# Winmate 전용 Redis(잡 큐·이벤트·호출 한도). 포트는 pm2 가 config/services.yaml 값으로 넘긴다(5379).
# IPv6 를 끈 PC 에서도 뜨도록 ::1 은 선택(-) 주소로
bind 127.0.0.1 -::1
protected-mode yes
daemonize no
# 잡 큐는 잃지 않도록 AOF
appendonly yes
appendfsync everysec
save 900 1
save 300 100
maxmemory 512mb
maxmemory-policy noeviction
loglevel notice
