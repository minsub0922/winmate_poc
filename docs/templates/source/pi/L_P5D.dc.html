<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">

  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">핵심 두 제품과, 동선을 채우는 세 제품</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{main}}" as="p" hint-placeholder-count="2">
      <div style="height: 250px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 20px; display: flex; gap: 22px">
        <div style="width: 250px; flex-shrink: 0; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center"><div style="width: 210px; height: 118px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417"></div></div>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <span style="align-self: flex-start; height: 24px; padding: 0 9px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">주력</span>
          <span style="font-size: 21px; font-weight: 800">{{p.name}}</span>
          <span style="font-size: 13px; color: #596170">{{p.spec}}</span>
          <span style="font-size: 14px; line-height: 1.55; color: #3d4452">{{p.desc}}</span>
          <div style="flex-grow: 1"></div>
          <span style="font-size: 13.5px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">{{p.qty}}</span> <span style="color: #596170">{{p.loc}}</span></span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 410px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{sub}}" as="p" hint-placeholder-count="3">
      <div style="height: 238px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="height: 110px; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; justify-content: center"><div style="{{p.screen}}"></div></div>
        <span style="font-size: 17px; font-weight: 800">{{p.name}}</span>
        <span style="font-size: 12.5px; color: #596170">{{p.spec}}</span>
        <span style="font-size: 13px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">{{p.qty}}</span> <span style="color: #596170">{{p.loc}}</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 18</div>
</div>
</x-dc>

        { name: 'Smart Signage QM55C', spec: '55" · 500nit · 4K · 24/7', desc: '카운터 3연 메인 메뉴보드 — 주문 결정의 중심', qty: '×3', loc: '/ 매장 · 카운터 상단' },
