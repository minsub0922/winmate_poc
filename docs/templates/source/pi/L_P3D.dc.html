<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P3-D 제품 3개 · 주력 1 + 보조 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — B 카운터</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">메인 메뉴보드와 두 개의 보조 화면</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 564px; height: 512px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 24px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">주력</span>
    <div style="height: 270px; display: flex; align-items: center; justify-content: center"><div style="width: 400px; height: 225px; box-sizing: border-box; border-radius: 5px; background: #1f232a; border: 5px solid #121417; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280">제품 이미지</div></div>
    <span style="font-size: 23px; font-weight: 800">Smart Signage QM55C</span>
    <span style="font-size: 13.5px; color: #596170">55" · 500nit · 4K · 24/7 · ×3 / 매장</span>
    <span style="font-size: 14.5px; line-height: 1.6; color: #3d4452">카운터 상단 3연 — 시간대 메뉴와 품절이 자동으로 바뀌는 메인 화면</span>
  </div>

  <div style="position: absolute; left: 652px; top: 136px; width: 564px; display: flex; flex-direction: column; gap: 24px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="2">
      <div style="height: 244px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; padding: 20px; display: flex; gap: 20px">
        <div style="width: 200px; flex-shrink: 0; border-radius: 12px; background: #f5f6f8; display: flex; align-items: center; justify-content: center"><div style="{{p.screen}}"></div></div>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <span style="align-self: flex-start; height: 24px; padding: 0 9px; border-radius: 999px; background: #f5f6f8; font-size: 12px; font-weight: 700; display: flex; align-items: center">보조</span>
          <span style="font-size: 19px; font-weight: 800">{{p.name}}</span>
          <span style="font-size: 13px; color: #596170">{{p.spec}}</span>
          <span style="font-size: 14px; line-height: 1.6; color: #3d4452">{{p.desc}}</span>
          <div style="flex-grow: 1"></div>
          <span style="font-size: 13.5px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">{{p.qty}}</span> <span style="color: #596170">{{p.loc}}</span></span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 16</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { screen: 'width: 84px; height: 150px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;', name: 'Kiosk KM24C', spec: '24" · 터치 · 결제 모듈', desc: '피크 시간 주문 분산', qty: '×1', loc: '/ 매장 · 대기열 옆' },
      { screen: 'width: 150px; height: 84px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;', name: 'Smart Signage QM43C', spec: '43" · 500nit', desc: '픽업대 주문 번호 호출', qty: '×1', loc: '/ 매장 · 픽업대 위' }
    ] };
  }
}
</script>
</body>
</html>
