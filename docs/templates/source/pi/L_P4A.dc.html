<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P4-A 제품 4개 · 이미지 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 플래그십 로비</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">플래그십 로비를 채우는 네 가지 화면</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="height: 220px; border-radius: 14px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="{{p.screen}}"></div>
          <div style="width: 70px; height: 4px; margin-top: 12px; border-radius: 2px; background: #dfe3ea"></div>
        </div>
        <span style="align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">{{p.cat}}</span>
        <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">{{p.name}}</span>
        <span style="font-size: 12.5px; color: #596170">{{p.spec}}</span>
        <span style="font-size: 14px; line-height: 1.55; color: #3d4452">{{p.desc}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 17</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const land = (w) => 'width: ' + w + 'px; height: ' + Math.round(w * 0.5625) + 'px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;';
    return { items: [
      { screen: land(210), cat: 'LED', name: 'The Wall IAB', spec: '146" · Micro LED', desc: '후면 벽 브랜드 스토리 대화면' },
      { screen: land(180), cat: '옥외', name: 'Outdoor OH55C', spec: '55" · 3,000nit · IP56', desc: '창면 3연 외부 메뉴' },
      { screen: land(190), cat: '인터랙티브', name: 'Flip Pro WA75D', spec: '75" · 터치 · 필기', desc: '측벽 체험 · 상담' },
      { screen: 'width: 64px; height: 150px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;', cat: '기둥형', name: 'Smart Signage QMC 세로형', spec: '55" · 세로 설치', desc: '기둥 2개 랩핑 디스플레이' }
    ] };
  }
}
</script>
</body>
</html>
