<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P4-D 제품 4개 · 주력 1 + 보조 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 플래그십 로비</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">The Wall을 중심으로 세 화면이 둘러쌉니다</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 564px; height: 512px; box-sizing: border-box; border-radius: 16px; background: #121417; color: #ffffff; padding: 24px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 999px; background: #1428a0; font-size: 12px; font-weight: 700; display: flex; align-items: center">주력</span>
    <div style="height: 270px; display: flex; align-items: center; justify-content: center"><div style="width: 460px; height: 200px; box-sizing: border-box; border-radius: 4px; background: #2b3140; border: 4px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8a91a0">제품 이미지</div></div>
    <span style="font-size: 24px; font-weight: 800">The Wall All-in-One IAB</span>
    <span style="font-size: 13.5px; color: #b8bec8">146" · Micro LED · 후면 벽 ×1</span>
    <span style="font-size: 14.5px; line-height: 1.6; color: #dfe3ea">로비에 들어서는 순간 보이는 브랜드 스토리 대화면</span>
  </div>

  <div style="position: absolute; left: 652px; top: 136px; width: 564px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
      <div style="height: 160px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 16px; display: flex; gap: 18px">
        <div style="width: 170px; flex-shrink: 0; border-radius: 10px; background: #ffffff; display: flex; align-items: center; justify-content: center"><div style="{{p.screen}}"></div></div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <span style="font-size: 12px; font-weight: 700; color: #1428a0">{{p.loc}}</span>
          <span style="font-size: 18px; font-weight: 800">{{p.name}}</span>
          <span style="font-size: 13px; color: #596170">{{p.spec}}</span>
          <span style="font-size: 13.5px; line-height: 1.5; color: #3d4452">{{p.desc}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 17</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const land = 'width: 130px; height: 73px; box-sizing: border-box; border-radius: 3px; background: #1f232a; border: 3px solid #121417;';
    return { items: [
      { screen: land, loc: '창면 · 도로측 ×3', name: 'Outdoor OH55C', spec: '55" · 3,000nit · IP56', desc: '거리에서 보이는 외부 메뉴' },
      { screen: 'width: 44px; height: 100px; box-sizing: border-box; border-radius: 3px; background: #1f232a; border: 3px solid #121417;', loc: '중앙 기둥 ×2', name: 'QMC 세로형', spec: '55" · 기둥 랩핑', desc: '기둥을 브랜드 포인트로' },
      { screen: land, loc: '측벽 ×1', name: 'Flip Pro WA75D', spec: '75" · 터치 · 필기', desc: '원두 · 메뉴 체험과 상담' }
    ] };
  }
}
</script>
</body>
</html>
