<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P5-B 제품 5개 · 공간·설치 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 표준 매장 전체</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">입구부터 픽업대까지, 동선을 따라 놓인 다섯 제품</div>

  <div style="position: absolute; left: 64px; top: 128px; width: 1152px; height: 280px; border-radius: 16px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8a91a0">매장 전체 조감도 · 손님 동선</div>
  <div style="position: absolute; left: 150px; top: 330px; width: 980px; height: 0; border-top: 2px dashed #1428a0"></div>
  <sc-for list="{{marks}}" as="m" hint-placeholder-count="5">
    <span style="{{m.style}}">{{m.no}}</span>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 428px; width: 1152px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
      <div style="height: 220px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.no}}</span><span style="font-size: 12px; font-weight: 700; color: #1428a0">{{p.loc}}</span></div>
        <div style="height: 76px; border-radius: 8px; background: #ffffff; display: flex; align-items: center; justify-content: center"><div style="width: 96px; height: 54px; box-sizing: border-box; border-radius: 3px; background: #1f232a; border: 3px solid #121417"></div></div>
        <span style="font-size: 16px; font-weight: 800">{{p.name}}</span>
        <span style="font-size: 12px; color: #596170">{{p.spec}}</span>
        <span style="font-size: 12.5px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">{{p.qty}}</span> <span style="color: #596170">/ 매장</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 18</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const X = [150, 380, 610, 840, 1100];
    const marks = X.map((x, i) => ({ no: i + 1, style: 'position: absolute; left: ' + (x - 18) + 'px; top: ' + (i % 2 ? 250 : 312) + 'px; width: 36px; height: 36px; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: border-box; font-family: Manrope, sans-serif; font-weight: 800; display: flex; align-items: center; justify-content: center;' }));
    const items = [
      { no: 1, loc: '외벽 · 입구', name: 'OH55C', spec: '55" · 3,000nit', qty: '×2' },
      { no: 2, loc: '주문 대기열', name: 'KM24C', spec: '24" · 키오스크', qty: '×1' },
      { no: 3, loc: '카운터 상단', name: 'QM55C', spec: '55" · 3연', qty: '×3' },
      { no: 4, loc: '대기 벽면', name: 'QM65C', spec: '65" · 프로모션', qty: '×1' },
      { no: 5, loc: '픽업대', name: 'QM43C', spec: '43" · 번호 호출', qty: '×1' }
    ];
    return { marks, items };
  }
}
</script>
</body>
</html>
