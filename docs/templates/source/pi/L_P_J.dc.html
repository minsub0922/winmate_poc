<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P-J 제품 디테일 콜아웃</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 입고 · 출고 현장</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">현장 단말에 필요한 것은 손에 쥔 그대로 보입니다 — Galaxy XCover7 Pro</div>

  <!-- 제품 무대 -->
  <div style="position: absolute; left: 440px; top: 136px; width: 400px; height: 462px; border-radius: 16px; background: #f5f6f8"></div>

  <!-- 정면 -->
  <div style="position: absolute; left: 488px; top: 146px; width: 216px; height: 424px; box-sizing: border-box; border-radius: 32px; border: 6px solid #d5d9e0; background: #ffffff"></div>
  <div style="position: absolute; left: 488px; top: 146px; width: 44px; height: 44px; box-sizing: border-box; border-top: 6px solid #b8bec8; border-left: 6px solid #b8bec8; border-top-left-radius: 32px"></div>
  <div style="position: absolute; left: 660px; top: 146px; width: 44px; height: 44px; box-sizing: border-box; border-top: 6px solid #b8bec8; border-right: 6px solid #b8bec8; border-top-right-radius: 32px"></div>
  <div style="position: absolute; left: 488px; top: 526px; width: 44px; height: 44px; box-sizing: border-box; border-bottom: 6px solid #b8bec8; border-left: 6px solid #b8bec8; border-bottom-left-radius: 32px"></div>
  <div style="position: absolute; left: 660px; top: 526px; width: 44px; height: 44px; box-sizing: border-box; border-bottom: 6px solid #b8bec8; border-right: 6px solid #b8bec8; border-bottom-right-radius: 32px"></div>
  <div style="position: absolute; left: 566px; top: 162px; width: 60px; height: 5px; border-radius: 3px; background: #d5d9e0"></div>
  <div style="position: absolute; left: 640px; top: 160px; width: 9px; height: 9px; border-radius: 50%; background: #b8bec8"></div>
  <div style="position: absolute; left: 502px; top: 182px; width: 188px; height: 330px; border-radius: 10px; background: #1f232a; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280">제품 이미지</div>
  <div style="position: absolute; left: 482px; top: 262px; width: 6px; height: 56px; border-radius: 3px 0 0 3px; background: #b8bec8"></div>
  <div style="position: absolute; left: 519px; top: 445px; width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%; border: 2px solid #b8c3ee"></div>
  <div style="position: absolute; left: 488px; top: 578px; width: 216px; text-align: center; font-size: 12px; color: #596170">정면</div>

  <!-- 측면 -->
  <div style="position: absolute; left: 764px; top: 146px; width: 30px; height: 424px; box-sizing: border-box; border-radius: 12px; border: 2px solid #d5d9e0; background: #ffffff"></div>
  <div style="position: absolute; left: 766px; top: 182px; width: 3px; height: 330px; background: #1f232a"></div>
  <div style="position: absolute; left: 780px; top: 160px; width: 12px; height: 396px; box-sizing: border-box; border-left: 1px dashed #8a91a0; background: #eef0f3"></div>
  <div style="position: absolute; left: 794px; top: 174px; width: 7px; height: 52px; border-radius: 0 4px 4px 0; background: #1f232a"></div>
  <div style="position: absolute; left: 794px; top: 500px; width: 4px; height: 32px; border-radius: 0 2px 2px 0; background: #8a91a0"></div>
  <div style="position: absolute; left: 749px; top: 578px; width: 60px; text-align: center; font-size: 12px; color: #596170">측면</div>

  <!-- 왼쪽 콜아웃 (정면) -->
  <sc-for list="{{left}}" as="c" hint-placeholder-count="3">
    <div>
    <div style="{{c.lineStyle}}"></div>
    <div style="{{c.dotStyle}}"></div>
    <div style="{{c.rowStyle}}">
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em">{{c.t}}</span>
      <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.no}}</span>
    </div>
    <div style="{{c.descStyle}}">{{c.d}}</div>
    </div>
  </sc-for>

  <!-- 오른쪽 콜아웃 (측면 · 후면) -->
  <sc-for list="{{right}}" as="c" hint-placeholder-count="3">
    <div>
    <div style="{{c.lineStyle}}"></div>
    <div style="{{c.dotStyle}}"></div>
    <div style="{{c.rowStyle}}">
      <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.no}}</span>
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em">{{c.t}}</span>
    </div>
    <div style="{{c.descStyle}}">
      <span style="font-size: 14px; line-height: 1.55; color: #596170">{{c.d}}</span>
      <sc-if value="{{c.hasChip}}" hint-placeholder-val="{{false}}">
        <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{c.chip}}</span>
      </sc-if>
    </div>
    </div>
  </sc-for>

  <!-- 이 공간에서 -->
  <div style="position: absolute; left: 64px; top: 608px; width: 1152px; height: 40px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 0 20px; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 14px; font-weight: 800; color: #1428a0">이 공간에서</span>
    <span style="font-size: 14px; color: #596170">—</span>
    <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #ffffff; font-size: 12px; display: flex; align-items: center">입고 검수</span>
    <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #ffffff; font-size: 12px; display: flex; align-items: center">피킹</span>
    <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #ffffff; font-size: 12px; display: flex; align-items: center">출고</span>
    <span style="flex-grow: 1"></span>
    <span style="font-size: 14px; font-weight: 700">Galaxy XCover7 Pro</span>
    <span style="display: flex; align-items: baseline; gap: 2px; color: #1428a0"><span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800">×[000]</span><span style="font-size: 14px; font-weight: 700">대</span></span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>L 물류센터 · 현장 디지털화 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 14</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 리더 선: 배지 끝 ↔ 기기 위의 지점 (y = 배지 중심)
    const line = (x1, x2, y) => 'position: absolute; left: ' + x1 + 'px; top: ' + y + 'px; width: ' + (x2 - x1) + 'px; height: 1px; background: #1428a0';
    const dot = (x, y, on) => on ? 'position: absolute; left: ' + (x - 5) + 'px; top: ' + (y - 5) + 'px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid #ffffff; background: #1428a0' : 'display: none';
    // 왼쪽 — 정면에서 보이는 것 (배지 오른쪽 끝 x 392)
    const L = [
      { no: 1, t: 'IP68 · MIL-STD-810H', d: '상차 중 바닥에 떨어뜨려도, 비 오는 도크에서도 그대로', y: 174, ax: 491, dot: true },
      { no: 2, t: '프로그래머블 키', d: '측면 키를 스캔 버튼으로 지정 — 엄지로 바로 스캔', y: 290, ax: 482, dot: true },
      { no: 3, t: '장갑 · 젖은 손 터치', d: '작업 장갑을 벗지 않고 수량 입력 · 서명', y: 462, ax: 536, dot: true }
    ];
    // 오른쪽 — 측면 · 후면 (배지 왼쪽 끝 x 900)
    const R = [
      { no: 4, t: '후면 카메라 바코드 스캔', d: '별도 스캐너 없이 송장 · 박스 바코드 인식', y: 200, ax: 801, chip: 'Knox Capture' },
      { no: 5, t: '교체형 배터리', d: '교대조마다 바꿔 끼움 — 충전을 기다리지 않습니다', y: 364, ax: 786, chip: '' },
      { no: 6, t: '충전 크래들 · POGO 핀', d: '근무가 끝나면 크래들에 올려두기만 — 케이블 없이 충전', y: 516, ax: 798, chip: '' }
    ];
    const left = L.map((c) => ({
      no: c.no, t: c.t, d: c.d,
      lineStyle: line(392, c.ax, c.y),
      dotStyle: dot(c.ax, c.y, c.dot),
      rowStyle: 'position: absolute; left: 64px; top: ' + (c.y - 14) + 'px; width: 328px; height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 12px',
      descStyle: 'position: absolute; left: 64px; top: ' + (c.y + 20) + 'px; width: 288px; text-align: right; font-size: 14px; line-height: 1.55; color: #596170'
    }));
    const right = R.map((c) => ({
      no: c.no, t: c.t, d: c.d, chip: c.chip, hasChip: !!c.chip,
      lineStyle: line(c.ax, 900, c.y),
      dotStyle: dot(c.ax, c.y, true),
      rowStyle: 'position: absolute; left: 900px; top: ' + (c.y - 14) + 'px; width: 316px; height: 28px; display: flex; align-items: center; gap: 12px',
      descStyle: 'position: absolute; left: 940px; top: ' + (c.y + 20) + 'px; width: 276px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px'
    }));
    return { left, right };
  }
}
</script>
</body>
</html>
