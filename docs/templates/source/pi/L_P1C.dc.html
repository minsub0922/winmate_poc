<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P1-C 제품 1개 · 스펙 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — B 카운터</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">Smart Signage QM55C — 숫자로 보는 선택 이유</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">카운터 상단 3연 · 매장당 3대 · 960대</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 368px; height: 488px; border-radius: 16px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
    <div style="width: 290px; height: 163px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 5px solid #121417; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280">제품 이미지</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px"><span style="font-size: 19px; font-weight: 800">QM55C</span><span style="font-size: 13px; color: #596170">Smart Signage · 55"</span></div>
  </div>

  <div style="position: absolute; left: 456px; top: 160px; width: 760px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <div style="height: 120px; box-sizing: border-box; border-radius: 12px; background: #1428a0; color: #ffffff; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #c8d3ff">밝기</span><span style="font-family: Manrope, sans-serif; font-size: 40px; font-weight: 800; line-height: 1">500<span style="font-size: 16px; margin-left: 4px">nit</span></span></div>
    <div style="height: 120px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #596170">명암비</span><span style="font-family: Manrope, sans-serif; font-size: 40px; font-weight: 800; line-height: 1; color: #1428a0">4000:1</span></div>
    <div style="height: 120px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: #596170">운영 시간</span><span style="font-family: Manrope, sans-serif; font-size: 40px; font-weight: 800; line-height: 1; color: #1428a0">24/7</span></div>
  </div>

  <div style="position: absolute; left: 456px; top: 304px; width: 760px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px">
    <sc-for list="{{specs}}" as="s" hint-placeholder-count="12">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; border-bottom: 1px solid #e2e5ea; font-size: 14.5px">
        <span style="color: #596170">{{s.k}}</span><span style="font-weight: 700">{{s.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 14</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [['화면 크기', '55"'], ['해상도', '3840 × 2160'], ['소비전력 (일반)', '[000] W'], ['소비전력 (최대)', '[000] W'], ['OS · 플레이어', 'Tizen · 내장'], ['관리 솔루션', 'MagicINFO'], ['베젤', '[0.0] mm'], ['무게', '[00.0] kg']];
    return { specs: S.map(([k, v]) => ({ k, v })) };
  }
}
</script>
</body>
</html>
