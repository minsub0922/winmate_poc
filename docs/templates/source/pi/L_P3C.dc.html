<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P3-C 제품 3개 · 라인업(스펙)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 라인업</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">QMC 라인업 — 공간 크기에 맞춰 고르세요</div>

  <!-- 크기 비례 라인업 -->
  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; height: 250px; border-radius: 16px; background: #f5f6f8"></div>
  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; height: 250px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: end; padding-bottom: 36px; box-sizing: border-box">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="{{p.screen}}"></div>
        <div style="width: 60px; height: 4px; border-radius: 2px; background: #d5d9e0"></div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 360px; width: 1152px; height: 1px; background: #d5d9e0"></div>

  <div style="position: absolute; left: 64px; top: 404px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-family: Manrope, sans-serif; font-size: 40px; font-weight: 800; line-height: 1; color: {{p.color}}">{{p.size}}</span>
        <span style="font-size: 16px; font-weight: 700">{{p.model}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 494px; width: 1152px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 120px repeat(3, minmax(0, 1fr)); align-items: center; height: 40px; border-top: 1px solid #e2e5ea; font-size: 14px">
        <span style="color: #596170; font-size: 13px">{{r.k}}</span>
        <span style="text-align: center">{{r.a}}</span><span style="text-align: center">{{r.b}}</span><span style="text-align: center">{{r.c}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 624px; font-size: 13px; color: #596170"><span style="font-weight: 700; color: #121417">공통</span> 500nit · 4K UHD · 24/7 · 내장 플레이어 · MagicINFO</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 16</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 화면 크기에 비례한 폭 (55 : 65 : 75)
    const scr = (w) => 'width: ' + w + 'px; height: ' + Math.round(w * 0.5625) + 'px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;';
    const items = [
      { size: '55"', model: 'QM55C', screen: scr(220), color: '#121417' },
      { size: '65"', model: 'QM65C', screen: scr(260), color: '#1428a0' },
      { size: '75"', model: 'QM75C', screen: scr(300), color: '#121417' }
    ];
    const rows = [
      { k: '추천 공간', a: '카운터 상단', b: '대기 공간 벽면', c: '매장 중앙 · 대형 벽' },
      { k: '권장 시청 거리', a: '[0.0] m', b: '[0.0] m', c: '[0.0] m' },
      { k: '수량 제안', a: '×3 / 매장', b: '×1 / 매장', c: '플래그십만' }
    ];
    return { items, rows };
  }
}
</script>
</body>
</html>
