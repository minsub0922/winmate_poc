<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P-T 카탈로그 6~8개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 빌트인 키친 존</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">키친 존 하나에 여덟 제품 — 냉장 · 조리 · 세척 · 세탁</div>

  <!-- 카탈로그: 행마다 카테고리 묶음, 묶음마다 제품 타일 -->
  <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
    <div style="{{row.style}}">
      <sc-for list="{{row.groups}}" as="g" hint-placeholder-count="2">
        <div style="{{g.style}}">
          <div style="height: 30px; box-sizing: border-box; border-bottom: 2px solid #121417; display: flex; align-items: center; gap: 8px">
            <span style="font-size: 15px; font-weight: 800">{{g.name}}</span>
            <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600; color: #596170">{{g.count}}</span>
          </div>
          <div style="margin-top: 10px; display: flex; gap: 16px">
            <sc-for list="{{g.items}}" as="p" hint-placeholder-count="3">
              <div style="width: 210px; height: 206px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; border: 1px solid #e2e5ea; padding: 12px; display: flex; flex-direction: column">
                <div style="position: relative; height: 96px; flex-shrink: 0; border-radius: 8px; background: #f5f6f8; display: flex; align-items: center; justify-content: center">
                  <div style="{{p.box}}">
                    <sc-for list="{{p.kids}}" as="k" hint-placeholder-count="2">
                      <span style="{{k}}"></span>
                    </sc-for>
                  </div>
                  <span style="position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
                </div>
                <span style="margin-top: 8px; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap">{{p.name}}</span>
                <span style="margin-top: 2px; font-size: 13px; color: #3d4452; white-space: nowrap">{{p.loc}}</span>
                <div style="flex-grow: 1"></div>
                <div style="height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="font-size: 12px; color: #596170; white-space: nowrap">{{p.model}}</span>
                  <span style="{{p.tagStyle}}">{{p.tag}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <!-- 미니 평면 -->
  <div style="position: absolute; left: 976px; top: 136px; width: 240px; height: 512px; border-radius: 16px; background: #f5f6f8"></div>
  <div style="position: absolute; left: 992px; top: 150px; font-size: 13px; font-weight: 800">키친 존 평면</div>
  <div style="position: absolute; left: 992px; top: 180px; width: 208px; height: 300px; box-sizing: border-box; border: 4px solid #8a91a0; background: #ffffff"></div>
  <sc-for list="{{plan}}" as="d" hint-placeholder-count="18">
    <div style="{{d.style}}">{{d.t}}</div>
  </sc-for>
  <sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
    <span style="{{d.style}}">{{d.n}}</span>
  </sc-for>

  <!-- 설치 방식 집계 -->
  <div style="position: absolute; left: 992px; top: 498px; width: 208px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #596170">빌트인</span><span style="display: flex; align-items: baseline; gap: 3px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1; color: #1428a0">{{builtN}}</span><span style="font-size: 13px; font-weight: 700; color: #1428a0">종</span></span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #596170">프리스탠딩</span><span style="display: flex; align-items: baseline; gap: 3px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">{{freeN}}</span><span style="font-size: 13px; font-weight: 700">종</span></span></div>
  </div>
  <div style="position: absolute; left: 992px; top: 568px; width: 208px; height: 1px; background: #d5d9e0"></div>
  <div style="position: absolute; left: 992px; top: 580px; width: 208px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 1.45; color: #596170">
    <span>번호는 왼쪽 제품과 같습니다</span>
    <span>배치는 쇼룸 도면 확정 전 예시</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>I 키친 · 쇼룸 빌트인 가전 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 14</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const abs = (l, t, w, h) => 'position: absolute; left: ' + l + 'px; top: ' + t + 'px; width: ' + w + 'px; height: ' + h + 'px; box-sizing: border-box; ';
    const line = '#b8bec8';
    // 비화면 제품 자리표시: 밝은 박스 + 1~2개의 선 (제품 비율대로)
    const body = (w, h, r) => 'position: relative; width: ' + w + 'px; height: ' + h + 'px; box-sizing: border-box; border-radius: ' + r + 'px; background: #eef0f3; border: 1.5px solid ' + line;
    const SHAPE = {
      fridge4: [body(46, 84, 4), [abs(21, 0, 1.5, 81) + 'background: ' + line, abs(0, 46, 43, 1.5) + 'background: ' + line]],
      kimchi: [body(42, 80, 4), [abs(19, 0, 1.5, 36) + 'background: ' + line, abs(0, 36, 39, 1.5) + 'background: ' + line, abs(0, 56, 39, 1.5) + 'background: ' + line]],
      cube: [body(40, 50, 6), [abs(31, 10, 3, 18) + 'border-radius: 2px; background: ' + line]],
      combo: [body(54, 68, 6), [abs(0, 12, 51, 1.5) + 'background: ' + line, abs(10, 21, 32, 32) + 'border-radius: 50%; border: 2px solid ' + line]],
      induction: [body(78, 58, 4), [abs(8, 9, 26, 26) + 'border-radius: 50%; border: 1.5px solid ' + line, abs(42, 9, 26, 26) + 'border-radius: 50%; border: 1.5px solid ' + line, abs(27, 36, 20, 16) + 'border-radius: 50%; border: 1.5px solid ' + line]],
      oven: [body(60, 60, 4), [abs(0, 10, 57, 1.5) + 'background: ' + line, abs(9, 19, 39, 28) + 'border-radius: 3px; background: #d5d9e0']],
      dish: [body(52, 66, 4), [abs(0, 10, 49, 1.5) + 'background: ' + line, abs(16, 16, 18, 3) + 'border-radius: 2px; background: ' + line]],
      water: [body(18, 62, 6), [abs(-26, 4, 28, 6) + 'border-radius: 3px 0 0 3px; background: #eef0f3; border: 1.5px solid ' + line + '; border-right: none']]
    };
    const tagB = 'flex-shrink: 0; height: 24px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12px; font-weight: 700; display: flex; align-items: center';
    const tagF = 'flex-shrink: 0; height: 24px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #ffffff; border: 1px solid #d5d9e0; color: #3d4452; font-size: 12px; display: flex; align-items: center';
    // [번호, 이름, 놓이는 곳, 모델, 형태, 빌트인 여부]
    const P = {
      1: ['냉장고 4도어', '키 큰 장 빌트인', 'BESPOKE', 'fridge4', true],
      2: ['김치플러스', '냉장고 옆 키 큰 장', 'BESPOKE', 'kimchi', true],
      3: ['큐브 냉장고', '다이닝 옆 홈바', 'BESPOKE', 'cube', false],
      4: ['AI 콤보 세탁건조기', '키친 옆 다용도실', 'BESPOKE', 'combo', false],
      5: ['인덕션', '아일랜드 상판', 'BESPOKE', 'induction', true],
      6: ['오븐', '키 큰 장 중단', 'BESPOKE', 'oven', true],
      7: ['식기세척기', '아일랜드 하부 · 싱크 옆', 'BESPOKE', 'dish', true],
      8: ['정수기', '아일랜드 싱크 하부', 'BESPOKE', 'water', true]
    };
    const tile = (n) => {
      const [name, loc, model, shape, built] = P[n];
      return { n: String(n), name, loc, model, box: SHAPE[shape][0], kids: SHAPE[shape][1], tag: built ? '빌트인' : '프리스탠딩', tagStyle: built ? tagB : tagF };
    };
    const grp = (name, ns) => ({
      name, count: ns.length + '종',
      style: 'width: ' + (ns.length * 210 + (ns.length - 1) * 16) + 'px; flex-shrink: 0; display: flex; flex-direction: column',
      items: ns.map(tile)
    });
    const rowStyle = (t) => 'position: absolute; left: 64px; top: ' + t + 'px; width: 888px; display: flex; gap: 16px';
    const rows = [
      { style: rowStyle(136), groups: [grp('냉장', [1, 2, 3]), grp('세탁', [4])] },
      { style: rowStyle(398), groups: [grp('조리', [5, 6]), grp('세척 · 물', [7, 8])] }
    ];

    // 미니 평면 (외곽 992,180 · 208×300, 벽 4px)
    const lt = 'background: #eef0f3; border: 1px solid #b8bec8; ';
    const wall = 'background: #8a91a0';
    const txt = 'font-size: 12px; color: #596170; display: flex; align-items: center; justify-content: center; ';
    const plan = [
      { style: abs(996, 184, 48, 30) + lt, t: '' },
      { style: abs(1044, 184, 42, 30) + lt, t: '' },
      { style: abs(1086, 184, 36, 30) + lt, t: '' },
      { style: abs(996, 218, 120, 16) + txt + 'justify-content: flex-start; padding-left: 2px', t: '키 큰 장' },
      { style: abs(1134, 184, 4, 84) + wall, t: '' },
      { style: abs(1134, 264, 6, 4) + wall, t: '' },
      { style: abs(1162, 264, 34, 4) + wall, t: '' },
      { style: abs(1152, 192, 30, 30) + lt + 'border-radius: 3px', t: '' },
      { style: abs(1138, 232, 58, 20) + txt, t: '다용도실' },
      { style: abs(1012, 290, 120, 44) + 'background: #e2e5ea; border-radius: 3px', t: '' },
      { style: abs(1018, 296, 34, 32) + lt + 'border-radius: 2px', t: '' },
      { style: abs(1058, 298, 30, 28) + 'border: 1px dashed #8a91a0; border-radius: 2px', t: '' },
      { style: abs(1094, 298, 32, 28) + 'background: #ffffff; border: 1px solid #b8bec8; border-radius: 4px', t: '' },
      { style: abs(1012, 338, 120, 16) + txt, t: '아일랜드' },
      { style: abs(1020, 392, 104, 48) + txt + 'border: 1px dashed #b8bec8; border-radius: 8px', t: '다이닝' },
      { style: abs(1150, 400, 28, 32) + lt + 'border-radius: 3px', t: '' },
      { style: abs(1030, 476, 100, 4) + 'background: #ffffff; border-top: 1px solid #596170; border-bottom: 1px solid #596170', t: '' },
      { style: abs(992, 372, 4, 44) + 'background: #ffffff', t: '' }
    ];
    const dot = 'border-radius: 50%; background: #1428a0; color: #ffffff; border: 2px solid #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center';
    // 점 중심 = 제품 자리 중심
    const dots = [[1, 1020, 199], [2, 1065, 199], [6, 1104, 199], [4, 1167, 207], [5, 1035, 312], [7, 1073, 312], [8, 1110, 312], [3, 1164, 416]]
      .map(([n, cx, cy]) => ({ n: String(n), style: abs(cx - 11, cy - 11, 22, 22) + dot }));

    const builtN = String(Object.values(P).filter((p) => p[4]).length);
    const freeN = String(Object.values(P).filter((p) => !p[4]).length);
    return { rows, plan, dots, builtN, freeN };
  }
}
</script>
</body>
</html>
