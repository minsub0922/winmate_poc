<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P5-A 제품 5개 · 이미지 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — 표준 매장 전체</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">표준 매장 한 곳에 들어가는 다섯 가지 제품</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="height: 200px; border-radius: 14px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="{{p.screen}}"></div>
          <div style="width: 56px; height: 4px; margin-top: 12px; border-radius: 2px; background: #dfe3ea"></div>
        </div>
        <span style="align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{p.cat}}</span>
        <span style="font-size: 16.5px; font-weight: 800; letter-spacing: -0.02em">{{p.name}}</span>
        <span style="font-size: 12px; color: #596170">{{p.spec}}</span>
        <span style="font-size: 13px; line-height: 1.5; color: #3d4452">{{p.desc}}</span>
        <span style="font-size: 12.5px; border-top: 1px solid #e2e5ea; padding-top: 8px"><span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">{{p.qty}}</span> <span style="color: #596170">{{p.loc}}</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 18</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const land = (w) => 'width: ' + w + 'px; height: ' + Math.round(w * 0.5625) + 'px; box-sizing: border-box; border-radius: 3px; background: #1f232a; border: 3px solid #121417;';
    const port = 'width: 60px; height: 108px; box-sizing: border-box; border-radius: 3px; background: #1f232a; border: 3px solid #121417;';
    return { items: [
      { screen: land(150), cat: '사이니지', name: 'QM55C', spec: '55" · 500nit · 4K', desc: '카운터 메인 메뉴보드', qty: '×3', loc: '카운터' },
      { screen: land(140), cat: '옥외', name: 'OH55C', spec: '55" · 3,000nit', desc: '쇼윈도 외부 메뉴', qty: '×2', loc: '외벽' },
      { screen: port, cat: '키오스크', name: 'KM24C', spec: '24" · 터치 · 결제', desc: '셀프 주문', qty: '×1', loc: '대기열' },
      { screen: land(160), cat: '사이니지', name: 'QM65C', spec: '65" · 500nit · 4K', desc: '대기 공간 프로모션', qty: '×1', loc: '대기 벽면' },
      { screen: land(120), cat: '사이니지', name: 'QM43C', spec: '43" · 500nit', desc: '픽업 번호 호출', qty: '×1', loc: '픽업대' }
    ] };
  }
}
</script>
</body>
</html>
