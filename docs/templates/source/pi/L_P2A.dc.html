<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P2-A 제품 2개 · 이미지 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — A 쇼윈도 · 외부</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">거리에서 먼저 보이는 두 개의 화면</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="height: 300px; border-radius: 16px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="width: 340px; height: 191px; box-sizing: border-box; border-radius: 5px; background: #1f232a; border: 5px solid #121417; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280">제품 이미지</div>
          <div style="width: 140px; height: 5px; margin-top: 16px; border-radius: 3px; background: #dfe3ea"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{p.cat}}</span><span style="font-size: 13px; color: #596170">{{p.spec}}</span></div>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">{{p.name}}</span>
        <span style="font-size: 15px; line-height: 1.6; color: #596170">{{p.desc}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 15</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { cat: '옥외 사이니지', spec: 'OH55C · 55" · 3,000nit · IP56', name: 'Outdoor Signage OH55C', desc: '직사광이 드는 쇼윈도에서도 메뉴와 프로모션이 선명하게 읽힙니다.' },
      { cat: '투명 디스플레이', spec: 'Transparent OLED · 55"', name: 'Transparent OLED', desc: '매장 안이 비쳐 보이면서 신메뉴가 떠 있는, 거리의 시선을 끄는 쇼윈도.' }
    ] };
  }
}
</script>
</body>
</html>
