<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SM-D 층별 단면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — C 빌딩 전 층</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">층마다 쓰임이 다르니, 제품도 층마다 다릅니다</div>

  <!-- 머리글: 왼쪽 단면 · 오른쪽 층별 제품 -->
  <div style="position: absolute; left: 120px; top: 140px; font-size: 12.5px; font-weight: 700; color: #596170">건물 단면 · 층별 쓰임</div>
  <div style="position: absolute; left: 620px; top: 136px; width: 596px; height: 28px; box-sizing: border-box; border-bottom: 2px solid #121417; display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: #596170"><span>층별 제품 · 수량</span><span>층 합계</span></div>

  <!-- 층 행: 단면 띠(120–560) · 연결선(560–620) · 제품 칩(620–1116) · 층 합계(1116–1216) -->
  <div style="position: absolute; left: 64px; top: 164px; width: 1152px; display: flex; flex-direction: column">
    <sc-for list="{{floors}}" as="f" hint-placeholder-count="6">
      <div style="{{f.row}}">
        <div style="width: 56px; flex-shrink: 0"></div>
        <div style="{{f.band}}">
          <span style="width: 52px; flex-shrink: 0; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: #1428a0">{{f.code}}</span>
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0">
            <span style="font-size: 14.5px; font-weight: 700; white-space: nowrap">{{f.use}}</span>
            <sc-if value="{{f.isStack}}" hint-placeholder-val="{{false}}">
              <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #1428a0; color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center">×7개 층</span>
            </sc-if>
          </div>
          <span style="flex-grow: 1"></span>
          <sc-if value="{{f.isStack}}" hint-placeholder-val="{{false}}">
            <div style="align-self: stretch; width: 118px; display: flex; flex-direction: column">
              <sc-for list="{{f.stack}}" as="s" hint-placeholder-count="7">
                <div style="{{s.style}}">
                  <sc-for list="{{s.glyphs}}" as="g" hint-placeholder-count="4">
                    <span style="{{g}}"></span>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{f.isFlat}}" hint-placeholder-val="{{true}}">
            <div style="{{f.glyphBox}}">
              <sc-for list="{{f.glyphs}}" as="g" hint-placeholder-count="3">
                <span style="{{g}}"></span>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div style="width: 60px; flex-shrink: 0; box-sizing: border-box; padding-right: 10px; display: flex; align-items: center">
          <span style="flex-grow: 1; height: 1px; background: #b8bec8"></span>
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #1428a0"></span>
        </div>
        <div style="{{f.chips}}">
          <sc-for list="{{f.items}}" as="it" hint-placeholder-count="2">
            <span style="height: 26px; padding: 0 11px; border-radius: 999px; background: #ffffff; border: 1px solid #d5d9e0; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap">
              <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-weight: 700">{{it.name}}</span>
              <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: #1428a0">{{it.qty}}</span>
              <sc-if value="{{it.hasUnit}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; color: #596170">{{it.unit}}</span></sc-if>
            </span>
          </sc-for>
        </div>
        <div style="{{f.totalBox}}">
          <span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">{{f.total}}</span>
          <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 11.5px; color: #596170; white-space: nowrap">{{f.totalSub}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 지반선 (1F | B1 경계, y 544) -->
  <div style="position: absolute; left: 64px; top: 543px; width: 520px; height: 2px; background: #596170"></div>
  <div style="position: absolute; left: 66px; top: 524px; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 700; color: #596170">GL</div>

  <!-- 건물 전체 -->
  <div style="position: absolute; left: 64px; top: 606px; width: 1152px; height: 42px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 0 20px; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 14px; font-weight: 800">건물 전체</span>
    <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 13px; color: #3d4452">B1 – 10F · 옥상, 6개 구간</span>
    <span style="display: flex; align-items: baseline; gap: 4px; padding-left: 8px"><span style="font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #1428a0">{{grand}}</span><span style="font-size: 14px; font-weight: 800; color: #1428a0">대</span></span>
    <span style="flex-grow: 1"></span>
    <span style="font-size: 12.5px; color: #596170">업무층 · 공조 수량은 현장 실사 후 확정 · 수치는 예시</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>C 빌딩 · 스마트 오피스 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 13</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const isNum = (v) => typeof v === 'number';
    // 단면 속 작은 제품 기호
    const G = {
      scr: 'width: 18px; height: 11px; border-radius: 1.5px; background: #1f232a',
      wall: 'width: 36px; height: 20px; border-radius: 1.5px; background: #1f232a',
      kio: 'width: 7px; height: 15px; border-radius: 1.5px; background: #1f232a',
      cas: 'width: 13px; height: 13px; box-sizing: border-box; border: 1.5px solid #8a91a0; border-radius: 2px; background: #ffffff',
      odu: 'width: 26px; height: 20px; box-sizing: border-box; border: 1.5px solid #8a91a0; border-radius: 3px; background: #ffffff',
      mon: 'width: 11px; height: 7px; border-radius: 1px; background: #1f232a',
      cas2: 'width: 9px; height: 9px; box-sizing: border-box; border: 1.5px solid #8a91a0; border-radius: 1.5px; background: #ffffff'
    };
    // [층 코드, 쓰임, 행 높이(px), 단면 기호, [제품, 수량, 단위], 종류]
    const F = [
      ['RF', '옥상 · 설비', 52, ['odu', 'odu', 'odu'], [['DVM S2 실외기', '[00]', '']], 'roof'],
      ['10F', '회의 · 교육', 64, ['scr', 'scr', 'kio', 'kio'], [['Flip Pro WM75', 6, ''], ['회의실 예약 사이니지', 12, '']], 'floor'],
      ['3–9F', '업무층', 124, [], [['ViewFinity 모니터', '[000]', '/층'], ['360 카세트', '[00]', '/층']], 'stack'],
      ['2F', '라운지 · 카페', 64, ['scr', 'scr', 'cas'], [['QM55C 메뉴', 2, ''], ['360 카세트', '[0]', '']], 'floor'],
      ['1F', '로비', 76, ['wall', 'kio', 'kio', 'scr'], [['The Wall IAB 146"', 1, ''], ['KM24C 방문객 키오스크', 2, ''], ['QM55C 안내', 3, '']], 'floor'],
      ['B1', '주차 · 설비', 52, ['scr', 'scr'], [['QM55C 주차 안내', 2, '']], 'base']
    ];
    const bandBase = 'width: 440px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px 0 14px; ';
    const bandKind = {
      roof: 'background: #ffffff; border: 1px dashed #b8bec8; border-bottom: none; border-radius: 6px 6px 0 0',
      floor: 'background: #f5f6f8; border-left: 2px solid #b8bec8; border-right: 2px solid #b8bec8; border-top: 3px solid #b8bec8',
      stack: 'background: #f5f6f8; border-left: 2px solid #b8bec8; border-right: 2px solid #b8bec8; border-top: 3px solid #b8bec8',
      base: 'background: #eef0f3; border-left: 2px solid #b8bec8; border-right: 2px solid #b8bec8; border-top: 3px solid #b8bec8; border-bottom: 3px solid #b8bec8'
    };
    const floors = F.map(([code, use, h, gl, items, kind], i) => {
      const nums = items.map((it) => it[1]);
      const known = nums.every(isNum);
      const sum = known ? nums.reduce((a, b) => a + b, 0) : null;
      const cellTop = i === 0 ? '' : 'border-top: 1px solid #e2e5ea; ';
      return {
        code, use,
        isStack: kind === 'stack',
        isFlat: kind !== 'stack',
        row: 'display: flex; height: ' + h + 'px',
        band: bandBase + bandKind[kind],
        glyphBox: 'display: flex; align-items: ' + (kind === 'roof' ? 'flex-end; align-self: stretch; padding-bottom: 4px' : 'center') + '; gap: 6px',
        glyphs: gl.map((k) => G[k]),
        stack: Array.from({ length: 7 }, (_, j) => ({
          style: 'height: 17px; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; gap: 4px' + (j ? '; border-top: 1px dashed #d5d9e0' : ''),
          glyphs: [G.mon, G.mon, G.mon, G.cas2]
        })),
        items: items.map(([name, q, unit]) => ({ name, qty: '×' + q, unit, hasUnit: unit !== '' })),
        chips: cellTop + 'flex-grow: 1; min-width: 0; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 6px',
        total: kind === 'stack' ? '[0,000]' : (known ? String(sum) : '[00]'),
        totalSub: kind === 'stack' ? '층당 [000] × 7' : '',
        totalBox: cellTop + 'width: 100px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px'
      };
    });
    return { floors, grand: '[0,000]' };
  }
}
</script>
</body>
</html>
