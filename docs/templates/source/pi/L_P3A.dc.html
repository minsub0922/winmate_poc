<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P3-A 제품 3개 · 이미지 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">04 · 공간별 제품 — B 카운터</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">카운터를 완성하는 세 가지 제품</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="height: 260px; border-radius: 16px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="{{p.screen}}"></div>
          <div style="width: 100px; height: 4px; margin-top: 14px; border-radius: 2px; background: #dfe3ea"></div>
        </div>
        <span style="align-self: flex-start; height: 24px; padding: 0 9px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{p.cat}}</span>
        <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">{{p.name}}</span>
        <span style="font-size: 13px; color: #596170">{{p.spec}}</span>
        <span style="font-size: 14.5px; line-height: 1.6; color: #3d4452">{{p.desc}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 16</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const land = 'width: 250px; height: 141px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;';
    const port = 'width: 96px; height: 170px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 4px solid #121417;';
    return { items: [
      { screen: land, cat: '스마트 사이니지', name: 'Smart Signage QM55C', spec: '55" · 500nit · 4K · 24/7', desc: '카운터 상단 3연 메인 메뉴보드' },
      { screen: port, cat: '키오스크', name: 'Kiosk KM24C', spec: '24" · 터치 · 결제 모듈', desc: '피크 시간 주문 분산' },
      { screen: land, cat: '인터랙티브', name: 'Flip Pro WA75D', spec: '75" · 터치 · 필기', desc: '원두 · 메뉴 정보를 손님이 직접 탐색' }
    ] };
  }
}
</script>
</body>
</html>
