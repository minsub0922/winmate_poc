<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IP-A 현장 조건 체크리스트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">09 · 실행 계획 — 설치 · 시공</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">로비 설치 전, 현장에서 확인할 열두 가지</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">구조 · 전기 · 통신 · 환경 · 일정 · 번호는 사진 위 위치</div>

  <!-- 현장 사진 6열 + 번호 핀 -->
  <div style="position: absolute; left: 64px; top: 160px; width: 560px; height: 488px; border-radius: 16px; overflow: hidden; background: #dfe3ea">
    <div style="position: absolute; left: 0px; top: 0px; width: 560px; height: 488px">
      <dc-import name="Img" kind="space" origin="site" hint="로비 전경 · 관통형 기둥 · 천장 점검구 · 바닥 마감이 보이게" w="560" h="488" radius="0" credit="tl" hint-size="560px,488px"></dc-import>
    </div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
      <div style="{{p.box}}">
        <span style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.no}}</span>
        <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #121417; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p.label}}</span>
      </div>
    </sc-for>
  </div>

  <!-- 체크리스트 6열 : 그룹 5 · 항목 12 -->
  <div style="position: absolute; left: 648px; top: 160px; width: 568px; display: flex; flex-direction: column; border-top: 2px solid #121417">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <div style="display: flex; border-bottom: 1px solid #d5d9e0">
        <div style="width: 92px; height: 35px; flex-shrink: 0; display: flex; align-items: center; gap: 7px">
          <sc-if value="{{g.ic.struct}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 21h18 M5 21V7l7-4 7 4v14 M9 10h6 M9 14h6 M9 18h6"/></svg></sc-if>
          <sc-if value="{{g.ic.power}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></sc-if>
          <sc-if value="{{g.ic.net}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M2 9a15 15 0 0 1 20 0 M5 12.5a10 10 0 0 1 14 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5h.01"/></svg></sc-if>
          <sc-if value="{{g.ic.env}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/></svg></sc-if>
          <sc-if value="{{g.ic.time}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></svg></sc-if>
          <span style="font-size: 12.5px; font-weight: 800">{{g.name}}</span>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <div style="{{it.row}}">
              <span style="{{it.pinSt}}">{{it.pin}}</span>
              <span style="font-size: 13.5px; font-weight: 700; white-space: nowrap">{{it.name}}</span>
              <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; color: #3d4452; white-space: nowrap">{{it.val}}</span>
              <span style="{{it.chip}}">{{it.status}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 상태 요약 -->
  <div style="position: absolute; left: 648px; top: 600px; width: 568px; height: 48px; box-sizing: border-box; border-radius: 10px; background: #f5f6f8; padding: 0 16px; display: flex; align-items: center; gap: 18px">
    <span style="font-size: 12.5px; font-weight: 800">현황</span>
    <sc-for list="{{sum}}" as="s" hint-placeholder-count="3">
      <span style="display: flex; align-items: center; gap: 7px"><span style="{{s.chip}}">{{s.name}}</span><span style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800">{{s.n}}</span></span>
    </sc-for>
    <span style="margin-left: auto; font-size: 12px; color: #596170; white-space: nowrap">실사 후 설치 도면 확정</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>C 빌딩 · 스마트 오피스 제안 · 현장 사진 2026.09.[00] 촬영</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 36</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 상태 칩 — 확인됨(Blue Soft) · 실사 필요(Ink 테두리) · 고객 확인(Surface)
    const chipBase = 'height: 22px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; ';
    const ST = {
      ok: ['확인됨', 'background: #eaeefb; color: #1428a0;'],
      site: ['실사 필요', 'background: #ffffff; color: #121417; border: 1.5px solid #121417;'],
      cust: ['고객 확인', 'background: #f5f6f8; color: #3d4452; border: 1px solid #d5d9e0;']
    };
    // [그룹, 아이콘, [[핀 번호(0 = 사진 위치 없음), 항목, 기준 · 값, 상태]]]
    const G = [
      ['구조', 'struct', [
        [1, '벽체 하중', '조적 / 경량', 'site'],
        [2, '기둥 마감', '석재 [00]T', 'ok'],
        [3, '천장 높이 · 점검구', '[0,000] mm', 'site']
      ]],
      ['전기', 'power', [
        [4, '전원 용량', '분전반 위치 · [00] kW', 'cust'],
        [0, '접지', '분전반 접지 단자', 'ok']
      ]],
      ['통신', 'net', [
        [5, 'LAN 포트', '무선 음영 · 포트 [0]개', 'site'],
        [0, '사내망 접속', '방화벽 · 외부 접속 정책', 'cust']
      ]],
      ['환경', 'env', [
        [6, '오후 직사광', '화면 반사 · 온습도', 'ok'],
        [0, '반입구 크기', '[0,000] × [0,000] mm', 'site'],
        [0, '소방 설비 간섭', '스프링클러 · 감지기', 'site']
      ]],
      ['일정', 'time', [
        [0, '공사 가능 시간', '평일 22–06시', 'cust'],
        [0, '소음 작업 제한', '타공 · 앵커 작업 시간', 'cust']
      ]]
    ];
    const pinSt = 'width: 22px; height: 22px; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center';
    const groups = G.map(([name, icon, items]) => ({
      name, ic: { struct: icon === 'struct', power: icon === 'power', net: icon === 'net', env: icon === 'env', time: icon === 'time' },
      items: items.map(([pin, nm, val, st], i) => ({
        pin: pin ? String(pin) : '', name: nm, val, status: ST[st][0],
        pinSt: pin ? pinSt : 'width: 22px; height: 22px',
        chip: chipBase + 'justify-self: end; ' + ST[st][1],
        row: 'display: grid; grid-template-columns: 30px 140px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; height: 35px; box-sizing: border-box;' + (i > 0 ? ' border-top: 1px solid #eef0f3;' : '')
      }))
    }));
    // 상태별 개수 — 항목에서 자동 집계
    const all = G.reduce((a, g) => a.concat(g[2]), []);
    const sum = ['ok', 'site', 'cust'].map((k) => ({
      name: ST[k][0], chip: chipBase + ST[k][1],
      n: String(all.filter((x) => x[3] === k).length)
    }));
    // 핀 좌표는 사진(560×488) 기준 예시 — 실제 사진이 들어오면 위치에 맞춰 조정
    const PINS = [
      [1, '벽체', 22, 132], [2, '기둥', 196, 116], [3, '천장 점검구', 312, 40],
      [4, '분전반', 420, 334], [5, 'LAN 포트', 60, 392], [6, '창 · 직사광', 386, 150]
    ];
    const pins = PINS.map(([no, label, x, y]) => ({
      no, label,
      box: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; display: flex; align-items: center; gap: 6px'
    }));
    return { groups, sum, pins };
  }
}
</script>
</body>
</html>
