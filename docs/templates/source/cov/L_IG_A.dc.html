<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IG-A 시스템 연동 매트릭스</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">09 · 실행 계획 — 시스템 연동</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">호텔이 쓰는 다섯 시스템과 이렇게 연결합니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">고객 시스템 × 삼성 솔루션 · 연동 방식 · 주고받는 데이터</div>

  <!-- 매트릭스 9열 -->
  <div style="position: absolute; left: 64px; top: 160px; width: 858px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 128px repeat(5, minmax(0, 1fr)); height: 58px; align-items: center; border-bottom: 2px solid #121417">
      <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 4px">
        <span style="font-size: 12.5px; font-weight: 700; color: #596170">고객 시스템</span>
        <span style="font-size: 11.5px; color: #8a91a0">× 삼성 솔루션</span>
      </div>
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">{{c.name}}</span>
          <span style="font-size: 11.5px; color: #8a91a0; white-space: nowrap">{{c.role}}</span>
        </div>
      </sc-for>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 128px repeat(5, minmax(0, 1fr)); height: 84px; align-items: stretch; border-bottom: 1px solid #e2e5ea">
        <div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-left: 4px">
          <span style="font-size: 15px; font-weight: 800; white-space: nowrap">{{r.name}}</span>
          <span style="font-size: 12px; color: #596170; white-space: nowrap">{{r.sub}}</span>
        </div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5">
          <div style="padding: 5px 4px; box-sizing: border-box; display: flex">
            <div style="{{c.tile}}">
              <sc-if value="{{c.on}}" hint-placeholder-val="{{true}}">
                <span style="{{c.chip}}">{{c.kind}}</span>
                <span style="display: flex; flex-wrap: wrap; column-gap: 4px; font-size: 11.5px; line-height: 1.4; color: #3d4452">
                  <sc-for list="{{c.segs}}" as="g" hint-placeholder-count="2"><span style="white-space: nowrap">{{g}}</span></sc-for>
                </span>
              </sc-if>
              <sc-if value="{{c.off}}" hint-placeholder-val="{{false}}">
                <span style="width: 14px; height: 2px; border-radius: 1px; background: #d5d9e0"></span>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- 연동 전제 조건 3열 -->
  <div style="position: absolute; left: 946px; top: 160px; width: 270px; height: 488px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 20px 20px 18px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 11l3 3 8-8 M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span style="font-size: 16px; font-weight: 800">연동 전제 조건</span>
    </div>
    <div style="margin-top: 12px; display: flex; flex-direction: column">
      <sc-for list="{{pre}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #e2e5ea">
          <span style="width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; box-sizing: border-box; border: 1.5px solid #b8bec8; border-radius: 4px; background: #ffffff"></span>
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0">
            <span style="font-size: 13.5px; font-weight: 700; white-space: nowrap">{{p.name}}</span>
            <span style="{{p.vSt}}">{{p.v}}</span>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="border-top: 1px solid #d5d9e0; padding-top: 14px; display: flex; flex-direction: column; gap: 9px">
      <span style="font-size: 12.5px; font-weight: 800; color: #596170">연동 방식 · 건수</span>
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="{{l.chip}}">{{l.kind}}</span>
          <span style="font-size: 12px; color: #3d4452; white-space: nowrap">{{l.desc}}</span>
          <span style="margin-left: auto; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800">{{l.n}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>B 비즈니스 호텔 · 객실 · 공용부 리뉴얼 제안 · 연동 방식은 벤더 협의로 확정</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 39</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 연동 방식 칩 — API(Blue) · 인터페이스 모듈(Blue mid) · 파일 연계(Surface) · 확인 필요(Ink 테두리)
    const chipBase = 'height: 22px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0; ';
    const K = {
      api: ['API', 'background: #1428a0; color: #ffffff;', '표준 API · 실시간 호출'],
      mod: ['인터페이스 모듈', 'background: #6f82d6; color: #ffffff;', '게이트웨이로 변환'],
      file: ['파일 연계', 'background: #f5f6f8; color: #3d4452; border: 1px solid #d5d9e0;', '정해진 시각에 교환'],
      tbd: ['확인 필요', 'background: #ffffff; color: #121417; border: 1.5px solid #121417;', '벤더 협의 후 확정']
    };
    const cols = [
      ['LYNK Cloud', '객실 TV'],
      ['MagicINFO', '사이니지 · 메뉴'],
      ['b.IoT', '객실 · 설비 제어'],
      ['SmartThings Pro', '에너지 · 기기'],
      ['Knox Suite', '직원 단말 보안']
    ].map(([name, role]) => ({ name, role }));
    // [고객 시스템, 설명, { 열 번호: [방식, 주고받는 데이터] }]
    const R = [
      ['PMS', '객실 관리', { 0: ['api', '투숙객 이름 · 체크인/아웃'], 2: ['mod', '재실 → 객실 공조'] }],
      ['POS', 'F&B', { 1: ['api', '메뉴 · 가격 · 품절'] }],
      ['BMS', '빌딩 설비', { 2: ['mod', '공조 · 조명 상태'], 3: ['tbd', '전력 계량'] }],
      ['예약 · CRM', '고객 관리', { 0: ['file', '웰컴 메시지 · 언어'] }],
      ['SSO', '사내 인증', { 4: ['api', '직원 계정 · 권한'], 1: ['tbd', '관리자 로그인'] }]
    ];
    const tileBase = 'flex-grow: 1; min-width: 0; box-sizing: border-box; border-radius: 10px; display: flex; flex-direction: column; ';
    const rows = R.map(([name, sub, map]) => ({
      name, sub,
      cells: [0, 1, 2, 3, 4].map((j) => {
        const c = map[j];
        return c ? {
          on: true, off: false, kind: K[c[0]][0],
          segs: c[1].split(' · ').map((t, i, a) => (i < a.length - 1 ? t + ' ·' : t)),
          chip: chipBase + K[c[0]][1],
          tile: tileBase + 'background: #ffffff; border: 1px solid #d5d9e0; padding: 0 10px; align-items: flex-start; justify-content: center; gap: 6px;'
        } : {
          on: false, off: true, kind: '', segs: [], chip: '',
          tile: tileBase + 'align-items: center; justify-content: center;'
        };
      })
    }));
    // 방식별 건수 — 매트릭스에서 자동 집계
    const all = R.reduce((a, r) => a.concat(Object.keys(r[2]).map((k) => r[2][k][0])), []);
    const legend = ['api', 'mod', 'file', 'tbd'].map((k) => ({
      kind: K[k][0], desc: K[k][2], chip: chipBase + K[k][1],
      n: String(all.filter((x) => x === k).length)
    }));
    const vTxt = 'font-family: Manrope, \'Noto Sans KR\', sans-serif; font-size: 12.5px; color: #596170; white-space: nowrap';
    const vChip = chipBase + K.tbd[1];
    const pre = [
      ['PMS 벤더 API 제공 여부', '확인 필요', vChip],
      ['방화벽 포트 개방', '[00]개 · 고객 IT팀 승인', vTxt],
      ['연동 개발 주체', 'SI 파트너 · 범위 [확정 필요]', vTxt],
      ['시험 환경(스테이징) 제공', '운영 전 [0]주 · 고객 제공', vTxt]
    ].map(([name, v, vSt]) => ({ name, v, vSt }));
    return { cols, rows, legend, pre };
  }
}
</script>
</body>
</html>
