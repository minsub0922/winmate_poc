<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ST-E 경쟁사 주장 → 반론 · 근거</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">07 · WHY SAMSUNG</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">비교할 때 나올 세 가지 말, 사실은 이렇습니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">예상 주장 · 확인된 사실 · 근거가 있는 쪽</div>

  <!-- 3행: 말풍선(360) · 화살표(48) · 사실(472) · 근거(248) -->
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <div style="{{r.pos}}">
      <!-- 말풍선 -->
      <div style="position: absolute; left: 0; top: 0; width: 360px; height: 134px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 0 24px; display: flex; flex-direction: column; justify-content: center; gap: 12px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #121417; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{r.who}}</span>
          <span style="font-size: 12px; color: #8a91a0">예상 주장</span>
        </div>
        <span style="font-size: 16px; font-weight: 700; line-height: 1.45; word-break: keep-all">{{r.claim}}</span>
      </div>
      <div style="position: absolute; left: 32px; top: 134px; width: 0; height: 0; border-top: 14px solid #f5f6f8; border-right: 18px solid transparent"></div>

      <!-- 화살표 -->
      <div style="position: absolute; left: 360px; top: 0; width: 48px; height: 134px; display: flex; align-items: center; justify-content: center">
        <div style="width: 20px; height: 2px; background: #1428a0"></div>
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="#1428a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: -3px"><path d="M2 1l6 5-6 5"/></svg>
      </div>

      <!-- 사실 -->
      <div style="position: absolute; left: 408px; top: 0; width: 472px; height: 148px; box-sizing: border-box; border-radius: 16px; background: #ffffff; border: 1px solid #e2e5ea; padding: 0 24px; display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: #1428a0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>사실</span>
        <span style="font-size: 14px; line-height: 1.65; color: #121417; word-break: keep-all">{{r.fact}}</span>
      </div>

      <!-- 근거 -->
      <div style="position: absolute; left: 904px; top: 0; width: 248px; height: 148px; box-sizing: border-box; border-radius: 16px; background: #eaeefb; padding: 18px 20px; display: flex; flex-direction: column">
        <span style="font-size: 12.5px; font-weight: 800; color: #1428a0">근거</span>
        <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{r.refs}}" as="c" hint-placeholder-count="1">
            <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #ffffff; color: #1428a0; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{c}}</span>
          </sc-for>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="display: flex; align-items: baseline; gap: 8px; padding-top: 10px; border-top: 1px solid #b8c3ee">
          <span style="font-size: 13px; font-weight: 700; color: #3d4452">{{r.kpiK}}</span>
          <span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; color: #1428a0">{{r.kpiV}}</span>
        </div>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 주장은 공개 자료 · 영업 현장 기준 예상</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 25</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 행 높이 148 · 간격 16 · 시작 160 (경쟁사는 익명)
    const TOP = 160, H = 148, GAP = 16;
    const R = [
      ['경쟁사 C', '“소프트웨어만 바꾸면 더 싸다”',
        '기존 화면 재사용 시 화면 수명 · 밝기 저하로 [0]년 내 교체가 필요합니다. 5년 총비용은 오히려 높습니다.',
        ['CO-B 총소유비용 p.[00]'], '5년 총비용', '−[00]%'],
      ['경쟁사 D', '“수도권 설치가 더 빠르다”',
        '협력사 2팀 추가로 매장당 설치 [0]일 · 야간 동시 설치로 오픈 일정은 같습니다.',
        ['IP-C 시공 일정 p.[00]'], '매장당 설치', '[0]일'],
      ['경쟁사 B', '“글로벌 레퍼런스가 더 많다”',
        '이번 요구는 국내 외식 매장 운영입니다. 국내 외식 도입 사례와 직영 서비스망이 더 직접적인 근거입니다.',
        ['CL-B 사례 p.[00]'], '국내 외식', '[00]곳']
    ];
    const rows = R.map(([who, claim, fact, refs, kpiK, kpiV], i) => ({
      who, claim, fact, refs, kpiK, kpiV,
      pos: 'position: absolute; left: 64px; top: ' + (TOP + i * (H + GAP)) + 'px; width: 1152px; height: ' + H + 'px'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
