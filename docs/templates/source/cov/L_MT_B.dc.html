<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MT-B 케어 플랜 등급</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">09 · 실행 계획 — 유지보수</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">세 가지 케어 플랜 — 매장 수와 운영 방식에 맞춰</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">320개 매장 기준 · 가운데가 추천</div>

  <!-- 3 플랜: 행은 세 카드가 같은 순서로 정렬 -->
  <div style="position: absolute; left: 64px; top: 156px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{plans}}" as="t" hint-placeholder-count="3">
      <div style="{{t.box}}">
        <div style="display: flex; align-items: center; gap: 10px; height: 30px">
          <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: {{t.nameColor}}">{{t.name}}</span>
          <sc-if value="{{t.rec}}" hint-placeholder-val="{{false}}">
            <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">추천</span>
          </sc-if>
          <span style="flex-grow: 1"></span>
          <span style="font-size: 12px; color: #596170">상대 비용</span>
          <div style="display: flex; gap: 4px">
            <sc-for list="{{t.cost}}" as="c" hint-placeholder-count="3">
              <span style="{{c}}"></span>
            </sc-for>
          </div>
        </div>
        <span style="margin-top: 6px; font-size: 14px; color: #3d4452; white-space: nowrap">{{t.desc}}</span>
        <div style="margin-top: 14px; height: 1px; flex-shrink: 0; background: #e2e5ea"></div>
        <div style="margin-top: 2px; display: flex; flex-direction: column">
          <sc-for list="{{t.rows}}" as="r" hint-placeholder-count="7">
            <div style="{{r.row}}">
              <span style="font-size: 13.5px; color: #596170; white-space: nowrap">{{r.k}}</span>
              <span style="flex-grow: 1"></span>
              <span style="{{r.dot}}"></span>
              <span style="{{r.vs}}">{{r.v}}</span>
            </div>
          </sc-for>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="{{t.whenBox}}">
          <span style="{{t.whenLabel}}">이럴 때</span>
          <span style="font-size: 14px; font-weight: 700; line-height: 1.45; white-space: nowrap">{{t.when}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 추천 이유 -->
  <div style="position: absolute; left: 64px; top: 612px; width: 1152px; height: 36px; box-sizing: border-box; border-radius: 10px; background: #f5f6f8; padding: 0 20px; display: flex; align-items: center; gap: 18px; white-space: nowrap">
    <span style="font-size: 13px; font-weight: 800; color: #1428a0">추천 이유</span>
    <span style="width: 1px; height: 16px; background: #d5d9e0"></span>
    <sc-for list="{{reasons}}" as="x" hint-placeholder-count="3">
      <span style="font-size: 13px; color: #3d4452">{{x.a}} <span style="font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: #121417">{{x.n}}</span>{{x.b}}</span>
    </sc-for>
    <span style="flex-grow: 1"></span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #596170"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1428a0"></span>포함</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #596170"><span style="font-family: Manrope, sans-serif; font-weight: 700; color: #b8bec8">—</span>미포함</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 금액은 견적서 · SLA는 계약 조건으로 확정</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 43</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 카드 368 × 444 (y 156–600) · 행 7개 × 36은 세 카드가 같은 순서
    const K = ['무상 보증', '원격 모니터링', '장애 대응 방문', '정기 점검', '예비품 보유', '콘텐츠 운영 지원', '리포트'];
    // 값: '●' = 포함 · '—' = 없음 · 그 밖은 값 그대로 (수치는 자리표시)
    const P = [
      { name: '기본', rec: false, cost: 1, desc: '보증 기간 안의 방문 수리 중심',
        v: ['[0]년', '—', '[00]시간 이내', '연 1회', '—', '—', '—'],
        when: '매장이 적고 IT 인력이 있을 때' },
      { name: '표준', rec: true, cost: 2, desc: '원격으로 먼저 살피고, 필요할 때 방문',
        v: ['[0]년', '●', '[0]시간 이내', '연 [0]회', '지역 거점', '월 [0]건', '월간'],
        when: '매장이 많고 본사 운영팀이 작을 때' },
      { name: '프리미엄', rec: false, cost: 3, desc: '매장 가까이에서, 가장 빠르게',
        v: ['[0]년', '●', '[0]시간 이내', '분기', '매장 근처', '상시', '주간'],
        when: '24시간 매장 · 장애가 매출로 직결될 때' }
    ];
    const sqOn = 'width: 12px; height: 12px; border-radius: 3px; background: #121417';
    const sqOff = 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 3px; border: 1.5px solid #d5d9e0';
    const plans = P.map((t) => ({
      name: t.name, rec: t.rec, desc: t.desc, when: t.when,
      nameColor: t.rec ? '#1428a0' : '#121417',
      box: 'position: relative; height: 444px; box-sizing: border-box; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; ' +
        (t.rec ? 'border: 2px solid #1428a0; padding: 19px 21px' : 'border: 1px solid #e2e5ea; padding: 20px 22px'),
      cost: [1, 2, 3].map((i) => (i <= t.cost ? sqOn : sqOff)),
      rows: K.map((k, i) => {
        const v = t.v[i];
        const on = v === '●', none = v === '—';
        return {
          k,
          v: on ? '포함' : v,
          row: 'display: flex; align-items: center; gap: 7px; height: 36px; box-sizing: border-box' + (i < K.length - 1 ? '; border-bottom: 1px solid #eef0f3' : ''),
          dot: on ? 'width: 10px; height: 10px; flex-shrink: 0; border-radius: 50%; background: #1428a0' : 'display: none',
          vs: 'white-space: nowrap; font-family: Manrope, \'Noto Sans KR\', sans-serif; ' +
            (none ? 'font-size: 14px; font-weight: 700; color: #b8bec8' : on ? 'font-size: 14px; font-weight: 700; color: #1428a0' : 'font-size: 14.5px; font-weight: 800; color: ' + (t.rec ? '#1428a0' : '#121417'))
        };
      }),
      whenBox: 'height: 64px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: ' + (t.rec ? '#eaeefb' : '#f5f6f8'),
      whenLabel: 'font-size: 12px; font-weight: 700; color: ' + (t.rec ? '#1428a0' : '#596170')
    }));
    return {
      plans,
      // 추천 이유 · 320개 매장 · 본사 운영 인원 [0]명 · 드라이브스루 [00]곳
      reasons: [
        { a: '', n: '320', b: '개 매장' },
        { a: '본사 운영 인원', n: '[0]', b: '명' },
        { a: '드라이브스루', n: '[00]', b: '곳' }
      ]
    };
  }
}
</script>
</body>
</html>
