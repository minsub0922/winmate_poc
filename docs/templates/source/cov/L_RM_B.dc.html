<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RM-B 요구사항 대응표</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">00 · 요구사항 대응</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">요구사항 28개, 빠짐없이 대응합니다</div>

  <!-- 요약 칩 + 쪽 표시 (부제 자리) -->
  <div style="position: absolute; right: 64px; top: 116px; height: 26px; display: flex; align-items: center; gap: 8px">
    <span style="height: 26px; padding: 0 12px; border-radius: 999px; background: #1428a0; color: #ffffff; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700">충족<span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800">[00]</span></span>
    <span style="height: 26px; padding: 0 12px; border-radius: 999px; background: #b8c3ee; color: #121417; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700">부분<span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800">[0]</span></span>
    <span style="height: 26px; padding: 0 11px; box-sizing: border-box; border-radius: 999px; background: #ffffff; border: 1px solid #121417; color: #121417; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700">대안<span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800">[0]</span></span>
    <span style="width: 1px; height: 16px; margin: 0 6px; background: #d5d9e0"></span>
    <span style="font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; color: #121417">1<span style="color: #8a91a0"> / 3</span></span>
  </div>

  <!-- 표 -->
  <div style="position: absolute; left: 64px; top: 152px; width: 1152px; display: flex; flex-direction: column">
    <div style="{{head}}">
      <span>ID</span><span>구분</span><span>요구 내용</span><span>필수</span><span>대응 방안</span><span style="text-align: center">수준</span><span style="text-align: center">위치</span><span style="text-align: center">변경</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="{{r.st}}">
        <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700; color: #121417; white-space: nowrap">{{r.id}}</span>
        <span style="font-size: 13px; color: #596170; white-space: nowrap">{{r.cat}}</span>
        <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{r.req}}</span>
        <span style="{{r.mustStyle}}">{{r.must}}</span>
        <span style="font-size: 13.5px; color: #121417; white-space: nowrap">{{r.ans}}</span>
        <span style="display: flex; justify-content: center"><span style="{{r.dot}}"></span></span>
        <span style="display: flex; justify-content: center"><span style="height: 22px; padding: 0 9px; border-radius: 999px; background: #f5f6f8; color: #3d4452; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{r.pg}}</span></span>
        <span style="display: flex; justify-content: center"><span style="{{r.chgStyle}}">{{r.chg}}</span></span>
      </div>
    </sc-for>
  </div>

  <!-- 범례 -->
  <div style="position: absolute; left: 64px; top: 628px; height: 18px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #596170; white-space: nowrap">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 50%; background: #1428a0"></span>충족</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 50%; background: #b8bec8"></span>부분 충족</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #121417"></span>대안 제시</span>
    <span style="width: 1px; height: 14px; background: #d5d9e0"></span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="height: 18px; padding: 0 7px; border-radius: 999px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center">NEW</span><span style="height: 18px; padding: 0 7px; box-sizing: border-box; border-radius: 999px; border: 1px solid #121417; color: #121417; font-size: 11px; font-weight: 700; display: flex; align-items: center">수정</span>변경 = 고객 답변 반영 v2</span>
  </div>
  <div style="position: absolute; right: 64px; top: 628px; height: 18px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8a91a0; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-weight: 700; color: #3d4452">1–10 / 28</span>다음 쪽에 이어집니다</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>S 지자체 · 통합 안내 · 관제 고도화 사업 제안 · RFP 요구사항 28개 기준</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 7</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 열: ID · 구분 · 요구 내용 · 필수 · 대응 방안 · 수준 · 위치 · 변경 (폭 1152, 열 간격 20)
    const GC = 'grid-template-columns: 92px 76px 300px 56px minmax(0, 1fr) 76px 104px 80px; column-gap: 20px;';
    // 수준: 2 충족 · 1 부분 · 0 대안 / 변경: NEW · 수정 · ''
    const R = [
      ['SFR-001', '기능', '상황실 화면 통합 표출', '필수', '비디오월 + 통합 관제 SW', 2, 'p.[00]', ''],
      ['SFR-002', '기능', '정류장 도착 정보 실시간 안내', '필수', 'BIS 연동 사이니지', 2, 'p.[00]', ''],
      ['SFR-003', '기능', '다국어 4개 안내', '필수', '콘텐츠 템플릿 다국어', 2, 'p.[00]', ''],
      ['SFR-004', '기능', '긴급 재난 문자 즉시 표출', '필수', '관제 → 전 사이니지 긴급 모드', 2, 'p.[00]', 'NEW'],
      ['PER-001', '성능', '화면 전환 [0]초 이내', '필수', '로컬 캐시 재생', 2, 'p.[00]', ''],
      ['PER-002', '성능', '24시간 365일 운영', '필수', '상업용 24/7 모델', 2, 'p.[00]', ''],
      ['SER-001', '보안', '관리자 접근 기록', '필수', '접근 로그 · 감사 보고', 1, 'p.[00]', '수정'],
      ['SER-002', '보안', '내부망 분리 운영', '필수', '내부 서버형 구성', 2, 'p.[00]', ''],
      ['INF-001', '인프라', '옥외 IP 등급', '선택', '옥외 모델 IP[00]', 2, 'p.[00]', ''],
      ['MNT-001', '유지보수', '장애 [0]시간 내 복구', '필수', '원격 조치 + 현장 출동', 1, 'p.[00]', '']
    ];
    const DOT = {
      2: 'width: 12px; height: 12px; border-radius: 50%; background: #1428a0',
      1: 'width: 12px; height: 12px; border-radius: 50%; background: #b8bec8',
      0: 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #121417'
    };
    const CHG = {
      NEW: 'height: 22px; padding: 0 8px; border-radius: 999px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center',
      '수정': 'height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; border: 1px solid #121417; color: #121417; font-size: 11.5px; font-weight: 700; display: flex; align-items: center',
      '': 'display: none'
    };
    const head = 'display: grid; ' + GC + ' height: 34px; box-sizing: border-box; align-items: center; padding: 0 4px; border-bottom: 2px solid #121417; font-size: 12.5px; font-weight: 700; color: #596170';
    const rows = R.map(([id, cat, req, must, ans, lv, pg, chg]) => ({
      id, cat, req, must, ans, pg, chg,
      mustStyle: 'font-size: 12.5px; white-space: nowrap; ' + (must === '필수' ? 'font-weight: 700; color: #121417' : 'font-weight: 500; color: #8a91a0'),
      dot: DOT[lv],
      chgStyle: CHG[chg],
      st: 'display: grid; ' + GC + ' height: 43px; box-sizing: border-box; align-items: center; padding: 0 4px; border-bottom: 1px solid #e2e5ea'
    }));
    return { head, rows };
  }
}
</script>
</body>
</html>
