<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SS-F 장면 스토리보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">손님 한 명의 25분 — 일곱 장면</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">매장 도착부터 다시 오고 싶어지기까지 · 장면마다 쓰이는 제품</div>

  <!-- 장면 7 -->
  <sc-for list="{{scenes}}" as="s" hint-placeholder-count="7">
    <div style="{{s.box}}">
      <div style="position: relative; width: 270px; height: 150px; flex-shrink: 0">
        <dc-import name="Img" kind="{{s.kind}}" origin="gen" hint="{{s.hint}}" w="270" h="150" radius="10" hint-size="270px,150px"></dc-import>
        <div style="position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px">
          <span style="width: 26px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 2px solid #ffffff; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.no}}</span>
          <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #121417; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">{{s.at}}</span>
        </div>
      </div>
      <div style="flex-grow: 1; box-sizing: border-box; padding: 12px 14px 12px 14px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 700; line-height: 1.4; white-space: nowrap">{{s.cap}}</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #ffffff; color: #1428a0; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{s.prod}}</span>
          <span style="flex-grow: 1"></span>
          <span style="height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(20,40,160,0.86); color: #ffffff; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; white-space: nowrap"><svg width="9" height="9" viewBox="0 0 24 24" fill="#ffffff" stroke="none"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg>AI 생성 시안</span>
        </div>
      </div>
    </div>
  </sc-for>
  <sc-for list="{{chevs}}" as="c" hint-placeholder-count="5">
    <div style="{{c}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
  </sc-for>

  <!-- 8번째: 요약 -->
  <div style="position: absolute; left: 946px; top: 404px; width: 270px; height: 236px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 16px 18px 14px 18px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 800; color: #1428a0">장면에 나온 것</span>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 54px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: #596170">제품 4종</span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px">
        <sc-for list="{{prods}}" as="p" hint-placeholder-count="4">
          <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #ffffff; color: #121417; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p}}</span>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 54px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: #596170">솔루션 2</span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px">
        <sc-for list="{{sols}}" as="p" hint-placeholder-count="2">
          <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #1428a0; color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p}}</span>
        </sc-for>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="border-top: 1px solid #b8c3ee; padding-top: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12.5px; font-weight: 700; color: #3d4452">이 흐름으로 줄어드는 대기</span>
      <span style="display: flex; align-items: baseline; gap: 4px; color: #1428a0"><span style="font-family: Manrope, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15">[00]</span><span style="font-size: 16px; font-weight: 800">분</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 장면 이미지는 AI 생성 시안 — 실제와 다를 수 있음</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 19</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 4 × 2 패널 270 × 236, 간격 24 / 16, top 152 — 8번째 칸(오른쪽 아래)은 요약 카드
    const X0 = 64, Y0 = 152, PW = 270, PH = 236, GX = 24, GY = 16;
    const pos = (i) => [X0 + (i % 4) * (PW + GX), Y0 + Math.floor(i / 4) * (PH + GY)];
    // [경과, 캡션, 제품 칩, 이미지 종류, 이미지 힌트]
    const S = [
      ['+0:00', '창가 사이니지에 오늘의 메뉴', 'QM55C 창가', 'people', '매장 밖 창가 화면을 보는 손님'],
      ['+0:30', '줄이 길면 키오스크로', 'KM24C', 'people', '줄 옆 키오스크에서 주문하는 손님'],
      ['+2:00', '메뉴보드에서 품절 없이 고르기', 'QM55C ×3 · POS 연동', 'insitu', '카운터 위 메뉴보드 3면 · 손님 시점'],
      ['+3:00', '결제 후 대기 번호 안내', '세로 사이니지', 'insitu', '대기 번호가 뜬 세로 사이니지'],
      ['+6:00', '픽업 호출, 바로 수령', '세로 사이니지', 'people', '번호 호출에 픽업대에서 음료를 받는 손님'],
      ['+7:00', '자리에서 쾌적하게', '360 카세트', 'people', '천장 카세트 아래 좌석에서 쉬는 손님'],
      ['+25:00', '나가며 다음 방문 쿠폰', 'QM55C 출구', 'people', '출구 화면의 쿠폰 QR을 찍는 손님']
    ];
    const scenes = S.map(([at, cap, prod, kind, hint], i) => {
      const [x, y] = pos(i);
      return {
        no: String(i + 1), at, cap, prod, kind, hint,
        box: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + PW + 'px; height: ' + PH + 'px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; overflow: hidden; display: flex; flex-direction: column'
      };
    });
    // 같은 줄의 다음 장면으로 이어지는 쉐브런 (이미지 높이 가운데)
    const chevs = [0, 1, 2, 4, 5].map((i) => {
      const [x, y] = pos(i);
      return 'position: absolute; left: ' + (x + PW + (GX - 16) / 2) + 'px; top: ' + (y + 75 - 8) + 'px; width: 16px; height: 16px';
    });
    return {
      scenes, chevs,
      prods: ['QM55C', 'KM24C', '세로 사이니지', '360 카세트'],
      sols: ['MagicINFO', 'POS 연동']
    };
  }
}
</script>
</body>
</html>
