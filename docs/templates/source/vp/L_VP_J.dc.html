<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-J 솔루션 화면 + 연결 제품</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">화면 하나로 320개 매장의 모든 기기를 움직입니다</div>

  <!-- 솔루션 화면 -->
  <div style="position: absolute; left: 64px; top: 136px; width: 640px; height: 400px; border-radius: 16px; background: #f5f6f8"></div>
  <div style="position: absolute; left: 64px; top: 136px; width: 640px; height: 400px">
    <dc-import name="Prod" kind="cms" w="640" h="400" zoom="{{yes}}" hint-size="640px,400px"></dc-import>
  </div>
  <div style="position: absolute; left: 80px; top: 150px; height: 26px; padding: 0 10px; border-radius: 8px; background: #121417; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: #9db4ff"></span>MagicINFO · 관리 화면 (예시)</div>
  <sc-for list="{{pins}}" as="p" hint-placeholder-count="3">
    <div style="{{p.style}}">{{p.no}}</div>
  </sc-for>

  <!-- 핀 설명 -->
  <div style="position: absolute; left: 64px; top: 552px; width: 640px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{pinText}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; gap: 8px; min-width: 0">
        <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{t.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 14px; font-weight: 800">{{t.t}}</span>
          <span style="font-size: 12.5px; line-height: 1.5; color: #596170">{{t.d}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 연결선 -->
  <div style="position: absolute; left: 704px; top: 335px; width: 24px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 727px; top: 204px; width: 2px; height: 292px; background: #1428a0"></div>
  <div style="position: absolute; left: 727px; top: 204px; width: 17px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 727px; top: 300px; width: 17px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 727px; top: 396px; width: 17px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 727px; top: 494px; width: 17px; height: 2px; background: #1428a0"></div>

  <!-- 움직이는 제품 -->
  <div style="position: absolute; left: 744px; top: 136px; font-size: 13px; font-weight: 800; color: #3d4452">이 화면 하나가 움직이는 제품</div>
  <div style="position: absolute; left: 744px; top: 162px; width: 472px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
      <div style="height: 86px; box-sizing: border-box; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 14px">
        <dc-import name="Prod" kind="{{d.kind}}" w="116" h="74" bg="soft" zoom="{{d.zoom}}" hint-size="116px,74px"></dc-import>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 800">{{d.name}}</span>
          <span style="font-size: 12.5px; color: #596170">{{d.role}}</span>
        </div>
        <span style="font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: #1428a0; white-space: nowrap">{{d.qty}}</span>
      </div>
    </sc-for>
  </div>

  <!-- 가치 -->
  <div style="position: absolute; left: 744px; top: 552px; width: 472px; height: 96px; box-sizing: border-box; border-radius: 14px; background: #121417; color: #ffffff; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12.5px; font-weight: 700; color: #9db4ff">그래서 A 커피는</span>
    <div style="display: flex; gap: 18px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11.5px; color: #c5cbd6; white-space: nowrap">{{k.k}}</span><span style="font-family: Manrope, sans-serif; font-size: 21px; font-weight: 800; white-space: nowrap">{{k.v}}</span></div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 화면 · 제품 이미지는 예시</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 10</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 화면 좌표 → 슬라이드 좌표 (Prod cms 확대 viewBox 26 10 188 140, 640 × 400 상자)
    const L = 64, T = 136, W = 640, H = 400, VX = 26, VY = 10, VW = 188, VH = 140;
    const S = Math.min(W / VW, H / VH);
    const ox = (W - VW * S) / 2, oy = (H - VH * S) / 2;
    const at = (vx, vy) => [Math.round(L + ox + (vx - VX) * S), Math.round(T + oy + (vy - VY) * S)];
    const P = [[1, [118, 73]], [2, [184, 26]], [3, [194, 81]]];
    const pins = P.map(([no, [vx, vy]]) => {
      const [x, y] = at(vx, vy);
      return { no, style: 'position: absolute; left: ' + (x - 15) + 'px; top: ' + (y - 15) + 'px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(18,20,23,0.25); color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;' };
    });
    const pinText = [
      ['매장 상태 한눈에', '[000]곳의 화면이 켜졌는지 · 무엇을 트는지'],
      ['예약 배포', '시간대 · 시즌 콘텐츠를 미리 걸어 두기'],
      ['장애 알림', '꺼진 화면 · 미수신 매장을 바로 표시']
    ].map(([t, d], i) => ({ no: i + 1, t, d }));
    const devices = [
      ['menuboard3', true, 'Smart Signage QM55C × 3', '카운터 메인 메뉴보드', '[000]대'],
      ['outdoor', true, 'OH55C', '드라이브스루 · 매장 앞', '[000]대'],
      ['kiosk', true, 'Kiosk KM24C', '셀프 주문 · 결제', '[000]대'],
      ['pickup', true, 'QM43C', '픽업 번호 호출', '[000]대']
    ].map(([kind, zoom, name, role, qty]) => ({ kind, zoom, name, role, qty }));
    const kpis = [['서버 추가', '0대'], ['매장 작업', '0회'], ['장애 확인', '[0]분']].map(([k, v]) => ({ k, v }));
    return { yes: true, pins, pinText, devices, kpis };
  }
}
</script>
</body>
</html>
