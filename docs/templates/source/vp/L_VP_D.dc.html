<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-D 이해관계자별 가치</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">같은 도입, 세 사람에게 다른 가치</div>

  <!-- 하나의 도입 (허브) -->
  <div style="position: absolute; left: 370px; top: 138px; width: 540px; height: 46px; box-sizing: border-box; border-radius: 999px; background: #1428a0; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 12px">
    <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 12px; font-weight: 700; display: flex; align-items: center">같은 도입</span>
    <span style="font-size: 15px; font-weight: 700">QM 메뉴보드 · MagicINFO · 320개 매장</span>
  </div>

  <!-- 허브 → 세 사람 연결선 -->
  <div style="position: absolute; left: 639px; top: 184px; width: 2px; height: 20px; background: #1428a0"></div>
  <div style="position: absolute; left: 247px; top: 204px; width: 786px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 247px; top: 204px; width: 2px; height: 24px; background: #1428a0"></div>
  <div style="position: absolute; left: 639px; top: 204px; width: 2px; height: 24px; background: #1428a0"></div>
  <div style="position: absolute; left: 1031px; top: 204px; width: 2px; height: 24px; background: #1428a0"></div>

  <!-- 이해관계자 3 -->
  <div style="position: absolute; left: 64px; top: 228px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
      <div style="height: 420px; box-sizing: border-box; border-radius: 16px; background: #ffffff; border: 1px solid #e2e5ea; padding: 28px 28px 28px 28px; display: flex; flex-direction: column; align-items: center; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #eaeefb; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
        <span style="margin-top: 12px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em">{{p.role}}</span>
        <span style="margin-top: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #8a91a0">관심사</span>
        <span style="margin-top: 6px; font-size: 15px; color: #596170">{{p.concern}}</span>
        <div style="margin-top: 20px; width: 100%; height: 1px; background: #e2e5ea"></div>
        <span style="margin-top: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">얻는 가치</span>
        <span style="margin-top: 8px; font-size: 18px; font-weight: 800; line-height: 1.45; letter-spacing: -0.01em">{{p.value}}</span>
        <div style="flex-grow: 1"></div>
        <span style="height: 36px; padding: 0 16px; border-radius: 999px; background: #eaeefb; color: #1428a0; display: flex; align-items: center; gap: 8px"><span style="font-size: 13.5px; font-weight: 700">{{p.kpiK}}</span><span style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800">{{p.kpiV}}</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 11</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 하나의 도입이 역할마다 다른 답이 됨: 역할 · 관심사 · 얻는 가치 · 그 가치를 재는 KPI
    return { people: [
      { role: '경영진 · CEO / CFO', concern: '투자 대비 효과', value: '인쇄 · 교체 비용이 줄어 운영비가 내려갑니다', kpiK: '운영비', kpiV: '[00]% ↓' },
      { role: '본사 운영팀', concern: '전 매장 일관된 운영', value: '한 번 올리면 320개 매장이 같은 화면으로', kpiK: '배포 시간', kpiV: '[0]분' },
      { role: '점장 · 매장 직원', concern: '바쁜 시간의 손 덜기', value: '메뉴 교체 없이 주문 응대에만 집중합니다', kpiK: '주문 대기', kpiV: '[00]% ↓' }
    ] };
  }
}
</script>
</body>
</html>
