<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-H 이해관계자 × 접점 제품</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">같은 도입, 네 사람이 만나는 화면은 다릅니다</div>

  <!-- 같은 도입 (허브) -->
  <div style="position: absolute; left: 330px; top: 122px; width: 620px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #1428a0; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 12px">
    <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 12px; font-weight: 700; display: flex; align-items: center">같은 도입</span>
    <span style="font-size: 15px; font-weight: 700">QM 메뉴보드 · MagicINFO · KM24C · 320개 매장</span>
  </div>
  <div style="position: absolute; left: 639px; top: 166px; width: 2px; height: 18px; background: #1428a0"></div>
  <div style="position: absolute; left: 202px; top: 184px; width: 878px; height: 2px; background: #1428a0"></div>
  <sc-for list="{{drops}}" as="d" hint-placeholder-count="4">
    <div style="{{d}}"></div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 204px; width: 1152px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <div style="height: 444px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; background: #ffffff; padding: 14px 12px 16px 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
          <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #eaeefb; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"/></svg></div>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.role}}</span>
            <span style="font-size: 12px; color: #596170; white-space: nowrap">관심사 · {{p.concern}}</span>
          </div>
        </div>
        <dc-import name="Prod" kind="{{p.kind}}" w="250" h="150" bg="soft" zoom="{{p.zoom}}" hint-size="250px,150px"></dc-import>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
          <span style="font-size: 11.5px; font-weight: 700; color: #8a91a0; letter-spacing: 0.04em">이 사람이 만나는 화면</span>
          <span style="font-size: 13px; font-weight: 700; color: #121417">{{p.touch}}</span>
        </div>
        <div style="height: 1px; background: #e2e5ea; margin: 2px 4px"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
          <span style="font-size: 11.5px; font-weight: 700; color: #1428a0; letter-spacing: 0.04em">얻는 가치</span>
          <span style="font-size: 16.5px; font-weight: 800; line-height: 1.45; letter-spacing: -0.01em">{{p.value}}</span>
        </div>
        <div style="flex-grow: 1"></div>
        <span style="align-self: flex-start; margin-left: 4px; height: 32px; padding: 0 14px; border-radius: 999px; background: #eaeefb; color: #1428a0; display: flex; align-items: center; gap: 8px; white-space: nowrap"><span style="font-size: 13px; font-weight: 700">{{p.kpiK}}</span><span style="font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800">{{p.kpiV}}</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 제품 이미지는 예시</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 11</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 카드 중심 x: 64 + 138 + i × 292
    const drops = [0, 1, 2, 3].map((i) => 'position: absolute; left: ' + (201 + i * 292) + 'px; top: 184px; width: 2px; height: 20px; background: #1428a0;');
    // [역할, 관심사, 이미지 슬롯, 확대, 만나는 화면, 얻는 가치, KPI 이름, KPI 값]
    const P = [
      ['경영진 · CEO / CFO', '투자 대비 효과', 'energy', true, 'SmartThings Pro 월간 리포트', '운영비가 눈에 보이게 내려갑니다', '운영비', '[00]% ↓'],
      ['본사 운영팀', '전 매장 일관된 운영', 'cms', true, 'MagicINFO 관리 화면', '한 번 올리면 320개 매장이 같은 화면으로', '배포', '[0]분'],
      ['점장 · 매장 직원', '바쁜 시간의 손 덜기', 'phone', true, 'VXT 앱 · 품절은 한 번 누르기', '메뉴판 교체 없이 주문 응대에만 집중', '교체 작업', '0회'],
      ['손님', '빨리, 헷갈리지 않게', 'kiosk', true, 'KM24C 키오스크 · 메뉴보드', '줄 서지 않고, 원하는 언어로 주문', '주문 대기', '[00]% ↓']
    ];
    const people = P.map(([role, concern, kind, zoom, touch, value, kpiK, kpiV]) => ({ role, concern, kind, zoom, touch, value, kpiK, kpiV }));
    return { drops, people };
  }
}
</script>
</body>
</html>
