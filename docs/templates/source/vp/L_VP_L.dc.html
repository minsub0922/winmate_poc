<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-L 도입 전 → 후 — 같은 자리, 다른 운영</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">같은 카운터, 메뉴판만 바꿨을 뿐인데 운영이 달라집니다</div>

  <!-- 지금 -->
  <div style="position: absolute; left: 64px; top: 128px; width: 544px; height: 340px; border-radius: 16px; background: #f5f6f8"></div>
  <div style="position: absolute; left: 80px; top: 144px; height: 26px; padding: 0 11px; border-radius: 999px; background: #ffffff; border: 1px solid #d5d9e0; font-size: 12.5px; font-weight: 700; color: #3d4452; display: flex; align-items: center">지금 · 인쇄 메뉴판</div>
  <sc-for list="{{posters}}" as="p" hint-placeholder-count="3">
    <div style="{{p.box}}">
      <div style="width: 70px; height: 7px; background: #3d4452; opacity: 0.75"></div>
      <sc-for list="{{p.lines}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 9px">
          <div style="{{l.text}}"></div>
          <div style="{{l.price}}"></div>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <!-- 수정 스티커 · 손글씨 품절 -->
  <div style="position: absolute; left: 357px; top: 252px; width: 34px; height: 16px; box-sizing: border-box; background: #ffffff; border: 1px solid #b8bec8; transform: rotate(-6deg); font-size: 9px; font-weight: 700; color: #121417; display: flex; align-items: center; justify-content: center">수정</div>
  <div style="position: absolute; left: 498px; top: 268px; width: 46px; height: 22px; box-sizing: border-box; background: #ffffff; border: 1.5px solid #121417; transform: rotate(8deg); font-size: 11px; font-weight: 800; color: #121417; display: flex; align-items: center; justify-content: center">품절</div>
  <div style="position: absolute; left: 84px; top: 376px; width: 504px; height: 7px; background: #3d4452"></div>
  <div style="position: absolute; left: 88px; top: 383px; width: 496px; height: 69px; background: #e2e5ea"></div>

  <!-- 화살표 -->
  <div style="position: absolute; left: 618px; top: 276px; width: 44px; height: 44px; border-radius: 50%; background: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>

  <!-- 도입 후 -->
  <div style="position: absolute; left: 672px; top: 128px; width: 544px; height: 340px; border-radius: 16px; background: #f5f7fd"></div>
  <div style="position: absolute; left: 688px; top: 144px; height: 26px; padding: 0 11px; border-radius: 999px; background: #1428a0; font-size: 12.5px; font-weight: 700; color: #ffffff; display: flex; align-items: center">도입 후 · QM55C × 3 + MagicINFO</div>
  <div style="position: absolute; left: 700px; top: 200px; width: 488px; height: 110px"><dc-import name="Prod" kind="menuboard3" w="488" h="110" zoom="{{yes}}" hint-size="488px,110px"></dc-import></div>
  <div style="position: absolute; left: 692px; top: 376px; width: 504px; height: 7px; background: #3d4452"></div>
  <div style="position: absolute; left: 696px; top: 383px; width: 496px; height: 69px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 1104px; top: 330px; height: 22px; padding: 0 8px; border-radius: 999px; background: #ffffff; color: #596170; font-size: 10.5px; font-weight: 600; display: flex; align-items: center">예시 이미지</div>

  <!-- 바뀌는 것 -->
  <div style="position: absolute; left: 64px; top: 484px; width: 1152px; display: grid; grid-template-columns: 544px 64px 544px">
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{before}}" as="b" hint-placeholder-count="3">
        <div style="height: 40px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e5ea">
          <span style="width: 80px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: #596170">{{b.k}}</span>
          <span style="font-size: 14px; color: #3d4452">{{b.v}}</span>
        </div>
      </sc-for>
    </div>
    <div></div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{after}}" as="a" hint-placeholder-count="3">
        <div style="height: 40px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e5ea">
          <span style="width: 80px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: #1428a0">{{a.k}}</span>
          <span style="font-size: 14px; font-weight: 700; color: #121417; flex-grow: 1">{{a.v}}</span>
          <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: #1428a0; white-space: nowrap">{{a.kpi}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 64px; top: 618px; width: 1152px; font-size: 14.5px; font-weight: 700; color: #121417">바뀌는 건 화면이 아니라 일하는 방식 — <span style="color: #1428a0">본사가 바꾸고, 매장은 손님만 봅니다</span></div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 장면은 예시 (고객 매장 사진으로 교체)</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 9</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 인쇄 메뉴판 3장 — 가운데는 가격 수정 스티커, 오른쪽은 손글씨 품절
    const posters = [0, 1, 2].map((i) => ({
      box: 'position: absolute; left: ' + (108 + i * 158) + 'px; top: 196px; width: 140px; height: 120px; box-sizing: border-box; padding: 12px 12px; background: #f3e7d3; border: 1px solid #e0c9a6; display: flex; flex-direction: column; gap: 9px; transform: rotate(' + [-1.5, 1, -0.8][i] + 'deg);',
      lines: [0, 1, 2, 3].map((j) => ({
        text: 'width: ' + [72, 64, 78, 58][j] + 'px; height: 3px; background: #8a91a0;' + (i === 2 && j === 2 ? ' opacity: 0.35;' : ''),
        price: 'width: 18px; height: 3px; background: #c9783f;' + (i === 1 && j === 1 ? ' opacity: 0.4;' : '')
      }))
    }));
    const before = [['메뉴 교체', '공문 → 인쇄 → 배송 → 교체 [0]일'], ['가격 표기', '매장마다 달라 수정 스티커로 덧붙임'], ['품절 안내', '직원이 주문받을 때마다 말로']].map(([k, v]) => ({ k, v }));
    const after = [['메뉴 교체', '본사 예약 한 번, 전 매장 동시', '[00]분'], ['가격 표기', 'POS와 연동해 모든 매장이 같은 값', '오류 0'], ['품절 안내', '다 떨어지면 화면에서 자동으로 흐리게', '문의 ↓']].map(([k, v, kpi]) => ({ k, v, kpi }));
    return { yes: true, posters, before, after };
  }
}
</script>
</body>
</html>
