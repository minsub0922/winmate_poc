<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-T 제품 실사 + 공식 연출 + 근거 스펙</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">키오스크 한 대가 피크 시간 줄을 나눕니다</div>

  <!-- 제품 컷 -->
  <div style="position: absolute; left: 64px; top: 128px"><dc-import name="Photo" pid="km24c.persp" w="296" h="470" bg="soft" radius="16" hint-size="296px,470px"></dc-import></div>
  <div style="position: absolute; left: 64px; top: 612px; width: 296px; display: flex; align-items: baseline; gap: 8px">
    <span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800">KM24C</span>
    <span style="font-size: 12px; font-weight: 600; color: #596170">삼성 키오스크 24형 · Windows</span>
  </div>

  <!-- 공식 연출 -->
  <div style="position: absolute; left: 392px; top: 128px"><dc-import name="Photo" pid="life.km24c.bakery" w="384" h="262" radius="14" pos="60% 50%" hint-size="384px,262px"></dc-import></div>
  <span style="position: absolute; left: 404px; top: 354px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(18,20,23,0.74); color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">베이커리 카운터에 놓인 모습</span>
  <div style="position: absolute; left: 392px; top: 402px"><dc-import name="Photo" pid="life.km24c.mounts" w="384" h="196" radius="14" bg="white" fit="contain" hint-size="384px,196px"></dc-import></div>
  <span style="position: absolute; left: 404px; top: 562px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(18,20,23,0.74); color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">카운터 · 스탠드 · 벽걸이</span>

  <!-- 가치 ← 근거 스펙 -->
  <div style="position: absolute; left: 800px; top: 128px; width: 416px; display: flex; flex-direction: column">
    <sc-for list="{{vals}}" as="v" hint-placeholder-count="3">
      <div style="padding: 16px 0 16px 0; border-top: 1px solid #e2e5ea; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; color: #1428a0">{{v.no}}</span><span style="font-size: 19px; font-weight: 800; letter-spacing: -0.01em">{{v.value}}</span></span>
        <span style="font-size: 13.5px; line-height: 1.5; color: #3d4452">{{v.desc}}</span>
        <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="height: 20px; padding: 0 7px; border-radius: 5px; background: #eaeefb; color: #1428a0; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0">근거 스펙</span><span style="font-size: 12.5px; font-weight: 700; color: #121417; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.spec}}</span></span>
      </div>
    </sc-for>
    <div style="margin-top: 4px; height: 58px; box-sizing: border-box; border-radius: 12px; background: #121417; color: #ffffff; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 700">점심 피크 주문 대기 (예상)</span>
      <span style="display: flex; align-items: baseline; gap: 8px; font-family: Manrope, sans-serif; font-weight: 800"><span style="font-size: 18px; color: #b8bec8">[0.0]분</span><span style="font-size: 14px; color: #9db4ff">→</span><span style="font-size: 22px">[0.0]분</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 키오스크 제안 · 제품 · 연출 사진 samsung.com · 스펙은 KM24C 공식 사양 기준</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 13</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 가치마다 그 가치를 받쳐 주는 공식 스펙 한 줄 — 스펙은 제품 페이지에 있는 것만
    const vals = [
      ['줄이 둘로 나뉩니다', '메뉴 고르기부터 결제까지 손님이 직접 — 카운터는 음료 만들기와 픽업에 집중', '24형 FHD 터치 · 한 화면에서 주문 → 결제'],
      ['어떤 결제든 받습니다', '카드를 꽂든, 휴대폰을 대든, 바코드를 찍든 같은 화면에서', '결제 모듈 장착 — 카드 · QR · 바코드 · NFC'],
      ['어디든 놓을 수 있습니다', '좁은 카운터 위에도, 입구 앞 스탠드로도, 벽에도', '설치 3가지 — 카운터 · 스탠드 · 벽걸이']
    ].map(([value, desc, spec], i) => ({ no: String(i + 1).padStart(2, '0'), value, desc, spec }));
    return { vals };
  }
}
</script>
</body>
</html>
