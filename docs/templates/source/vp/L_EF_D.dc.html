<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EF-D 제품별 기대 효과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">제품마다, 도입 1년 후 이만큼 달라집니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">예상치 · 유사 사례 기준 · 막대는 지금을 100으로 둔 도입 후 길이 · 효과를 제품 단위로 증명할 때</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="v" hint-placeholder-count="3">
      <div style="height: 488px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; overflow: hidden; display: flex; flex-direction: column">
        <div style="position: relative; height: 196px; background: #f5f6f8; display: flex; align-items: center; justify-content: center">
          <dc-import name="Prod" kind="{{v.kind}}" w="366" h="196" zoom="{{v.zoom}}" hint-size="366px,196px"></dc-import>
          <span style="position: absolute; left: 12px; bottom: 10px; height: 24px; padding: 0 10px; border-radius: 999px; background: #121417; color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{v.prod}}</span>
        </div>
        <div style="padding: 20px 24px 22px 24px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 18px; font-weight: 800">{{v.k}}</span>
            <span style="font-size: 12.5px; color: #8a91a0">{{v.basis}}</span>
          </div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: end">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 700; color: #596170">지금</span>
              <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">{{v.before}}</span><span style="font-size: 14px; font-weight: 700; color: #596170">{{v.bu}}</span></span>
            </div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 700; color: #1428a0">도입 후</span>
              <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: #1428a0">{{v.after}}</span><span style="font-size: 14px; font-weight: 700; color: #1428a0">{{v.au}}</span></span>
            </div>
          </div>
          <div style="height: 10px; border-radius: 5px; background: #eef0f3; overflow: hidden"><div style="{{v.bar}}"></div></div>
          <div style="flex-grow: 1"></div>
          <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #e2e5ea; padding-top: 12px">
            <span style="font-size: 12.5px; color: #596170">{{v.so}}</span>
            <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; display: flex; align-items: center">{{v.chg}}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 수치는 예시 · 제품 이미지는 예시</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 12</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // [슬롯, 제품, 지표, 기준, 지금, 단위, 도입 후, 단위, 도입 후 막대 %, 변화, 그래서]
    const V = [
      ['menuboard3', 'QM55C × 3 · MagicINFO', '메뉴 교체 소요', '신메뉴 1회 · 전 매장 반영', '[0]', '일', '[00]', '분', 12, '▼ [00]%', '프로모션 회전이 빨라짐'],
      ['kiosk', 'Kiosk KM24C', '피크 주문 대기', '점심 피크 · 평균', '[0.0]', '분', '[0.0]', '분', 64, '▼ [00]%', '같은 인원으로 더 많은 주문'],
      ['energy', 'SmartThings Pro · 시스템에어컨', '매장 월 전력', '매장당 · 월', '[000]', 'kWh', '[000]', 'kWh', 78, '▼ [00]%', '전기요금 고지서가 가벼워짐']
    ];
    const items = V.map(([kind, prod, k, basis, before, bu, after, au, pct, chg, so]) => ({
      kind, zoom: true, prod, k, basis, before, bu, after, au, chg, so,
      bar: 'width: ' + pct + '%; height: 10px; border-radius: 5px; background: #1428a0;'
    }));
    return { items };
  }
}
</script>
</body>
</html>
