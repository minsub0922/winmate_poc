<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CH-C 문제 → 근본 원인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">표기 오류는 결과일 뿐, 원인은 운영 구조에 있습니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">눈에 보이는 문제에서 두 단계 아래 원인까지 · 현장 점검 · 인터뷰 기준</div>

  <!-- 열 머리 -->
  <div style="position: absolute; left: 64px; top: 176px; width: 270px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #596170">문제</div>
  <div style="position: absolute; left: 430px; top: 176px; width: 300px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #596170">직접 원인</div>
  <div style="position: absolute; left: 826px; top: 176px; width: 390px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #121417">근본 원인</div>

  <!-- 1열: 표면 문제 (잉크) -->
  <div style="position: absolute; left: 64px; top: 316px; width: 270px; height: 196px; box-sizing: border-box; border-radius: 14px; background: #121417; color: #ffffff; padding: 24px; display: flex; flex-direction: column">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #b8bec8">눈에 보이는 현상</span>
    <span style="margin-top: 10px; font-size: 18px; font-weight: 800; line-height: 1.4; letter-spacing: -0.01em">매장별 가격 · 메뉴 표기 불일치</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 15px; font-weight: 700; color: #d5d9e0">월</span><span style="font-family: Manrope, sans-serif; font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em">[00]</span><span style="font-size: 16px; font-weight: 700">건</span></div>
  </div>

  <!-- 1차 연결선: 문제 → 직접 원인 (회색 트리) -->
  <div style="position: absolute; left: 334px; top: 413px; width: 48px; height: 2px; background: #b8bec8"></div>
  <div style="position: absolute; left: 381px; top: 269px; width: 2px; height: 290px; background: #b8bec8"></div>
  <div style="position: absolute; left: 382px; top: 269px; width: 48px; height: 2px; background: #b8bec8"></div>
  <div style="position: absolute; left: 382px; top: 413px; width: 48px; height: 2px; background: #b8bec8"></div>
  <div style="position: absolute; left: 382px; top: 557px; width: 48px; height: 2px; background: #b8bec8"></div>
  <div style="position: absolute; left: 338px; top: 402px; width: 40px; height: 24px; box-sizing: border-box; border-radius: 999px; background: #ffffff; border: 1px solid #b8bec8; font-size: 12px; font-weight: 800; color: #3d4452; display: flex; align-items: center; justify-content: center">왜?</div>

  <!-- 2 · 3열: 직접 원인 — 근본 원인 (한 줄에 한 갈래) -->
  <div style="position: absolute; left: 430px; top: 212px; width: 786px; display: flex; flex-direction: column; gap: 28px">
    <sc-for list="{{branches}}" as="b" hint-placeholder-count="3">
      <div style="height: 116px; display: grid; grid-template-columns: 300px 96px minmax(0, 1fr); align-items: center">
        <div style="height: 116px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
          <span style="font-size: 16px; font-weight: 800">{{b.cause}}</span>
          <span style="font-size: 13px; line-height: 1.5; color: #596170">{{b.causeDesc}}</span>
        </div>
        <div style="{{b.line}}"></div>
        <div style="{{b.box}}">
          <div style="display: flex">
            <sc-if value="{{b.solved}}" hint-placeholder-val="{{true}}">
              <span style="height: 22px; padding: 0 9px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>이번 제안이 해결</span>
            </sc-if>
            <sc-if value="{{b.other}}" hint-placeholder-val="{{false}}">
              <span style="height: 22px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; border: 1px solid #d5d9e0; color: #8a91a0; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">운영 정책 과제</span>
            </sc-if>
          </div>
          <span style="font-size: 16px; font-weight: 800; line-height: 1.4">{{b.root}}</span>
          <span style="font-size: 13px; line-height: 1.5; color: #596170">{{b.rootDesc}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 826px; top: 624px; width: 390px; font-size: 13px; font-weight: 700; color: #1428a0">근본 원인 세 가지 중 두 가지를 이번 제안이 직접 풉니다</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 10</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 갈래마다: 직접 원인 → 근본 원인. 제안이 푸는 근본 원인은 파란 테두리 + 파란 연결선.
    const B = [
      ['인쇄물 교체 지연', '인쇄 · 배송에 [0]주, 매장마다 교체하는 날이 다름', '메뉴 정보가 매장까지 자동으로 가지 않음', '본사 변경이 사람과 인쇄물을 거쳐야만 전달됨', true],
      ['매장별 수기 수정', '급한 변경은 현장에서 스티커 · 손글씨로 고침', '가격 정책 잦은 변경', '지역 · 채널별 가격 조정이 자주 일어남', false],
      ['본사 · 매장 정보 불일치', '어느 매장이 틀렸는지 본사가 알기 어려움', '매장 화면을 본사가 볼 수 없음', '확인하려면 담당자가 매장을 직접 방문해야 함', true]
    ];
    const box = (on) => 'height: 116px; box-sizing: border-box; border-radius: 12px; padding: 14px 20px; display: flex; flex-direction: column; justify-content: center; gap: 5px; background: #ffffff; ' +
      (on ? 'border: 2px solid #1428a0;' : 'border: 1px solid #e2e5ea;');
    const line = (on) => 'height: 2px; background: ' + (on ? '#1428a0' : '#d5d9e0') + ';';
    return { branches: B.map(([cause, causeDesc, root, rootDesc, on]) => ({ cause, causeDesc, root, rootDesc, solved: on, other: !on, box: box(on), line: line(on) })) };
  }
}
</script>
</body>
</html>
