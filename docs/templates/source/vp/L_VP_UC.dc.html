<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-U·C 현장 질문 → 제품 · 솔루션 → 핵심 가치 (열형)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS · 현장 질문</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1150px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">{{d.title}}</div>
  <div style="position: absolute; left: 64px; top: 112px; display: flex; align-items: center; gap: 8px">
    <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #121417; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{d.venue}}</span>
    <span style="height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid #d5d9e0; color: #3d4452; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{d.where}}</span>
  </div>

  <div style="position: absolute; left: 64px; top: 150px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{d.items}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
        <!-- 질문 -->
        <div style="position: relative; height: 150px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
          <span style="position: absolute; left: 50%; bottom: -7px; margin-left: -7px; width: 14px; height: 14px; background: #f5f6f8; transform: rotate(45deg)"></span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; color: #1428a0">Q{{r.no}}</span>
            <span style="height: 22px; padding: 0 9px; border-radius: 999px; background: #ffffff; color: #3d4452; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{r.who}}</span>
          </span>
          <span style="font-size: 17.5px; font-weight: 800; line-height: 1.45; letter-spacing: -0.01em">“{{r.q}}”</span>
        </div>
        <!-- 제품 · 솔루션 -->
        <div style="position: relative; width: 368px; height: 196px">
          <sc-if value="{{r.isPhoto}}" hint-placeholder-val="{{true}}">
            <dc-import name="Photo" pid="{{r.pid}}" w="368" h="196" bg="soft" radius="14" fit="contain" hint-size="368px,196px"></dc-import>
          </sc-if>
          <sc-if value="{{r.isProd}}" hint-placeholder-val="{{false}}">
            <dc-import name="Prod" kind="{{r.kind}}" w="368" h="196" bg="soft" zoom="{{r.zoom}}" hint-size="368px,196px"></dc-import>
          </sc-if>
          <span style="position: absolute; left: 12px; bottom: 12px; height: 26px; padding: 0 11px; border-radius: 999px; background: rgba(18,20,23,0.8); color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-weight: 800">{{r.prod}}</span><span style="color: #c9cfdb; font-weight: 500">{{r.type}}</span></span>
        </div>
        <!-- 가치 + 키워드 -->
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
          <span style="font-size: 18.5px; font-weight: 800; line-height: 1.4; letter-spacing: -0.01em">{{r.value}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{r.kw}}" as="k" hint-placeholder-count="2">
              <span style="height: 28px; padding: 0 11px; border-radius: 8px; background: #eaeefb; color: #1428a0; font-size: 13px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">#{{k.t}}</span>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>{{d.foot}}</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 6</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ind":{"editor":"enum","options":["cafe","hotel","hospital","retail"],"default":"cafe"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // VP-U와 같은 재료를 열로 — 질문이 짧고 제품 이미지를 크게 보여 줄 때
    const D = {
      cafe: ['외식 · 카페', '카운터 · 드라이브스루 · 좌석', '카페 매장에서 자주 듣는 질문 셋, 이렇게 답합니다', 'A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 질문은 본사 · 매장 인터뷰에서', [
        ['본사 운영팀', '신메뉴가 나올 때마다 메뉴판을 다시 뽑아야 하나요?', 'p:qm55c.persp', 'QM55C', '+ MagicINFO', '본사가 바꾸면 전 매장이 같은 날 바뀝니다', ['인쇄 · 배송 0', '원격 배포']],
        ['점장', '점심 피크에 주문 줄이 너무 길어요', 'p:km24c.persp', 'KM24C', '셀프 주문 키오스크', '주문은 나눠 받고, 카운터는 음료에 집중', ['셀프 주문', '대기 단축']],
        ['가맹점주', '여름만 되면 전기요금이 부담돼요', 'p:ui.stp.energy', 'SmartThings Pro', '에너지 관리', '영업시간에만, 필요한 만큼 냉방', ['스케줄 운전', '사용량 확인']]]],
      hotel: ['호텔 · 리조트', '로비 · 객실 · 부대시설', '호텔에서 자주 듣는 질문 셋, 이렇게 답합니다', 'B 호텔 · 객실 · 로비 디지털 전환 제안 · 질문은 객실 · 프런트 · 시설팀 인터뷰에서', [
        ['객실 운영팀', '객실 TV로 호텔 안내와 부대시설을 알릴 수 있나요?', 'k:signage', '삼성 호텔 TV', '호텔 안내 채널', '켜는 순간 호텔 안내가 먼저 보입니다', ['웰컴 화면', '부대시설 안내']],
        ['프런트', '체크인 시간마다 로비 대기가 길어요', 'p:km24c.front', 'KM24C', '셀프 체크인', '체크인을 나눠 받아 로비가 한산해집니다', ['셀프 체크인', '대기 단축']],
        ['시설팀', '빈 객실에도 냉난방이 계속 돌아가요', 'p:ui.stp.schedule', 'SmartThings Pro', '스케줄 제어', '빈 방은 스케줄대로 절전 운전', ['객실 단위 제어', '에너지 절감']]]],
      hospital: ['의료 · 요양', '외래 대기실 · 원무과 · 층별 안내', '병원에서 자주 듣는 질문 셋, 이렇게 답합니다', 'B 병원 · 안내 시스템 제안 · 질문은 원무과 · 환자 설문에서', [
        ['외래 환자', '내 진료 순서가 언제인지 계속 물어보게 돼요', 'p:qm55c.front', 'QM55C', '+ MagicINFO', '내 순서가 대기실 화면에 바로 보입니다', ['순번 안내', '문의 감소']],
        ['원무과', '접수 · 수납 창구가 늘 붐벼요', 'p:km24c.persp', 'KM24C', '셀프 접수 · 수납', '접수와 수납을 키오스크가 나눠 받습니다', ['셀프 접수', '창구 분산']],
        ['시설 · 홍보팀', '층마다 안내 화면 내용이 제각각이에요', 'p:ui.mi.overview', 'MagicINFO', '통합 관리', '한 곳에서 층별 안내를 같은 기준으로', ['층별 스케줄', '긴급 공지']]]],
      retail: ['리테일 · 플래그십', '쇼윈도 · 매장 · 다지점', '리테일 매장에서 자주 듣는 질문 셋, 이렇게 답합니다', 'R 리테일 · 매장 디지털 전환 제안 · 질문은 점장 · 본사 마케팅 인터뷰에서', [
        ['점장', '저녁엔 쇼윈도가 눈에 잘 안 띄어요', 'p:life.window', '윈도 사이니지', '고휘도', '지나가는 손님의 발길을 멈추게', ['고휘도', '시간대 콘텐츠']],
        ['본사 마케팅', '가격이 바뀔 때마다 POP를 다시 붙여요', 'k:cms', 'MagicINFO', '원격 관리', '가격 · 프로모션을 한 번에 전 매장으로', ['원격 배포', '가격 일치']],
        ['시설팀', '지점마다 냉난방 관리가 제각각이에요', 'p:ui.stp.map', 'SmartThings Pro', '다지점 관제', '전 지점을 지도 한 장에서 관리', ['다지점 관제', '이상 알림']]]]
    };
    const key = String(this.props.ind ?? 'cafe');
    const [venue, where, title, foot, rows] = D[key] || D.cafe;
    const items = rows.map(([who, q, img, prod, type, value, kw], i) => {
      const photo = img.startsWith('p:');
      return { no: i + 1, who, q, prod, type, value, isPhoto: photo, isProd: !photo, pid: photo ? img.slice(2) : 'qm55c.persp', kind: photo ? 'signage' : img.slice(2), zoom: true, kw: kw.map((t) => ({ t })) };
    });
    return { d: { venue, where, title, foot, items } };
  }
}
</script>
</body>
</html>
