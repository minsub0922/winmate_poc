<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP03 가치 3개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">A 커피가 얻는 세 가지 가치</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">Key Message 3개 선택 시</div>

  <div style="position: absolute; left: 64px; top: 176px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="v" hint-placeholder-count="3">
      <div style="height: 472px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #eaeefb; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{v.icon}}"/></svg></div>
        <span style="font-size: 23px; font-weight: 800; line-height: 1.35; letter-spacing: -0.02em">{{v.title}}</span>
        <span style="font-size: 15px; line-height: 1.65; color: #596170">{{v.desc}}</span>
        <div style="flex-grow: 1"></div>
        <div style="border-top: 1px solid #e2e5ea; padding-top: 16px; display: flex; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 34px; font-weight: 800; color: #1428a0">{{v.kpi}}</span><span style="font-size: 13px; color: #596170">{{v.kpiLabel}}</span></div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 9</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { icon: 'M3 4h18v12H3z M8 20h8 M12 16v4', title: '본사에서 한 번에 운영', desc: '제작 · 승인 · 배포 · 적용 확인까지 한 화면에서.', kpi: '[000]', kpiLabel: '매장 동시 배포' },
      { icon: 'M13 2L4 14h7l-1 8 9-12h-7l1-8z', title: '저전력 자동 운영', desc: '영업시간에만, 필요한 밝기로만 켭니다.', kpi: '[00]%', kpiLabel: '예상 전력 절감' },
      { icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 3', title: '프로모션을 몇 분 만에', desc: '시간대 · 시즌 콘텐츠를 예약하고 자동으로 전환.', kpi: '[00]분', kpiLabel: '교체 리드타임' }
    ] };
  }
}
</script>
</body>
</html>
