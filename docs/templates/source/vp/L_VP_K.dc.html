<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-K 공간 속 제품 — 동선 위 가치 핀</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">손님 동선을 따라가면, 제품마다 맡은 가치가 보입니다</div>

  <!-- 매장 단면 -->
  <div style="position: absolute; left: 64px; top: 128px; width: 1152px; height: 438px; border-radius: 16px; background: #fbfbfc; border: 1px solid #e2e5ea; box-sizing: border-box; overflow: hidden"></div>
  <div style="position: absolute; left: 65px; top: 129px; width: 225px; height: 417px; border-radius: 15px 0 0 0; background: #eef1f8"></div>
  <div style="position: absolute; left: 80px; top: 142px; font-size: 11.5px; font-weight: 700; color: #596170">매장 앞 · 드라이브스루</div>
  <div style="position: absolute; left: 296px; top: 129px; width: 919px; height: 20px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 290px; top: 149px; width: 6px; height: 397px; background: #b8c3ee"></div>
  <div style="position: absolute; left: 65px; top: 546px; width: 1150px; height: 19px; border-radius: 0 0 15px 15px; background: #d5d9e0"></div>

  <!-- 제품 -->
  <div style="position: absolute; left: 110px; top: 320px; width: 140px; height: 226px"><dc-import name="Prod" kind="outdoor" w="140" h="226" zoom="{{yes}}" hint-size="140px,226px"></dc-import></div>
  <div style="position: absolute; left: 330px; top: 320px; width: 110px; height: 226px"><dc-import name="Prod" kind="kiosk" w="110" h="226" zoom="{{yes}}" hint-size="110px,226px"></dc-import></div>
  <div style="position: absolute; left: 510px; top: 226px; width: 400px; height: 90px"><dc-import name="Prod" kind="menuboard3" w="400" h="90" zoom="{{yes}}" hint-size="400px,90px"></dc-import></div>
  <div style="position: absolute; left: 520px; top: 436px; width: 380px; height: 6px; background: #3d4452"></div>
  <div style="position: absolute; left: 524px; top: 442px; width: 372px; height: 104px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 540px; top: 418px; width: 14px; height: 18px; border-radius: 3px; background: #f3e7d3"></div>
  <div style="position: absolute; left: 560px; top: 422px; width: 12px; height: 14px; border-radius: 3px; background: #d5d9e0"></div>
  <div style="position: absolute; left: 930px; top: 252px; width: 160px; height: 92px"><dc-import name="Prod" kind="pickup" w="160" h="92" zoom="{{yes}}" hint-size="160px,92px"></dc-import></div>
  <div style="position: absolute; left: 936px; top: 392px; width: 148px; height: 5px; background: #3d4452"></div>
  <!-- 좌석 -->
  <div style="position: absolute; left: 1010px; top: 486px; width: 78px; height: 6px; border-radius: 3px; background: #8a91a0"></div>
  <div style="position: absolute; left: 1046px; top: 492px; width: 6px; height: 54px; background: #8a91a0"></div>
  <div style="position: absolute; left: 1112px; top: 486px; width: 78px; height: 6px; border-radius: 3px; background: #8a91a0"></div>
  <div style="position: absolute; left: 1148px; top: 492px; width: 6px; height: 54px; background: #8a91a0"></div>
  <!-- 천장 에어컨 -->
  <div style="position: absolute; left: 1050px; top: 149px; width: 110px; height: 14px; box-sizing: border-box; border-radius: 0 0 6px 6px; background: #ffffff; border: 1.5px solid #b8bec8"></div>
  <svg style="position: absolute; left: 1020px; top: 160px" width="170" height="70" viewBox="0 0 170 70" fill="none" aria-hidden="true">
    <path d="M30 10 C 18 26, 14 44, 18 62 M140 10 C 152 26, 156 44, 152 62 M58 12 C 52 30, 52 46, 56 62 M112 12 C 118 30, 118 46, 114 62" stroke="#9db4ff" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  </svg>
  <div style="position: absolute; left: 1010px; top: 520px; font-size: 11px; font-weight: 700; color: #596170">좌석</div>
  <div style="position: absolute; left: 640px; top: 512px; font-size: 12px; font-weight: 700; color: #596170">카운터</div>

  <!-- 핀 -->
  <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
    <div style="{{p.style}}">{{p.no}}</div>
  </sc-for>

  <!-- 가치 칩 -->
  <div style="position: absolute; left: 64px; top: 578px; width: 1152px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <div style="height: 74px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 10px 12px; display: flex; gap: 10px; min-width: 0">
        <span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 12px; font-weight: 700; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.prod}}</span>
          <span style="font-size: 13.5px; font-weight: 800; line-height: 1.35; color: #121417">{{c.value}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 매장 단면과 제품 이미지는 예시</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 10</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 핀: [번호, x, y] — 손님 동선 순서 (매장 앞 → 주문 → 메뉴 → 픽업 → 좌석)
    const P = [[1, 180, 312], [2, 385, 312], [3, 710, 218], [4, 1010, 244], [5, 1105, 188]];
    const pins = P.map(([no, x, y]) => ({ no, style: 'position: absolute; left: ' + (x - 15) + 'px; top: ' + (y - 15) + 'px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(18,20,23,0.25); color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;' }));
    const chips = [
      ['OH55C 옥외 사이니지', '지나가며 읽히는 첫 메뉴판'],
      ['KM24C 키오스크', '피크 줄이 둘로 나뉨'],
      ['QM55C × 3 메뉴보드', '본사가 몇 분 만에 바꾸는 메뉴'],
      ['QM43C 픽업 호출', '이름 부르지 않는 픽업'],
      ['시스템에어컨 360', '오래 앉아도 쾌적한 좌석']
    ].map(([prod, value], i) => ({ no: i + 1, prod, value }));
    return { yes: true, pins, chips };
  }
}
</script>
</body>
</html>
