<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP-F 가치 기둥 × 제품 (2 · 3 · 4)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">{{title}}</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">{{sub}}</div>

  <sc-if value="{{cols}}" hint-placeholder-val="{{true}}">
    <div style="{{colsStyle}}">
      <sc-for list="{{items}}" as="v" hint-placeholder-count="3">
        <div style="height: 488px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; background: #ffffff; overflow: hidden; display: flex; flex-direction: column">
          <div style="{{v.imgBox}}">
            <dc-import name="Prod" kind="{{v.kind}}" w="{{v.imgW}}" h="{{v.imgH}}" zoom="{{v.zoom}}" hint-size="{{v.hint}}"></dc-import>
            <span style="position: absolute; left: 12px; bottom: 10px; height: 24px; padding: 0 10px; border-radius: 999px; background: #121417; color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{v.prodMain}}</span>
          </div>
          <div style="padding: 20px 24px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
            <div style="display: flex; align-items: baseline; gap: 12px">
              <span style="font-family: Manrope, sans-serif; font-size: 26px; font-weight: 800; line-height: 1; color: #1428a0">{{v.no}}</span>
              <span style="font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35">{{v.title}}</span>
            </div>
            <span style="font-size: 14px; line-height: 1.6; color: #596170">{{v.desc}}</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{v.prods}}" as="p" hint-placeholder-count="2">
                <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{p}}</span>
              </sc-for>
            </div>
            <div style="flex-grow: 1"></div>
            <div style="border-top: 1px solid #e2e5ea; padding-top: 12px; display: flex; align-items: baseline; gap: 8px">
              <span style="font-size: 13px; color: #596170">{{v.kpiK}}</span>
              <span style="font-family: Manrope, sans-serif; font-size: 24px; font-weight: 800; color: #1428a0">{{v.kpiV}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{grid}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 64px; top: 160px; width: 1152px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
      <sc-for list="{{items}}" as="v" hint-placeholder-count="4">
        <div style="height: 232px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; background: #ffffff; overflow: hidden; display: flex">
          <div style="position: relative; width: 230px; height: 230px; flex-shrink: 0; background: #f5f6f8">
            <dc-import name="Prod" kind="{{v.kind}}" w="230" h="230" zoom="{{v.zoom}}" hint-size="230px,230px"></dc-import>
          </div>
          <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 10px">
              <span style="font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; line-height: 1; color: #1428a0">{{v.no}}</span>
              <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em">{{v.title}}</span>
            </div>
            <span style="font-size: 13.5px; line-height: 1.55; color: #596170">{{v.desc}}</span>
            <span style="font-size: 12.5px; font-weight: 700; color: #121417">{{v.prodLine}}</span>
            <div style="flex-grow: 1"></div>
            <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 12.5px; color: #596170">{{v.kpiK}}</span><span style="font-family: Manrope, sans-serif; font-size: 21px; font-weight: 800; color: #1428a0">{{v.kpiV}}</span></div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 제품 이미지는 예시</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 9</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":3,"min":2,"max":4},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 기둥 수 = Key Message 수 (2 · 3 · 4). 기둥마다 그 가치를 만드는 제품 · 솔루션 이미지
    const n = Math.min(4, Math.max(2, Number(this.props.n ?? 3)));
    const V = [
      ['본사에서 한 번에 운영', '제작 · 승인 · 배포 · 적용 확인까지 한 화면에서. 매장은 켜 두기만 하면 됩니다.', ['MagicINFO', 'QM55C'], 'cms', '배포', '[000]개 매장 동시'],
      ['프로모션을 몇 분 만에', '시간대 · 시즌 콘텐츠를 예약하고, 급할 땐 휴대폰으로 바로 바꿉니다.', ['VXT', 'QM55C × 3'], 'phone', '교체 리드타임', '[00]분'],
      ['저전력 자동 운영', '영업시간에만, 필요한 밝기와 온도로만. 매장별 전력 리포트가 따라옵니다.', ['SmartThings Pro', '시스템에어컨 360'], 'energy', '매장 전력', '[00]% ↓'],
      ['손님이 먼저 읽는 메뉴', '드라이브스루와 매장 앞에서도 선명한 고휘도 화면, 품절은 자동으로.', ['OH55C', 'KM24C'], 'outdoor', 'DT 주문', '[00]초']
    ].slice(0, n);
    const WORD = { 2: '두', 3: '세', 4: '네' };
    const cols = n < 4;
    const cardW = n === 2 ? 564 : 368;
    const imgW = cardW - 2, imgH = n === 2 ? 236 : 200;
    const items = V.map(([title, desc, prods, kind, kpiK, kpiV], i) => ({
      no: String(i + 1).padStart(2, '0'), title, desc, prods, kind, kpiK, kpiV, zoom: true,
      prodMain: prods.join(' · '), prodLine: '만드는 제품 · ' + prods.join(' · '),
      imgW, imgH, hint: imgW + 'px,' + imgH + 'px',
      imgBox: 'position: relative; width: ' + imgW + 'px; height: ' + imgH + 'px; flex-shrink: 0; background: #f5f6f8;'
    }));
    return {
      cols, grid: !cols, items,
      title: 'A 커피가 얻는 ' + WORD[n] + ' 가치, 그리고 그 가치를 만드는 제품',
      sub: 'Key Message ' + n + '개 → 가치 기둥 ' + n + ' · 기둥마다 그 가치를 만드는 제품 · 솔루션 이미지',
      colsStyle: 'position: absolute; left: 64px; top: 160px; width: 1152px; display: grid; grid-template-columns: repeat(' + n + ', minmax(0, 1fr)); gap: 24px;'
    };
  }
}
</script>
</body>
</html>
