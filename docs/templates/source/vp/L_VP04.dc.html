<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP04 가치 4개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">A 커피가 얻는 네 가지 가치</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">Key Message 4개 선택 시</div>

  <div style="position: absolute; left: 64px; top: 176px; width: 1152px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="v" hint-placeholder-count="4">
      <div style="height: 224px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 28px; display: flex; gap: 22px">
        <span style="font-family: Manrope, sans-serif; font-size: 40px; font-weight: 800; line-height: 1; color: #1428a0; flex-shrink: 0">{{v.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">{{v.title}}</span>
          <span style="font-size: 15px; line-height: 1.65; color: #596170">{{v.desc}}</span>
          <div style="flex-grow: 1"></div>
          <span style="font-size: 13px; font-weight: 700; color: #1428a0">{{v.proof}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 9</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const V = [
      ['본사에서 한 번에 운영', '제작 · 승인 · 배포 · 적용 확인까지 한 화면에서.', '→ 솔루션 제안 섹션'],
      ['저전력 자동 운영', '영업시간에만, 필요한 밝기로만 켭니다.', '→ 예상 절감 [00]%'],
      ['프로모션을 몇 분 만에', '시간대 · 시즌 콘텐츠를 예약하고 자동 전환.', '→ 교체 리드타임 [00]분'],
      ['손님이 먼저 읽는 메뉴', '멀리서도 선명한 고휘도 화면과 실시간 품절 표시.', '→ 공간별 제품 섹션']
    ];
    return { items: V.map(([title, desc, proof], i) => ({ no: String(i + 1).padStart(2, '0'), title, desc, proof })) };
  }
}
</script>
</body>
</html>
