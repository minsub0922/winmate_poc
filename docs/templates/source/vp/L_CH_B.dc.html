<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CH-B 지금 → 바라는 모습</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">A 커피가 바라는 매장 운영의 모습</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">운영 영역별 현재 상태와 목표 상태 · 본사 · 매장 인터뷰 기준</div>

  <!-- 열 머리: 지금 / 바라는 모습 -->
  <div style="position: absolute; left: 64px; top: 172px; width: 1152px; height: 32px; display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px minmax(0, 1fr); column-gap: 12px; align-items: center">
    <span style="font-size: 13px; font-weight: 700; color: #8a91a0">운영 영역</span>
    <div style="display: flex"><span style="height: 30px; padding: 0 14px; border-radius: 999px; background: #e2e5ea; color: #3d4452; font-size: 13px; font-weight: 800; display: flex; align-items: center">지금</span></div>
    <span></span>
    <div style="display: flex"><span style="height: 30px; padding: 0 14px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 13px; font-weight: 800; display: flex; align-items: center">바라는 모습</span></div>
  </div>

  <!-- 행: 같은 영역의 현재와 목표를 한 줄에 맞춰 격차를 보여줌 -->
  <div style="position: absolute; left: 64px; top: 216px; width: 1152px; display: flex; flex-direction: column; border-bottom: 1px solid #e2e5ea">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="height: 104px; box-sizing: border-box; border-top: 1px solid #e2e5ea; display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px minmax(0, 1fr); column-gap: 12px; align-items: center">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: #b8bec8">{{r.no}}</span>
          <span style="font-size: 16px; font-weight: 800">{{r.k}}</span>
        </div>
        <div style="height: 80px; box-sizing: border-box; border-radius: 10px; background: #f5f6f8; padding: 0 22px; display: flex; align-items: center; font-size: 15px; line-height: 1.55; color: #596170">{{r.now}}</div>
        <div style="display: flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 50%; background: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <div style="height: 80px; box-sizing: border-box; border-radius: 10px; background: #eaeefb; padding: 0 22px; display: flex; align-items: center; font-size: 15.5px; font-weight: 700; line-height: 1.5; color: #121417">{{r.want}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 10</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 영역 | 지금(회색 · 흐린 글씨) | → | 바라는 모습(파랑 틴트 · 진한 글씨)
    const R = [
      ['메뉴 교체', '인쇄물을 제작 · 배송한 뒤 매장에서 직접 교체, 반영까지 [0]주', '본사에서 한 번 수정하면 전 매장에 그날 바로 반영'],
      ['가격 관리', '매장마다 교체 시점이 달라 같은 메뉴도 가격 표기가 어긋남', '320개 매장이 같은 시각, 같은 가격을 표시'],
      ['프로모션', '시즌 행사 준비에 [0]주, 시간대별 메뉴 운영은 사실상 불가', '아침 · 점심 · 저녁 시간대에 맞춰 메뉴가 자동으로 전환'],
      ['매장 점검', '화면 · 게시물 상태는 담당자가 매장을 방문해야 확인', '본사 화면에서 전 매장 상태를 실시간으로 확인']
    ];
    return { rows: R.map(([k, now, want], i) => ({ no: String(i + 1).padStart(2, '0'), k, now, want })) };
  }
}
</script>
</body>
</html>
