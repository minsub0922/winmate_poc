<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EF-E 기대 효과 + 확인할 실제 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">기대 효과, 그리고 그걸 매달 확인할 화면</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1100px; font-size: 15px; color: #596170">예상치 · 유사 사례 기준 · 아래 화면은 도입 후 본사가 실제로 보게 될 솔루션 화면</div>

  <div style="position: absolute; left: 64px; top: 156px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{items}}" as="v" hint-placeholder-count="3">
      <div style="height: 492px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; padding: 20px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
          <span style="font-size: 18px; font-weight: 800">{{v.k}}</span>
          <span style="font-size: 12.5px; color: #8a91a0">{{v.basis}}</span>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: end; padding: 0 4px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 700; color: #596170">지금</span>
            <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">{{v.before}}</span><span style="font-size: 14px; font-weight: 700; color: #596170">{{v.bu}}</span></span>
          </div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 700; color: #1428a0">도입 후</span>
            <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Manrope, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: #1428a0">{{v.after}}</span><span style="font-size: 14px; font-weight: 700; color: #1428a0">{{v.au}}</span></span>
          </div>
        </div>
        <div style="height: 1px; background: #e2e5ea; margin: 2px 4px"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
          <span style="font-size: 12px; font-weight: 800; color: #1428a0; letter-spacing: 0.02em">매달 여기서 확인</span>
          <span style="font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; color: #121417">{{v.tool}}</span>
        </div>
        <dc-import name="Photo" pid="{{v.pid}}" w="334" h="206" bg="soft" radius="10" fit="contain" hint-size="334px,206px"></dc-import>
        <span style="font-size: 12.5px; line-height: 1.5; color: #3d4452; padding: 0 4px">{{v.how}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안 · 수치는 예시 · 화면은 samsung.com 공개 솔루션 화면(실제 데이터 아님)</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 14</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // [지표, 기준, 지금, 단위, 도입 후, 단위, 확인 도구, 실제 화면, 어떻게 확인]
    const V = [
      ['매장 월 전력', '매장당 · 월', '[000]', 'kWh', '[000]', 'kWh', 'SmartThings Pro', 'ui.stp.energy', '매장별 누적 · 예상 사용량과 목표 대비를 매달 자동 집계'],
      ['메뉴 교체 소요', '신메뉴 1회 · 전 매장 반영', '[0]', '일', '[00]', '분', 'Samsung VXT CMS', 'ui.cms', '메뉴판 틀은 그대로 두고 바꾼 칸만 고쳐 전 매장에 배포'],
      ['프로모션 메뉴 판매', '화면 노출 메뉴 · 월', '[00]', '%', '[00]', '%', 'MagicINFO Insight', 'ui.mi.insight', 'POS 판매 데이터를 붙여 화면별 · 메뉴별 효과를 분석']
    ];
    const items = V.map(([k, basis, before, bu, after, au, tool, pid, how]) => ({ k, basis, before, bu, after, au, tool, pid, how }));
    return { items };
  }
}
</script>
</body>
</html>
