<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VP01 과제 → 해결</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">02 · VALUE PROPS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">세 가지 과제를, 세 가지 방법으로 풉니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">고객 과제와 제안 해결의 1:1 대응</div>

  <div style="position: absolute; left: 64px; top: 172px; width: 1152px; display: grid; grid-template-columns: 1fr 56px 1fr; gap: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.06em">
    <span style="color: #596170">고객 과제</span><span></span><span style="color: #1428a0">제안 해결</span>
  </div>
  <div style="position: absolute; left: 64px; top: 204px; width: 1152px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 1fr 56px 1fr; align-items: stretch; height: 136px">
        <div style="box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 22px 24px; display: flex; gap: 16px">
          <span style="font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; color: #8a91a0">{{r.no}}</span>
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 18px; font-weight: 700">{{r.pain}}</span><span style="font-size: 14px; line-height: 1.55; color: #596170">{{r.painDesc}}</span></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
        <div style="box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 22px 24px; display: flex; gap: 16px">
          <span style="font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; color: #1428a0">{{r.no}}</span>
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 18px; font-weight: 700">{{r.fix}}</span><span style="font-size: 14px; line-height: 1.55; color: #3d4452">{{r.fixDesc}}</span></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 8</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['매장마다 제각각인 메뉴 관리', '매장별 수동 교체로 표기 · 가격 오류 반복', '본사 원격 통합 관리', '한 번의 승인으로 320개 매장에 동시 배포'],
      ['느린 프로모션 교체', '공문 → 인쇄 → 교체까지 [N]일', '며칠에서 몇 분으로', '시간대 · 시즌 콘텐츠 예약과 자동 전환'],
      ['늘어나는 전기료', '영업시간 외에도 켜져 있는 조명 · 화면', '저전력 운영 자동화', '자동 밝기 · 전원 스케줄 · 매장별 전력 리포트']
    ];
    return { rows: R.map(([pain, painDesc, fix, fixDesc], i) => ({ no: String(i + 1).padStart(2, '0'), pain, painDesc, fix, fixDesc })) };
  }
}
</script>
</body>
</html>
