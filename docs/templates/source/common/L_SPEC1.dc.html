<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SPEC1 제품 1개 상세 스펙</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">08 · 제품 스펙</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">QM55C 상세 사양</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">제안 수량 960대 · 매장 카운터 메뉴보드</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 368px; height: 488px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 28px; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 200px; display: flex; align-items: center; justify-content: center"><div style="width: 290px; height: 163px; box-sizing: border-box; border-radius: 4px; background: #1f232a; border: 5px solid #121417; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280">제품 이미지</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 24px; font-weight: 800">QM55C</span>
      <span style="font-size: 14px; color: #596170">Smart Signage · 55" UHD</span>
      <span style="font-family: Manrope, sans-serif; font-size: 12px; color: #8a91a0; margin-top: 2px">LH55QMCE[XXXX]</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{c}}</span>
      </sc-for>
    </div>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 11.5px; line-height: 1.5; color: #8a91a0">사양은 모델 · 지역에 따라 다를 수 있으며 최종 견적 시 확인합니다.</span>
  </div>

  <div style="position: absolute; left: 456px; top: 160px; width: 760px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start">
    <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{col.groups}}" as="g" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column">
            <div style="height: 34px; display: flex; align-items: center; border-bottom: 2px solid #121417; font-size: 13px; font-weight: 800">{{g.name}}</div>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
              <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e5ea; font-size: 13px">
                <span style="color: #596170">{{r.k}}</span><span style="font-weight: 600">{{r.v}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 26</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const G = (name, rows) => ({ name, rows: rows.map(([k, v]) => ({ k, v })) });
    return {
      chips: ['UHD', '500 nit', '24/7', 'MagicINFO'],
      cols: [
        { groups: [
          G('디스플레이', [['화면 크기', '55"'], ['해상도', '3840 × 2160'], ['밝기', '500 nit'], ['명암비', '4000:1'], ['시야각', '178° / 178°']]),
          G('연결 · 재생', [['OS', 'Tizen [0.0]'], ['입력', 'HDMI ×[0] · USB ×[0]'], ['네트워크', 'LAN · Wi-Fi'], ['관리', 'MagicINFO']])
        ] },
        { groups: [
          G('전원 · 환경', [['소비전력 (일반)', '[000] W'], ['소비전력 (최대)', '[000] W'], ['운영 온도', '0 – 40 ℃'], ['운영 시간', '24/7']]),
          G('외형 · 설치', [['크기 (W×H×D)', '[0000] × [000] × [00] mm'], ['무게', '[00.0] kg'], ['베젤', '[0.0] mm'], ['VESA', '[000] × [000]']]),
          G('인증 · 보증', [['인증', 'KC · [기타]'], ['보증', '[0]년 상업용']])
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
