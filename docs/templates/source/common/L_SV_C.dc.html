<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SV-C 서비스 현장 4단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">07 · WHY SAMSUNG</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">설치 전부터 운영까지, 현장에 사람이 갑니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170; white-space: nowrap">N 리테일 체인 전국 [000]개 매장 · 단계별 담당과 약속</div>

  <!-- 4단계 -->
  <div style="position: absolute; left: 64px; top: 156px; width: 1152px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; min-width: 0">
        <div style="width: 270px; height: 262px"><dc-import name="Img" kind="people" origin="official" hint="{{s.hint}}" w="270" h="262" radius="12" credit="bl" hint-size="270px,262px"></dc-import></div>
        <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: #1428a0">{{s.no}}</span><span style="font-size: 16px; font-weight: 800">{{s.name}}</span></span>
          <span style="flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 999px; background: #1428a0; color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">{{s.when}}</span>
        </div>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #596170; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>{{s.owner}}</div>
        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e2e5ea; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11.5px; font-weight: 700; color: #8a91a0">고객이 받는 것</span><span style="font-size: 13px; line-height: 1.55; color: #3d4452; word-break: keep-all">{{s.get}}</span></div>
      </div>
    </sc-for>
  </div>
  <!-- 단계 사이 화살표 -->
  <sc-for list="{{arrows}}" as="a" hint-placeholder-count="3">
    <span style="{{a.st}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </sc-for>

  <!-- SLA 띠 -->
  <div style="position: absolute; left: 64px; top: 588px; width: 1152px; height: 56px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 0 20px; display: flex; align-items: center; gap: 12px">
    <span style="width: 116px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: #1428a0; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>약속 (SLA)</span>
    <sc-for list="{{sla}}" as="c" hint-placeholder-count="4">
      <span style="flex: 1 1 0; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap"><span style="font-size: 13px; color: #3d4452">{{c.l}}</span><span style="font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 800; color: #1428a0">{{c.v}}</span></span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>N 리테일 체인 · 매장 디스플레이 도입 제안 · 사진 samsung.com 공식 · SLA 수치는 계약 시 확정</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 31</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // [단계, 시점, 담당, 고객이 받는 것, 현장 사진 힌트(사람 · samsung.com 공식 서비스 이미지)]
    const S = [
      ['사전 실측', 'D-30', '현장 엔지니어 · 설치 기술팀', '매장별 실측 도면과 설치 조건 보고서 — 전원 · 하중 · 배선까지 미리 확인', '엔지니어가 매장 벽면을 레이저로 실측하는 모습 · 측정기 화면 보이게'],
      ['설치 · 시운전', 'D-Day', '공인 설치 협력사 · 품질 감리', '영업 외 시간에 설치하고 당일 시운전 — 화면 · 네트워크 점검 확인서', '설치 엔지니어 두 명이 매장 벽에 사이니지를 거는 모습 · 브래킷 보이게'],
      ['운영 교육', 'D+3', '솔루션 컨설턴트', '점장 · 본사 운영자 현장 교육과 매뉴얼 — 콘텐츠 교체 실습 포함', '컨설턴트가 점장에게 태블릿으로 화면 변경을 설명하는 모습'],
      ['정기 점검 · 원격 지원', '월 1회', '전담 서비스 매니저 · 원격 지원 센터', '월간 점검 리포트와 원격 장애 진단 · 펌웨어 업데이트', '원격 지원 센터 상담원이 모니터로 매장 기기 상태를 보는 모습']
    ];
    const steps = S.map(([name, when, owner, get, hint], i) => ({ no: String(i + 1).padStart(2, '0'), name, when, owner, get, hint }));
    // 화살표: 카드 사이 간격(24px) 중앙, 이미지 세로 중앙
    const colW = (1152 - 24 * 3) / 4;
    const arrows = [0, 1, 2].map((i) => {
      const cx = 64 + (i + 1) * colW + i * 24 + 12;
      return { st: 'position: absolute; left: ' + (cx - 17) + 'px; top: ' + (156 + 131 - 17) + 'px; width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 1px solid #e2e5ea; box-shadow: 0 0 0 3px #ffffff; display: flex; align-items: center; justify-content: center' };
    });
    const sla = [
      { l: '장애 접수', v: '24시간' },
      { l: '현장 출동', v: '[N]시간 이내' },
      { l: '원격 진단', v: '[N]분' },
      { l: '예비 부품', v: '[N]일' }
    ];
    return { steps, arrows, sla };
  }
}
</script>
</body>
</html>
