<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CS03 사례 3개 요약</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">이미 검증된 방식입니다</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{cases}}" as="c" hint-placeholder-count="3">
      <div style="height: 160px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 14px; display: flex; gap: 24px; align-items: center">
        <div style="width: 228px; height: 132px; flex-shrink: 0; border-radius: 10px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8a91a0">현장 이미지</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 19px; font-weight: 800">{{c.name}}</span>
            <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 11.5px; display: flex; align-items: center">{{c.tag}}</span>
          </div>
          <span style="font-size: 14.5px; line-height: 1.55; color: #3d4452">{{c.line}}</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #1428a0">{{c.used}}</span>
        </div>
        <div style="width: 1px; height: 100px; background: #d5d9e0; flex-shrink: 0"></div>
        <div style="width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding-right: 10px">
          <span style="font-family: Manrope, sans-serif; font-size: 38px; font-weight: 800; color: #1428a0; letter-spacing: -0.02em">{{c.n}}</span>
          <span style="font-size: 13px; color: #3d4452">{{c.l}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 22</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { cases: [
      { name: 'B 베이커리 체인', tag: '식음료 · 180개 매장', line: '인쇄 메뉴판을 디지털 메뉴보드로 바꾸고 본사에서 일괄 배포', used: 'QM55C · MagicINFO', n: '[00]%', l: '메뉴 교체 비용 절감' },
      { name: 'C 버거 브랜드', tag: '퀵서비스 · 90개 매장', line: '키오스크와 메뉴보드를 연동해 점심 피크 대기 해소', used: 'KM24C · QM55C', n: '[00]%', l: '주문 대기 시간 단축' },
      { name: 'D 카페 브랜드', tag: '카페 · 60개 매장', line: '외부 사이니지로 시간대별 프로모션, 전력은 영업시간에만', used: 'OH55C · SmartThings Pro', n: '[00]%', l: '매장 유입 증가' }
    ] };
  }
}
</script>
</body>
</html>
