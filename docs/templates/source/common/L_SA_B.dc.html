<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SA-B 허브형 구성도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">05 · 솔루션 제안</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">MagicINFO 하나가 매장의 모든 화면을 묶습니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">허브형 구성도 · 클라우드 CMS 하나에 매장 시스템과 화면이 모두 연결됩니다</div>

  <!-- 그룹 라벨 -->
  <div style="position: absolute; left: 64px; top: 160px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.04em; color: #596170">연동 시스템</div>
  <div style="position: absolute; left: 966px; top: 160px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.04em; color: #596170">매장 화면</div>

  <!-- 연결선 (카드 → 허브 가장자리) -->
  <sc-for list="{{wires}}" as="w" hint-placeholder-count="6">
    <div style="{{w.style}}"></div>
  </sc-for>

  <!-- 허브 -->
  <div style="position: absolute; left: 530px; top: 286px; width: 220px; height: 220px; border-radius: 50%; background: #1428a0; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a4 4 0 0 1 1-7.9A6 6 0 0 1 17 8a4 4 0 0 1 1 8H4z"/></svg>
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em">MagicINFO</span>
    <span style="font-size: 13.5px; color: #c8d3ff">클라우드 CMS</span>
  </div>

  <!-- 노드 카드 (좌 3 · 우 3) -->
  <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
    <div style="position: absolute; {{n.pos}} width: 250px; height: 92px; box-sizing: border-box; border-radius: 14px; background: #ffffff; border: 1px solid #e2e5ea; padding: 0 16px; display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: {{n.tile}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{n.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><span style="font-size: 15px; font-weight: 800">{{n.name}}</span><span style="font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 700; color: #596170">{{n.model}}</span></div>
        <span style="font-size: 12.5px; color: #596170; white-space: nowrap">{{n.io}}</span>
      </div>
    </div>
  </sc-for>

  <!-- 받는 쪽 점 -->
  <sc-for list="{{ports}}" as="p" hint-placeholder-count="8">
    <div style="{{p.style}}"></div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 624px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a91a0">
    <span style="width: 24px; height: 2px; background: #b8bec8"></span><span>선 = 데이터 흐름</span>
    <span style="width: 8px; height: 8px; margin-left: 12px; border-radius: 50%; background: #1428a0"></span><span>점 = 받는 쪽</span>
  </div>
  <div style="position: absolute; right: 64px; top: 624px; font-size: 12px; color: #8a91a0">320개 매장 동일 구성 · 매장이 늘면 화면만 등록</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 19</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 허브 중심 (640, 396) · 반지름 110 · 카드 중심 y 236 / 396 / 556
    const cx = 640, cy = 396, r = 110, k = 78;
    const ys = [236, 396, 556];
    const px = (n) => n + 'px; ';
    const B = 'position: absolute; box-sizing: border-box; ';
    const W = '2px solid #b8bec8';

    // 연결선: 가운데 카드는 직선, 위 · 아래 카드는 꺾인 선으로 허브 어깨에 닿음
    const wires = [];
    ys.forEach((y, i) => {
      if (i === 1) {
        wires.push({ style: B + 'left: 314px; top: ' + px(y - 1) + 'width: 236px; height: 2px; background: #b8bec8;' });
        wires.push({ style: B + 'left: 730px; top: ' + px(y - 1) + 'width: 236px; height: 2px; background: #b8bec8;' });
        return;
      }
      const up = i === 0;
      const top = up ? y - 1 : cy + 50;
      const h = up ? (cy - 50) - top : (y + 1) - top;
      const edge = up ? 'top' : 'bottom';
      const common = 'top: ' + px(top) + 'height: ' + px(h) + 'border-' + edge + ': ' + W + '; ';
      wires.push({ style: B + 'left: 314px; width: ' + px(cx - k + 1 - 314) + common + 'border-right: ' + W + '; border-' + edge + '-right-radius: 14px;' });
      wires.push({ style: B + 'left: ' + px(cx + k - 1) + 'width: ' + px(966 - (cx + k - 1)) + common + 'border-left: ' + W + '; border-' + edge + '-left-radius: 14px;' });
    });

    // 받는 쪽 표시 점
    const dot = (x, y) => ({ style: B + 'left: ' + px(x - 6) + 'top: ' + px(y - 6) + 'width: 12px; height: 12px; border-radius: 50%; background: #1428a0; border: 2px solid #ffffff;' });
    const hubL = [[cx - k, cy - k], [cx - r, cy], [cx - k, cy + k]];
    const hubR = [[cx + k, cy - k], [cx + r, cy], [cx + k, cy + k]];

    const T = { sys: ['#f5f6f8', '#121417'], stp: ['#121417', '#ffffff'], dev: ['#eaeefb', '#1428a0'] };
    const I = {
      pos: 'M6 2h12v20l-3-2-3 2-3-2-3 2z M9 7h6 M9 11h6 M9 15h4',
      dash: 'M3 3h18v18H3z M3 9h18 M9 21V9',
      power: 'M12 2v10 M6.3 6.3a8 8 0 1 0 11.4 0',
      board: 'M3 4h18v12H3z M8 20h8 M12 16v4',
      kiosk: 'M7 2h10v14H7z M12 16v5 M8 21h8',
      outdoor: 'M4 3h16v11H4z M8 14v7 M16 14v7'
    };
    // dir: in = 허브가 받음 · out = 노드가 받음 · both = 양방향
    const left = [
      ['POS 연동', '', '가격 · 품절 정보 전송', 'in', 'sys', I.pos],
      ['본사 대시보드', '', '콘텐츠 등록 · 상태 확인', 'both', 'sys', I.dash],
      ['SmartThings Pro', '', '영업시간 · 전원 연동', 'both', 'stp', I.power]
    ];
    const right = [
      ['메뉴보드', 'QM55C', '메뉴 · 가격 · 품절 수신', 'out', 'dev', I.board],
      ['키오스크', 'KM24C', '주문 화면 · 추천 메뉴 수신', 'out', 'dev', I.kiosk],
      ['외부 사이니지', 'OH55C', '시간대별 프로모션 수신', 'out', 'dev', I.outdoor]
    ];
    const nodes = [], ports = [];
    const add = (arr, side) => arr.forEach(([name, model, io, dir, kind, icon], i) => {
      const y = ys[i];
      const x = side === 'L' ? 64 : 966;
      nodes.push({ name, model, io, icon, tile: T[kind][0], stroke: T[kind][1], pos: 'left: ' + px(x) + 'top: ' + px(y - 46) });
      const hub = (side === 'L' ? hubL : hubR)[i];
      const card = [side === 'L' ? 314 : 966, y];
      if (dir !== 'out') ports.push(dot(hub[0], hub[1]));
      if (dir !== 'in') ports.push(dot(card[0], card[1]));
    });
    add(left, 'L');
    add(right, 'R');
    return { wires, nodes, ports };
  }
}
</script>
</body>
</html>
