<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OP-B 역할별 스윔레인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">05 · 솔루션 제안</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">신메뉴 출시 — 본사 · 시스템 · 매장 · 손님이 각각 겪는 일</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">운영 시나리오 · 역할별 스윔레인 — 일이 누구에게서 누구로 넘어가는가</div>

  <!-- 시간 헤더 -->
  <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
    <div style="position: absolute; top: 166px; {{c.pos}} display: flex; justify-content: center; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: #121417">{{c.t}}</span><span style="font-size: 12.5px; color: #596170">{{c.d}}</span></div>
  </sc-for>

  <!-- 레인 -->
  <sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
    <div style="{{l.style}}"><span style="font-size: 15px; font-weight: 800; color: {{l.nameColor}}">{{l.name}}</span><span style="font-size: 12px; color: #596170">{{l.role}}</span></div>
  </sc-for>
  <div style="position: absolute; left: 64px; top: 616px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 232px; top: 200px; width: 1px; height: 416px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 480px; top: 200px; width: 0; height: 416px; border-left: 1px dashed #d5d9e0"></div>
  <div style="position: absolute; left: 728px; top: 200px; width: 0; height: 416px; border-left: 1px dashed #d5d9e0"></div>
  <div style="position: absolute; left: 976px; top: 200px; width: 0; height: 416px; border-left: 1px dashed #d5d9e0"></div>

  <!-- 흐름 화살표 -->
  <sc-for list="{{arrows}}" as="a" hint-placeholder-count="14">
    <div style="{{a.style}}"></div>
  </sc-for>
  <div style="position: absolute; left: 616px; top: 451px; font-size: 11.5px; color: #8a91a0">교체 작업 없음</div>

  <!-- 카드 (레인 × 시간 칸) -->
  <sc-for list="{{cards}}" as="k" hint-placeholder-count="8">
    <div style="position: absolute; {{k.pos}} width: 208px; height: 70px; box-sizing: border-box; border-radius: 10px; background: #ffffff; border: 1px solid {{k.border}}; padding: 0 12px; display: flex; align-items: center; gap: 10px">
      <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: {{k.badge}}; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{k.no}}</span>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{k.title}}</span>
        <span style="font-size: 12px; color: #596170; white-space: nowrap">{{k.desc}}</span>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 626px; font-size: 12px; color: #8a91a0">번호 = 일이 넘어가는 순서 · 빈 칸 = 그 시간에 할 일 없음</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 20</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 시간 칸 중심 x · 레인 중심 y
    const cc = [356, 604, 852, 1100];
    const lc = [252, 356, 460, 564];
    const px = (n) => n + 'px; ';

    const cols = [['D-3', '출시 준비'], ['D-Day 07:00', '오픈'], ['11:30', '점심 피크'], ['21:00', '마감']]
      .map(([t, d], i) => ({ t, d, pos: 'left: ' + px(240 + i * 248) + 'width: 232px;' }));

    const lanes = [
      ['본사 운영팀', '마케팅 · 운영', false],
      ['MagicINFO', '클라우드 CMS', true],
      ['점장', '매장 320곳', false],
      ['손님', '매장 방문객', false]
    ].map(([name, role, sys], j) => ({
      name, role,
      nameColor: sys ? '#1428a0' : '#121417',
      style: 'position: absolute; left: 64px; top: ' + px(200 + j * 104) + 'width: 1152px; height: 104px; box-sizing: border-box; border-top: 1px solid #e2e5ea; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; gap: 3px; background: ' + (sys ? '#f5f7fd' : '#ffffff') + ';'
    }));

    // [레인, 시간 칸, 제목, 설명] — 배열 순서 = 흐름 순서
    const C = [
      [0, 0, '신메뉴 콘텐츠 등록', '메뉴판 · 영상 업로드 · 승인'],
      [1, 0, '전 매장 예약 배포', 'D-Day 07:00 전환 예약'],
      [1, 1, '메뉴보드 자동 전환', '320개 매장 동시 적용'],
      [3, 1, '화면에서 신메뉴 발견', '외부 · 카운터 사이니지'],
      [3, 2, '신메뉴 주문 집중', '점심 피크 · 재고 소진'],
      [2, 2, 'POS에서 품절 입력', '화면은 손대지 않음'],
      [1, 2, '품절 즉시 반영', '대체 메뉴 자동 추천'],
      [0, 3, '매장별 리포트 확인', '노출 · 판매 결과 비교']
    ];
    const cards = C.map(([lane, col, title, desc], i) => ({
      no: i + 1, title, desc,
      pos: 'left: ' + px(cc[col] - 104) + 'top: ' + px(lc[lane] - 35),
      border: lane === 1 ? '#b8c3ee' : '#d5d9e0',
      badge: lane === 1 ? '#1428a0' : '#121417'
    }));

    // 화살표: 2px 선 + 삼각 머리 (카드 가장자리 → 다음 카드 가장자리)
    const G = '#8a91a0';
    const A = 'position: absolute; box-sizing: border-box; ';
    const H = 'position: absolute; width: 0; height: 0; ';
    const line = (x, y, w, h) => ({ style: A + 'left: ' + px(x) + 'top: ' + px(y) + 'width: ' + px(w) + 'height: ' + px(h) + 'background: ' + G + ';' });
    const down = (x, y) => ({ style: H + 'left: ' + px(x - 5) + 'top: ' + px(y - 7) + 'border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid ' + G + ';' });
    const up = (x, y) => ({ style: H + 'left: ' + px(x - 5) + 'top: ' + px(y) + 'border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid ' + G + ';' });
    const right = (x, y) => ({ style: H + 'left: ' + px(x - 7) + 'top: ' + px(y - 5) + 'border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid ' + G + ';' });
    const arrows = [
      line(355, 287, 2, 27), down(356, 321),
      line(460, 355, 33, 2), right(500, 356),
      line(603, 391, 2, 131), down(604, 529),
      line(708, 563, 33, 2), right(748, 564),
      line(851, 502, 2, 27), up(852, 495),
      line(851, 398, 2, 27), up(852, 391),
      { style: A + 'left: 956px; top: 294px; width: 145px; height: 63px; border-bottom: 2px solid ' + G + '; border-right: 2px solid ' + G + '; border-bottom-right-radius: 10px;' },
      up(1100, 287)
    ];
    return { cols, lanes, cards, arrows };
  }
}
</script>
</body>
</html>
