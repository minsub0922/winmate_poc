<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C10 목차 B · 섹션 썸네일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">CONTENTS</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">목차</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; line-height: 1.5; color: #596170; white-space: nowrap">A 커피 프랜차이즈 매장 디지털 전환 제안 · 6개 장</div>

  <!-- 3 × 2 섹션 카드: 썸네일 + 번호 · 장 이름 · 페이지 + 한 줄 설명 + 시트 목록 -->
  <div style="position: absolute; left: 64px; top: 152px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; row-gap: 20px">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
      <div style="height: 236px; display: flex; flex-direction: column">
        <div style="width: 368px; height: 128px; flex-shrink: 0">
          <dc-import name="Img" pid="{{s.pid}}" kind="{{s.kind}}" origin="{{s.origin}}" hint="{{s.hint}}" pos="{{s.pos}}" zoom="{{s.zoom}}" w="368" h="128" radius="12" credit="{{s.credit}}" hint-size="368px,128px"></dc-import>
        </div>
        <div style="padding-top: 14px; display: flex; align-items: baseline; gap: 10px">
          <span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800; line-height: 1; color: #1428a0">{{s.no}}</span>
          <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; flex-grow: 1">{{s.name}}</span>
          <span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #8a91a0; white-space: nowrap">{{s.pages}}</span>
        </div>
        <span style="margin-top: 6px; font-size: 13px; line-height: 1.5; color: #3d4452; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.desc}}</span>
        <span style="margin-top: auto; padding-top: 8px; border-top: 1px solid #e2e5ea; font-size: 11.5px; line-height: 1.4; color: #8a91a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.sheets}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 매장 디지털 전환 제안 · 썸네일 이미지 출처는 각 장에 표기 · 도입사례 사진은 외부 제출 전 고객사 확인</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 2</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 장마다 대표 이미지 1장 — 실사(pid)가 있으면 pid, 없으면 kind · origin · hint 자리표시
    // 썸네일은 작아서 출처 칩을 끄고 각 장에 표기 — 단, 다른 브랜드가 보이는 도입사례 사진만 칩을 켠다
    // [장 이름, 한 줄 설명, 페이지 범위, 시트 목록, pid, kind, origin, hint, pos, zoom, credit]
    const S = [
      ['고객 이해', '320개 매장의 지금 — 카운터 · 메뉴판 · 대기 동선', 'p.3–6', '매장 현황 · 현장 조사 · 과제 정리', 'none', 'space', 'site', '매장 카운터 현재 모습', '50% 50%', 1, 'off'],
      ['가치 제안', '손님 · 점주 · 본사가 각각 얻는 세 가지', 'p.7–9', '핵심 가치 · 사용 장면 · 기대 효과', 'none', 'people', 'gen', '키오스크로 주문하는 손님', '50% 50%', 1, 'off'],
      ['공간별 제품', '카운터 · 쇼윈도 · 대기 공간에 들어가는 화면', 'p.10–14', '공간 맵 · 카운터 · 쇼윈도 · 대기 공간', 'life.qm55c.wall', 'people', 'auto', '', '100% 70%', 1.4, 'off'],
      ['솔루션', '본사에서 전 매장 화면과 기기를 한 번에 운영', 'p.15–18', '구성도 · 콘텐츠 배포 · 원격 관제', 'ui.stp.map', 'ui', 'auto', '', '50% 32%', 1, 'off'],
      ['도입 사례', '같은 구성을 먼저 도입한 퀵서비스 매장', 'p.19–21', '사례 요약 · 전후 비교 · 성과', 'case.mcd.counter', 'insitu', 'auto', '', '50% 40%', 1, 'br'],
      ['도입 계획 · 지원', '시범 매장부터 전국 확산까지, 일정과 지원 체계', 'p.22–26', '일정 · 설치 · 교육 · 유지보수', 'none', 'people', 'official', '설치 엔지니어 현장 작업', '50% 50%', 1, 'off']
    ];
    const sections = S.map(([name, desc, pages, sheets, pid, kind, origin, hint, pos, zoom, credit], i) => ({
      no: String(i + 1).padStart(2, '0'), name, desc, pages, sheets, pid, kind, origin, hint, pos, zoom, credit
    }));
    return { sections };
  }
}
</script>
</body>
</html>
