<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IS-B 실측 오버레이 · 설치 조건</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · 고객 현장</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1100px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">벽 하나에 걸린 조건 다섯 가지 — 제안은 여기서 시작합니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170; white-space: nowrap">F 사옥 1층 로비 · 미디어월 설치 예정 벽면 · 실측 2026.09.[00]</div>

  <!-- 현장 사진 + 실측 오버레이 (사진 좌표 760 × 470) -->
  <div style="position: absolute; left: 64px; top: 150px; width: 760px; height: 470px">
    <dc-import name="Img" kind="space" origin="site" hint="로비 정면 벽 전체 · 바닥부터 천장까지 · 정면 수평" w="760" h="470" radius="16" credit="tl" hint-size="760px,470px"></dc-import>

    <!-- 보 하부 수평 점선 -->
    <div style="position: absolute; left: 96px; top: 94px; width: 640px; height: 0px; border-top: 2px dashed #ffffff"></div>
    <span style="position: absolute; left: 584px; top: 80px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(18,20,23,0.78); color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 50%; background: #9db4ff"></span>보 하부 2.9m</span>

    <!-- 세로 치수선: 바닥 ~ 천장 -->
    <div style="position: absolute; left: 95px; top: 60px; width: 1.5px; height: 360px; background: #ffffff"></div>
    <div style="position: absolute; left: 86px; top: 60px; width: 20px; height: 1.5px; background: #ffffff"></div>
    <div style="position: absolute; left: 86px; top: 419px; width: 20px; height: 1.5px; background: #ffffff"></div>
    <span style="position: absolute; left: 30px; top: 226px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(18,20,23,0.78); color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">설치 가능 높이 3.2m</span>

    <!-- 가로 치수선: 벽 폭 -->
    <div style="position: absolute; left: 96px; top: 440px; width: 640px; height: 1.5px; background: #ffffff"></div>
    <div style="position: absolute; left: 96px; top: 431px; width: 1.5px; height: 20px; background: #ffffff"></div>
    <div style="position: absolute; left: 734px; top: 431px; width: 1.5px; height: 20px; background: #ffffff"></div>
    <span style="position: absolute; left: 366px; top: 427px; height: 26px; padding: 0 12px; border-radius: 999px; background: rgba(18,20,23,0.78); color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">벽 폭 8.4m</span>

    <!-- 설비 핀 -->
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="2">
      <div style="{{p.box}}">
        <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(18,20,23,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><sc-if value="{{p.is_load}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16 M6 20V10l6-5 6 5v10 M10 20v-5h4v5"/></svg></sc-if><sc-if value="{{p.is_sun}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4L7 17 M17 7l1.4-1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></sc-if><sc-if value="{{p.is_beam}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18 M3 10h18 M7 14v7 M17 14v7"/></svg></sc-if><sc-if value="{{p.is_hatch}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M4 9h16 M9 4v5"/></svg></sc-if><sc-if value="{{p.is_power}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5 M15 3v5 M6 8h12v4a6 6 0 0 1-12 0z M12 18v3"/></svg></sc-if></span>
        <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(18,20,23,0.78); color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p.label}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 630px; width: 760px; height: 20px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #8a91a0; white-space: nowrap">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 1.5px; background: #8a91a0"></span>실측 치수</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 0px; border-top: 2px dashed #8a91a0"></span>설치 상한</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1428a0"></span>설비 위치</span>
    <span style="margin-left: auto">치수는 레이저 실측값 · 도면과 대조 필요</span>
  </div>

  <!-- 현장 조건 → 제안 반영 -->
  <div style="position: absolute; left: 848px; top: 150px; width: 368px; height: 26px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #596170; white-space: nowrap">
    <span>현장 조건</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14 M13 6l6 6-6 6"/></svg>
    <span style="color: #1428a0">제안 반영</span>
  </div>
  <div style="position: absolute; left: 848px; top: 184px; width: 368px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="height: 92px; box-sizing: border-box; border-top: 1px solid #e2e5ea; padding-top: 14px; display: flex; gap: 14px">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #f5f6f8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><sc-if value="{{r.is_load}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16 M6 20V10l6-5 6 5v10 M10 20v-5h4v5"/></svg></sc-if><sc-if value="{{r.is_sun}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4L7 17 M17 7l1.4-1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></sc-if><sc-if value="{{r.is_beam}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18 M3 10h18 M7 14v7 M17 14v7"/></svg></sc-if><sc-if value="{{r.is_hatch}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M4 9h16 M9 4v5"/></svg></sc-if><sc-if value="{{r.is_power}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5 M15 3v5 M6 8h12v4a6 6 0 0 1-12 0z M12 18v3"/></svg></sc-if></span>
        <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
          <span style="font-size: 14px; font-weight: 800; color: #121417; white-space: nowrap">{{r.cond}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: #1428a0; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14 M13 6l6 6-6 6"/></svg>{{r.fix}}</span>
          <span style="font-size: 12px; color: #8a91a0; white-space: nowrap">{{r.note}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>F 사옥 · 로비 미디어월 제안 · 사진 · 고객 현장 직접 촬영 2026.09.[00]</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 6</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 아이콘 키 → sc-if 플래그 (load · sun · beam · hatch · power)
    const flags = (k) => ({ is_load: k === 'load', is_sun: k === 'sun', is_beam: k === 'beam', is_hatch: k === 'hatch', is_power: k === 'power' });
    // 설비 핀 = [라벨, 사진 좌표 x, y (핀 중심), 아이콘]
    const P = [
      ['전원 1구', 640, 392, 'power'],
      ['점검구', 300, 70, 'hatch']
    ];
    const pins = P.map(([label, x, y, icon]) => ({
      label, ...flags(icon),
      box: 'position: absolute; left: ' + (x - 15) + 'px; top: ' + (y - 15) + 'px; height: 30px; display: flex; align-items: center; gap: 6px;'
    }));
    // [아이콘, 현장 조건, 제안 반영, 근거 한 줄]
    const R = [
      ['load', '벽 하중 [000]kg/㎡', '경량 캐비닛 LED', '석고 보드 벽 · 보강 범위 [확인 필요]'],
      ['sun', '오후 직사광 [N]시간', '고휘도 [0000]nit', '서측 유리 커튼월 · [00]–[00]시 측정'],
      ['beam', '보 하부 2.9m', '높이 [0.0]m 이내 구성', '천장 3.2m · 보 아래로만 설치'],
      ['hatch', '점검구 위치', '전면 유지보수형', '벽 뒤 접근 불가 · 앞에서 모듈 교체'],
      ['power', '전원 1구', '분전반 증설 [확인 필요]', '미디어월 소비전력 대비 용량 부족']
    ];
    const rows = R.map(([icon, cond, fix, note]) => ({ cond, fix, note, ...flags(icon) }));
    return { pins, rows };
  }
}
</script>
</body>
</html>
