<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CL-D 사례 사진 카드 6</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">여섯 업종에서 먼저 바꿨습니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1100px; font-size: 15px; line-height: 1.5; color: #596170; white-space: nowrap">삼성 B2B 도입사례 중 이번 제안과 구성이 비슷한 6건 · 원문 링크 포함</div>

  <!-- 3 × 2 사례 카드 -->
  <div style="position: absolute; left: 64px; top: 150px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; row-gap: 20px">
    <sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
      <div style="height: 240px; display: flex; flex-direction: column">
        <div style="position: relative; width: 368px; height: 136px; flex-shrink: 0">
          <dc-import name="Img" pid="{{c.pid}}" kind="{{c.kind}}" origin="case" hint="{{c.hint}}" pos="{{c.pos}}" w="368" h="136" radius="12" credit="tr" hint-size="368px,136px"></dc-import>
          <span style="position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.94); display: flex; align-items: center; gap: 6px; white-space: nowrap">
            <span style="font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; color: #1428a0">{{c.no}}</span>
            <span style="font-size: 12px; font-weight: 700">{{c.ind}}</span>
          </span>
        </div>
        <span style="margin-top: 12px; font-size: 15px; font-weight: 800; line-height: 22px; white-space: nowrap">{{c.client}}</span>
        <span style="margin-top: 2px; font-size: 12.5px; line-height: 19px; color: #596170; white-space: nowrap">{{c.prod}}</span>
        <div style="margin-top: 10px; padding-top: 9px; border-top: 1px solid #e2e5ea; display: flex; align-items: baseline; justify-content: space-between">
          <span style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap">
            <span style="font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800; color: #1428a0">{{c.kpi}}</span>
            <span style="font-size: 12.5px; font-weight: 700; color: #3d4452">{{c.label}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: #1428a0; white-space: nowrap">원문 보기<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>출처 · samsung.com/sec/business 고객 사례 · 사례 사진 저작권 삼성전자 · 다른 브랜드 노출 시 외부 제출 전 확인</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 24</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 사례 하나 = 사례 사진(도입사례) + 업종 · 고객사 · 도입 제품 · 대표 성과 + 원문 링크
    // pid가 없으면 kind insitu + hint로 사례 이미지 DB를 찾는다. 성과 수치는 원문에 있는 값만.
    const cases = [
      ['case.mcd.window', '30% 100%', '퀵서비스', '맥도날드 코리아', '메뉴보드 · 옥외 사이니지 · 창가 사이니지', '[00]%', '주문 대기 시간 단축', ''],
      ['none', '50% 50%', '호텔', '[고객사]', '호텔 TV · LYNK Cloud', '[00]%', '객실 서비스 주문 증가', '호텔 객실 TV 웰컴 화면 · 침대 쪽에서 본 객실'],
      ['none', '50% 50%', '리테일', '[고객사]', 'LED 사이니지 · 대형 파사드', '[00]%', '매장 방문 증가', '플래그십 스토어 대형 LED 파사드 · 거리에서 본 외관'],
      ['none', '50% 50%', '교육', '[고객사]', '전자칠판 Flip Pro', '[00]%', '수업 준비 시간 단축', '강의실 전자칠판 수업 장면 · 교수자와 학생'],
      ['none', '50% 50%', '오피스', '[고객사]', 'LED 미디어월 · The Wall', '[00]%', '방문객 안내 문의 감소', '사옥 로비 미디어월 · 입구에서 본 정면'],
      ['none', '50% 50%', '의료', '[고객사]', '안내 사이니지 · MagicINFO', '[00]%', '대기 안내 문의 감소', '병원 대기 홀 안내 사이니지 · 대기 좌석 포함']
    ].map(([pid, pos, ind, client, prod, kpi, label, hint], i) => ({
      no: String(i + 1).padStart(2, '0'), pid, pos, ind, client, prod, kpi, label, hint, kind: 'insitu'
    }));
    return { cases };
  }
}
</script>
</body>
</html>
