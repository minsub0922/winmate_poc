<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CL-C 레퍼런스 월</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">식음료 · 리테일 [00]개 브랜드가 먼저 선택했습니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">업종별 도입 브랜드 · [0000]년 [00]월 기준</div>

  <!-- 업종별 로고 월 -->
  <div style="position: absolute; left: 64px; top: 160px; width: 1152px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="{{r.st}}">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 800">{{r.name}}</span>
          <span style="font-family: Manrope, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: #1428a0">{{r.count}}</span>
        </div>
        <sc-for list="{{r.logos}}" as="l" hint-placeholder-count="6">
          <div style="height: 64px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8a91a0">고객 로고</div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 624px; font-size: 12px; color: #8a91a0">공개 동의를 받은 고객만 표시합니다</div>
  <div style="position: absolute; right: 64px; top: 618px; display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: #596170">전체 <span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800; color: #1428a0">[00]</span>개 브랜드 · 매장 <span style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 800; color: #1428a0">[0,000]</span>곳</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 23</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const PER_ROW = 6;
    const R = [
      ['커피 · 카페', '[00]곳'],
      ['퀵서비스', '[00]곳'],
      ['베이커리 · 디저트', '[00]곳'],
      ['편의점 · 리테일', '[00]곳']
    ];
    const base = 'height: 112px; box-sizing: border-box; display: grid; grid-template-columns: 180px repeat(' + PER_ROW + ', minmax(0, 1fr)); column-gap: 16px; align-items: center; border-top: 1px solid #e2e5ea;';
    return {
      rows: R.map(([name, count], i) => ({
        name, count,
        logos: Array.from({ length: PER_ROW }, (_, j) => j + 1),
        st: base + (i === R.length - 1 ? ' border-bottom: 1px solid #e2e5ea;' : '')
      }))
    };
  }
}
</script>
</body>
</html>
