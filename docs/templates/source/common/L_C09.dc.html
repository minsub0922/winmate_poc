class Component extends DCLogic {
  renderVals() {

    const K = [
      ['[00]%', '주문 대기 단축', '피크 시간 · 도입 전 대비'],

    ];
    const base = 'display: flex; flex-direction: column; gap: 7px; box-sizing: border-box;';
    return {
      kpis: K.map(([n, l, d], i) => ({
        n, l, d,
