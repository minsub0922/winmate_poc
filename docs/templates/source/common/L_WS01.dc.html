<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WS01 비교표 (삼성 강조)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">07 · WHY SAMSUNG</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">운영까지 보면, 차이는 분명합니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">고객 요구사항 기준 비교 · 경쟁사는 익명 처리</div>

  <div style="position: absolute; left: 340px; top: 150px; width: 292px; height: 476px; border-radius: 16px; background: #eaeefb; border: 2px solid #1428a0; box-sizing: border-box"></div>

  <div style="position: absolute; left: 64px; top: 160px; width: 1152px">
    <div style="display: grid; grid-template-columns: 276px repeat(3, minmax(0, 1fr)); height: 64px; align-items: center">
      <span style="padding-left: 4px; font-size: 13px; color: #596170">요구사항</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 17px; font-weight: 800; color: #1428a0">Samsung</span><span style="font-size: 12px; color: #1428a0">QM · MagicINFO</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">경쟁사 A</span><span style="font-size: 12px; color: #8a91a0">[제품군]</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">경쟁사 B</span><span style="font-size: 12px; color: #8a91a0">[제품군]</span></div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 276px repeat(3, minmax(0, 1fr)); height: 66px; align-items: center; border-top: 1px solid #e2e5ea">
        <span style="padding-left: 4px; font-size: 15px; font-weight: 700">{{r.k}}</span>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1428a0"></span><span style="font-size: 14px; font-weight: 700; color: #1428a0">{{r.s}}</span></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px"><span style="{{r.aDot}}"></span><span style="font-size: 14px; color: #596170">{{r.a}}</span></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px"><span style="{{r.bDot}}"></span><span style="font-size: 14px; color: #596170">{{r.b}}</span></div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; right: 64px; top: 638px; display: flex; gap: 16px; font-size: 11.5px; color: #8a91a0">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1428a0"></span>충족</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #b8bec8"></span>부분 충족</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #b8bec8"></span>미지원</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 24</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (lv) => lv === 2
      ? 'width: 12px; height: 12px; border-radius: 50%; background: #1428a0'
      : lv === 1
        ? 'width: 12px; height: 12px; border-radius: 50%; background: #b8bec8'
        : 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #b8bec8';
    const R = [
      ['전 매장 원격 배포', '표준 제공', 1, '별도 SW', 1, '별도 SW'],
      ['메뉴 · 가격 자동 연동', 'POS 연동 지원', 1, '부분 지원', 0, '미지원'],
      ['24/7 연속 운영', '상업용 설계', 2, '지원', 1, '일부 모델'],
      ['키오스크 · 메뉴보드 통합', '단일 콘솔', 0, '미지원', 1, '별도 콘솔'],
      ['에너지 관리', 'SmartThings Pro', 0, '미지원', 0, '미지원'],
      ['전국 설치 · 유지보수', '직영 서비스망', 1, '협력사', 1, '협력사']
    ];
    return { rows: R.map(([k, s, al, a, bl, b]) => ({ k, s, a, b, aDot: dot(al), bDot: dot(bl) })) };
  }
}
</script>
</body>
</html>
