<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CS02 사례 2개 비교</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">같은 고민을 먼저 푼 두 브랜드</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{cases}}" as="c" hint-placeholder-count="2">
      <div style="height: 512px; box-sizing: border-box; border-radius: 16px; border: 1px solid #e2e5ea; overflow: hidden; display: flex; flex-direction: column">
        <div style="position: relative; height: 200px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8a91a0">{{c.name}} 현장 이미지
          <span style="position: absolute; left: 16px; top: 16px; height: 26px; padding: 0 10px; border-radius: 999px; background: #ffffff; color: #121417; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{c.tag}}</span>
        </div>
        <div style="padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 64px; height: 24px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #8a91a0">고객 로고</span>
            <span style="font-size: 19px; font-weight: 800">{{c.name}}</span>
          </div>
          <div style="display: flex; gap: 12px; font-size: 14px; line-height: 1.55"><span style="width: 36px; flex-shrink: 0; font-weight: 800; color: #1428a0">과제</span><span>{{c.pain}}</span></div>
          <div style="display: flex; gap: 12px; font-size: 14px; line-height: 1.55"><span style="width: 36px; flex-shrink: 0; font-weight: 800; color: #1428a0">해결</span><span>{{c.fix}}</span></div>
          <div style="flex-grow: 1"></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="border-radius: 12px; background: #eaeefb; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Manrope, sans-serif; font-size: 26px; font-weight: 800; color: #1428a0">{{c.n1}}</span><span style="font-size: 12.5px; color: #3d4452">{{c.l1}}</span></div>
            <div style="border-radius: 12px; background: #eaeefb; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Manrope, sans-serif; font-size: 26px; font-weight: 800; color: #1428a0">{{c.n2}}</span><span style="font-size: 12.5px; color: #3d4452">{{c.l2}}</span></div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 22</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { cases: [
      { name: 'B 베이커리 체인', tag: '식음료 · 180개 매장', pain: '매장마다 다른 가격 표기, 메뉴 교체에 매달 [00]일', fix: 'QM 메뉴보드 + MagicINFO 일괄 배포', n1: '[00]%', l1: '메뉴 교체 비용 절감', n2: '[0]분', l2: '신메뉴 반영 시간' },
      { name: 'C 버거 브랜드', tag: '퀵서비스 · 90개 매장', pain: '점심 피크 주문 대기, 카운터 인력 부족', fix: 'KM24C 키오스크 + 메뉴보드 연동', n1: '[00]%', l1: '주문 대기 시간 단축', n2: '[00]%', l2: '객단가 상승' }
    ] };
  }
}
</script>
</body>
</html>
