<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CM-B 요구사항별 충족도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">07 · WHY SAMSUNG</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">A 커피의 다섯 가지 요구, 모두 충족하는 곳은 삼성뿐입니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 640px; font-size: 15px; color: #596170">요구사항별 충족 점수 · 경쟁사는 익명 처리</div>

  <!-- 범례 -->
  <div style="position: absolute; right: 64px; top: 116px; display: flex; align-items: center; gap: 18px; font-size: 12.5px; color: #3d4452">
    <span style="display: flex; align-items: center; gap: 7px"><span style="width: 22px; height: 10px; border-radius: 0 3px 3px 0; background: #1428a0"></span>Samsung</span>
    <span style="display: flex; align-items: center; gap: 7px"><span style="width: 22px; height: 6px; border-radius: 0 3px 3px 0; background: #b8bec8"></span>경쟁사 평균</span>
    <span style="display: flex; align-items: center; gap: 7px"><span style="width: 2px; height: 14px; background: #121417"></span>요구 수준</span>
  </div>

  <!-- 열 머리 + 눈금 -->
  <div style="position: absolute; left: 64px; top: 164px; font-size: 13px; color: #596170">요구사항 · 중요도</div>
  <sc-for list="{{ticks}}" as="t" hint-placeholder-count="3">
    <span style="{{t.st}}">{{t.label}}</span>
  </sc-for>
  <div style="position: absolute; left: 1016px; top: 164px; font-size: 13px; color: #596170">충족 여부</div>

  <!-- 눈금선 -->
  <sc-for list="{{ticks}}" as="t" hint-placeholder-count="3">
    <div style="{{t.line}}"></div>
  </sc-for>

  <!-- 요구사항 행 -->
  <div style="position: absolute; left: 64px; top: 188px; width: 1152px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="{{r.st}}">
        <div style="display: flex; flex-direction: column; gap: 7px">
          <span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
          <div style="display: flex; align-items: center; gap: 5px">
            <span style="font-size: 11.5px; color: #8a91a0; margin-right: 3px">중요도</span>
            <sc-for list="{{r.dots}}" as="d" hint-placeholder-count="3">
              <span style="{{d}}"></span>
            </sc-for>
          </div>
        </div>
        <div style="position: relative; height: 86px">
          <div style="{{r.sBar}}"></div>
          <span style="{{r.sLab}}">{{r.s}}</span>
          <div style="{{r.cBar}}"></div>
          <span style="{{r.cLab}}">{{r.c}}</span>
          <div style="{{r.thr}}"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px">
          <span style="height: 26px; padding: 0 11px 0 8px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>충족</span>
          <span style="font-size: 12.5px; color: #8a91a0">{{r.comp}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 628px; font-size: 11.5px; color: #8a91a0">점수는 예시 · 평가 기준: [기준] · 데이터 연결 시 자동 반영</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 24</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 막대 영역: x 368–992 (폭 624), 행 5개 × 86 (y 188–618)
    const X0 = 368, W = 624, TOP = 188, ROW = 86, NROW = 5;
    // [요구사항, 중요도(1–3), Samsung 점수, 경쟁사 평균, 요구 수준] — 길이는 예시 (0–1)
    const R = [
      ['전 매장 원격 콘텐츠 배포', 3, 0.92, 0.62, 0.75],
      ['24시간 연속 운영', 3, 0.88, 0.70, 0.80],
      ['키오스크 · 메뉴보드 통합 관리', 2, 0.90, 0.48, 0.70],
      ['에너지 사용 관리', 2, 0.84, 0.44, 0.65],
      ['전국 설치 · 유지보수', 3, 0.86, 0.66, 0.75]
    ];
    const dot = (on) => 'width: 9px; height: 9px; border-radius: 50%; background: ' + (on ? '#1428a0' : '#d5d9e0');
    const px = (f) => Math.round(W * f);
    const ticks = [0, 0.5, 1].map((f, i) => {
      const x = X0 + px(f) - (i === 2 ? 1 : 0);
      return {
        label: i === 2 ? '100%' : String(f * 100),
        st: 'position: absolute; left: ' + (x - 30) + 'px; top: 165px; width: 60px; text-align: center; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #8a91a0',
        line: 'position: absolute; left: ' + x + 'px; top: ' + TOP + 'px; width: 1px; height: ' + (ROW * NROW) + 'px; background: ' + (i === 0 ? '#b8bec8' : '#e2e5ea')
      };
    });
    const base = 'height: ' + ROW + 'px; box-sizing: border-box; display: grid; grid-template-columns: 280px ' + W + 'px minmax(0, 1fr); column-gap: 24px; align-items: center; border-top: 1px solid #e2e5ea;';
    const rows = R.map(([name, imp, s, c, t], i) => ({
      name,
      dots: [1, 2, 3].map((k) => dot(k <= imp)),
      s: '[00]', c: '[00]',
      comp: '경쟁사 [0]곳 중 [0]곳',
      sBar: 'position: absolute; left: 0; top: 24px; width: ' + px(s) + 'px; height: 16px; border-radius: 0 4px 4px 0; background: #1428a0',
      sLab: 'position: absolute; left: ' + (px(s) + 8) + 'px; top: 22px; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: #1428a0',
      cBar: 'position: absolute; left: 0; top: 50px; width: ' + px(c) + 'px; height: 10px; border-radius: 0 3px 3px 0; background: #b8bec8',
      cLab: 'position: absolute; left: ' + (px(c) + 8) + 'px; top: 46px; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #8a91a0',
      thr: 'position: absolute; left: ' + (px(t) - 1) + 'px; top: 16px; width: 2px; height: 52px; background: #121417',
      st: base + (i === R.length - 1 ? ' border-bottom: 1px solid #e2e5ea;' : '')
    }));
    return { ticks, rows };
  }
}
</script>
</body>
</html>
