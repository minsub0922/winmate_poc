<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SA-C 레이어 스택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">05 · 솔루션 제안</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">기기부터 운영 서비스까지, 네 개 층으로 구성합니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">제안 범위 · 층마다 무엇을, 누가 제공하는가</div>

  <!-- 4개 층 (위 → 아래: 운영 서비스 / 솔루션 / 플랫폼 / 디바이스) -->
  <div style="position: absolute; left: 64px; top: 164px; width: 1032px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{layers}}" as="l" hint-placeholder-count="4">
      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; border: 1px solid #e2e5ea; overflow: hidden; display: flex">
        <div style="width: 200px; flex-shrink: 0; box-sizing: border-box; background: #eaeefb; padding: 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
          <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; color: #1428a0">{{l.no}}</span><span style="font-size: 17px; font-weight: 800; color: #121417">{{l.name}}</span></div>
          <span style="font-size: 12.5px; color: #596170">{{l.role}}</span>
        </div>
        <div style="flex-grow: 1; padding: 0 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{l.chips}}" as="c" hint-placeholder-count="4">
            <span style="{{c.style}}"><span style="{{c.labelStyle}}">{{c.label}}</span><span style="{{c.subStyle}}">{{c.sub}}</span></span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 삼성 제공 범위 브래킷 -->
  <div style="position: absolute; left: 1112px; top: 164px; width: 16px; height: 436px; box-sizing: border-box; border-top: 2px solid #1428a0; border-right: 2px solid #1428a0; border-bottom: 2px solid #1428a0; border-radius: 0 10px 10px 0"></div>
  <div style="position: absolute; left: 1128px; top: 381px; width: 10px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 1146px; top: 344px; width: 70px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 15px; font-weight: 800; line-height: 1.35; color: #1428a0">삼성</span>
    <span style="font-size: 15px; font-weight: 800; line-height: 1.35; color: #1428a0">제공 범위</span>
    <span style="margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: #596170">파트너 포함 단일 창구</span>
  </div>

  <!-- 범례 -->
  <div style="position: absolute; left: 64px; top: 616px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #596170">
    <span style="width: 30px; height: 16px; box-sizing: border-box; border-radius: 999px; border: 1px solid #b8bec8"></span><span>실선 = 삼성 제공</span>
    <span style="width: 30px; height: 16px; margin-left: 14px; box-sizing: border-box; border-radius: 999px; border: 1.5px dashed #8a91a0"></span><span>점선 = 파트너 제공</span>
    <span style="width: 12px; height: 12px; margin-left: 14px; border-radius: 50%; background: #1428a0"></span><span>MagicINFO</span>
    <span style="width: 12px; height: 12px; margin-left: 6px; border-radius: 50%; background: #121417"></span><span>SmartThings Pro</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 19</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 7px; white-space: nowrap; ';
    // [칩 스타일, 이름 색, 보조 색] · sam = 삼성 제공, ptn = 파트너 제공(점선), mi / stp = 솔루션 채움 구분
    const V = {
      sam: [base + 'background: #ffffff; border: 1px solid #b8bec8;', '#121417', '#596170'],
      ptn: [base + 'background: #ffffff; border: 1.5px dashed #8a91a0;', '#596170', '#8a91a0'],
      mi: [base + 'background: #1428a0; border: 1px solid #1428a0;', '#ffffff', '#c8d3ff'],
      stp: [base + 'background: #121417; border: 1px solid #121417;', '#ffffff', '#b8bec8']
    };
    const chip = (label, sub, v, latin) => ({
      label, sub, style: V[v][0],
      labelStyle: 'font-size: 14px; font-weight: 800; color: ' + V[v][1] + ';' + (latin ? ' font-family: Manrope, sans-serif;' : ''),
      subStyle: 'font-size: 12px; color: ' + V[v][2] + ';'
    });
    return { layers: [
      { no: 'L4', name: '운영 서비스', role: '설치부터 운영까지 지원', chips: [
        chip('설치', '매장당 [0]일', 'ptn'),
        chip('원격 모니터링', '24/7', 'sam'),
        chip('유지보수', '[0]년', 'sam'),
        chip('콘텐츠 제작 지원', '시즌 템플릿', 'ptn')
      ] },
      { no: 'L3', name: '솔루션', role: '화면 · 전력을 제어', chips: [
        chip('MagicINFO', '콘텐츠 · 원격 관리', 'mi', true),
        chip('SmartThings Pro', '에너지 · 기기 제어', 'stp', true),
        chip('POS 연동', '주문 · 품절 정보', 'ptn')
      ] },
      { no: 'L2', name: '플랫폼', role: '기기를 움직이는 기반', chips: [
        chip('Tizen', '기기 내장 OS', 'sam', true),
        chip('클라우드', '서버 구축 불필요', 'sam')
      ] },
      { no: 'L1', name: '디바이스', role: '매장에 설치되는 화면', chips: [
        chip('QM55C', '카운터', 'sam', true),
        chip('QM65C', '대기 공간', 'sam', true),
        chip('QM43C', '픽업대', 'sam', true),
        chip('OH55C', '매장 외부', 'sam', true),
        chip('KM24C', '키오스크', 'sam', true)
      ] }
    ] };
  }
}
</script>
</body>
</html>
