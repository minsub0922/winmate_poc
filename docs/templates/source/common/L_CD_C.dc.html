<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CD-C 성과 수치 + 고객 코멘트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">D 카페 브랜드 — 도입 6개월 성과</div>

  <!-- 성과 수치 7열 -->
  <div style="position: absolute; left: 64px; top: 136px; width: 662px; display: flex; flex-direction: column">
    <sc-for list="{{nums}}" as="n" hint-placeholder-count="3">
      <div style="{{n.st}}">
        <span style="width: 236px; flex-shrink: 0; font-family: Manrope, sans-serif; font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #1428a0">{{n.n}}</span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 20px; font-weight: 800; line-height: 1.4">{{n.l}}</span>
          <span style="font-size: 14.5px; line-height: 1.6; color: #596170">{{n.d}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 628px; font-size: 11.5px; color: #8a91a0">출처 · 삼성 B2B 사례 [링크] · 수치는 고객 공개 범위 내</div>

  <!-- 사례 메타 5열 -->
  <div style="position: absolute; left: 750px; top: 136px; width: 466px; height: 220px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #e2e5ea">
      <span style="width: 96px; height: 36px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 4px; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8a91a0">고객 로고</span>
      <span style="font-size: 19px; font-weight: 800">D 카페 브랜드</span>
    </div>
    <div style="display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; row-gap: 12px; font-size: 13.5px">
      <span style="color: #596170">업종 · 매장</span>
      <span style="font-weight: 700">카페 · 국내 [000]개 매장</span>
      <span style="color: #596170">도입 제품</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{prods}}" as="p" hint-placeholder-count="3">
          <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{p}}</span>
        </sc-for>
      </div>
      <span style="color: #596170">도입 기간</span>
      <span style="font-weight: 700"><span style="font-family: Manrope, sans-serif">[0000].[00] – [0000].[00]</span> · 6개월</span>
    </div>
  </div>

  <!-- 고객 코멘트 -->
  <div style="position: absolute; left: 750px; top: 372px; width: 466px; height: 276px; box-sizing: border-box; border-radius: 16px; background: #ffffff; border: 1px solid #e2e5ea; padding: 22px 28px 24px 28px; display: flex; flex-direction: column">
    <span style="font-family: Manrope, sans-serif; font-size: 64px; font-weight: 800; line-height: 0.9; height: 48px; color: #1428a0">“</span>
    <span style="margin-top: 12px; font-size: 22px; font-weight: 700; line-height: 1.55">[공개 동의된 고객 코멘트]</span>
    <span style="margin-top: 6px; font-size: 16px; line-height: 1.6; color: #3d4452">[이어지는 코멘트 · 고객 동의 범위 내 인용]</span>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 13.5px; font-weight: 600; color: #596170">— [직함], D 카페 브랜드</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 22</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const N = [
      ['[00]%', '추가 주문(업셀) 비율 증가', '메뉴보드 추천 세트 노출 이후 · 도입 전 6개월 대비'],
      ['[0]분', '신메뉴 전 매장 반영 시간', '도입 전 [00]일 걸리던 교체를 본사에서 한 번에 배포'],
      ['[00]%', '메뉴 운영 비용 절감', '인쇄 · 배송 · 매장 교체 작업을 합친 연간 비용 기준']
    ];
    const row = 'height: 160px; box-sizing: border-box; display: flex; align-items: center; gap: 28px;';
    return {
      nums: N.map(([n, l, d], i) => ({ n, l, d, st: row + (i === 0 ? '' : ' border-top: 1px solid #e2e5ea;') })),
      prods: ['QM55C', 'QM43C', 'MagicINFO']
    };
  }
}
</script>
</body>
</html>
