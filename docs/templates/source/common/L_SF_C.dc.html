<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SF-C 솔루션 KV 히어로 + 함께 쓰는 기기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <!-- 솔루션 KV (오른쪽 전면) -->
  <div style="position: absolute; left: 700px; top: 0px; width: 580px; height: 720px">
    <dc-import name="Img" pid="ui.mi.kv" w="580" h="720" fit="cover" pos="50% 50%" credit="br" hint-size="580px,720px"></dc-import>
  </div>
  <div style="position: absolute; left: 728px; top: 572px; box-sizing: border-box; border-radius: 14px; background: rgba(18,20,23,0.78); color: #ffffff; padding: 14px 22px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #9db4ff">이번 제안 적용 범위</span>
    <div style="display: flex; align-items: flex-end; gap: 28px">
      <sc-for list="{{scope}}" as="c" hint-placeholder-count="3">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: Manrope, sans-serif; font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.01em">{{c.n}}</span><span style="font-size: 12px; color: #d5d9e0; white-space: nowrap">{{c.l}}</span></span>
      </sc-for>
    </div>
  </div>

  <!-- 왼쪽: 솔루션 소개 -->
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">05 · 솔루션 제안</div>
  <div style="position: absolute; left: 64px; top: 74px; display: flex; align-items: center; gap: 14px">
    <span style="font-family: Manrope, sans-serif; font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">MagicINFO</span>
    <span style="height: 26px; padding: 0 11px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">사이니지 통합 관리 솔루션</span>
  </div>
  <div style="position: absolute; left: 64px; top: 142px; width: 588px; font-size: 22px; font-weight: 700; line-height: 1.45; letter-spacing: -0.01em">본사에서 만든 화면이<br>320개 매장에 같은 시각에 켜집니다</div>

  <!-- 가치 3행 -->
  <div style="position: absolute; left: 64px; top: 236px; width: 588px; display: flex; flex-direction: column; gap: 20px">
    <sc-for list="{{values}}" as="v" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #eaeefb; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{v.isSend}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg></sc-if>
          <sc-if value="{{v.isMonitor}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v12H3z"></path><path d="M8 20h8"></path><path d="M12 16v4"></path><path d="M9 10l2 2 4-4"></path></svg></sc-if>
          <sc-if value="{{v.isData}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg></sc-if>
        </span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; font-weight: 800; line-height: 1.35">{{v.title}}</span>
          <span style="font-size: 13.5px; line-height: 1.5; color: #596170; white-space: nowrap">{{v.desc}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 함께 쓰는 기기 -->
  <div style="position: absolute; left: 64px; top: 446px; width: 588px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 462px; width: 588px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #1428a0">함께 쓰는 기기</span>
    <span style="font-size: 12px; color: #8a91a0">A 커피 표준 매장 구성 · 모두 MagicINFO로 관리</span>
  </div>
  <div style="position: absolute; left: 64px; top: 494px; width: 588px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="width: 180px; height: 124px">
          <dc-import name="Img" pid="{{d.pid}}" w="180" h="124" bg="soft" radius="10" hint-size="180px,124px"></dc-import>
        </div>
        <span style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800">{{d.model}}</span><span style="font-size: 12px; color: #596170">{{d.role}}</span></span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 588px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 · 매장 디지털 전환 제안 · 이미지 samsung.com 공식</span></div>
  <div style="position: absolute; right: 628px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 18</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 왼쪽: 솔루션이 주는 가치 3 + 함께 쓰는 기기(제품 컷). 오른쪽: 솔루션 KV 전면.
    // 아이콘: send(배포) · monitor(상태 확인) · data(데이터 연동)
    const values = [
      ['send', '콘텐츠 일괄 배포', '메뉴 · 프로모션을 매장별 스케줄로 한 번에 내려보냅니다'],
      ['monitor', '기기 상태 원격 확인', '꺼짐 · 미수신 화면을 대시보드에서 찾고 원격으로 재시작합니다'],
      ['data', 'POS 데이터 연동', '가격 · 품절 정보를 POS에서 받아 화면에 자동 반영합니다']
    ].map(([icon, title, desc]) => ({ isSend: icon === 'send', isMonitor: icon === 'monitor', isData: icon === 'data', title, desc }));
    const devices = [
      ['qm55c.front', 'QM55C', '카운터 메뉴보드'],
      ['km24c.front', 'KM24C', '셀프 주문 키오스크'],
      ['oh55a.front', 'OH55A-S', '드라이브스루 옥외']
    ].map(([pid, model, role]) => ({ pid, model, role }));
    const scope = [
      { n: '320', l: '매장' },
      { n: '[000]', l: '연결 화면' },
      { n: '1', l: '본사 운영실' }
    ];
    return { values, devices, scope };
  }
}
</script>
</body>
</html>
