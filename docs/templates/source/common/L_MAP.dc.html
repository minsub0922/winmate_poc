<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시트 · 템플릿 지도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">LAYOUT SYSTEM · MAP</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">시트 유형 30 · 템플릿 321 — 역할마다 여러 표현, 솔루션 · 업종마다 전용</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">칸 하나 = 템플릿 하나 · 솔루션 전용 11종 × 3 + 업종 21 · 업종 16개 × MI · 가치 제안 · 공간 시나리오 (MI 48 · 공간 시나리오 80장) · 공통 7종 별도</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px">
    <sc-for list="{{secs}}" as="s" hint-placeholder-count="9">
      <div style="height: 152px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; color: #1428a0">{{s.no}}</span><span style="font-size: 14px; font-weight: 800">{{s.name}}</span><span style="flex-grow: 1"></span><span style="font-size: 11px; color: #8a91a0">{{s.where}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <sc-for list="{{s.types}}" as="t" hint-placeholder-count="3">
            <div style="height: 14px; display: flex; align-items: center; gap: 8px">
              <span style="width: 26px; font-family: Manrope, sans-serif; font-size: 10.5px; font-weight: 800; color: #596170">{{t.code}}</span>
              <span style="width: 118px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
              <span style="display: flex; gap: 3px">
                <sc-for list="{{t.cells}}" as="c" hint-placeholder-count="3"><span style="width: 9px; height: 9px; border-radius: 2px; background: #1428a0"></span></sc-for>
              </span>
              <span style="font-size: 11px; color: #596170; white-space: nowrap">{{t.note}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 0</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // [번호, 섹션, 쓰는 제안서, 시트 유형: [코드, 이름, 템플릿 수, 메모]]
    const S = [
      ['01', 'Market Intelligence', '표준 · Solution형', [['MS', '시장 규모 · 성장', 5, ''], ['TR', '산업 트렌드', 3, ''], ['CB', '고객사 비즈니스', 4, ''], ['US', '사용자 분석', 3, ''], ['CP', '경쟁 환경', 3, '중립'], ['IM', 'MI 시사점', 2, ''], ['IND', '업종별 MI', 3, '× 업종 16 = 48']]],
      ['02', 'Value Props', '전 유형', [['CH', '고객 과제', 3, ''], ['VP', '가치 제안', 4, '기둥 2 · 3 · 4'], ['EF', '기대 효과', 3, ''], ['IND', '업종별 가치 제안', 3, '× 업종 16 · 제작 중']]],
      ['03', '조감도', '표준', [['BV', '공간 전경', 3, ''], ['ZP', '존별 포인트', 3, '']]],
      ['04', '공간별 제품', '표준 · 퀵윈 · 04 캔버스', [['SM', '공간 맵', 5, ''], ['P', '공간 제품 소개', 4, '× 제품 1~5 = 20'], ['PX', '공간 · 근거 표현', 9, 'P-E ~ M'], ['PX', '선택 · 사람 표현', 7, 'P-N ~ T'], ['BM', '구성 · 수량', 5, '']]],
      ['05', '솔루션 제안', '표준 · 퀵윈', [['SOL', '솔루션별 전용', 3, '× 11 = 33 + 업종 21'], ['SA', '통합 구성도', 3, '2개 이상일 때'], ['OP', '통합 운영 시나리오', 3, ''], ['SF', '솔루션 상세 (범용)', 2, '']]],
      ['03', '공간별 가치 제공 시나리오', 'Solution형', [['VM', '공간 × 솔루션 맵', 4, ''], ['SS', '공간 시나리오', 3, '공간마다'], ['IND', '업종별 시나리오', 5, '업종 16 × 5 = 80'], ['VC', '조합 · 공간 1~2곳', 10, '솔루션 1~4'], ['VC', '조합 · 3곳 이상 · 지점', 9, '+ 조합 지도']]],
      ['06', '유관 사례', '전 유형', [['CD', '사례 상세', 3, '사례마다'], ['CL', '사례 모음', 3, '']]],
      ['07', 'Why Samsung', '표준 · Solution형', [['CM', '경쟁 비교', 3, ''], ['ST', '삼성 강점', 3, ''], ['SV', '지원 체계', 2, '']]],
      ['08', '제품 스펙', '표준 · 퀵윈', [['SC', '스펙 비교', 2, '비교표 2~5개'], ['SD', '제품 상세', 2, '제품마다']]]
    ];
    const secs = S.map(([no, name, where, types]) => ({
      no, name, where,
      types: types.map(([code, tname, count, note]) => ({ code, name: tname, note, cells: Array.from({ length: count }, () => ({})) }))
    }));
    return { secs };
  }
}
</script>
</body>
</html>
