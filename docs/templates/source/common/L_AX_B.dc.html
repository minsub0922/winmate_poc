<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AX-B 현장 사진 갤러리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">부록 · 현장 사진</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">현장 사진 12장</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 860px; font-size: 15px; color: #596170; white-space: nowrap">C 종합병원 외래동 · 2026.09.[00] 촬영 · 사진 번호는 본문 각주와 같음</div>
  <div style="position: absolute; right: 64px; top: 110px; display: flex; align-items: center; gap: 6px; white-space: nowrap">
    <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 700; color: #3d4452; display: flex; align-items: center">공간 <span style="margin-left: 4px; font-family: Manrope, sans-serif; font-weight: 800">8</span></span>
    <span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 700; color: #3d4452; display: flex; align-items: center">설비 · 기존 장비 <span style="margin-left: 4px; font-family: Manrope, sans-serif; font-weight: 800">4</span></span>
  </div>

  <!-- 4 × 3 그리드 -->
  <div style="position: absolute; left: 64px; top: 150px; width: 1152px; display: grid; grid-template-columns: repeat(4, 270px); column-gap: 24px; row-gap: 14px">
    <sc-for list="{{photos}}" as="p" hint-placeholder-count="12">
      <div style="width: 270px; height: 154px; display: flex; flex-direction: column; gap: 8px">
        <div style="width: 270px; height: 120px; flex-shrink: 0">
          <dc-import name="Img" kind="space" origin="site" hint="{{p.hint}}" w="270" h="120" radius="10" credit="off" hint-size="270px,120px"></dc-import>
        </div>
        <div style="height: 18px; display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; overflow: hidden">
          <span style="font-family: Manrope, sans-serif; font-weight: 700; color: #1428a0">{{p.no}}</span>
          <span style="color: #b8bec8">·</span>
          <span style="font-weight: 700; color: #121417">{{p.place}}</span>
          <span style="color: #b8bec8">·</span>
          <span style="color: #596170">{{p.note}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>C 종합병원 · 외래동 디지털 안내 제안 · 사진 · 고객 현장 직접 촬영 · 환자 얼굴 비식별 처리 후 사용</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 31</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // [종류, 장소, 촬영 메모, 촬영 지시(hint)]
    const P = [
      ['space', '정문 로비', '북측', '정문에서 북측 로비 · 안내 데스크'],
      ['space', '원무 수납', '창구 정면', '수납 창구 정면 · 번호 표시기'],
      ['space', '외래 대기 홀', '동측', '동측 끝에서 본 대기 좌석 전체'],
      ['space', '외래 대기 홀', '서측 · 창가', '서측 창가 좌석 · 오후 역광'],
      ['space', '진료과 앞 복도', '내과 구역', '복도 끝에서 본 내과 입구 열'],
      ['space', '약제부 대기', '호출 창구', '약제부 창구 · 호출 표시기'],
      ['space', '엘리베이터 홀', '1번 홀', '문 맞은편에서 본 홀 · 층 안내판'],
      ['space', '천장 설비', '대기 홀', '대기 홀 천장 · 디퓨저와 점검구'],
      ['space', '기존 안내판', '로비 기둥', '로비 기둥 인쇄 안내판 근접'],
      ['space', '기존 TV', '대기 홀 벽', '벽걸이 TV · 브래킷과 배선'],
      ['space', '전원 · 배선', '수납 창구 뒤', '창구 뒤 벽 콘센트 · 노출 배선'],
      ['space', '외부 출입구', '응급실 방향', '외부 출입구 · 차양과 외벽']
    ];
    const photos = P.map(([kind, place, note, hint], i) => ({
      no: '사진 ' + String(i + 1).padStart(2, '0'), kind, place, note, hint
    }));
    return { photos };
  }
}
</script>
</body>
</html>
