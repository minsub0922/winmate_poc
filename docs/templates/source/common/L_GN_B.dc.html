<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GN-B 현재 ↔ 시안 와이프</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간 시안</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">같은 자리, 바뀐 카운터</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170; white-space: nowrap">A 커피 역삼점 카운터 · 왼쪽 지금 · 오른쪽 제안 시안 (같은 시점)</div>

  <!-- 와이프 프레임: 왼쪽 현장 사진 | 오른쪽 생성 시안 -->
  <div style="position: absolute; left: 64px; top: 150px; width: 1152px; height: 420px; border-radius: 16px; overflow: hidden; background: #dfe3ea">
    <div style="position: absolute; left: 0px; top: 0px; width: 576px; height: 420px">
      <dc-import name="Img" kind="space" origin="site" hint="카운터 정면 · 인쇄 메뉴판과 포스터가 보이게 · 사람 키 높이 수평" w="576" h="420" radius="0" credit="tl" hint-size="576px,420px"></dc-import>
    </div>
    <div style="position: absolute; left: 576px; top: 0px; width: 576px; height: 420px">
      <dc-import name="Img" kind="insitu" origin="gen" hint="같은 시점 · 메뉴보드 3면 · 키오스크 2대 · 세로 사이니지" w="576" h="420" radius="0" credit="tr" hint-size="576px,420px"></dc-import>
    </div>

    <!-- 라벨 칩: 분할선 양옆 -->
    <span style="position: absolute; right: 596px; top: 16px; height: 28px; padding: 0 12px; border-radius: 999px; background: #596170; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">지금</span>
    <span style="position: absolute; left: 596px; top: 16px; height: 28px; padding: 0 12px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">제안 시안</span>

    <!-- 핀: 시안 위 바뀌는 곳 -->
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="3">
      <div style="{{p.box}}">
        <span style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.no}}</span>
        <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #121417; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p.label}}</span>
      </div>
    </sc-for>

    <!-- 분할선 + 핸들 -->
    <div style="position: absolute; left: 574px; top: 0px; width: 4px; height: 420px; background: #ffffff"></div>
    <div style="position: absolute; left: 554px; top: 188px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 10px rgba(18,20,23,0.22); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5"/><path d="M15 7l5 5-5 5"/></svg></div>
  </div>

  <!-- 바뀌는 것 3 -->
  <div style="position: absolute; left: 64px; top: 590px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px">
    <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.4; white-space: nowrap"><span style="color: #8a91a0">{{c.from}}</span><span style="color: #8a91a0"> → </span><span style="color: #1428a0">{{c.to}}</span></span>
          <span style="font-size: 12.5px; line-height: 1.5; color: #3d4452; word-break: keep-all">{{c.desc}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 · 매장 디지털 전환 제안 · 왼쪽 고객 현장 사진(2026.09.[00]) · 오른쪽 AI 생성 시안 — 제품 크기는 실측 비례, 실제 시공과 다를 수 있음</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 13</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 핀 좌표는 와이프 프레임(1152×420) 기준, 오른쪽 반(x 576~1152)의 시안 위. 시안 이미지가 바뀌면 제품 위치에 맞춰 조정
    const C = [
      ['인쇄 메뉴판', 'QM55C ×3', '카운터 위 3면 · 시간대별 메뉴 · 가격을 본사에서 변경', '메뉴보드 3면', 652, 74],
      ['카운터 주문 1줄', 'KM24C ×2', '카운터 옆 셀프 주문 · 피크 시간 주문 줄을 둘로', '키오스크 2대', 640, 318],
      ['벽 포스터', '세로 사이니지 ×1', '픽업대 옆 세로 화면 · 신메뉴와 주문 번호 호출', '세로 사이니지', 960, 318]
    ];
    const changes = C.map(([from, to, desc], i) => ({ no: i + 1, from, to, desc }));
    const pins = C.map(([, , , label, x, y], i) => ({
      no: i + 1, label,
      box: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; display: flex; align-items: center; gap: 6px'
    }));
    return { changes, pins };
  }
}
</script>
</body>
</html>
