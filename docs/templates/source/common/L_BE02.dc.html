<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BE02 존별 포인트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 조감도</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">공간의 특징을 살린 네 개의 포인트</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">존별 포인트 · 번호는 조감도 위 위치</div>

  <div style="position: absolute; left: 64px; top: 176px; width: 760px; height: 472px; border-radius: 12px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8a91a0">조감도 이미지</div>
  <span style="position: absolute; left: 150px; top: 230px; width: 34px; height: 34px; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: border-box; font-family: Manrope, sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">1</span>
  <span style="position: absolute; left: 380px; top: 360px; width: 34px; height: 34px; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: border-box; font-family: Manrope, sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">2</span>
  <span style="position: absolute; left: 560px; top: 540px; width: 34px; height: 34px; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: border-box; font-family: Manrope, sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">3</span>
  <span style="position: absolute; left: 720px; top: 290px; width: 34px; height: 34px; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: border-box; font-family: Manrope, sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">4</span>

  <div style="position: absolute; left: 848px; top: 176px; width: 368px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{pts}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #e2e5ea">
        <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 700">{{p.title}}</span><span style="font-size: 13.5px; line-height: 1.55; color: #596170">{{p.desc}}</span></div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 12</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['창면 고휘도 사이니지', '전면 유리창으로 외부 시선을 끄는 OH55C 3연'],
      ['기둥 랩핑 디스플레이', '중앙 기둥 2개를 브랜드 스토리 포인트로'],
      ['The Wall 관람 존', '후면 벽 146" 대화면 앞 관람 벤치 3열'],
      ['체험 · 상담 카운터', '측벽 Flip Pro로 메뉴 · 원두 정보 체험']
    ];
    return { pts: P.map(([title, desc], i) => ({ no: i + 1, title, desc })) };
  }
}
</script>
</body>
</html>
