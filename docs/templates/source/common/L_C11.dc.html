<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C11 간지 C · 풀블리드 사진 + 밴드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #121417; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <!-- 전면 사진 -->
  <div style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px">
    <dc-import name="Img" pid="life.ac360.store" w="1280" h="720" pos="50% 18%" credit="tr" hint-size="1280px,720px"></dc-import>
  </div>

  <!-- 왼쪽 위 고객사 로고 -->
  <div style="position: absolute; left: 64px; top: 44px; width: 88px; height: 26px; box-sizing: border-box; border: 1px dashed #8a91a0; border-radius: 4px; background: rgba(255,255,255,0.86); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #596170">고객사 로고</div>

  <!-- 아래 밴드 -->
  <div style="position: absolute; left: 0px; top: 500px; width: 1280px; height: 220px; background: rgba(18,20,23,0.82)"></div>
  <div style="position: absolute; left: 64px; top: 546px; font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.02em; color: #9db4ff">03 / 07</div>
  <div style="position: absolute; left: 64px; top: 574px; width: 700px; font-size: 44px; font-weight: 800; line-height: 1.2; letter-spacing: -0.03em; color: #ffffff; white-space: nowrap">공간별 제품</div>
  <div style="position: absolute; left: 64px; top: 636px; width: 700px; font-size: 16px; line-height: 1.5; color: #d5d9e0; white-space: nowrap">매장의 공간마다 어떤 제품이 어디에, 몇 대 놓이는지 보여드립니다.</div>

  <!-- 이 장의 시트 -->
  <div style="position: absolute; left: 820px; top: 548px; width: 396px; display: flex; flex-direction: column">
    <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; color: #9db4ff; padding-bottom: 8px">이 장에서 다루는 것</span>
    <sc-for list="{{sheets}}" as="s" hint-placeholder-count="3">
      <div style="{{s.st}}">
        <span style="display: flex; align-items: center; gap: 10px"><span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; color: #9db4ff">{{s.no}}</span><span style="font-size: 15px; font-weight: 700; color: #ffffff; white-space: nowrap">{{s.name}}</span></span>
        <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700; color: #b8bec8">{{s.page}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; right: 64px; top: 692px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 10</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 이 장의 시트 3개 — [이름, 페이지]
    const S = [
      ['매장 공간 맵', '11'],
      ['카운터 · 메뉴보드', '12'],
      ['천장 공조 · 360 카세트', '13']
    ];
    const line = 'display: flex; align-items: center; justify-content: space-between; height: 34px; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.18);';
    const sheets = S.map(([name, page], i) => ({
      no: String(i + 1).padStart(2, '0'), name, page,
      st: line + (i === S.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.18);' : '')
    }));
    return { sheets };
  }
}
</script>
</body>
</html>
