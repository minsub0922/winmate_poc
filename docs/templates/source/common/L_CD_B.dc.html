<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CD-B 도입 전 → 후 사진</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">06 · 유관 사례</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">C 버거 브랜드 — 같은 카운터, 달라진 주문 경험</div>

  <!-- 사례 메타 -->
  <div style="position: absolute; left: 64px; top: 114px; display: flex; align-items: center; gap: 6px">
    <sc-for list="{{meta}}" as="m" hint-placeholder-count="3">
      <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{m}}</span>
    </sc-for>
  </div>
  <div style="position: absolute; right: 64px; top: 119px; font-size: 11.5px; color: #8a91a0">출처 · 삼성 B2B 사례 [링크] · 수치는 고객 공개 범위 내</div>

  <!-- 도입 전 -->
  <div style="position: absolute; left: 64px; top: 160px; width: 564px; height: 330px; border-radius: 16px; background: #cfd4dc; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #596170">
    도입 전 · 매장 카운터 이미지
    <span style="position: absolute; left: 18px; top: 18px; height: 28px; padding: 0 12px; border-radius: 999px; background: #596170; color: #ffffff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center">도입 전</span>
  </div>
  <!-- 도입 후 -->
  <div style="position: absolute; left: 652px; top: 160px; width: 564px; height: 330px; border-radius: 16px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8a91a0">
    도입 후 · 같은 카운터 이미지
    <span style="position: absolute; left: 18px; top: 18px; height: 28px; padding: 0 12px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center">도입 후</span>
  </div>
  <!-- 전환 화살표 -->
  <div style="position: absolute; left: 612px; top: 297px; width: 56px; height: 56px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 5px solid #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14 M13 6l6 6-6 6"/></svg></div>

  <!-- 전후 설명 -->
  <div style="position: absolute; left: 64px; top: 504px; width: 564px; font-size: 14px; line-height: 1.55; color: #3d4452"><span style="font-weight: 800; color: #121417">{{before.k}}</span> · {{before.v}}</div>
  <div style="position: absolute; left: 652px; top: 504px; width: 564px; font-size: 14px; line-height: 1.55; color: #3d4452"><span style="font-weight: 800; color: #1428a0">{{after.k}}</span> · {{after.v}}</div>

  <!-- 성과 KPI -->
  <div style="position: absolute; left: 64px; top: 540px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 556px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
      <div style="{{k.st}}">
        <span style="font-family: Manrope, sans-serif; font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #1428a0">{{k.n}}</span>
        <span style="font-size: 14.5px; font-weight: 700; line-height: 1.5">{{k.l}}</span>
        <span style="font-size: 12.5px; line-height: 1.5; color: #8a91a0">{{k.d}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 22</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const K = [
      ['[00]%', '주문 대기 시간 단축', '점심 피크 기준 · 도입 전 대비'],
      ['[00]%', '객단가 상승', '키오스크 추천 메뉴 노출 효과'],
      ['[00]%', '피크 시간 주문 처리량 증가', '카운터 + 키오스크 동시 주문']
    ];
    const base = 'display: flex; flex-direction: column; gap: 5px; height: 88px; box-sizing: border-box;';
    return {
      meta: ['퀵서비스 · 90개 매장', 'KM24C · QM55C', '2024 도입'],
      before: { k: '인쇄 메뉴판 + 카운터 주문', v: '주문은 한 줄, 피크마다 긴 대기' },
      after: { k: 'KM24C 셀프 주문 + QM55C 메뉴보드', v: '주문 동선 분산, 메뉴 즉시 변경' },
      kpis: K.map(([n, l, d], i) => ({
        n, l, d,
        st: base + (i === 0 ? ' padding-right: 24px;' : ' padding: 0 24px; border-left: 1px solid #e2e5ea;')
      }))
    };
  }
}
</script>
</body>
</html>
