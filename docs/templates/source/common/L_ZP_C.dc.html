<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ZP-C 고객 동선 따라가기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 조감도</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">손님의 발걸음을 따라 — 입구에서 픽업까지</div>

  <!-- 평면 + 동선 -->
  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; height: 300px; border-radius: 16px; background: #dfe3ea"></div>
  <span style="position: absolute; left: 64px; top: 404px; width: 1152px; text-align: center; font-size: 13px; color: #8a91a0">매장 평면 · 조감도</span>
  <sc-for list="{{pts}}" as="p" hint-placeholder-count="4">
    <div style="{{p.drop}}"></div>
  </sc-for>
  <svg style="position: absolute; left: 64px; top: 136px" width="1152" height="300" viewBox="0 0 1152 300" fill="none">
    <polyline points="135,220 282,220 282,160 429,160 576,160 576,84 723,84 870,84 870,176 1017,176" stroke="#1428a0" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="204,214 214,220 204,226" fill="#1428a0"/>
    <polygon points="498,154 508,160 498,166" fill="#1428a0"/>
    <polygon points="792,78 802,84 792,90" fill="#1428a0"/>
    <polygon points="938,170 948,176 938,182" fill="#1428a0"/>
  </svg>
  <sc-for list="{{pts}}" as="p" hint-placeholder-count="4">
    <span style="{{p.dot}}">{{p.no}}</span>
  </sc-for>

  <!-- 단계 카드: 중심이 동선 위 점과 정렬 (3열 × 4) -->
  <div style="position: absolute; left: 64px; top: 460px; width: 1152px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="height: 188px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.no}}</span>
          <span style="font-size: 18px; font-weight: 800">{{s.place}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: #596170">보는 화면</span>
          <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="{{s.icon}}"></span><span style="font-family: Manrope, sans-serif; font-weight: 800">{{s.prod}}</span></span>
        </div>
        <span style="font-size: 14px; line-height: 1.55; color: #3d4452">{{s.line}}</span>
      </div>
    </sc-for>
  </div>
  <sc-for list="{{chevs}}" as="c" hint-placeholder-count="3">
    <span style="{{c}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8bec8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 14</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 동선 위 점: x = 아래 카드 중심 (64 + 135 + 294 × i), y = 평면 위 샘플 위치
    const IMG_TOP = 136, CARD_TOP = 460;
    const Y = [220, 160, 84, 176];
    const pts = Y.map((y, i) => {
      const cx = 64 + 135 + 294 * i, cy = IMG_TOP + y;
      return {
        no: i + 1,
        dot: 'position: absolute; left: ' + (cx - 15) + 'px; top: ' + (cy - 15) + 'px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center',
        drop: 'position: absolute; left: ' + cx + 'px; top: ' + (cy + 15) + 'px; width: 1px; height: ' + (CARD_TOP - cy - 15) + 'px; background: #6f82d6'
      };
    });
    const land = 'width: 14px; height: 9px; box-sizing: border-box; border-radius: 1.5px; background: #1f232a; border: 1.5px solid #121417';
    const port = 'width: 8px; height: 13px; box-sizing: border-box; border-radius: 1.5px; background: #1f232a; border: 1.5px solid #121417';
    const steps = [
      { place: '매장 외부', prod: 'OH55C', icon: land, line: '지나가며 오늘의 메뉴와 대기 시간을 확인' },
      { place: '입구', prod: 'KM24C', icon: port, line: '줄 서지 않고 키오스크에서 바로 주문' },
      { place: '카운터', prod: 'QM55C ×3', icon: land, line: '한눈에 읽히는 메뉴판에서 추가 메뉴 선택' },
      { place: '픽업대', prod: 'QM43C', icon: land, line: '화면에 뜬 주문 번호를 보고 바로 픽업' }
    ].map((s, i) => Object.assign({ no: i + 1 }, s));
    // 카드 사이 거터 중앙의 진행 화살표
    const chevs = [0, 1, 2].map((i) => 'position: absolute; left: ' + (64 + 270 + 12 - 8 + 294 * i) + 'px; top: 546px; width: 16px; height: 16px; display: flex');
    return { pts, steps, chevs };
  }
}
</script>
</body>
</html>
