<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SC-B 요구사항 대응표</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">08 · 제품 스펙</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">요구사항마다 확인한 제안 제품 사양</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">RFP 요구사항 항목별 · 제안 제품 사양 1:1 대응</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 1152px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 262px 196px 318px 170px minmax(0, 1fr); column-gap: 16px; height: 44px; align-items: center; border-bottom: 2px solid #121417; font-size: 13px; color: #596170">
      <span style="padding-left: 4px">요구사항</span><span>기준</span><span>제안 제품 · 사양</span><span>충족</span><span>근거</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 262px 196px 318px 170px minmax(0, 1fr); column-gap: 16px; height: 62px; align-items: center; border-bottom: 1px solid #e2e5ea">
        <div style="display: flex; align-items: center; gap: 12px; padding-left: 4px">
          <span style="width: 34px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.id}}</span>
          <span style="font-size: 15px; font-weight: 700">{{r.req}}</span>
        </div>
        <span style="font-size: 14px; color: #3d4452">{{r.std}}</span>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 30px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="{{r.glyph}}"></span></span>
          <span style="font-family: Manrope, sans-serif; font-size: 14.5px; font-weight: 800">{{r.model}}</span>
          <span style="font-size: 14px; font-weight: 700; color: #1428a0">{{r.spec}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          <span style="{{r.fitSt}}">{{r.fit}}</span>
        </div>
        <span style="font-size: 12.5px; color: #8a91a0">{{r.src}}</span>
      </div>
    </sc-for>
  </div>

  <!-- 충족 현황 -->
  <div style="position: absolute; left: 64px; top: 594px; width: 1152px; height: 46px; box-sizing: border-box; border-radius: 10px; background: #f5f6f8; padding: 0 20px; display: flex; align-items: center; gap: 16px">
    <span style="font-size: 13px; font-weight: 800; color: #596170">충족 현황</span>
    <div style="display: flex; gap: 4px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="6">
        <span style="{{s}}"></span>
      </sc-for>
    </div>
    <span style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; color: #1428a0">{{met}}</span>
    <span style="font-size: 13px; color: #596170">충족 · 기준 초과 <span style="font-family: Manrope, sans-serif; font-weight: 800; color: #121417">{{over}}</span>건</span>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 11.5px; color: #8a91a0">근거 페이지는 제조사 스펙 시트 기준 · 최종 제안서에 첨부</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 27</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const GLYPH = {
      land: 'display: block; width: 30px; height: 18px; box-sizing: border-box; border-radius: 2px; background: #1f232a; border: 2.5px solid #121417',
      port: 'display: block; width: 14px; height: 24px; box-sizing: border-box; border-radius: 2px; background: #1f232a; border: 2.5px solid #121417',
      sw: 'display: block; width: 22px; height: 22px; box-sizing: border-box; border-radius: 6px; background: #eaeefb; border: 2px solid #1428a0'
    };
    // [요구사항, 기준, 형태, 제품 · 솔루션, 사양, 초과 여부, 근거]
    const R = [
      ['외부 시인성', '2,500 nit 이상', 'land', 'OH55C', '3,000 nit', true, '스펙 시트 p.[0]'],
      ['24시간 운영', '24시간 연속 구동', 'land', 'QM55C', '24/7 운영 설계', false, '스펙 시트 p.[0]'],
      ['원격 콘텐츠 관리', '전 매장 일괄 배포', 'sw', 'MagicINFO', '원격 배포 · 예약', false, '솔루션 가이드 p.[0]'],
      ['방진 · 방수', 'IP55 이상', 'land', 'OH55C', 'IP56', true, '스펙 시트 p.[0]'],
      ['셀프 주문', '세로형 터치 주문', 'port', 'KM24C', '정전식 터치', false, '스펙 시트 p.[0]'],
      ['에너지 관리', '매장별 전력 모니터링', 'sw', 'SmartThings Pro', '전력 리포트 · 제어', false, '솔루션 가이드 p.[0]']
    ];
    const chip = 'height: 24px; padding: 0 10px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 800; display: flex; align-items: center';
    const plain = 'font-size: 13.5px; font-weight: 700; color: #3d4452';
    const rows = R.map(([req, std, g, model, spec, over, src], i) => ({
      id: 'R' + (i + 1), req, std, model, spec, src,
      glyph: GLYPH[g],
      fit: over ? '초과' : '충족',
      fitSt: over ? chip : plain
    }));
    const overN = R.filter((r) => r[5]).length;
    return {
      rows,
      segs: R.map(() => 'width: 28px; height: 10px; border-radius: 3px; background: #1428a0'),
      met: R.length + ' / ' + R.length,
      over: String(overN)
    };
  }
}
</script>
</body>
</html>
