<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C04 목차</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 64px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">CONTENTS</div>
  <div style="position: absolute; left: 64px; top: 90px; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">목차</div>
  <div style="position: absolute; left: 64px; top: 150px; width: 320px; font-size: 15px; line-height: 1.6; color: #596170">표준 제안서 · 8개 섹션<br>A 커피 프랜차이즈 디지털 메뉴보드 전환</div>
  <div style="position: absolute; left: 480px; top: 64px; width: 736px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 24px; height: 64px; border-bottom: 1px solid #e2e5ea">
        <span style="width: 44px; font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; color: #1428a0">{{r.no}}</span>
        <span style="flex-grow: 1; font-size: 20px; font-weight: 700">{{r.name}}</span>
        <span style="font-size: 13px; color: #8a91a0">{{r.desc}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 2</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [['Market Intelligence', '시장 · 고객사 · 경쟁'], ['Value Props', '고객 과제와 가치 제안'], ['조감도', '공간 전경 · 존별 포인트'], ['공간별 제품', '공간마다 놓이는 제품'], ['솔루션 제안', '구성도 · 운영 시나리오'], ['유관 사례', '비슷한 고객의 도입 성과'], ['Why Samsung', '경쟁 대비 강점'], ['제품 스펙', '제안 모델 상세']];
    return { rows: S.map(([name, desc], i) => ({ no: String(i + 1).padStart(2, '0'), name, desc })) };
  }
}
</script>
</body>
</html>
