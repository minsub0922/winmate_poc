<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VM-C 조감도 위 솔루션 핀</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">매장 어디에서, 어떤 솔루션이 일하는가</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">공간 × 솔루션 전체 맵 · 조감도 위 솔루션 위치</div>

  <!-- 조감도 (8열) -->
  <div style="position: absolute; left: 64px; top: 160px; width: 760px; height: 488px; border-radius: 16px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8a91a0">매장 조감도 이미지</div>

  <!-- 핀 + 공간 태그 -->
  <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
    <div style="position: absolute; left: 0; top: 0">
      <div style="position: absolute; {{p.pos}} width: 36px; height: 36px; border-radius: 50%; border: 3px solid #ffffff; background: {{p.fill}}; color: #ffffff; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.letter}}</div>
      <div style="position: absolute; {{p.tagPos}} height: 26px; padding: 0 10px; border-radius: 8px; background: #ffffff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{p.space}}</div>
    </div>
  </sc-for>

  <!-- 범례 (4열) -->
  <div style="position: absolute; left: 848px; top: 160px; width: 368px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span><span style="font-size: 14px; font-weight: 800">MagicINFO</span><span style="font-size: 12.5px; color: #596170">콘텐츠 · 원격 관리</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #121417; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">S</span><span style="font-size: 14px; font-weight: 800">SmartThings Pro</span><span style="font-size: 12.5px; color: #596170">에너지 · 기기 제어</span></div>
  </div>

  <!-- 핀 목록 -->
  <div style="position: absolute; left: 848px; top: 270px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.04em; color: #596170">핀 5곳 · 솔루션이 하는 일</div>
  <div style="position: absolute; left: 848px; top: 296px; width: 368px; display: flex; flex-direction: column">
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
      <div style="height: 68px; box-sizing: border-box; border-top: 1px solid #e2e5ea; display: flex; align-items: center; gap: 12px">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: {{p.fill}}; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.letter}}</span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 15px; font-weight: 800">{{p.space}}</span><span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #8a91a0">{{p.dev}}</span></div>
          <span style="font-size: 13px; color: #596170; white-space: nowrap">{{p.job}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 12</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const px = (n) => n + 'px; ';
    const F = { M: '#1428a0', S: '#121417' };
    // [공간, 솔루션, 제품, 하는 일, 조감도 안 x, y (예시 위치)] — 손님 동선 순서
    const P = [
      ['외부', 'M', 'OH55C', '날씨 · 시간대별 프로모션 자동 전환', 130, 420],
      ['입구', 'S', 'KM24C', '오픈 · 마감에 맞춰 화면 · 조명 전원', 330, 380],
      ['카운터', 'M', 'QM55C ×3', '시간대 메뉴 · 품절 즉시 반영', 250, 150],
      ['픽업대', 'M', 'QM43C', '주문 번호 호출 화면 연동', 470, 130],
      ['대기 공간', 'S', 'QM65C', '영업시간 기준 공조 · 조명 스케줄', 590, 260]
    ];
    const pins = P.map(([space, letter, dev, job, x, y]) => {
      const cx = 64 + x, cy = 160 + y;   // 핀 지름 36 + 흰 테두리 3 → 42
      return {
        space, letter, dev, job, fill: F[letter],
        pos: 'left: ' + px(cx - 21) + 'top: ' + px(cy - 21),
        tagPos: 'left: ' + px(cx + 26) + 'top: ' + px(cy - 13)
      };
    });
    return { pins };
  }
}
</script>
</body>
</html>
