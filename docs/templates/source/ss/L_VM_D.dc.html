<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VM-D 하루 타임라인 × 공간</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">하루 동안, 솔루션은 공간을 넘나듭니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">공간 × 솔루션 전체 맵 · 같은 시각, 공간마다 일어나는 일</div>

  <!-- 시간 축 -->
  <div style="position: absolute; left: 240px; top: 195px; width: 976px; height: 2px; background: #d5d9e0"></div>
  <sc-for list="{{ticks}}" as="t" hint-placeholder-count="4">
    <div style="position: absolute; left: 0; top: 0">
      <div style="position: absolute; top: 160px; {{t.label}} display: flex; justify-content: center; align-items: baseline; gap: 6px"><span style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800">{{t.t}}</span><span style="font-size: 12.5px; color: #596170">{{t.d}}</span></div>
      <div style="position: absolute; {{t.guide}} width: 0; height: 430px; border-left: 1px dashed #b8bec8"></div>
      <div style="position: absolute; {{t.dot}} width: 10px; height: 10px; border-radius: 50%; background: #1428a0; border: 2px solid #ffffff"></div>
    </div>
  </sc-for>

  <!-- 행: 공간 -->
  <div style="position: absolute; left: 240px; top: 352px; width: 976px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 240px; top: 496px; width: 976px; height: 1px; background: #e2e5ea"></div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <div style="position: absolute; left: 64px; {{r.pos}} width: 160px; height: 136px; box-sizing: border-box; border-radius: 12px; background: #f5f6f8; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px"><span style="font-size: 16px; font-weight: 800">{{r.name}}</span><span style="font-size: 12.5px; color: #596170">{{r.who}}</span></div>
  </sc-for>

  <!-- 이벤트 카드 (행 × 시각) -->
  <sc-for list="{{cards}}" as="k" hint-placeholder-count="10">
    <div style="position: absolute; {{k.pos}} width: 208px; height: 104px; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid #d5d9e0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; background: {{k.fill}}; color: #ffffff; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{k.letter}}</span><span style="font-size: 11.5px; font-weight: 700; color: {{k.fill}}">{{k.sol}}</span></div>
      <span style="font-size: 14.5px; font-weight: 800; white-space: nowrap">{{k.title}}</span>
      <span style="font-size: 12px; color: #596170; white-space: nowrap">{{k.desc}}</span>
    </div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 12</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const px = (n) => n + 'px; ';
    const cc = [356, 604, 852, 1100];      // 시각 눈금 x
    const rowTop = [212, 356, 500];        // 공간 행 y
    const ticks = [['07:00', '오픈'], ['11:30', '점심 피크'], ['15:00', '한가한 오후'], ['21:00', '마감']].map(([t, d], i) => ({
      t, d,
      label: 'left: ' + px(cc[i] - 116) + 'width: 232px;',
      guide: 'left: ' + px(cc[i]) + 'top: 206px;',
      dot: 'left: ' + px(cc[i] - 7) + 'top: 189px;'
    }));
    const rows = [['본사 운영실', '운영 담당'], ['매장 카운터', '점장 · 손님'], ['매장 외부', '지나가는 손님']]
      .map(([name, who], j) => ({ name, who, pos: 'top: ' + px(rowTop[j]) }));
    const SOL = { M: ['#1428a0', 'MagicINFO'], S: ['#121417', 'SmartThings Pro'] };
    // [행, 시각, 솔루션, 제목, 설명] — 빈 칸: 본사 11:30, 외부 15:00
    const C = [
      [0, 0, 'M', '전 매장 적용 확인', '미수신 매장 즉시 알림'],
      [0, 2, 'M', '주말 캠페인 예약', '다음 콘텐츠 예약 배포'],
      [0, 3, 'S', '매장별 전력 리포트', '오늘 사용량 · 이상 알림'],
      [1, 0, 'M', '아침 메뉴로 자동 전환', '점장 작업 없음'],
      [1, 1, 'M', '품절 즉시 반영', 'POS 연동 · 대체 메뉴 표시'],
      [1, 2, 'M', '디저트 세트 강조', '한가한 시간 객단가 올리기'],
      [1, 3, 'S', '화면 · 조명 자동 소등', '마감 시각에 맞춰'],
      [2, 0, 'S', '사이니지 켜짐', '일출 밝기로 시작'],
      [2, 1, 'M', '점심 세트 프로모션', '지나가는 손님 유입'],
      [2, 3, 'S', '간판 · 사이니지 소등', '주변 밝기 따라 순차']
    ];
    const cards = C.map(([row, col, s, title, desc]) => ({
      letter: s, fill: SOL[s][0], sol: SOL[s][1], title, desc,
      pos: 'left: ' + px(cc[col] - 104) + 'top: ' + px(rowTop[row] + 16)
    }));
    return { ticks, rows, cards };
  }
}
</script>
</body>
</html>
