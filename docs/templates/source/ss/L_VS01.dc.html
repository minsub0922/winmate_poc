<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VS01 공간 × 솔루션 맵</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">어느 공간에서, 어떤 솔루션이, 어떤 가치를 만드는가</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">공간 × 솔루션 맵 · 칸마다 함께 쓰는 제품</div>

  <div style="position: absolute; left: 64px; top: 160px; width: 1152px; border-radius: 14px; overflow: hidden; border: 1px solid #e2e5ea; box-sizing: border-box">
    <div style="display: grid; grid-template-columns: 220px repeat(2, minmax(0, 1fr)); background: #121417; color: #ffffff">
      <span style="padding: 16px 20px; font-size: 13px; color: #b8bec8">공간 \ 솔루션</span>
      <div style="padding: 14px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">MagicINFO</span><span style="font-size: 12px; color: #b8bec8">콘텐츠 · 원격 관리</span></div>
      <div style="padding: 14px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">SmartThings Pro</span><span style="font-size: 12px; color: #b8bec8">에너지 · 기기 제어</span></div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 220px repeat(2, minmax(0, 1fr)); border-top: 1px solid #e2e5ea; height: 140px">
        <div style="padding: 18px 20px; background: #f5f6f8; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 17px; font-weight: 800">{{r.space}}</span><span style="font-size: 12.5px; color: #596170">{{r.who}}</span></div>
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #e2e5ea">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.45"><span style="color: #1428a0">●</span> {{r.a}}</span>
          <span style="font-size: 12.5px; color: #596170">{{r.aDev}}</span>
        </div>
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #e2e5ea">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.45"><span style="color: #1428a0">●</span> {{r.b}}</span>
          <span style="font-size: 12.5px; color: #596170">{{r.bDev}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 12</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { space: '본사 운영실', who: '마케팅 · 운영 담당', a: '320개 매장에 한 번에 배포', aDev: 'PC · 대시보드', b: '매장별 전력 사용을 한눈에', bDev: '에너지 리포트' },
      { space: '매장 카운터', who: '점장 · 손님', a: '시간대 메뉴 · 품절 자동 반영', aDev: 'QM55C ×3 · KM24C', b: '영업시간에만 켜지는 화면', bDev: 'QM55C · 조명' },
      { space: '매장 외부', who: '지나가는 손님', a: '날씨 · 시간대별 외부 프로모션', aDev: 'OH55C ×2', b: '일몰 · 일출 밝기 전환', bDev: 'OH55C · 간판 조명' }
    ] };
  }
}
</script>
</body>
</html>
