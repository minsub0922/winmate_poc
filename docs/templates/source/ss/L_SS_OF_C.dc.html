<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SS-OF-C 오피스 · 업무 빌딩 · 하루 · 동선 시나리오</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap">C 빌딩의 하루, 이용자가 느끼기 전에 운영이 먼저 움직입니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170; white-space: nowrap">방문객 · 운영팀 · 관리실 · 입주사 임직원의 평일 하루 — 화살표는 역할 간 연결 · 시간은 예시</div>

  <!-- 레인 머리 -->
  <div style="position: absolute; left: 64px; top: 172px; width: 44px; text-align: right; font-size: 11px; line-height: 16px; color: #8a91a0; white-space: nowrap">시간</div>
  <sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
    <div style="{{l.head}}">
      <div style="position: absolute; left: 12px; top: 3px; font-size: 14.5px; line-height: 20px; font-weight: 800; letter-spacing: -0.01em; color: {{l.nameC}}; white-space: nowrap">{{l.name}}</div>
      <div style="position: absolute; left: 12px; top: 22px; font-size: 11px; line-height: 15px; color: #596170; white-space: nowrap">{{l.sub}}</div>
      <div style="{{l.chip}}">{{l.group}}</div>
    </div>
    <div style="{{l.body}}"></div>
  </sc-for>

  <!-- 시간 눈금 -->
  <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
    <div style="{{h.label}}">{{h.t}}</div>
    <div style="{{h.line}}"></div>
  </sc-for>

  <!-- 역할 간 연결 -->
  <sc-for list="{{links}}" as="k" hint-placeholder-count="4">
    <div style="{{k.line}}"></div>
    <div style="{{k.head}}"></div>
  </sc-for>
  <div style="position: absolute; left: 405px; top: 436px; width: 249px; height: 14px; text-align: center; font-size: 10.5px; line-height: 14px; font-weight: 700; color: #1428a0; white-space: nowrap">행사 화면 · 음향 준비 → 타운홀</div>

  <!-- 단계 카드 -->
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
    <div style="{{c.style}}">
      <div style="position: absolute; left: 10px; top: 7px; height: 18px; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-size: 13px; line-height: 18px; font-weight: 800; color: #1428a0">{{c.time}}</span><span style="height: 18px; box-sizing: border-box; padding: 0 7px; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; font-size: 10.5px; color: #3d4452; display: flex; align-items: center">{{c.space}}</span></div>
      <div style="position: absolute; right: 10px; top: 7px; height: 18px; box-sizing: border-box; padding: 0 6px; border-radius: 4px; background: #1428a0; color: #ffffff; font-family: Manrope, 'Noto Sans KR', sans-serif; font-size: 10px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{c.sol}}</div>
      <div style="position: absolute; left: 10px; top: 28px; font-size: 12.5px; line-height: 17px; font-weight: 600; color: #121417; white-space: nowrap">{{c.act}}</div>
      <div style="position: absolute; left: 10px; top: 45px; font-size: 11.5px; line-height: 15px; font-weight: 700; color: #1428a0; white-space: nowrap">{{c.out}}</div>
    </div>
  </sc-for>

  <!-- 월말 · 분기 -->
  <div style="position: absolute; left: 64px; top: 608px; width: 44px; display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; line-height: 15px; font-weight: 800; color: #596170; white-space: nowrap"><span>월말</span><span>분기</span></div>
  <sc-for list="{{monthly}}" as="m" hint-placeholder-count="4">
    <div style="{{m.style}}">
      <div style="position: absolute; left: 10px; top: 6px; font-size: 11.5px; line-height: 16px; font-weight: 800; color: {{m.c}}; white-space: nowrap">{{m.t}}</div>
      <div style="position: absolute; left: 10px; top: 24px; font-size: 11.5px; line-height: 16px; color: #3d4452; white-space: nowrap">{{m.d}}</div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>C 오피스 빌딩 · 스마트 오피스 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 13</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const px = (n) => n + 'px; ';
    const A = 'position: absolute; ';
    const box = (x, y, w, h) => A + 'left: ' + px(x) + 'top: ' + px(y) + 'width: ' + px(w) + 'height: ' + px(h);
    const T = 'white-space: nowrap;';

    // 레인: 이용자는 양 끝, 운영은 가운데 (x 120 + i*277, 폭 265)
    const LX = [120, 397, 674, 951], LW = 265;
    const BODY_Y = 206, BODY_H = 388;               // 206–594
    const L = [
      ['방문객 · 고객사', '건물을 처음 찾는 사람', '이용자', false],
      ['C 빌딩 운영 · PM', '임대 · 입주사 · 브랜드 관리', '운영', true],
      ['관리실 · 시설 · 미화', '설비 · VOC · 에너지 · 미화', '운영', true],
      ['입주사 임직원', '매일 건물을 쓰는 사람', '이용자', false]
    ];
    const lanes = L.map(([name, sub, group, op], i) => ({
      name, sub, group,
      nameC: op ? '#1428a0' : '#121417',
      head: box(LX[i], 160, LW, 40) + 'box-sizing: border-box; border-radius: 10px; background: ' + (op ? '#eaeefb' : '#f5f6f8') + ';',
      chip: A + 'right: 10px; top: 11px; height: 18px; box-sizing: border-box; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; ' + T +
        (op ? ' background: #1428a0; color: #ffffff;' : ' background: #ffffff; border: 1.5px solid #121417; color: #121417;'),
      body: box(LX[i], BODY_Y, LW, BODY_H) + 'box-sizing: border-box; border-radius: 12px; ' +
        (op ? 'background: #f5f6f8;' : 'background: #ffffff; border: 1px solid #e2e5ea;')
    }));

    // 시간축 07:00 → 22:00 (1시간 = 24px)
    const yOf = (t) => Math.round(218 + (t - 7) * 24);
    const hours = [7, 9, 11, 13, 15, 17, 19, 21].map((t) => ({
      t: (t < 10 ? '0' : '') + t + ':00',
      label: box(64, yOf(t) - 7, 44, 14) + 'text-align: right; font-family: Manrope, sans-serif; font-size: 11px; line-height: 14px; font-weight: 700; color: #596170; ' + T,
      line: box(114, yOf(t), 1102, 1) + 'background: #e2e5ea;'
    }));

    // 단계 카드 — [레인, 시각(시), 표시 시각, 공간, 삼성, 하는 일, 결과]
    const C = [
      [0, 10, '10:00', '1F 로비', 'MagicINFO', 'LED 사이니지에 웰컴 · 층별 길 안내', '→ 헤매지 않는 첫 방문, 건물의 첫인상'],
      [0, 14, '14:00', '회의실', '예약 솔루션 · Flip', '문 앞 탭으로 예약 확인, Flip에 공유', '→ 기다림 없이 시작하는 미팅'],
      [0, 17, '17:00', '타운홀', 'LED · 하만 프로 오디오', '포럼 · 대관 — LED 대화면 · 고른 음향', '→ 외부 행사에도 손색없는 품질'],
      [1, 9, '09:00', '운영 사무실', 'MagicINFO', '오늘 방문 · 행사 콘텐츠 예약 송출', '→ 현장 작업 · 인쇄물 없이 교체'],
      [1, 18, '18:00', '운영 사무실', 'b.IoT', '층 · 입주사별 에너지 일일 리포트', '→ 목표 대비 사용량을 매일 확인'],
      [2, 7, '07:00', '기계실 · 관리실', 'b.IoT · DMS', '입주사 운영 시간대로 층별 공조 가동', '→ 출근 시 균일한 온도, 빈 층은 OFF'],
      [2, 11, '11:00', '관리실', 'b.IoT', 'VOC 접수 즉시 원격 조치 · 이상 알림', '→ VOC 처리 [00]분'],
      [2, 15, '15:00', 'B1 조정실', '하만 프로 오디오', '행사 화면 · 음향을 한 콘솔에서 준비', '→ 적은 인원으로 행사 · 대관 운영'],
      [2, 20, '20:00', '전 층', 'b.IoT', '연장 존 외 일괄 절전 · 야간 미화', '→ 야간 에너지 [00]% 절감'],
      [3, 8 + 50 / 60, '08:50', '업무층', 'SmartThings', '앱으로 내 자리 냉난방 · 조명 조절', '→ 관리실 전화 없이 바로 쾌적'],
      [3, 12.5, '12:30', '라운지', '공조 · 환기', '미세먼지 날도 창문 없이 맑은 공기', '→ 오래 머무는 공용 공간'],
      [3, 19.5, '19:30', '업무층', 'SmartThings', '앱으로 연장 운전 요청', '→ 필요한 존만 냉난방, 투명한 정산']
    ];
    const CW = LW - 16, CH = 62;
    const cards = C.map(([lane, h, time, space, sol, act, out]) => ({
      time, space, sol, act, out,
      style: box(LX[lane] + 8, yOf(h) - 8, CW, CH) + 'box-sizing: border-box; border-radius: 10px; background: #ffffff; border: 1px solid #d5d9e0;'
    }));
    const top = (lane, h) => yOf(h) - 8;
    const left = (lane) => LX[lane] + 8;
    const right = (lane) => LX[lane] + 8 + CW;

    // 역할 간 연결 — 카드가 겹치는 높이에서 수평 화살표 (dir -1: 왼쪽으로, +1: 오른쪽으로)
    const link = (x1, x2, y, dir) => {
      const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
      return {
        line: box(dir < 0 ? lo + 6 : lo, y - 1, hi - lo - 6, 2) + 'background: #1428a0;',
        head: A + 'left: ' + px(dir < 0 ? lo : hi - 7) + 'top: ' + px(y - 5) + 'width: 0px; height: 0px; border-top: 5px solid transparent; border-bottom: 5px solid transparent; ' +
          (dir < 0 ? 'border-right: 7px solid #1428a0;' : 'border-left: 7px solid #1428a0;')
      };
    };
    const mid = (a0, a1, b0, b1) => Math.round((Math.max(a0, b0) + Math.min(a1, b1)) / 2);
    const links = [
      // 운영 09:00 콘텐츠 예약 → 방문객 10:00 로비
      link(left(1), right(0), mid(top(1, 9), top(1, 9) + CH, top(0, 10), top(0, 10) + CH), -1),
      // 관리실 15:00 행사 준비 → 방문객 17:00 타운홀 (운영 레인 빈 구간 통과)
      link(left(2), right(0), mid(top(2, 15), top(2, 15) + CH, top(0, 17), top(0, 17) + CH), -1),
      // 관리실 07:00 공조 가동 → 임직원 08:50 출근
      link(right(2), left(3), mid(top(2, 7), top(2, 7) + CH, top(3, 8 + 50 / 60), top(3, 8 + 50 / 60) + CH), 1),
      // 임직원 19:30 연장 요청 → 관리실 20:00 절전
      link(left(3), right(2), mid(top(3, 19.5), top(3, 19.5) + CH, top(2, 20), top(2, 20) + CH), -1)
    ];

    // 월말 · 분기 — 레인별 (y 602–648)
    const M = [
      ['월간 · 방문 · 대관', '대관 [00]건 · 안내 문의 [00]%↓', false],
      ['월말 · DMS 전력 분배 (옵션)', '입주사별 사용량 → 관리비 정산 자료', true],
      ['분기 · 케어 서비스', '전담 엔지니어 정기 점검 · 유지보수', true],
      ['입주사 만족도 [0.0]점', '재계약률 [00]% · VOC [00]건 → [00]건', false]
    ];
    const monthly = M.map(([t, d, op], i) => ({
      t, d, c: op ? '#1428a0' : '#121417',
      style: box(LX[i], 602, LW, 46) + 'box-sizing: border-box; border-radius: 10px; ' +
        (op ? 'background: #eaeefb;' : 'background: #ffffff; border: 1px solid #d5d9e0;')
    }));

    return { lanes, hours, cards, links, monthly };
  }
}
</script>
</body>
</html>
