<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VS02 한 공간의 시나리오</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">03 · 공간별 가치 제공 시나리오 — 매장 카운터</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">매장 카운터의 하루 — 세 장면</div>

  <div style="position: absolute; left: 64px; top: 136px; width: 466px; height: 512px; border-radius: 16px; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8a91a0">매장 카운터 이미지</div>

  <div style="position: absolute; left: 578px; top: 136px; width: 2px; height: 500px; background: #d5d9e0"></div>
  <div style="position: absolute; left: 562px; top: 136px; width: 654px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{scenes}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; gap: 20px">
        <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; border: 3px solid #ffffff; box-sizing: content-box; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.no}}</span>
        <div style="flex-grow: 1; height: 150px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; color: #1428a0">{{s.time}}</span><span style="font-size: 17px; font-weight: 800">{{s.title}}</span></div>
          <span style="font-size: 14px; line-height: 1.55; color: #3d4452">{{s.desc}}</span>
          <div style="flex-grow: 1"></div>
          <div style="display: flex; gap: 6px">
            <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">{{s.sol}}</span>
            <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 11.5px; display: flex; align-items: center">{{s.dev}}</span>
            <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11.5px; font-weight: 700; display: flex; align-items: center">가치 · {{s.value}}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 13</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['07:00', '오픈', '점장이 도착하기 전 메뉴보드가 아침 메뉴로 켜져 있습니다.', 'MagicINFO 스케줄', 'QM55C ×3', '오픈 준비 0분'],
      ['11:30', '점심 피크', '대기가 길어지면 키오스크로 주문이 분산되고, 품절은 즉시 반영됩니다.', 'MagicINFO 조건부 재생', 'QM55C · KM24C', '대기 시간 단축'],
      ['21:00', '마감', '화면과 조명이 함께 꺼지고, 오늘의 전력 사용이 본사로 전송됩니다.', 'SmartThings Pro', 'QM55C · 조명', '전력 절감']
    ];
    return { scenes: S.map(([time, title, desc, sol, dev, value], i) => ({ no: i + 1, time, title, desc, sol, dev, value })) };
  }
}
</script>
</body>
</html>
