<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MI05 사용자 페르소나 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">메뉴보드를 쓰는 세 사람, 원하는 것이 다릅니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">비즈니스 사용자 분석 · 인터뷰 및 매장 관찰 기반</div>

  <div style="position: absolute; left: 64px; top: 176px; width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
      <div style="height: 472px; box-sizing: border-box; border-radius: 12px; border: 1px solid #e2e5ea; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 120px; background: #f5f6f8; display: flex; align-items: center; gap: 16px; padding: 0 24px">
          <div style="width: 64px; height: 64px; border-radius: 50%; background: #dfe3ea; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8a91a0">사진</div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; font-weight: 700">{{p.role}}</span><span style="font-size: 13px; color: #596170">{{p.who}}</span></div>
        </div>
        <div style="padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
          <div style="font-size: 17px; font-weight: 700; line-height: 1.5; color: #1428a0">"{{p.quote}}"</div>
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #596170; letter-spacing: 0.04em">불편</span><span style="font-size: 14px; line-height: 1.55">{{p.pain}}</span></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #596170; letter-spacing: 0.04em">원하는 것</span><span style="font-size: 14px; line-height: 1.55">{{p.need}}</span></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 8</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { people: [
      { role: '점장', who: '매장 운영 · 직원 관리', quote: '아침마다 메뉴판 바꾸는 시간이 아까워요', pain: '본사 공문을 보고 메뉴판을 직접 교체, 표기 실수가 잦음', need: '켜 두기만 하면 알아서 바뀌는 화면' },
      { role: '본사 운영자', who: '마케팅 · 프로모션 기획', quote: '320개 매장이 같은 날 같은 화면이었으면', pain: '매장별 적용 여부를 확인할 방법이 없음', need: '한 번에 배포하고 적용 현황을 보는 대시보드' },
      { role: '손님', who: '출근길 · 점심 피크 방문', quote: '줄 서 있는 동안 메뉴를 다 보고 싶어요', pain: '작은 글씨 · 품절 표시가 늦음', need: '멀리서도 읽히고 실시간으로 맞는 메뉴' }
    ] };
  }
}
</script>
</body>
</html>
