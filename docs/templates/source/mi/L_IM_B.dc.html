<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IM-B 4분면 요약 + 결론</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">한 장으로 보는 Market Intelligence</div>

  <!-- 4분면 카드: 텍스트는 바깥 모서리로 정렬 -->
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
    <div style="{{c.box}}">
      <span style="height: 28px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px"><span style="font-family: Manrope, sans-serif; color: #1428a0">{{c.no}}</span>{{c.k}}</span>
      <span style="font-family: Manrope, sans-serif; font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; color: #1428a0; padding-top: 6px">{{c.num}}</span>
      <span style="font-size: 12.5px; color: #596170">{{c.cap}}</span>
      <span style="font-size: 15.5px; font-weight: 700; line-height: 1.5; max-width: 420px; padding-top: 6px">{{c.t}}</span>
    </div>
  </sc-for>

  <!-- 결론 원 (그리드 중앙 교차점) -->
  <div style="position: absolute; left: 534px; top: 286px; width: 212px; height: 212px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 6px solid #ffffff; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center">
    <span style="height: 22px; padding: 0 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #ffffff; display: flex; align-items: center">결론</span>
    <div style="display: flex; flex-direction: column; font-size: 17px; font-weight: 800; line-height: 1.45">
      <span>메뉴 운영을</span>
      <span>본사로 모아야 합니다</span>
    </div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 9</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 2×2: 카드 568×248, 간격 16 · 중앙 교차점 (640, 392)에 결론 원
    // 위 카드는 위쪽, 아래 카드는 아래쪽 / 왼쪽 카드는 왼쪽, 오른쪽 카드는 오른쪽 정렬
    const C = [
      ['01', '시장', '[0,000]억 원', '2028 시장 전망 · 연 [00]% 성장', '메뉴보드 시장은 커피 · 디저트 매장이 이끕니다', 0, 0],
      ['02', '고객사', '[00]일', '메뉴 교체 1회 소요 기간', '메뉴가 바뀔 때마다 다섯 단계를 거칩니다', 1, 0],
      ['03', '사용자', '[00]%', '출근길 테이크아웃 손님 비중', '손님은 메뉴 탐색 · 픽업 대기에서 머뭇거립니다', 0, 1],
      ['04', '경쟁', '[00]%', '상위 3개 공급사 점유율', '원격 운영까지 갖춘 공급사는 소수입니다', 1, 1]
    ];
    const cards = C.map(([no, k, num, cap, t, col, row]) => ({
      no, k, num, cap, t,
      box: 'position: absolute; left: ' + (64 + col * 584) + 'px; top: ' + (136 + row * 264) + 'px; width: 568px; height: 248px; box-sizing: border-box; border-radius: 16px; background: #f5f6f8; padding: 28px 32px; display: flex; flex-direction: column; gap: 4px; '
        + 'justify-content: ' + (row ? 'flex-end' : 'flex-start') + '; align-items: ' + (col ? 'flex-end' : 'flex-start') + '; text-align: ' + (col ? 'right' : 'left')
    }));
    return { cards };
  }
}
</script>
</body>
</html>
