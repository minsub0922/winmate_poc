<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MI04 경쟁 환경 비교표</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">경쟁 환경 — 공급사마다 강점이 다릅니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">고객 요구사항 기준 비교 · 출처: [공개 자료, 연도]</div>

  <div style="position: absolute; left: 64px; top: 176px; width: 1152px; border-radius: 12px; overflow: hidden; border: 1px solid #e2e5ea; box-sizing: border-box">
    <div style="display: grid; grid-template-columns: 260px repeat(3, minmax(0, 1fr)); background: #121417; color: #ffffff; font-size: 14px; font-weight: 700">
      <span style="padding: 16px 20px">요구사항</span><span style="padding: 16px 20px">공급사 A</span><span style="padding: 16px 20px">공급사 B</span><span style="padding: 16px 20px">공급사 C</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="{{r.rowStyle}}">
        <span style="padding: 0 20px; font-weight: 700">{{r.k}}</span>
        <span style="padding: 0 20px; color: #596170">{{r.a}}</span>
        <span style="padding: 0 20px; color: #596170">{{r.b}}</span>
        <span style="padding: 0 20px; color: #596170">{{r.c}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 620px; font-size: 12px; color: #8a91a0">표의 내용은 공개 자료 기준이며, 제안서 확정 전 검증이 필요합니다.</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 7</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['원격 통합 관리', '[자체 CMS · 서버 별도]', '[3rd-party CMS 연동]', '[지역 단위 관리]'],
      ['저전력 운영', '[내용]', '[내용]', '[내용]'],
      ['프로모션 배포 속도', '[내용]', '[내용]', '[내용]'],
      ['유지보수 · 장애 대응', '[내용]', '[내용]', '[내용]'],
      ['초기 도입 비용', '[내용]', '[내용]', '[내용]']
    ];
    return { rows: R.map(([k, a, b, c], i) => ({ k, a, b, c, rowStyle: 'display: grid; grid-template-columns: 260px repeat(3, minmax(0, 1fr)); align-items: center; height: 80px; font-size: 14.5px; border-top: 1px solid #e2e5ea;' + (i % 2 ? ' background: #fbfbfc;' : ' background: #ffffff;') })) };
  }
}
</script>
</body>
</html>
