<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>US-C 사용자 구성 + 니즈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">방문객의 [00]%는 출근길 테이크아웃 손님입니다</div>

  <!-- 도넛 (5열) -->
  <div style="{{donut}}"></div>
  <div style="position: absolute; left: 212px; top: 209px; width: 170px; height: 170px; border-radius: 50%; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
    <span style="font-size: 13px; color: #596170">하루 방문</span>
    <span style="display: flex; align-items: baseline; gap: 2px; color: #1428a0"><span style="font-family: Manrope, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">[000]</span><span style="font-size: 16px; font-weight: 700">명</span></span>
    <span style="font-size: 11.5px; color: #8a91a0">매장 평균</span>
  </div>
  <sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
    <span style="{{g.ring}}">[00]%</span>
  </sc-for>

  <div style="position: absolute; left: 64px; top: 468px; width: 466px; display: flex; flex-direction: column">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
      <div style="{{g.legendRow}}">
        <span style="width: 12px; height: 12px; flex-shrink: 0; border-radius: 3px; background: {{g.color}}"></span>
        <span style="{{g.legendName}}">{{g.name}}</span>
        <span style="{{g.legendPct}}">[00]%</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 64px; top: 612px; font-size: 11.5px; color: #8a91a0">비율은 예시 · 데이터 연결 시 자동 반영</div>

  <!-- 유형별 니즈 표 (7열) -->
  <div style="position: absolute; left: 554px; top: 136px; width: 662px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 176px 104px minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; align-items: center; height: 40px; padding: 0 16px; font-size: 12.5px; font-weight: 700; color: #8a91a0">
      <span>손님 유형</span><span>주 방문 시간</span><span>핵심 니즈</span><span style="color: #1428a0">화면이 할 일</span>
    </div>
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
      <div style="{{g.row}}">
        <div style="display: flex; gap: 10px; align-items: flex-start">
          <span style="width: 14px; height: 14px; flex-shrink: 0; margin-top: 4px; border-radius: 4px; background: {{g.color}}"></span>
          <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 800; line-height: 1.4">{{g.name}}</span><span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700; color: #8a91a0">[00]%</span></div>
        </div>
        <span style="font-size: 13.5px; font-weight: 700; color: #3d4452">{{g.time}}</span>
        <span style="font-size: 13.5px; line-height: 1.55; color: #3d4452">{{g.need}}</span>
        <span style="font-size: 14px; line-height: 1.5; font-weight: 700; color: #1428a0">{{g.job}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 7</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 예시 비율(%) — 도넛 · 범례 · 표가 같은 목록을 공유
    const S = [
      { name: '출근길 테이크아웃', share: 42, color: '#1428a0', on: '#ffffff', time: '07–09시', need: '줄 서지 않고 빨리 받아 가기', job: '주문 전 메뉴 확정 · 픽업 호출로 바로 수령' },
      { name: '점심 직장인', share: 28, color: '#6f82d6', on: '#ffffff', time: '11–13시', need: '짧은 점심시간 안에 세트 고르기', job: '점심 세트 · 할인을 첫 화면에' },
      { name: '오후 체류 고객', share: 18, color: '#b8c3ee', on: '#121417', time: '14–17시', need: '디저트 · 신메뉴를 천천히 둘러보기', job: '시즌 디저트를 큰 이미지로 추천' },
      { name: '저녁 · 주말 가족', share: 12, color: '#e2e5ea', on: '#121417', time: '18시 이후 · 주말', need: '아이와 함께 쉽게 고르기', job: '가족 세트 · 키즈 메뉴를 한 화면에' }
    ];
    const CX = 297, CY = 294, R = 117.5; // 도넛 중심, 링 중간 반지름
    let acc = 0;
    const stops = [];
    const segs = S.map((s, i) => {
      const a0 = acc, a1 = acc + s.share;
      acc = a1;
      stops.push(s.color + ' ' + a0 + '% ' + a1 + '%');
      const ang = ((a0 + a1) / 2) / 100 * 2 * Math.PI;
      const x = CX + R * Math.sin(ang), y = CY - R * Math.cos(ang);
      const first = i === 0;
      return {
        name: s.name, color: s.color, time: s.time, need: s.need, job: s.job,
        ring: 'position: absolute; left: ' + (x - 26).toFixed(1) + 'px; top: ' + (y - 10).toFixed(1) + 'px; width: 52px; height: 20px; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: ' + s.on,
        legendRow: 'display: flex; align-items: center; gap: 10px; height: 32px; box-sizing: border-box; padding: 0 4px;' + (i < S.length - 1 ? ' border-bottom: 1px solid #e2e5ea' : ''),
        legendName: first ? 'flex-grow: 1; font-size: 14px; font-weight: 800; color: #121417' : 'flex-grow: 1; font-size: 14px; color: #3d4452',
        legendPct: 'font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; color: ' + (first ? '#1428a0' : '#121417'),
        row: 'display: grid; grid-template-columns: 176px 104px minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; align-items: center; height: 112px; box-sizing: border-box; padding: 0 16px;' + (first ? ' background: #f5f7fd; border-radius: 12px' : ' border-top: 1px solid #e2e5ea')
      };
    });
    const donut = 'position: absolute; left: 147px; top: 144px; width: 300px; height: 300px; border-radius: 50%; background: conic-gradient(' + stops.join(', ') + ')';
    return { segs, donut };
  }
}
</script>
</body>
</html>
