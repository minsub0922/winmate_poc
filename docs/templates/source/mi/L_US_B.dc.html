<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>US-B 고객 여정 맵</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">주문까지 3분, 손님이 머뭇거리는 순간이 두 번 있습니다</div>

  <!-- 단계 헤더 -->
  <div style="position: absolute; left: 196px; top: 157px; width: 1020px; height: 2px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 136px; width: 1152px; height: 44px; display: grid; grid-template-columns: 120px repeat(5, minmax(0, 1fr)); column-gap: 12px; align-items: center">
    <span style="font-size: 12.5px; font-weight: 700; color: #8a91a0">단계</span>
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <div style="height: 40px; box-sizing: border-box; border-radius: 999px; background: #f5f6f8; border: 1px solid #e2e5ea; padding: 0 6px; display: flex; align-items: center; gap: 10px">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #121417; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.no}}</span>
        <span style="font-size: 15px; font-weight: 700; white-space: nowrap">{{s.name}}</span>
      </div>
    </sc-for>
  </div>

  <!-- 행동 -->
  <div style="position: absolute; left: 64px; top: 192px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 193px; width: 1152px; height: 99px; display: grid; grid-template-columns: 120px repeat(5, minmax(0, 1fr)); column-gap: 12px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">행동</span><span style="font-size: 11.5px; color: #8a91a0">손님이 하는 일</span></div>
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <span style="padding: 0 8px; font-size: 13.5px; line-height: 1.55; color: #3d4452">{{s.act}}</span>
    </sc-for>
  </div>

  <!-- 감정 -->
  <div style="position: absolute; left: 64px; top: 292px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 293px; width: 120px; height: 143px; box-sizing: border-box; padding: 10px 0; display: flex; flex-direction: column; justify-content: space-between">
    <span style="font-size: 11.5px; color: #8a91a0">좋음 ↑</span>
    <span style="font-size: 14px; font-weight: 800">감정</span>
    <span style="font-size: 11.5px; color: #8a91a0">불편 ↓</span>
  </div>
  <div style="position: absolute; left: 196px; top: 364px; width: 1020px; height: 0px; border-top: 1px dashed #d5d9e0"></div>
  <svg style="position: absolute; left: 196px; top: 292px" width="1020" height="144" viewBox="0 0 1020 144" fill="none"><polyline points="{{emoPoints}}" stroke="#3d4452" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
  <div style="position: absolute; left: 196px; top: 292px; width: 1020px; height: 144px">
    <sc-for list="{{emo}}" as="e" hint-placeholder-count="5">
      <div style="{{e.dot}}"></div>
      <span style="{{e.label}}">{{e.feel}}</span>
      <sc-if value="{{e.low}}" hint-placeholder-val="{{false}}">
        <span style="{{e.badge}}">!</span>
      </sc-if>
    </sc-for>
  </div>

  <!-- 터치포인트 -->
  <div style="position: absolute; left: 64px; top: 436px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 437px; width: 1152px; height: 75px; display: grid; grid-template-columns: 120px repeat(5, minmax(0, 1fr)); column-gap: 12px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">터치포인트</span><span style="font-size: 11.5px; color: #8a91a0">만나는 화면</span></div>
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
        <sc-for list="{{s.tps}}" as="tp" hint-placeholder-count="1">
          <span style="height: 26px; padding: 0 10px; box-sizing: border-box; border-radius: 999px; background: #ffffff; border: 1px solid #d5d9e0; font-size: 12.5px; font-weight: 600; color: #3d4452; display: flex; align-items: center">{{tp}}</span>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- 기회 -->
  <div style="position: absolute; left: 64px; top: 512px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 513px; width: 1152px; height: 135px; display: grid; grid-template-columns: 120px repeat(5, minmax(0, 1fr)); column-gap: 12px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">기회</span><span style="font-size: 11.5px; color: #8a91a0">화면이 개입할 지점</span></div>
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <div style="{{s.oppBox}}">
        <sc-if value="{{s.low}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #1428a0">머뭇 지점 → 개입</span>
        </sc-if>
        <span style="{{s.oppText}}">{{s.opp}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 7</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 단계 열: 폭 1020 안에 5열, 열 간격 206.4, 열 중심 97.2 (감정 곡선 좌표계와 동일)
    const COL = 206.4, HALF = 97.2;
    const S = [
      { no: '01', name: '매장 발견', act: '출근길에 외부 사이니지를 보고 들를지 결정', emo: 72, feel: '기대', tps: ['외부 사이니지'], opp: '오늘의 메뉴 · 프로모션을 매장 밖에서 노출', low: false },
      { no: '02', name: '입장', act: '대기 줄 길이를 보고 주문할지 판단', emo: 60, feel: '무난', tps: ['입구 사이니지'], opp: '대기 현황 안내로 입구 이탈 방지', low: false },
      { no: '03', name: '메뉴 탐색', act: '신메뉴 · 가격 · 옵션을 찾느라 메뉴판 앞에서 머뭇', emo: 16, feel: '망설임', tps: ['메뉴보드'], opp: '시간대별 추천 메뉴를 한눈에 보여주기', low: true },
      { no: '04', name: '주문 · 결제', act: '카운터 또는 키오스크에서 주문 · 멤버십 적립', emo: 58, feel: '안도', tps: ['키오스크', 'POS'], opp: '키오스크와 메뉴보드 내용 일치', low: false },
      { no: '05', name: '픽업 대기', act: '호출을 놓칠까 픽업대 주변에서 서성임', emo: 22, feel: '불안', tps: ['픽업 호출'], opp: '호출 화면으로 픽업 대기 불안 해소', low: true }
    ];
    // 감정 0–100 → 행 안 y 20–124 (높을수록 위)
    const pt = S.map((s, i) => [HALF + i * COL, 20 + (1 - s.emo / 100) * 104]);
    const emoPoints = pt.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const emo = S.map((s, i) => {
      const x = pt[i][0], y = pt[i][1];
      const r = s.low ? 7 : 6;
      return {
        feel: s.feel, low: s.low,
        dot: s.low
          ? 'position: absolute; left: ' + (x - r).toFixed(1) + 'px; top: ' + (y - r).toFixed(1) + 'px; width: 14px; height: 14px; border-radius: 50%; background: #121417'
          : 'position: absolute; left: ' + (x - r).toFixed(1) + 'px; top: ' + (y - r).toFixed(1) + 'px; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 2.5px solid #3d4452',
        label: s.low
          ? 'position: absolute; left: ' + (x - 40).toFixed(1) + 'px; top: ' + (y + 11).toFixed(1) + 'px; width: 80px; text-align: center; font-size: 12.5px; font-weight: 800; color: #121417'
          : 'position: absolute; left: ' + (x - 40).toFixed(1) + 'px; top: ' + (y - 30).toFixed(1) + 'px; width: 80px; text-align: center; font-size: 12.5px; color: #596170',
        badge: 'position: absolute; left: ' + (x + 10).toFixed(1) + 'px; top: ' + (y - 28).toFixed(1) + 'px; width: 18px; height: 18px; border-radius: 50%; background: #121417; color: #ffffff; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center'
      };
    });
    const stages = S.map(s => ({
      no: s.no, name: s.name, act: s.act, tps: s.tps, opp: s.opp, low: s.low,
      oppBox: s.low
        ? 'height: 110px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px'
        : 'height: 110px; box-sizing: border-box; padding: 16px 8px; display: flex; flex-direction: column; justify-content: center',
      oppText: s.low
        ? 'font-size: 14.5px; line-height: 1.5; font-weight: 700; color: #1428a0'
        : 'font-size: 13.5px; line-height: 1.55; color: #3d4452'
    }));
    return { stages, emo, emoPoints };
  }
}
</script>
</body>
</html>
