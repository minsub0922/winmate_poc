<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MS-D 세그먼트 규모 × 성장률</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">가장 빠르게 크는 곳은 커피 · 디저트 매장입니다</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">세그먼트별 현재 규모(원 크기) × 연평균 성장률 · 출처: [조사 기관, 연도]</div>

  <!-- 좌측 8열: 버블 차트 -->
  <div style="position: absolute; left: 64px; top: 158px; font-size: 13px; font-weight: 700; color: #596170">연평균 성장률 ↑</div>
  <div style="position: absolute; left: 124px; top: 190px; width: 692px; height: 400px">
    <!-- 크고 빠른 시장 사분면 -->
    <div style="position: absolute; left: 330px; top: 0; width: 362px; height: 175px; background: #f5f7fd"></div>
    <div style="position: absolute; right: 12px; top: 10px; font-size: 12.5px; font-weight: 800; color: #1428a0">크고 빠른 시장</div>
    <!-- 그리드 4줄 + 축 -->
    <sc-for list="{{grid}}" as="g" hint-placeholder-count="4">
      <div style="{{g}}"></div>
    </sc-for>
    <div style="position: absolute; left: 0; top: 399px; width: 692px; height: 1px; background: #b8bec8"></div>
    <div style="position: absolute; left: 0; top: 0; width: 1px; height: 400px; background: #b8bec8"></div>
    <!-- 중앙값 점선 -->
    <div style="position: absolute; left: 330px; top: 0; width: 0; height: 399px; border-left: 1px dashed #b8bec8"></div>
    <div style="position: absolute; left: 1px; top: 175px; width: 691px; height: 0; border-top: 1px dashed #b8bec8"></div>
    <div style="position: absolute; right: 6px; top: 180px; font-size: 11px; color: #8a91a0">성장률 중앙값</div>
    <div style="position: absolute; left: 336px; top: 382px; font-size: 11px; color: #8a91a0">규모 중앙값</div>
    <!-- 축 눈금 -->
    <sc-for list="{{yTicks}}" as="t" hint-placeholder-count="5">
      <span style="{{t.style}}">{{t.label}}</span>
    </sc-for>
    <sc-for list="{{xTicks}}" as="t" hint-placeholder-count="5">
      <span style="{{t.style}}">{{t.label}}</span>
    </sc-for>
    <div style="position: absolute; right: 0; top: 432px; font-size: 13px; font-weight: 700; color: #596170">현재 시장 규모 →</div>
    <!-- 버블 -->
    <sc-for list="{{bubbles}}" as="b" hint-placeholder-count="5">
      <div style="{{b.style}}"></div>
    </sc-for>
    <sc-for list="{{bubbles}}" as="b" hint-placeholder-count="5">
      <div style="{{b.labelStyle}}">
        <span style="font-size: 13.5px; font-weight: 800; color: {{b.nameColor}}">{{b.name}}</span>
        <span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: {{b.valColor}}">{{b.val}}</span>
      </div>
    </sc-for>
    <!-- 고객 위치 태그 -->
    <div style="position: absolute; left: 352px; top: 80px; width: 62px; height: 24px; border-radius: 6px; background: #121417; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">A 커피</div>
    <div style="position: absolute; left: 414px; top: 91px; width: 20px; height: 2px; background: #121417"></div>
  </div>

  <!-- 우측 4열: 인사이트 -->
  <div style="position: absolute; left: 848px; top: 184px; width: 368px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{insights}}" as="n" hint-placeholder-count="3">
      <div style="{{n.wrap}}">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{n.no}}</span>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 17px; font-weight: 700">{{n.head}}</span><span style="font-size: 13.5px; line-height: 1.55; color: #596170">{{n.body}}</span></div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 848px; top: 622px; font-size: 11.5px; color: #8a91a0">수치는 예시 · 데이터 연결 시 자동 반영</div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 5</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 플롯 영역 692 × 400 (좌상단 기준). 버블 위치 · 크기는 예시 형태
    const W = 692, H = 400;
    const grid = [0, 100, 200, 300].map((y) => 'position: absolute; left: 1px; top: ' + y + 'px; width: ' + (W - 1) + 'px; height: 1px; background: #e2e5ea');
    const yTicks = [0, 100, 200, 300, 400].map((y, i) => ({
      label: i === 4 ? '0%' : '[00]%',
      style: 'position: absolute; left: -60px; top: ' + (y - 8) + 'px; width: 50px; text-align: right; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 600; color: #8a91a0'
    }));
    const xTicks = [0, 173, 346, 519, 692].map((x, i) => {
      const pos = i === 0 ? 'left: 0; text-align: left;' : i === 4 ? 'right: 0; text-align: right;' : 'left: ' + (x - 40) + 'px; width: 80px; text-align: center;';
      return { label: i === 0 ? '0' : '[000]억', style: 'position: absolute; top: 410px; ' + pos + ' font-family: Manrope, sans-serif; font-size: 12px; font-weight: 600; color: #8a91a0' };
    });
    const B = [
      { name: '커피 · 디저트', cx: 500, cy: 92, d: 132, bg: '#1428a0', lab: 'in', nameColor: '#ffffff', valColor: '#c8d3ff' },
      { name: '퀵서비스', cx: 590, cy: 290, d: 150, bg: '#b8c3ee', lab: 'in', nameColor: '#121417', valColor: '#3d4452' },
      { name: '베이커리', cx: 180, cy: 124, d: 84, bg: '#b8c3ee', lab: 'right', nameColor: '#121417', valColor: '#596170' },
      { name: '패밀리 레스토랑', cx: 290, cy: 280, d: 104, bg: '#d5d9e0', lab: 'below', nameColor: '#121417', valColor: '#596170' },
      { name: '편의점', cx: 96, cy: 326, d: 60, bg: '#d5d9e0', lab: 'right', nameColor: '#121417', valColor: '#596170' }
    ];
    const bubbles = B.map((b) => {
      const r = b.d / 2;
      let ls;
      if (b.lab === 'in') {
        ls = 'left: ' + (b.cx - r) + 'px; top: ' + (b.cy - r) + 'px; width: ' + b.d + 'px; height: ' + b.d + 'px; align-items: center; justify-content: center; text-align: center;';
      } else if (b.lab === 'below') {
        ls = 'left: ' + (b.cx - 70) + 'px; top: ' + (b.cy + r + 6) + 'px; width: 140px; align-items: center; text-align: center;';
      } else {
        ls = 'left: ' + (b.cx + r + 10) + 'px; top: ' + (b.cy - 18) + 'px; width: 110px; align-items: flex-start;';
      }
      return {
        name: b.name, val: '[000]억 · [00]%', nameColor: b.nameColor, valColor: b.valColor,
        style: 'position: absolute; left: ' + (b.cx - r) + 'px; top: ' + (b.cy - r) + 'px; width: ' + b.d + 'px; height: ' + b.d + 'px; border-radius: 50%; background: ' + b.bg + ';',
        labelStyle: 'position: absolute; display: flex; flex-direction: column; gap: 1px; ' + ls
      };
    });
    const I = [
      ['성장률 1위, 규모 2위', '커피 · 디저트는 연평균 [00]% 성장해 F&B 평균의 [0.0]배입니다.'],
      ['가장 큰 퀵서비스는 정체', '규모는 [000]억 원으로 1위지만 성장률은 [0]%에 머뭅니다.'],
      ['A 커피는 성장 구간의 중심', '세그먼트 내 매장 수 [0]위 · 교체 수요가 가장 먼저 생깁니다.']
    ];
    const insights = I.map(([head, body], i) => ({
      no: String(i + 1), head, body,
      wrap: 'display: flex; gap: 14px;' + (i < I.length - 1 ? ' padding-bottom: 16px; border-bottom: 1px solid #e2e5ea;' : '')
    }));
    return { grid, yTicks, xTicks, bubbles, insights };
  }
}
</script>
</body>
</html>
