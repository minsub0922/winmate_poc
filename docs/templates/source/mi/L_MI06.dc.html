<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MI06 산업 트렌드 타임라인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">매장 디스플레이는 '보여주는 화면'에서 '운영하는 화면'으로</div>
  <div style="position: absolute; left: 64px; top: 112px; width: 1060px; font-size: 15px; color: #596170">산업 트렌드 · 대규모 MI용</div>

  <div style="position: absolute; left: 64px; top: 262px; width: 1152px; height: 2px; background: #d5d9e0"></div>
  <div style="position: absolute; left: 64px; top: 262px; width: 864px; height: 2px; background: #1428a0"></div>
  <div style="position: absolute; left: 64px; top: 196px; width: 1152px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; color: {{s.color}}">{{s.year}}</span>
        <span style="{{s.dot}}"></span>
        <span style="font-size: 18px; font-weight: 700; padding-top: 10px">{{s.title}}</span>
        <span style="font-size: 14px; line-height: 1.6; color: #596170">{{s.desc}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 64px; top: 520px; width: 1152px; height: 128px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 24px 28px; display: flex; align-items: center; gap: 28px">
    <span style="flex-shrink: 0; width: 140px; font-size: 14px; font-weight: 800; color: #1428a0; letter-spacing: 0.04em">A 커피에 주는 의미</span>
    <span style="font-size: 17px; line-height: 1.6">지금 도입하면 '통합 운영' 단계로 바로 들어가, 개별 교체 → 통합 전환의 이중 투자를 피할 수 있습니다.</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 5</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['2020', '인쇄에서 화면으로', '메뉴판을 단순 교체하는 1세대 디지털화', 0],
      ['2022', '콘텐츠 자동화', '시간대별 메뉴 · 품절 자동 반영', 0],
      ['2024', '본사 통합 운영', '원격 배포 · 장애 모니터링이 구매 기준으로', 0],
      ['2026+', '매장 데이터 플랫폼', '주문 · 재고 · 에너지 데이터와 화면이 연결', 1]
    ];
    return { steps: S.map(([year, title, desc, now]) => ({ year, title, desc, color: now ? '#1428a0' : '#121417',
      dot: 'width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; margin-top: 12px;' + (now ? ' background: #1428a0; box-shadow: 0 0 0 5px #eaeefb;' : ' background: #ffffff; border: 3px solid #1428a0;') })) };
  }
}
</script>
</body>
</html>
