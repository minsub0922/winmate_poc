<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MS-E 성장 동인 → 전망</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">세 가지 변화가 시장을 키우고 있습니다</div>

  <!-- 좌측 7열: 성장 동인 3행 → 우측 전망 패널로 화살표 -->
  <div style="position: absolute; left: 64px; top: 136px; width: 686px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{drivers}}" as="d" hint-placeholder-count="3">
      <div style="position: relative; width: 686px; height: 160px">
        <div style="position: absolute; left: 0; top: 0; width: 630px; height: 160px; box-sizing: border-box; border-radius: 14px; background: #f5f6f8; padding: 0 24px; display: flex; align-items: center; gap: 20px">
          <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: #eaeefb; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{d.iconPeople}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></svg></sc-if>
            <sc-if value="{{d.iconCycle}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></sc-if>
            <sc-if value="{{d.iconEnergy}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></sc-if>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #1428a0">{{d.no}}</span>
            <span style="font-size: 19px; font-weight: 800; line-height: 1.35">{{d.title}}</span>
            <span style="font-size: 14px; line-height: 1.55; color: #596170">{{d.desc}}</span>
          </div>
          <div style="width: 1px; height: 88px; flex-shrink: 0; background: #e2e5ea"></div>
          <div style="width: 124px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: Manrope, sans-serif; font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; color: #1428a0">{{d.num}}</span>
            <span style="font-size: 12.5px; line-height: 1.45; color: #3d4452">{{d.evidence}}</span>
          </div>
        </div>
        <svg style="position: absolute; left: 648px; top: 64px" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
      </div>
    </sc-for>
  </div>

  <!-- 우측 5열: 전망 패널 -->
  <div style="position: absolute; left: 750px; top: 136px; width: 466px; height: 512px; border-radius: 16px; background: #1428a0; color: #ffffff">
    <div style="position: absolute; left: 32px; top: 32px; font-size: 15px; font-weight: 700; color: #c8d3ff"><span style="font-family: Manrope, sans-serif">2028</span> 시장 전망</div>
    <div style="position: absolute; left: 32px; top: 60px; display: flex; align-items: baseline; gap: 8px"><span style="font-family: Manrope, sans-serif; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">[0,000]</span><span style="font-size: 24px; font-weight: 700">억 원</span></div>
    <div style="position: absolute; left: 32px; top: 132px; font-size: 16px; color: #c8d3ff">연평균 <span style="font-family: Manrope, sans-serif; font-weight: 800; color: #ffffff">[00]%</span> 성장</div>

    <div style="position: absolute; left: 32px; top: 190px; width: 402px; height: 250px">
      <div style="position: absolute; left: 0; top: 249px; width: 402px; height: 1px; background: rgba(255,255,255,0.3)"></div>
      <svg style="position: absolute; left: 0; top: 0" width="402" height="250" viewBox="0 0 402 250" fill="none"><path d="M162 160 L240 50" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/></svg>
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
        <div style="{{b.barStyle}}"></div>
        <div style="{{b.valStyle}}">{{b.val}}</div>
      </sc-for>
      <div style="position: absolute; left: 165px; top: 92px; width: 72px; height: 26px; box-sizing: border-box; border-radius: 999px; background: #1428a0; border: 1px solid rgba(255,255,255,0.6); font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">+[00]%</div>
    </div>
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
      <div style="{{b.yearStyle}}">{{b.year}}</div>
    </sc-for>
    <div style="position: absolute; left: 32px; top: 484px; font-size: 11.5px; color: #9db4ff">출처: [조사 기관, 연도] · 수치는 예시 · 데이터 연결 시 자동 반영</div>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 6</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const drivers = [
      { no: '01', title: '인건비 상승 → 셀프 주문 확대', desc: '주문 · 결제를 화면으로 넘기는 매장이 빠르게 늘고 있습니다.',
        num: '[00]%', evidence: '최저임금 5년간 상승률', iconPeople: true, iconCycle: false, iconEnergy: false },
      { no: '02', title: '메뉴 교체 주기 단축', desc: '시즌 · 시간대 메뉴가 늘어 인쇄 메뉴판으로는 속도를 맞추기 어렵습니다.',
        num: '[0]주', evidence: '신메뉴 평균 교체 주기', iconPeople: false, iconCycle: true, iconEnergy: false },
      { no: '03', title: '매장 에너지 관리 의무화', desc: '매장 단위 전력 사용량 관리 · 보고 요구가 커지고 있습니다.',
        num: '[00]%', evidence: '매장 운영비 중 전력비 비중', iconPeople: false, iconCycle: false, iconEnergy: true }
    ];
    // 막대: 바닥선 y=250 기준, 높이는 예시 형태
    const B = [
      { year: '2025', h: 90, left: 66, bg: 'rgba(255,255,255,0.3)', yearColor: '#c8d3ff', yearWeight: 700 },
      { year: '2028E', h: 200, left: 240, bg: '#ffffff', yearColor: '#ffffff', yearWeight: 800 }
    ];
    const bars = B.map((b, i) => ({
      year: b.year, val: i === 0 ? '[000]억' : '[0,000]억',
      barStyle: 'position: absolute; left: ' + b.left + 'px; top: ' + (250 - b.h) + 'px; width: 96px; height: ' + b.h + 'px; border-radius: 6px 6px 0 0; background: ' + b.bg + ';',
      valStyle: 'position: absolute; left: ' + b.left + 'px; top: ' + (250 - b.h - 28) + 'px; width: 96px; text-align: center; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; color: #ffffff;',
      yearStyle: 'position: absolute; left: ' + (32 + b.left) + 'px; top: 450px; width: 96px; text-align: center; font-family: Manrope, sans-serif; font-size: 14px; font-weight: ' + b.yearWeight + '; color: ' + b.yearColor + ';'
    }));
    return { drivers, bars };
  }
}
</script>
</body>
</html>
