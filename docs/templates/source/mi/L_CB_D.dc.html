<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CB-D SWOT</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #ffffff; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 64px; top: 44px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1428a0">01 · MARKET INTELLIGENCE</div>
  <div style="position: absolute; left: 64px; top: 66px; width: 1060px; font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em">A 커피의 강점은 규모, 위협은 인건비입니다</div>

  <!-- 상단 축: 도움 / 위험 -->
  <div style="position: absolute; left: 128px; top: 139px; width: 536px; height: 22px; display: flex; align-items: center; gap: 12px">
    <span style="flex-grow: 1; height: 1px; background: #e2e5ea"></span>
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #1428a0; white-space: nowrap">도움이 되는 것</span>
    <span style="flex-grow: 1; height: 1px; background: #e2e5ea"></span>
  </div>
  <div style="position: absolute; left: 680px; top: 139px; width: 536px; height: 22px; display: flex; align-items: center; gap: 12px">
    <span style="flex-grow: 1; height: 1px; background: #e2e5ea"></span>
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #3d4452; white-space: nowrap">위험한 것</span>
    <span style="flex-grow: 1; height: 1px; background: #e2e5ea"></span>
  </div>

  <!-- 좌측 축: 내부 / 외부 -->
  <div style="position: absolute; left: 64px; top: 172px; width: 48px; height: 192px; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e5ea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <span style="writing-mode: vertical-rl; text-orientation: upright; font-size: 14px; font-weight: 800; letter-spacing: 0.3em; color: #3d4452">내부</span>
    <span style="font-size: 10.5px; color: #8a91a0">역량</span>
  </div>
  <div style="position: absolute; left: 64px; top: 380px; width: 48px; height: 192px; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e5ea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <span style="writing-mode: vertical-rl; text-orientation: upright; font-size: 14px; font-weight: 800; letter-spacing: 0.3em; color: #3d4452">외부</span>
    <span style="font-size: 10.5px; color: #8a91a0">환경</span>
  </div>

  <!-- 4분면 -->
  <sc-for list="{{quads}}" as="q" hint-placeholder-count="4">
    <div style="{{q.box}}">
      <div style="display: flex; align-items: baseline; gap: 12px">
        <span style="font-family: Manrope, sans-serif; font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: {{q.color}}">{{q.letter}}</span>
        <span style="font-size: 19px; font-weight: 800">{{q.name}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{q.bullets}}" as="b" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="{{b.dot}}"></span>
            <span style="{{b.style}}">{{b.t}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <!-- S + O 연결 표시 -->
  <div style="position: absolute; left: 381px; top: 357px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #1428a0; border: 3px solid #ffffff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></div>

  <!-- 제안 방향 -->
  <div style="position: absolute; left: 64px; top: 592px; width: 1152px; height: 56px; box-sizing: border-box; border-radius: 12px; background: #eaeefb; padding: 0 24px; display: flex; align-items: center; gap: 14px">
    <span style="height: 28px; padding: 0 12px; border-radius: 999px; background: #1428a0; color: #ffffff; font-size: 12.5px; font-weight: 800; display: flex; align-items: center">제안 방향</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    <span style="font-size: 16px; font-weight: 700">표준화된 320개 매장<span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">(S)</span>을 본사 일괄 운영<span style="font-family: Manrope, sans-serif; font-weight: 800; color: #1428a0">(O)</span>으로 연결</span>
  </div>

  <div style="position: absolute; left: 64px; top: 668px; width: 1152px; height: 1px; background: #e2e5ea"></div>
  <div style="position: absolute; left: 64px; top: 680px; display: flex; align-items: center; gap: 12px; font-size: 11px; color: #8a91a0"><span style="width: 72px; height: 20px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px">고객사 로고</span><span>A 커피 프랜차이즈 · 디지털 메뉴보드 제안</span></div>
  <div style="position: absolute; right: 64px; top: 683px; font-size: 11px; color: #8a91a0; font-family: Manrope, sans-serif">CONFIDENTIAL · 6</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // 좌열 = 도움이 되는 것 (S, O · 파랑), 우열 = 위험한 것 (W, T · 잉크)
    const help = { bg: '#f5f7fd', color: '#1428a0' };
    const risk = { bg: '#f5f6f8', color: '#121417' };
    const Q = [
      ['S', '강점', 128, 172, help, [['전국 320개 매장 규모의 구매 · 운영력', 1], ['매장 레이아웃 · 메뉴 구성 표준화', 0], ['멤버십 회원 [00]만 명의 재방문 기반', 0]]],
      ['W', '약점', 680, 172, risk, [['메뉴 교체마다 인쇄물 재제작 · 배송', 0], ['매장별 가격 · 품절 표기 불일치', 0], ['피크 시간 카운터 대기 줄 발생', 0]]],
      ['O', '기회', 128, 380, help, [['본사 일괄 콘텐츠 운영 기술의 보편화', 1], ['시간대별 메뉴 · 프로모션 자동 전환', 0], ['셀프 주문 · 픽업 호출 수요 확대', 0]]],
      ['T', '위협', 680, 380, risk, [['최저임금 인상에 따른 인건비 부담', 1], ['저가 커피 브랜드의 공격적 출점', 0], ['원두 · 원재료 가격 변동성 확대', 0]]]
    ];
    const quads = Q.map(([letter, name, x, y, tone, bl]) => ({
      letter, name, color: tone.color,
      box: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: 536px; height: 192px; box-sizing: border-box; border-radius: 14px; background: ' + tone.bg + '; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px',
      bullets: bl.map(([t, strong]) => ({
        t,
        dot: 'width: 6px; height: 6px; flex-shrink: 0; border-radius: 2px; background: ' + tone.color,
        style: strong
          ? 'font-size: 15px; line-height: 1.5; font-weight: 700; color: #121417'
          : 'font-size: 15px; line-height: 1.5; color: #3d4452'
      }))
    }));
    return { quads };
  }
}
</script>
</body>
</html>
