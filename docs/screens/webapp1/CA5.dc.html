<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경쟁사 분석 · 저장 · 보내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="competitor" current="A 커피 메뉴보드 경쟁사 분석" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="경쟁사 분석" title="A 커피 메뉴보드 경쟁사 분석" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" complete="{{true}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: #1428a0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>저장 완료</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em">저장했어요. 어디에 쓸까요?</h1>
        </div>
        <span style="font-size: 14px; color: #596170">결과는 작업 목록과 사이드바에 남아요. 보낼 곳을 고르면 그 자리에 맞게 바뀌어 들어가요.</span>
      </div>

      <!-- 보낼 곳 4 -->
      <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
        <a href="MI3.dc.html" style="{{card}}">
          <span style="{{iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16 M7 16V10 M12 16V5 M17 16v-7"/></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13.5px; font-weight: 600; color: #121417; white-space: nowrap">Market Intelligence 작업에 합치기</span>
            <span style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">A 커피 프랜차이즈 시장·경쟁사 분석의 경쟁사 영역으로</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="https://claude.ai/artifact/Jd1mPcNMqvZoeBjfKFxeJe" style="{{card}}">
          <span style="{{iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v12H3z M8 20h8 M12 16v4"/></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13.5px; font-weight: 600; color: #121417; white-space: nowrap">제안서 Why Samsung · 경쟁 비교 시트로</span>
            <span style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{prsSub}}</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="SB1Q3.dc.html" style="{{card}}">
          <span style="{{iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13.5px; font-weight: 600; color: #121417; white-space: nowrap">Storyboard 비교 기준으로</span>
            <span style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">기획 질의 3 / 3 비교 기준에 채우기</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <button style="{{cardBtn}}">
          <span style="{{iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11 M7 10l5 5 5-5 M4 20h16"/></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 13.5px; font-weight: 600; color: #121417; white-space: nowrap">리포트 저장</span>
            <span style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">PDF · 사내용 · 실명 표기 — 고객에게는 보내지 않아요</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <!-- 익명 표기 스위치 (MI2C 패턴) -->
      <div style="height: 48px; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid #e2e5ea; display: flex; align-items: center; gap: 10px; padding: 0 16px; flex-shrink: 0">
        <button role="switch" aria-checked="{{anon}}" aria-label="고객 제출물엔 익명으로 표기" onClick="{{anonCtl.toggle}}" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
        <span style="font-size: 13px; font-weight: 600; white-space: nowrap">고객 제출물엔 익명으로 표기</span>
        <span style="font-size: 12.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">— {{anonText}}</span>
        <span style="flex-grow: 1"></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span style="font-size: 11.5px; color: #8a91a0; white-space: nowrap">실명은 이 작업 안에서만 보여요</span>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <a href="CA0.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: #596170"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16 M4 12h16 M4 18h10"/></svg>작업 목록</a>
        <span style="flex-grow: 1"></span>
        <a href="Main.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap">홈으로<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = ['넣기', '경쟁사 확인', '분석', '결과'];
    const st = this.state || {};
    const anon = st.anon !== false;

    // 보낼 곳 카드: 링크 3 + 버튼 1 (리포트 저장) · 같은 모양
    const card = 'height: 64px; box-sizing: border-box; padding: 0 16px 0 14px; border-radius: 14px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; display: flex; align-items: center; gap: 12px; width: 100%;';

    return {
      steps, cur: 4, anon,
      card,
      cardBtn: card + ' cursor: pointer; font-family: inherit;',
      iconBox: 'width: 36px; height: 36px; border-radius: 10px; background: #eaeefb; display: flex; align-items: center; justify-content: center; flex-shrink: 0;',
      prsSub: anon ? '익명 표기 (경쟁사 A · B · C · D) 로 Why Samsung 비교 시트에 들어가요' : '실명 표기 · 보낼 때 한 번 더 물어요',
      anonText: anon ? '경쟁사 A · B · C · D' : '실명 표기 · 고객 제출물에 넣을 땐 한 번 더 물어요',
      anonCtl: { on: anon, toggle: () => this.setState({ anon: !anon }) },
      switchStyle: 'width: 36px; height: 22px; border-radius: 999px; border: none; position: relative; padding: 0; flex-shrink: 0;' + (anon ? ' background: #1428a0;' : ' background: #c9ced6;'),
      knobStyle: 'position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff;' + (anon ? ' right: 3px;' : ' left: 3px;')
    };
  }
}
</script>
</body>
</html>
