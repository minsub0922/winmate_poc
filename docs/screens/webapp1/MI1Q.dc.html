<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Intelligence · 업종이 두 갈래일 때 한 번 묻기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="market" current="" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="Market Intelligence" title="H 호텔 로비 라운지 카페 분석" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 18px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; gap: 12px">
        <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 3px; flex-grow: 1; min-width: 0">
          <div style="font-size: 14.5px; line-height: 1.6">회의록을 읽어 보니 업종이 두 갈래로 읽혀요. 업종에 따라 시장 · 비즈니스 · 사용자 레이아웃이 통째로 달라져서, 이것 하나만 여쭤볼게요.</div>

          <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden">
            <div style="height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e2e5ea; background: #fbfbfc">
              <span style="height: 22px; padding: 0 8px; border-radius: 999px; box-sizing: border-box; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; background: #121417; color: #ffffff; flex-shrink: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 14h2v2h-2zm1-10a4 4 0 0 1 4 4c0 2-3 2.5-3 4h-2c0-2.5 3-3 3-4a2 2 0 0 0-4 0H8a4 4 0 0 1 4-4z"/></svg>선택 필요</span>
              <span style="font-size: 13.5px; font-weight: 700; white-space: nowrap">어느 업종 관점으로 분석할까요?</span>
              <span style="flex-grow: 1"></span>
              <span style="font-size: 12px; color: #596170; white-space: nowrap">1 · 2위 차이 <span style="font-family: Manrope, sans-serif; font-weight: 700; color: #121417">0.03</span> · 기준 0.10 미만</span>
            </div>

            <!-- 읽힌 단서 -->
            <div style="padding: 12px 16px 4px 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
              <span style="font-size: 12px; font-weight: 600; color: #596170; margin-right: 4px; white-space: nowrap">읽힌 단서</span>
              <sc-for list="{{clues}}" as="c" hint-placeholder-count="6">
                <span style="height: 26px; box-sizing: border-box; padding: 0 4px 0 9px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap">{{c.t}}<span style="{{c.tagStyle}}">{{c.code}}</span></span>
              </sc-for>
            </div>

            <!-- 선택지 -->
            <div style="padding: 10px 16px 0 16px; display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
                <label style="{{o.box}}">
                  <input type="radio" name="ind" checked="{{o.on}}" style="accent-color: #1428a0; margin: 4px 0 0 0; flex-shrink: 0">
                  <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
                    <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
                      <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{o.name}}</span>
                      <sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}">
                        <span style="font-size: 10.5px; font-weight: 700; color: #ffffff; background: #1428a0; border-radius: 999px; padding: 2px 7px; white-space: nowrap">추천</span>
                      </sc-if>
                    </div>
                    <span style="font-size: 12px; color: #3d4452; line-height: 1.5">{{o.desc}}</span>
                    <div style="display: flex; align-items: center; gap: 8px">
                      <div style="width: 64px; height: 6px; border-radius: 999px; background: #eef0f3; overflow: hidden; flex-shrink: 0"><div style="{{o.bar}}"></div></div>
                      <span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #121417">{{o.score}}</span>
                      <span style="font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 700; color: #1428a0; white-space: nowrap">{{o.codes}}</span>
                    </div>
                  </div>
                  <div style="display: flex; gap: 8px; flex-shrink: 0">
                    <sc-for list="{{o.thumbs}}" as="t" hint-placeholder-count="3">
                      <div style="width: 120px; height: 68px"><dc-import name="Thumb" kind="{{t.kind}}" n="{{t.n}}" hint-size="120px,68px"></dc-import></div>
                    </sc-for>
                  </div>
                </label>
              </sc-for>
            </div>
            <div style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #596170">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">답이 없으면 추천(호텔 · 리조트)으로 진행하고, 결과 화면의 업종 칩에서 언제든 바꿀 수 있어요.</span>
            </div>
          </div>

          <!-- 이미 자동으로 정한 것 -->
          <div style="display: flex; align-items: center; gap: 6px; height: 30px; min-width: 0">
            <span style="font-size: 12px; font-weight: 600; color: #596170; white-space: nowrap; margin-right: 4px">자동으로 정한 것</span>
            <sc-for list="{{done}}" as="d" hint-placeholder-count="4">
              <span style="height: 26px; box-sizing: border-box; padding: 0 9px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>{{d}}</span>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 14px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; display: flex; align-items: center; justify-content: space-between">
          <div style="font-size: 13px; font-weight: 600">업종 확인 <span style="color: #596170; font-weight: 500">· 선택 필요 1 · 나머지 6개는 자동으로 정했어요</span></div>
          <a href="MIR.dc.html" style="font-size: 12.5px; font-weight: 600; white-space: nowrap">언제 묻는지 보기</a>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; gap: 10px">
          <label for="hint" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">판단에 도움이 될 말</label>
          <div style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; display: flex; align-items: center; gap: 8px; padding: 0 12px">
            <input id="hint" placeholder="판단에 도움이 될 말 (예: 결재는 호텔 F&amp;B 팀장)" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none">
            <button aria-label="보내기" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: none; background: #e2e5ea; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
          <a href="MI1.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; flex-shrink: 0">이전</a>
          <a href="MI3G.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap">
            <span>호텔 · 리조트로 분석 시작</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // 회의록에서 읽힌 단서와 그 단서가 가리키는 업종
    const C = [['로비', 'HT'], ['투숙객', 'HT'], ['객실 320실', 'HT'], ['라운지 카페', 'FB'], ['메뉴보드', 'FB'], ['음료 피크타임', 'FB']];
    const clues = C.map(([t, code]) => ({
      t, code,
      tagStyle: 'height: 18px; padding: 0 6px; border-radius: 999px; font-family: Manrope, sans-serif; font-size: 10.5px; font-weight: 800; display: inline-flex; align-items: center; ' + (code === 'HT' ? 'background: #1428a0; color: #ffffff;' : 'background: #f0f2f5; color: #3d4452;')
    }));
    // 선택지: [이름, 설명, 점수, 레이아웃 코드, 썸네일 3, 추천]
    const O = [
      ['호텔 · 리조트', '호텔 운영 관점 — 로비 · 객실 경험, 투숙객 여정, 호텔 매출 구조. 사례 17건', 0.58, 'MI-HT-A · B · C', ['barline', 'process', 'journey'], true],
      ['외식 · 카페', '매장 운영 관점 — 메뉴 · 피크 주문, 손님 체류, 가맹 구조. 사례 23건', 0.55, 'MI-FB-A · B · C', ['barline', 'process', 'journey'], false],
      ['섞어서 보기', '시장 · 비즈니스는 호텔로, 사용자 여정은 라운지 카페 손님으로', 0.57, 'MI-HT-A · B + MI-FB-C', ['barline', 'process', 'journey'], false]
    ];
    const opts = O.map(([name, desc, s, codes, thumbs, rec]) => ({
      name, desc, codes, rec, on: rec,
      thumbs: thumbs.map((kind) => ({ kind, n: 3 })),
      score: s.toFixed(2),
      bar: 'width: ' + Math.round(s * 100) + '%; height: 6px; border-radius: 999px; background: ' + (rec ? '#1428a0' : '#8a91a0') + ';',
      box: 'display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px; border-radius: 12px; cursor: pointer;' + (rec ? ' border: 1.5px solid #1428a0; background: #f5f7fd;' : ' border: 1px solid #e2e5ea; background: #ffffff;')
    }));
    const done = ['쓰임 · 표준 MI 3시트', '범위 · 4개 영역', '경쟁사 · 익명 A · B · C', '사내 자료 · 호텔 17 + 외식 23건'];
    return { steps: ['고객 요구사항', '분석 범위', '분석 결과'], cur: 2, clues, opts, done };
  }
}
</script>
</body>
</html>
