<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DSS · 솔루션 고르기 팝업</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.o-ghost:hover{background:#f3f5fd}
.o-aib:hover{background:#eaeefb}
.o-card:focus-visible,.o-ghost:focus-visible,.o-btn:focus-visible,.o-aib:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="솔루션 고르기" style="width: 820px; height: 700px; box-sizing: border-box; border-radius: 18px; background: #f5f6f8; box-shadow: 0 28px 72px rgba(18,20,23,0.32); display: flex; flex-direction: column; overflow: hidden; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <div style="height: 72px; box-sizing: border-box; padding: 0 16px 0 24px; background: #ffffff; border-bottom: 1px solid #e2e5ea; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
      <span style="font-size: 17px; font-weight: 700">솔루션 고르기 · 0개 이상</span>
      <span style="font-size: 12.5px; color: #596170">{{sub}}</span>
    </span>
    <button class="o-aib" onClick="{{runAi}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #c9d1f2; background: #ffffff; color: #1428a0; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/></svg>AI 솔루션 추천</button>
    <button class="o-ghost" onClick="{{close}}" aria-label="닫기" style="width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{overlap}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex-shrink: 0; display: flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #fff4dc; color: #7a4f00; font-size: 12.5px; font-weight: 600">MagicINFO와 VXT는 둘 다 사이니지 CMS예요. 같은 사이니지에 함께 쓰는 경우는 드물어요.</div>
    </sc-if>
    <sc-for list="{{sols}}" as="o" hint-placeholder-count="5">
      <div style="{{o.wrap}}">
        <button class="o-card" role="checkbox" aria-checked="{{o.on}}" onClick="{{o.toggle}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 0; border: none; background: transparent; text-align: left; color: #121417; flex-grow: 1; min-width: 0">
          <span style="{{o.box}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></sc-if></span>
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14.5px; font-weight: 700">{{o.t}}</span><sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 7px; border-radius: 5px; border: 1px dashed #1428a0; color: #1428a0; font-size: 11px; font-weight: 700; display: flex; align-items: center">AI 추천</span></sc-if></span>
            <span style="font-size: 12.5px; color: #596170; line-height: 1.5">{{o.d}} · <b style="font-weight: 600; color: #3d4452">함께 쓰는 제품</b> {{o.links}}</span>
            <sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #1428a0">근거 · {{o.why}}</span></sc-if>
          </span>
        </button>
        <button class="o-ghost" style="align-self: center; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0">상세</button>
      </div>
    </sc-for>
  </div>
  <div style="height: 72px; box-sizing: border-box; padding: 0 24px; background: #ffffff; border-top: 1px solid #e2e5ea; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <span style="font-size: 13px; color: #596170; flex-grow: 1">{{selLine}}</span>
    <button class="o-ghost" onClick="{{close}}" style="height: 44px; padding: 0 16px; border-radius: 11px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 14px; font-weight: 600">취소</button>
    <button class="o-btn" onClick="{{close}}" style="height: 44px; padding: 0 20px; border-radius: 11px; border: none; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 700">고른 솔루션 넣기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["saved","editing","new","draft"],"default":"draft"},"ai":{"editor":"boolean","default":false},"onClose":{"editor":null},"$preview":{"width":820,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const pai = !!this.props.ai;
    const SAVED = this.props.mode === 'saved' || this.props.mode === 'editing';
    const K = String(pai) + (SAVED ? 's' : '');
    const s = Object.assign(SAVED ? { on: { 0: true, 1: true, 2: true }, ai: false } : { on: pai ? { 0: true } : {}, ai: pai }, (this.state && this.state.k === K) ? this.state : {});
    const put = (p) => this.setState(Object.assign({}, s, p, { k: K }));
    // [이름, 설명, 함께 쓰는 제품, AI 근거]
    const SO = SAVED ? [
      ['MagicINFO', '사이니지 콘텐츠를 한 곳에서 배포 · 예약', '로비 · 라운지 · 회의실 · 공용공간 사이니지 · The Wall', 'RQ-01 업무환경 플랫폼'],
      ['SmartThings Pro', '공간 기기 · 센서를 연결하고 자동화', '회의실 Flip · 키오스크 · 센서', 'RQ-01 예측 · 반응형 공간'],
      ['b.IoT', '빌딩 설비 · 에너지 데이터를 관제실로', '중앙관제실 비디오월 · 센서', ''],
      ['VXT', '클라우드형 사이니지 CMS · 구독형', '로비 · 라운지 · 공용공간 사이니지', ''],
      ['Knox', '모바일 · 업무 기기 보안 관리', '—', '']
    ] : [
      ['MagicINFO', '사이니지 콘텐츠를 한 곳에서 배포 · 예약', '로비 · 라운지 · 공용 공간 사이니지 · 전시 미디어월', 'RQ-05 1 입주사 안내 · 사이니지 6대'],
      ['SmartThings Pro', '공간 기기 · 센서를 연결하고 자동화', '공용 회의실 Flip · 키오스크 · 센서', 'RQ-05 1 공용 회의실 예약'],
      ['b.IoT', '빌딩 설비 · 에너지 데이터를 관제실로', '통합 관제실 비디오월 · 센서', 'RQ-05 3 단지 에너지 모니터링'],
      ['VXT', '클라우드형 사이니지 CMS · 구독형', '로비 · 라운지 · 공용 공간 사이니지', ''],
      ['Knox', '모바일 · 업무 기기 보안 관리', '—', '']
    ];
    const sols = SO.map(([t, d, links, why], i) => {
      const on = !!s.on[i];
      const rec = s.ai && !!why;
      return { t, d, links, why, rec, on,
        wrap: 'box-sizing: border-box; padding: 14px 14px 14px 16px; border-radius: 14px; background: #ffffff; display: flex; gap: 10px; flex-shrink: 0;' + (on ? ' border: 2px solid #1428a0;' : rec ? ' border: 1.5px dashed #1428a0;' : ' border: 1px solid #e2e5ea;'),
        box: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center;' + (on ? ' background: #1428a0;' : ' border: 2px solid #c9d0e6; background: #ffffff;'),
        toggle: () => put({ on: Object.assign({}, s.on, { [i]: !on }) }) };
    });
    const n = Object.keys(s.on).filter((k) => s.on[k]).length;
    return {
      sub: SAVED ? 'DSS-01 공간 제품과 함께 쓸 솔루션 · 고르지 않아도 저장돼요' : '판교 스타트업 단지 공간 제품과 함께 쓸 솔루션 · 고르지 않아도 저장돼요',
      sols, overlap: !!(s.on[0] && s.on[3]),
      selLine: n ? '솔루션 ' + n + '개 골랐어요 · 넣으면 DSS 화면의 솔루션 칸에 들어가요' : '솔루션 없이 닫아도 돼요',
      runAi: () => put({ ai: true }), close: this.props.onClose || (() => {})
    };
  }
}
</script>
</body>
</html>
