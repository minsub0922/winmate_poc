      '삼성 키오스크': AI ? [['로비', '방문객 등록 대기를 줄임', '예약 없이 온 손님도 기다리지 않게 하고 싶어요', 'pend', 'RQ-01 인식 · 반응', 'pend']] : [],
      'Flip Pro WA75D': [['회의실', '회의 내용이 끊기지 않고 이어짐', '회의 끝나도 판서 내용이 사라지지 않았으면 해요', 'manual', 'RQ-01 업무환경 플랫폼', 'manual'], ['회의실', '케이블 없이 바로 화면 공유', AI ? '회의 시작할 때 케이블 찾느라 시간 버리고 싶지 않아요' : '', AI ? 'pend' : '', 'RQ-01 업무환경 플랫폼', 'manual']],

    const tagBase = 'height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0;';
