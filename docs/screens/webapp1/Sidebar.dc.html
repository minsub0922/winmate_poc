<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사이드바 컴포넌트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<aside style="width: 260px; height: 900px; box-sizing: border-box; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e2e5ea; display: flex; flex-direction: column; padding: 20px 14px 16px 14px; gap: 6px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px 8px; color: #121417">
    <div style="width: 28px; height: 28px; border-radius: 8px; background: #1428a0; display: flex; align-items: center; justify-content: center; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 15px">W</div>
    <div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">winmate</div>
  </a>
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #1428a0; background: #ffffff; color: #1428a0; font-size: 14px; font-weight: 600">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>새 작업</span>
  </a>
  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #596170; padding: 18px 10px 6px 10px">작업 내역</div>

  <div style="display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="10">
      <a href="{{g.listHref}}" style="{{g.rowStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.iconColor}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{g.icon}}"/></svg>
        <span style="flex-grow: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
        <span style="font-size: 11px; color: #596170; background: #f0f2f5; border-radius: 999px; padding: 2px 7px">{{g.count}}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{g.chev}}"/></svg>
      </a>
      <sc-if value="{{g.expanded}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 22px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" style="{{it.style}}">{{it.title}}</a>
          </sc-for>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 0 8px; border-top: 1px solid #e2e5ea">
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #eaeefb; color: #1428a0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">최</div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <div style="font-size: 13px; font-weight: 600">최민섭</div>
      <div style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Samsung Research · AX그룹</div>
    </div>
    <button aria-label="설정" style="width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#ffffff"/><circle cx="15" cy="12" r="2" fill="#ffffff"/><circle cx="8" cy="17" r="2" fill="#ffffff"/></svg>
    </button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"group":{"editor":"enum","options":["","requirements","storyboard","dss","market","competitor","value","spec","scenario","image","birdseye","proposal"],"default":""},"current":{"editor":"text","default":""},"$preview":{"width":260,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const group = this.props.group ?? '';
    const current = this.props.current ?? '';
    const GROUPS = [
      { key: 'requirements', name: '고객 요구사항', href: 'RQ1.dc.html', icon: 'M9 4h6v3H9z M7 5.5H5V21h14V5.5h-2 M8.5 12h7 M8.5 16h5',
        items: ['E 자산운용 · 용산 오피스', 'F 시행사 · 동탄 시니어', 'G 공사 · 판교 스타트업 단지'] },
      { key: 'storyboard', name: '전략 수립 Storyboard', href: 'SB1.dc.html', icon: 'M4 5h16v14H4z M4 11h16 M10 11v8',
        items: ['용산 AI Ready 오피스', '용산 AI Ready 오피스 · 분기 B', 'A 커피 매장 리뉴얼'] },
      { key: 'dss', name: '공간별 제품 매칭 DSS', href: 'DS2.dc.html', icon: 'M3 21h18 M5 21V9l7-5 7 5v12 M9 21v-6h6v6',
        items: ['용산 오피스 공간별 제품', '판교 스타트업 단지 DSS'] },
      { key: 'market', name: 'Market Intelligence', href: 'MI2.dc.html', icon: 'M4 20V10 M10 20V4 M16 20v-8 M22 20H2',
        items: ['용산 오피스 시장 분석', '용산 · 리테일 테넌트 관점'] },
      { key: 'competitor', name: '경쟁사 분석', href: 'CA2.dc.html', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M21 3l-4 4',
        items: ['A 커피 메뉴보드 경쟁사'] },
      { key: 'value', name: 'Value Proposition', href: 'VP2.dc.html', icon: 'M6 4h12l3 5-9 11L3 9l3-5z M3 9h18 M9.5 9L12 20l2.5-11', items: [] },
      { key: 'spec', name: 'Spec 시트 생성', href: 'SP2.dc.html', icon: 'M6 3h8l5 5v13H6V3z M14 3v5h5 M9 13h7 M9 17h7',
        items: ['A 커피 메뉴보드 스펙'] },
      { key: 'scenario', name: '공간 시나리오 생성', href: 'SC2.dc.html', icon: 'M4 6h16v12H4z M10 9l5 3-5 3V9z', items: [] },
      { key: 'image', name: '이미지 생성', href: 'https://claude.ai/artifact/HrArDmhk9qC7pKKfvEyaqX', icon: 'M4 5h16v14H4z M9 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z M20 15l-5-5-8 8',
        items: ['카페 매장 메뉴보드 시안', '로비 배경 이미지'] },
      { key: 'birdseye', name: '공간 조감도 생성', href: 'https://claude.ai/artifact/HrArDmhk9qC7pKKfvEyaqX', icon: 'M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z M12 12l8-4.5 M12 12v9 M12 12L4 7.5',
        items: ['강남 플래그십 1층 로비', 'B 병원 외래 대기실'] },
      { key: 'proposal', name: 'B2B 제안서 생성', href: 'https://claude.ai/artifact/Jd1mPcNMqvZoeBjfKFxeJe', icon: 'M3 4h18v12H3z M8 20h8 M12 16v4 M7 12l3-3 2 2 4-4',
        items: ['A 커피 프랜차이즈 메뉴보드 제안', 'B 병원 안내 시스템 제안'] }
    ];
    // 그룹 이름 → 그 기능의 목록, 작업 항목 → 그 작업이 지금 있는 화면
    const LIST = {'requirements': 'RQ0', 'storyboard': 'SB0', 'dss': 'DS0', 'market': 'MI0', 'competitor': 'CA0', 'value': 'VP0', 'spec': 'SP0', 'scenario': 'SC0', 'image': 'IMG0', 'birdseye': 'BE0', 'proposal': 'PR0'};
    const ITEM = {"E 자산운용 · 용산 오피스": "RQ1", "F 시행사 · 동탄 시니어": "RQ1", "G 공사 · 판교 스타트업 단지": "RQ1", "용산 AI Ready 오피스": "SB1", "용산 AI Ready 오피스 · 분기 B": "SB1", "A 커피 매장 리뉴얼": "SB1", "용산 오피스 공간별 제품": "DS2", "판교 스타트업 단지 DSS": "DS2", "용산 오피스 시장 분석": "MI2", "용산 · 리테일 테넌트 관점": "MI2", "A 커피 메뉴보드 경쟁사": "CA2", "A 커피 메뉴보드 스펙": "SP2", "카페 매장 메뉴보드 시안": "IMG3", "로비 배경 이미지": "IMG3G", "강남 플래그십 1층 로비": "BE5", "B 병원 외래 대기실": "BE4", "A 커피 프랜차이즈 메뉴보드 제안": "PR7", "B 병원 안내 시스템 제안": "PR3"};
    // 다른 캔버스에 있는 화면은 그 캔버스를 새 탭으로 엽니다
    const B = 'https://claude.ai/artifact/HrArDmhk9qC7pKKfvEyaqX', G = 'https://claude.ai/artifact/Jd1mPcNMqvZoeBjfKFxeJe';
    const EXT = {"BE0.dc.html": B, "BE4.dc.html": B, "BE5.dc.html": B, "IMG0.dc.html": B, "IMG3.dc.html": B, "IMG3G.dc.html": B, "PR0.dc.html": G, "PR3.dc.html": G, "PR7.dc.html": G};
    const ext = (f) => EXT[f] || f;
    const rowBase = 'display: flex; align-items: center; gap: 9px; height: 38px; width: 100%; padding: 0 10px; border-radius: 8px; border: none; background: transparent; color: #121417; font-size: 13.5px; font-family: inherit; text-align: left;';
    const itemBase = 'display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
    const groups = GROUPS.map((g) => {
      const expanded = g.key === group;
      return {
        name: g.name, icon: g.icon, count: g.items.length, expanded, listHref: ext(LIST[g.key] + '.dc.html'),
        iconColor: expanded ? '#1428a0' : '#596170',
        chev: expanded ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6',
        rowStyle: rowBase + (expanded ? ' font-weight: 600; background: #f5f6f8;' : ' font-weight: 400;'),
        items: g.items.map((t) => ({
          title: t, href: ext((ITEM[t] || g.href.replace('.dc.html', '')) + '.dc.html'),
          style: itemBase + (t === current ? ' background: #eaeefb; color: #1428a0; font-weight: 600;' : ' color: #121417;')
        }))
      };
    });
    return { groups };
  }
}
</script>
</body>
</html>
