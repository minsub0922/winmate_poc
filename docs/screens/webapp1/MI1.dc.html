<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Intelligence 1/3 — 고객 요구사항</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="market" current="A 커피 프랜차이즈 시장·경쟁사 분석" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="Market Intelligence" title="새 작업" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; gap: 12px">
          <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
          <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 3px; flex-grow: 1">
            <div style="font-size: 14.5px; line-height: 1.65">어떤 고객 요구사항을 기준으로 시장을 분석할까요? 고객사와 업종, 해결하려는 과제를 적어주시면 시장·고객사·사용자·경쟁사 관점에서 조사합니다.</div>
            <div style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #ffffff; border: 1px dashed #1428a0">
              <div style="width: 34px; height: 34px; border-radius: 9px; background: #eaeefb; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M4 11h16 M10 11v8"/></svg></div>
              <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
                <div style="font-size: 13px; font-weight: 600">Storyboard 작업에서 요구사항을 가져올까요?</div>
                <div style="font-size: 12px; color: #596170">"A 커피 프랜차이즈 매장 리뉴얼" 의 고객 요구사항과 Key Message를 그대로 사용합니다.</div>
              </div>
              <button style="height: 32px; padding: 0 12px; border-radius: 8px; border: none; background: #1428a0; color: #ffffff; font-size: 12.5px; font-weight: 600; flex-shrink: 0">가져오기</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 16px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; font-size: 13px; font-weight: 600">고객 요구사항 <span style="color: #596170; font-weight: 500">· 1 / 3</span></div>
        <div style="padding: 10px 18px 0 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 5px">
            <label for="cust" style="font-size: 12px; color: #596170">고객사</label>
            <div style="height: 38px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; padding: 0 12px"><input id="cust" placeholder="예) A 커피 프랜차이즈" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none"></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px">
            <span style="font-size: 12px; color: #596170">업종 <span style="color: #8a91a0">· 16개 업종 중 자동 판별</span></span>
            <div style="height: 38px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 10px; background: #ffffff; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px">
              <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>자동</span>
              <span style="font-size: 12.5px; color: #8a91a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0">입력하면 업종과 레이아웃을 알아서 골라요</span>
              <a href="MI1I.dc.html" style="height: 28px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0">직접 고르기</a>
            </div>
          </div>
        </div>
        <div style="padding: 10px 18px 0 18px">
          <label for="req" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">요구사항 입력</label>
          <textarea id="req" placeholder="해결하려는 과제와 배경 (예: 320개 매장 디지털 메뉴보드 교체, 본사 일괄 관리, 전기료 절감…)" style="width: 100%; height: 96px; box-sizing: border-box; resize: none; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #121417; outline: none"></textarea>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="display: flex; align-items: center; gap: 6px">
            <button aria-label="파일 첨부" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L16 7"/></svg></button>
            <span style="font-size: 12.5px; color: #596170">RFP · 고객사 IR 자료 첨부 시 분석 정확도가 올라갑니다</span>
          </div>
          <a href="MI2A.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
            <span>다음 · 분석 설계</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { steps: ['고객 요구사항', '분석 범위', '분석 결과'], cur: 1 }; }
}
</script>
</body>
</html>
