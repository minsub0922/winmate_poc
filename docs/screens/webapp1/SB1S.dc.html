<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Storyboard · 설정 바꾸기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="storyboard" current="E 자산운용 용산 오피스 제안 기획" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="전략 수립 Storyboard" title="E 자산운용 용산 오피스 제안 기획" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <span style="display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12.5px; font-weight: 700; color: #1428a0">요구사항 불러오기 · 설정</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35">스토리보드 설정</h1>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #596170">정의서에서 읽은 값으로 골라 뒀어요. 바꿀 것만 바꾸세요.</p>
      </div>
      <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 16px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 16px; height: 72px; box-sizing: border-box; padding: 0 20px;">
          <span style="width: 84px; flex-shrink: 0; font-size: 14px; font-weight: 600">제안 단계</span>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <div style="align-self: flex-start; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f0f2f5"><button aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: #ffffff; color: #1428a0; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);">컨셉 제안</button><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">본제안</button></div>
            <span style="font-size: 12px; color: #8a91a0; white-space: nowrap">요청서: 사업계획 · 공간 구성 단계</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; height: 72px; box-sizing: border-box; padding: 0 20px; border-top: 1px solid #f0f2f5;">
          <span style="width: 84px; flex-shrink: 0; font-size: 14px; font-weight: 600">문서 형식</span>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <div style="align-self: flex-start; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f0f2f5"><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">공통 Pitch deck</button><button aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: #ffffff; color: #1428a0; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);">고객 맞춤 제안</button></div>
            <span style="font-size: 12px; color: #8a91a0; white-space: nowrap">공통 Pitch deck은 여러 고객에게 쓸 때</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; height: 72px; box-sizing: border-box; padding: 0 20px; border-top: 1px solid #f0f2f5;">
          <span style="width: 84px; flex-shrink: 0; font-size: 14px; font-weight: 600">분량</span>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <div style="align-self: flex-start; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f0f2f5"><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">약 12장</button><button aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: #ffffff; color: #1428a0; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);">약 20장</button><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">약 30장</button></div>
            <span style="font-size: 12px; color: #8a91a0; white-space: nowrap">7개 공간을 담으려면 20장 이상</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; height: 72px; box-sizing: border-box; padding: 0 20px; border-top: 1px solid #f0f2f5;">
          <span style="width: 84px; flex-shrink: 0; font-size: 14px; font-weight: 600">언어</span>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <div style="align-self: flex-start; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f0f2f5"><button aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: #ffffff; color: #1428a0; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);">한국어</button><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">영문</button><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">한 · 영 병기</button></div>
            
          </div>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <a href="SB1.dc.html" style="display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #596170; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>정의서</a>
        <span style="flex-grow: 1"></span>
        
        <a href="SB1.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap">저장</a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { steps: ["요구사항 불러오기", "기획 방향", "목차 · 서사", "요구 추적", "일정 · 공유"], cur: 1 };
  }
}
</script>
</body>
</html>
