<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Storyboard · 수정 요청</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="storyboard" current="E 자산운용 용산 오피스 제안 기획" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="전략 수립 Storyboard" title="E 자산운용 용산 오피스 제안 기획" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <span style="display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12.5px; font-weight: 700; color: #1428a0">목차 · 수정 요청</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35">어떻게 바꿀까요?</h1>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #596170">섹션 하나씩 다시 써요. 검토 중인 내용과 [확인 필요]는 그대로 둬요.</p>
      </div>
      <div style="box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 1.5px solid #1428a0; border-radius: 18px; box-shadow: 0 10px 32px rgba(20,40,160,0.10); display: flex; flex-direction: column">
        <button style="margin: 14px 18px 0 18px; align-self: flex-start; height: 34px; box-sizing: border-box; padding: 0 10px 0 12px; border-radius: 9px; border: 1px solid #e2e5ea; background: #fbfbfc; color: #121417; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap"><span style="color: #8a91a0">고칠 섹션</span><b style="font-weight: 700">Part 1-2 Tech Ready 모델의 성과</b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div style="padding: 10px 18px 0 18px">
          <label for="rev" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">어떻게 바꿀까요</label>
          <textarea id="rev" placeholder="예) 경영진용으로 짧게. 성과 3가지는 한 장 비교표로, 임대료 프리미엄 주장은 출처 확인 전까지 각주로" style="width: 100%; height: 120px; box-sizing: border-box; resize: none; border: none; background: transparent; padding: 4px 2px; font-size: 14.5px; line-height: 1.65; color: #121417; outline: none"></textarea>
        </div>
        <div style="padding: 12px 14px 12px 18px; border-top: 1px solid #f0f2f5; display: flex; align-items: center; gap: 8px"><button aria-pressed="false" style="height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-weight: 500;">더 짧게</button><button aria-pressed="false" style="height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-weight: 500;">비교표로</button><button aria-pressed="false" style="height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-weight: 500;">주장은 각주로</button></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
        <span style="font-size: 13.5px; font-weight: 600">다시 쓸 범위</span>
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #e9ebef"><button aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: #ffffff; color: #1428a0; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);">이 섹션만</button><button aria-pressed="false" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; font-size: 13.5px; white-space: nowrap; background: transparent; color: #596170; font-weight: 500;">Part 1 전체</button></div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <a href="SB3.dc.html" style="display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #596170; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>목차</a>
        <span style="flex-grow: 1"></span>
        
        <a href="SB3R2.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap">다시 쓰기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { steps: ["요구사항 불러오기", "기획 방향", "목차 · 서사", "요구 추적", "일정 · 공유"], cur: 3 };
  }
}
</script>
</body>
</html>
