<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Spec 시트 · 본문 (형식 · 항목 · 제품을 그 자리에서 고치기)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
.e-in:hover{border-color:#e0c27a}
.e-in:focus{border-color:#1428a0;box-shadow:0 0 0 3px rgba(20,40,160,0.12)}
.e-ghost:hover{background:#f3f5fd}
.e-seg:focus-visible,.e-ghost:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div style="width: 1100px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <div style="flex-shrink: 0; height: 48px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e5ea; display: flex; align-items: center; gap: 10px">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="2">
      <span style="font-size: 12.5px; font-weight: 700; color: #3d4452; white-space: nowrap">{{g.k}}</span>
      <span role="radiogroup" aria-label="{{g.k}}" style="height: 32px; box-sizing: border-box; padding: 3px; border-radius: 8px; background: #f0f2f5; display: flex; gap: 2px; margin-right: 6px">
        <sc-for list="{{g.vs}}" as="v" hint-placeholder-count="2"><button class="e-seg" role="radio" aria-checked="{{v.on}}" style="{{v.style}}">{{v.t}}</button></sc-for>
      </span>
    </sc-for>
    <span style="font-size: 12.5px; font-weight: 700; color: #3d4452; white-space: nowrap">항목</span>
    <button class="e-ghost" aria-haspopup="listbox" style="{{itemBtn}}">{{itemLabel}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <span style="font-size: 12.5px; color: #596170; white-space: nowrap; margin-left: 4px"><b style="font-weight: 700; color: #3d4452">값</b> 공식 카탈로그</span>
    <span style="flex-grow: 1"></span>
    <sc-for list="{{warns}}" as="w" hint-placeholder-count="1"><span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #fff4dc; color: #7a4f00; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{w}}</span></sc-for>
    <button class="e-ghost" onClick="{{openPick}}" style="height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16 M4 12h10 M4 18h6"/></svg>제품 고르기 · {{pickLine}}</button>
  </div>
  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: auto">
    <div style="{{gridStyle}}">
      <sc-for list="{{grid}}" as="g" hint-placeholder-count="40">
        <sc-if value="{{g.input}}" hint-placeholder-val="{{false}}"><span style="{{g.cell}}"><input class="e-in" aria-label="{{g.label}}" value="{{g.t}}" placeholder="[확인 필요]" style="{{g.inStyle}}"></span></sc-if>
        <sc-if value="{{g.text}}" hint-placeholder-val="{{true}}"><span style="{{g.style}}">{{g.t}}</span></sc-if>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{hasOut}}" hint-placeholder-val="{{false}}">
    <div style="flex-shrink: 0; height: 40px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 10px; border: 1px dashed #d5d9e0; background: #fbfbfc; display: flex; align-items: center; gap: 10px">
      <span style="font-size: 12.5px; font-weight: 700; color: #3d4452">시트에서 뺀 제품</span>
      <sc-for list="{{outs}}" as="o" hint-placeholder-count="1"><span style="height: 26px; padding: 0 4px 0 10px; border-radius: 7px; background: #eaeefb; box-shadow: inset 3px 0 0 #1428a0; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap">{{o}}<button class="e-ghost" style="height: 22px; padding: 0 6px; border-radius: 5px; border: none; background: transparent; color: #1428a0; font-size: 11.5px; font-weight: 700">다시 넣기</button></span></sc-for>
    </div>
  </sc-if>
  <span style="font-size: 11.5px; color: #8a91a0; flex-shrink: 0">값은 공식 카탈로그에서 채워요 · 카탈로그에 없는 값은 [확인 필요]로 남기고, 노란 칸에 원문 값을 바로 적어요</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["saved","editing","new","draft"],"default":"saved"},"h":{"editor":"int","default":682},"onPop":{"editor":null},"$preview":{"width":1100,"height":682}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'saved';
    const EDIT = mode === 'editing';
    const CHG = ' border: 1.5px solid #1428a0; background: #f6f8fe;';
    const seg = (on, chg) => 'height: 26px; padding: 0 10px; border-radius: 6px; border: none; font-size: 12px; white-space: nowrap;' + (on ? ' background: #ffffff; color: #121417; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);' : ' background: transparent; color: #596170; font-weight: 600;') + (chg ? ' box-shadow: 0 0 0 2px #1428a0;' : '');
    const segs = [['형식', ['비교표', '제품별 1장'], 0], ['표기', ['한국어 · mm', '영문 · inch'], 0]].map(([k, vs, cur]) => ({ k, vs: vs.map((t, i) => ({ t, on: i === cur, style: seg(i === cur, false) })) }));
    const FIELDS = ['화면 크기 · 해상도', '밝기 · 명암비', '입출력 단자', '소비전력', '크기 · 무게', '설치 방식'].concat(EDIT ? ['보증'] : []);
    const MODELS = [['The Wall IAB 146"', '로비', '1식'], ['Smart Signage QM55C', '로비 · 라운지', '3대'], ['삼성 키오스크', '로비', '1대'], ['Flip Pro WA75D', '회의실', null], ['Smart Signage QB55C', '회의실', '실당 1대'], ['Smart Signage QB43C', '사무실 · 공용공간', '층당 1대'], ['비디오월 VM55B', '중앙관제실', '2×2'], ['옥외형 사이니지 OHC55', '주차장', '1대'], ['SmartThings 센서', '공용공간', null]]
      .filter((m) => !(EDIT && m[0] === '옥외형 사이니지 OHC55'));
    const warnModel = '삼성 키오스크';
    const cell = 'box-sizing: border-box; min-height: 44px; padding: 0 12px; display: flex; align-items: center; border-top: 1px solid #f0f2f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px;';
    const head = cell + ' min-height: 40px; border-top: none; background: #fbfbfc; font-size: 12px; font-weight: 700; color: #596170; position: sticky; top: 0;';
    const grid = [{ t: '제품', style: head, text: true }, { t: '공간 · 수량', style: head, text: true }].concat(FIELDS.map((t) => ({ t, text: true, style: head + (t === '보증' ? ' color: #1428a0; box-shadow: inset 0 -2px 0 #1428a0;' : '') })));
    MODELS.forEach(([name, space, qty]) => {
      const warn = name === warnModel;
      const sensor = name.indexOf('센서') >= 0;
      grid.push({ t: name, text: true, style: cell + ' font-weight: 700;' + (warn ? ' color: #7a4f00;' : '') });
      grid.push({ t: space + ' · ' + (qty || '[확인 필요]'), text: true, style: cell + ' color: #596170; font-size: 12px;' });
      FIELDS.forEach((f, fi) => {
        if (warn) { grid.push({ input: true, t: '', label: name + ' ' + f, cell: cell + ' padding: 0 6px;', inStyle: 'width: 100%; height: 32px; box-sizing: border-box; padding: 0 8px; border-radius: 7px; border: 1px solid #f1dfb3; background: #fff8e6; font-size: 12px; font-weight: 600; color: #7a4f00; outline: none;' }); return; }
        const na = sensor && fi < 2;
        grid.push({ t: na ? '해당 없음' : '카탈로그 값', text: true, style: cell + ' color: #8a91a0;' + (f === '보증' ? ' background: #f6f8fe;' : '') });
      });
    });
    return {
      h: this.props.h ?? 682, segs, grid,
      gridStyle: 'display: grid; grid-template-columns: 190px 160px repeat(' + FIELDS.length + ', minmax(116px, 1fr)); min-width: 100%;',
      itemLabel: '6개' + (EDIT ? ' + 보증' : '') + ' 고름',
      itemBtn: 'height: 32px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap;' + (EDIT ? CHG + ' color: #1428a0;' : ' border: 1px solid #e2e5ea; background: #ffffff; color: #121417;'),
      warns: ['삼성 키오스크 · 모델 코드 확인 필요'],
      pickLine: MODELS.length + '/9',
      hasOut: EDIT, outs: ['옥외형 사이니지 OHC55'],
      openPick: () => (this.props.onPop || (() => {}))('pick')
    };
  }
}
</script>
</body>
</html>
