<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제품 · 솔루션 고르기 팝업</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#a3a9b5}
.pp-row:hover{background:#f7f8fd}
.pp-btn:focus-visible,.pp-row:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="{{title}}" style="width: 760px; height: 640px; box-sizing: border-box; background: #ffffff; border-radius: 18px; box-shadow: 0 28px 72px rgba(18,20,23,0.28); display: flex; flex-direction: column; overflow: hidden; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 20px 16px 14px 24px; border-bottom: 1px solid #eef0f3; flex-shrink: 0">
    <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
      <span style="font-size: 18px; font-weight: 700">{{title}}</span>
      <span style="font-size: 12.5px; color: #596170; line-height: 1.5">{{sub}}</span>
    </span>
    <button class="pp-btn" onClick="{{close}}" aria-label="닫기" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <span style="font-size: 12px; font-weight: 700; color: #596170; margin-top: 2px">{{g.h}}</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <button class="pp-row" role="checkbox" aria-checked="{{r.on}}" onClick="{{r.toggle}}" style="{{r.wrap}}">
            <span style="{{r.box}}"><sc-if value="{{r.on}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></sc-if></span>
            <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1">
              <span style="font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
              <span style="font-size: 11.5px; color: #8a91a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.where}}</span>
            </span>
            <span style="{{r.kindStyle}}">{{r.kind}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
    <label for="pp-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">카탈로그에서 찾기</label>
    <input id="pp-search" placeholder="+ 카탈로그에서 제품 · 솔루션 찾기 (DSS 밖)" style="flex-shrink: 0; height: 38px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 10px; padding: 0 12px; font-size: 13px; color: #121417; outline: none">
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px 24px; border-top: 1px solid #eef0f3; flex-shrink: 0">
    <span style="{{noteStyle}}">{{noteLine}}</span>
    <button class="pp-btn" onClick="{{close}}" style="height: 40px; padding: 0 20px; border-radius: 10px; border: none; background: #1428a0; color: #ffffff; font-size: 13.5px; font-weight: 700">완료</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"제품 · 솔루션 고르기"},"sub":{"editor":"text","default":"DSS-01에서 고른 제품 · 솔루션이에요. 이 작업에 쓸 것을 고르세요."},"picked":{"editor":null},"min":{"editor":"number","default":0},"onToggle":{"editor":null},"onClose":{"editor":null},"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    // DSS-01 제품 · 솔루션 + 카탈로그 (DSS 밖)
    const ALL = [
      ['The Wall IAB 146"', '제품', 'DSS-01 · 로비'], ['Smart Signage QM55C', '제품', 'DSS-01 · 로비 · 라운지'], ['삼성 키오스크', '제품', 'DSS-01 · 로비'],
      ['Flip Pro WA75D', '제품', 'DSS-01 · 회의실'], ['Smart Signage QB55C', '제품', 'DSS-01 · 회의실'], ['Smart Signage QB43C', '제품', 'DSS-01 · 사무실 · 공용공간'],
      ['스마트 모니터', '제품', 'DSS-01 · 사무실 · R&D'], ['옥외형 사이니지 OHC55', '제품', 'DSS-01 · 주차장'], ['비디오월 VM55B', '제품', 'DSS-01 · 중앙관제실'],
      ['SmartThings 센서', '제품', 'DSS-01 · 공용공간'],
      ['MagicINFO', '솔루션', 'DSS-01 · 사이니지 공간 전체'], ['SmartThings Pro', '솔루션', 'DSS-01 · 공간 기기 전체'], ['b.IoT', '솔루션', 'DSS-01 · 중앙관제실'],
      ['VXT', '솔루션', '카탈로그 · DSS 밖'], ['Knox Suite', '솔루션', '카탈로그 · DSS 밖']
    ];
    const picked = Array.isArray(this.props.picked) ? this.props.picked : ['The Wall IAB 146"', 'MagicINFO'];
    const on = (n) => picked.indexOf(n) >= 0;
    const row = ([name, kind, where]) => {
      const o = on(name);
      return { name, kind, where, on: o,
        wrap: 'display: flex; align-items: center; gap: 10px; box-sizing: border-box; height: 52px; padding: 0 12px; border-radius: 10px; text-align: left; color: #121417; background: #ffffff;' + (o ? ' border: 1.5px solid #1428a0;' : ' border: 1px solid #e2e5ea;'),
        box: 'width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center;' + (o ? ' background: #1428a0;' : ' border: 2px solid #c9d0e6;'),
        kindStyle: 'height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 700; display: flex; align-items: center; flex-shrink: 0;' + (kind === '제품' ? ' background: #f0f2f5; color: #3d4452;' : ' background: #eaeefb; color: #1428a0;'),
        toggle: () => (this.props.onToggle || noop)(name) };
    };
    const groups = [
      ['DSS-01 · 제품', ALL.filter((x) => x[1] === '제품' && x[2].indexOf('DSS') === 0)],
      ['DSS-01 · 솔루션', ALL.filter((x) => x[1] === '솔루션' && x[2].indexOf('DSS') === 0)],
      ['카탈로그 · DSS에 없는 것', ALL.filter((x) => x[2].indexOf('카탈로그') === 0)]
    ].map(([h, xs]) => ({ h, rows: xs.map(row) }));
    const min = this.props.min ?? 0;
    const short = picked.length < min;
    return {
      title: this.props.title ?? '제품 · 솔루션 고르기', sub: this.props.sub ?? '', groups,
      noteLine: short ? '하나 이상 골라야 해요' : picked.length + '개 골랐어요',
      noteStyle: 'flex-grow: 1; font-size: 13px; font-weight: 600;' + (short ? ' color: #7a4f00;' : ' color: #596170;'),
      close: this.props.onClose || noop
    };
  }
}
</script>
</body>
</html>
