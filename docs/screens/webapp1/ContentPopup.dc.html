<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>연결된 콘텐츠 보기 팝업</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button{font-family:inherit;cursor:pointer}
.cp-btn:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="{{title}}" style="width: 820px; height: 680px; box-sizing: border-box; background: #ffffff; border-radius: 18px; box-shadow: 0 28px 72px rgba(18,20,23,0.28); display: flex; flex-direction: column; overflow: hidden; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <div style="display: flex; align-items: flex-start; gap: 14px; padding: 20px 18px 14px 24px; border-bottom: 1px solid #eef0f3; flex-shrink: 0">
    <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: #eaeefb; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{icon}}"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
      <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 600; color: #596170">{{kind}}</span><span style="height: 20px; padding: 0 7px; border-radius: 5px; background: #f0f2f5; color: #3d4452; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center">{{ref}}</span></span>
      <span style="font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #596170; flex-wrap: wrap">연결된 Storyboard<sc-for list="{{sbs}}" as="b" hint-placeholder-count="2"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #f7f8fd; border: 1px solid #c9d1f2; color: #1428a0; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{b}}</span></sc-for><span>· {{when}}</span></span>
    </div>
    <button class="cp-btn" onClick="{{close}}" aria-label="닫기" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
        <div style="box-sizing: border-box; padding: 10px 12px; border-radius: 10px; background: #f5f6f8; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 11.5px; color: #596170">{{f.k}}</span><span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.v}}</span></div>
      </sc-for>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; flex-shrink: 0">
        <div style="width: 130px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 2px">
          <span style="font-size: 13.5px; font-weight: 700">{{g.h}}</span>
          <sc-if value="{{g.hasSub}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; height: 20px; padding: 0 7px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; display: flex; align-items: center">{{g.sub}}</span></sc-if>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <sc-for list="{{g.lines}}" as="l" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 8px; min-height: 26px">
              <span style="font-size: 13px; line-height: 1.45; flex-grow: 1; min-width: 0">{{l.t}}</span>
              <sc-if value="{{l.hasNote}}" hint-placeholder-val="{{false}}"><span style="{{l.noteStyle}}">{{l.note}}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px 16px 24px; border-top: 1px solid #eef0f3; background: #fbfbfc; flex-shrink: 0">
    <span style="font-size: 12.5px; color: #596170; flex-grow: 1">{{foot}}</span>
    <a href="{{editHref}}" style="height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">편집 화면에서 고치기</a>
    <button class="cp-btn" onClick="{{close}}" style="height: 42px; padding: 0 18px; border-radius: 10px; border: none; background: #1428a0; color: #ffffff; font-size: 13.5px; font-weight: 700">닫기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"refId":{"editor":"enum","options":["RQ-01","DSS-01","MI-01"],"default":"RQ-01"},"onClose":{"editor":null},"$preview":{"width":820,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (t, kind) => ({ t, note: kind, hasNote: !!kind, noteStyle: 'height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0;' + (kind === '확인 필요' ? ' background: #fff4dc; color: #7a4f00;' : kind === '확장' ? ' border: 1px solid #121417; color: #121417;' : ' background: #f0f2f5; color: #3d4452;') });
    // [종류, 버전, 제목, 아이콘, 연결 Storyboard, 수정, 요약 3칸, 묶음[[제목, 부제, 줄[[내용, 표시]]]], 편집 화면, 아래 한 줄]
    const D = {
      'RQ-01': ['고객 요구사항', 'RQ-01 v2', '용산 업무시설 재개발 AI Ready 오피스', 'M9 4h6v3H9z M7 5.5H5V21h14V5.5h-2 M8.5 12h7 M8.5 16h5', ['용산 AI Ready 오피스', '분기 B'], '오늘 13:40 저장',
        [['고객사', 'E 자산운용'], ['최종 제안대상', '대표이사'], ['요구', '12 · 확인 필요 4']],
        [['대표이사', '50%', [['사용자를 인식하고 반응하는 AI Ready 오피스', ''], ['최초 AI Ready 공간으로 알리기', ''], ['에너지 사용량 20% 절감 · 실측 증빙', '']]],
         ['공간컨텐츠실장', '30%', [['오피스를 업무환경 플랫폼으로', '확인 필요'], ['예측 · 반응형 공간', ''], ['건물 가치 · 임대 선호도 제고', '']]],
         ['개발사업팀장', '20%', [['AI 인프라를 설계 단계에 반영', ''], ['시공 · 운영 유지보수 부담 최소화', '']]]],
        'RQ1.dc.html', '제작자 의견은 고객 문서에서 빠져요'],
      'DSS-01': ['공간별 제품 매칭 DSS', 'DSS-01 v1', '용산 오피스 공간별 제품', 'M3 21h18 M5 21V9l7-5 7 5v12 M9 21v-6h6v6', ['용산 AI Ready 오피스', '분기 B'], '오늘 10:10 저장',
        [['업종', '오피스 · 업무시설'], ['공간 · 제품', '7 · 12'], ['솔루션', 'MagicINFO · SmartThings Pro · b.IoT']],
        [['로비', '제품 3', [['The Wall IAB 146" · 1식', ''], ['Smart Signage QM55C · 2대', ''], ['삼성 키오스크 · 1대', '']]],
         ['회의실 · 사무실', '제품 4', [['Flip Pro WA75D · 실 수', '확인 필요'], ['Smart Signage QB55C · 실당 1대', ''], ['스마트 모니터 · 좌석 수', '확인 필요']]],
         ['그 밖의 공간', '제품 5', [['라운지 QM55C · 중앙관제실 비디오월 VM55B', ''], ['공용공간 SmartThings 센서 · QB43C', ''], ['주차장 옥외형 사이니지 OHC55', '확장']]]],
        'DS2.dc.html', '수량 [확인 필요] 3곳 · 확장 공간 1'],
      'MI-01': ['Market Intelligence', 'MI-01 v1', '용산 오피스 시장 분석', 'M4 20V10 M10 20V4 M16 20v-8 M22 20H2', ['용산 AI Ready 오피스'], '오늘 12:30 저장',
        [['담은 정보', '11'], ['출처', '11 · 링크 포함'], ['수치 원문 확인', '2']],
        [['시장', '4', [['프라임 오피스 스마트 빌딩 도입 증가', '리포트'], ['AI 도입 기업의 회의 · 협업 공간 확대', '리포트'], ['오피스 로비의 브랜드 공간화', '뉴스']]],
         ['고객사', '4', [['E 자산운용 용산 재개발 사업 개요', '뉴스'], ['ESG 보고서의 에너지 절감 목표', '확인 필요'], ['보유 오피스 포트폴리오', '공시 · IR']]],
         ['사용자', '3', [['하이브리드 근무 뒤 회의실 수요 변화', '리포트'], ['임차인이 선호하는 오피스 설비', '리포트'], ['실내 쾌적성 만족도', '확인 필요']]]],
        'MI2.dc.html', '문장은 원문을 줄여 쓴 것 · 수치는 원문 확인']
    };
    const id = this.props.refId ?? 'RQ-01';
    const [kind, ref, title, icon, sbs, when, facts, groups, editHref, foot] = D[id] || D['RQ-01'];
    const noop = () => {};
    return {
      kind, ref, title, icon, sbs, when, editHref, foot,
      facts: facts.map(([k, v]) => ({ k, v })),
      groups: groups.map(([h, sub, lines]) => ({ h, sub, hasSub: !!sub, lines: lines.map(([t, n]) => tag(t, n)) })),
      close: this.props.onClose || noop
    };
  }
}
</script>
</body>
</html>
