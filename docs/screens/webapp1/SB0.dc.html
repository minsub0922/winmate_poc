<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Storyboard · 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
.s0-row:hover{background:#fbfcff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="storyboard" current="" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="전략 수립 Storyboard" title="" popover="none" hint-size="1180px,64px"></dc-import>
    <section style="width: 1180px; height: 836px; box-sizing: border-box; padding: 28px 40px 24px 40px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 16px; flex-shrink: 0">
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
          <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">전략 수립 Storyboard</h1>
          <span style="font-size: 13.5px; color: #596170">제안서 흐름 전체를 담는 context예요. 고객 요구사항을 저장하면 생기고, 콘텐츠의 복제본을 만들면 분기돼요.</span>
        </div>
        <a href="RQ1.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; white-space: nowrap; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 고객 요구사항으로 시작</a>
      </div>
      <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden; flex-shrink: 0">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px 120px 110px; column-gap: 16px; align-items: center; height: 42px; padding: 0 20px; background: #fbfbfc; font-size: 12px; font-weight: 600; color: #596170"><span>Storyboard</span><span>어디까지 입력됐나</span><span>Key message</span><span>수정</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <a href="SB1.dc.html" class="s0-row" style="display: grid; grid-template-columns: minmax(0, 1fr) 300px 120px 110px; column-gap: 16px; align-items: center; min-height: 72px; padding: 10px 20px; box-sizing: border-box; border-top: 1px solid #eef0f3; color: #121417">
            <div style="{{r.nameBox}}">
              <sc-if value="{{r.branch}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 3v10a4 4 0 0 0 4 4h8 M15 14l3 3-3 3"/></svg></sc-if>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                <span style="font-size: 12px; color: #8a91a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
              </span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px">
              <span style="display: flex; gap: 3px"><sc-for list="{{r.dots}}" as="d" hint-placeholder-count="8"><span style="{{d}}"></span></sc-for></span>
              <span style="font-size: 12px; color: #3d4452; font-weight: 600">{{r.stage}}</span>
            </div>
            <span style="{{r.kmStyle}}">{{r.km}}</span>
            <span style="font-size: 13px; color: #596170; white-space: nowrap">{{r.when}}</span>
          </a>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; font-size: 12px; color: #596170; padding: 0 4px; flex-shrink: 0">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 14px; border-radius: 2px; background: #1428a0"></span>입력됨</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 14px; border-radius: 2px; background: #e2e5ea"></span>아직</span>
        <span>순서 · 요구사항 → DSS → MI · 경쟁사 · VP · Spec · 시나리오 → 제안서</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const SBS = [
      ['SB-01', '용산 AI Ready 오피스', 'E 자산운용', '', { rq: 1, dss: 1, mi: 1 }, 'AI Ready 오피스의 새로운 모델', '오늘 13:40'],
      ['SB-02', '용산 AI Ready 오피스 · 분기 B', 'E 자산운용', 'SB-01 · MI에서 분기', { rq: 1, dss: 1, mi: 1 }, '', '오늘 14:05'],
      ['SB-03', 'A 커피 매장 리뉴얼', 'A 커피 프랜차이즈', '', { rq: 1, dss: 1, ca: 1, sp: 1 }, '', '어제'],
      ['SB-04', '동탄 시니어 복합단지', 'F 시행사', '', { rq: 1 }, '', '오늘 11:20'],
      ['SB-05', '판교 스타트업 단지', 'G 공사', '', { rq: 1 }, '', '11/2']
    ];
    const ORDER = ['rq', 'dss', 'mi', 'ca', 'vp', 'sp', 'sc', 'ppt'];
    const NAMES = { rq: '요구사항', dss: 'DSS', mi: 'MI', ca: '경쟁사', vp: 'VP', sp: 'Spec', sc: '시나리오', ppt: '제안서' };
    const stageOf = (d) => { const after = ['mi', 'ca', 'vp', 'sp', 'sc'].filter((k) => d[k]).map((k) => NAMES[k]); if (!d.dss) return '요구사항까지'; return after.length ? 'DSS + ' + after.join(' · ') : 'DSS까지'; };
    const rows = SBS.map(([id, name, cust, from, done, km, when]) => ({
      name, sub: id + ' · ' + cust + (from ? ' · ' + from : ''), branch: !!from, stage: stageOf(done), when,
      km: km || '아직 없음',
      kmStyle: 'font-size: 12px; line-height: 1.4;' + (km ? ' color: #121417; font-weight: 600;' : ' color: #8a91a0;'),
      nameBox: 'display: flex; align-items: center; gap: 8px; min-width: 0;' + (from ? ' padding-left: 20px;' : ''),
      dots: ORDER.map((k, i) => 'width: 22px; height: 14px; border-radius: 3px;' + (i === 2 || i === 7 ? ' margin-left: 5px;' : '') + (done[k] ? ' background: #1428a0;' : ' background: #e2e5ea;'))
    }));
    return { rows };
  }
}
</script>
</body>
</html>
