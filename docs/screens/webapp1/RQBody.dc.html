<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고객 요구사항 · 본문 (그 자리에서 입력 · 수정)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#a3a9b5}
.e-in:hover{border-color:#c9d0e6}
.e-in:focus{border-color:#1428a0;box-shadow:0 0 0 3px rgba(20,40,160,0.12)}
.e-x:hover{color:#121417;background:#f0f2f5}
.e-add:hover{background:#f3f5fd}
.e-x:focus-visible,.e-add:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div style="width: 1100px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #121417">
  <!-- 파일로 채우기: 빈 칸만 채우고, 이미 쓴 칸은 덮지 않음 -->
  <div style="{{dropStyle}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 15V4 M7 9l5-5 5 5 M4 15v5h16v-5"/></svg>
    <span style="font-size: 13px; font-weight: 600; flex-grow: 1; white-space: nowrap">{{dropText}} <span style="font-weight: 400; color: #8a91a0">· PPTX · PDF · DOCX · 메일</span></span>
    <span style="{{readStyle}}">{{readFrom}}</span>
    <button class="e-add" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 600; white-space: nowrap">파일 첨부</button>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px">
    <!-- 개요 -->
    <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; padding: 14px 18px 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 5px; flex-shrink: 0">
          <label for="{{f.id}}" style="font-size: 12px; font-weight: 600; color: #596170">{{f.k}}</label>
          <input class="e-in" id="{{f.id}}" value="{{f.v}}" placeholder="{{f.ph}}" style="{{f.style}}">
        </div>
      </sc-for>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-height: 0">
        <label for="rq-note" style="font-size: 12px; font-weight: 600; color: #596170">제작자 의견 <span style="font-weight: 500; color: #8a91a0">· 고객 문서에서 빠져요</span></label>
        <textarea class="e-in" id="rq-note" placeholder="제안 방향 · 강조할 점" style="flex-grow: 1; min-height: 54px; box-sizing: border-box; resize: none; border: 1px solid #e6e9ef; border-radius: 9px; padding: 9px 11px; font-size: 13.5px; line-height: 1.6; color: #121417; background: #ffffff; outline: none">{{note}}</textarea>
      </div>
      <span style="font-size: 11.5px; color: #8a91a0; flex-shrink: 0">모두 선택 항목이에요 · 비어 있어도 저장돼요</span>
    </div>

    <!-- 키맨별 요구사항 -->
    <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; min-width: 0">
      <div style="height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px; border-bottom: 1px solid #f0f2f5; flex-shrink: 0">
        <span style="font-size: 14px; font-weight: 700">키맨별 요구사항</span>
        <span style="{{sumStyle}}">{{sumLine}}</span>
        <span style="flex-grow: 1"></span>
        <button class="e-add" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px dashed #b8c2e6; background: #ffffff; color: #1428a0; font-size: 12.5px; font-weight: 700; white-space: nowrap">+ 키맨 추가</button>
      </div>
      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{kms}}" as="k" hint-placeholder-count="3">
          <div style="box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; padding: 10px 12px 8px 14px; display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 14px; flex-shrink: 0">
            <span style="display: flex; flex-direction: column; gap: 6px; align-items: stretch">
              <label for="{{k.idN}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">키맨</label>
              <input class="e-in" id="{{k.idN}}" value="{{k.name}}" placeholder="키맨 · 예) 대표이사" style="{{k.nameStyle}}">
              <span style="display: flex; align-items: center; gap: 6px">
                <span style="font-size: 11.5px; font-weight: 600; color: #596170">가중치</span>
                <label for="{{k.idW}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">가중치</label>
                <input class="e-in" id="{{k.idW}}" value="{{k.weight}}" style="width: 52px; height: 28px; box-sizing: border-box; padding: 0 8px; border-radius: 7px; border: 1px solid #e6e9ef; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; text-align: right; outline: none">
                <span style="font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800; color: #1428a0">%</span>
              </span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <sc-for list="{{k.reqs}}" as="r" hint-placeholder-count="3">
                <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
                  <span style="width: 14px; flex-shrink: 0; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 700; color: #8a91a0">{{r.n}}</span>
                  <label for="{{r.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">요구사항 {{r.n}}</label>
                  <input class="e-in" id="{{r.id}}" value="{{r.t}}" placeholder="요구사항 · 예) 에너지 사용량 20% 절감" style="{{r.style}}">
                  <sc-if value="{{r.warn}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 7px; border-radius: 999px; background: #fff4dc; color: #7a4f00; font-size: 11px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0">확인 필요</span></sc-if>
                  <sc-if value="{{r.chg}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 7px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0">{{r.chgText}}</span></sc-if>
                  <button class="e-x" aria-label="{{r.xLabel}}" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; border: none; background: transparent; color: #b8bec8; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                </span>
              </sc-for>
              <button class="e-add" style="align-self: flex-start; height: 26px; margin-left: 18px; padding: 0 8px; border-radius: 7px; border: none; background: transparent; color: #1428a0; font-size: 12px; font-weight: 700">+ 요구사항</button>
            </span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["saved","editing","new","draft"],"default":"saved"},"h":{"editor":"int","default":682},"onPop":{"editor":null},"$preview":{"width":1100,"height":682}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'saved';
    const NEW = mode === 'new', DRAFT = mode === 'draft', EDIT = mode === 'editing';
    const IN = 'width: 100%; height: 38px; box-sizing: border-box; padding: 0 11px; border-radius: 9px; border: 1px solid #e6e9ef; background: #ffffff; font-size: 14px; color: #121417; outline: none;';
    const CHG = ' border: 1.5px solid #1428a0; background: #f6f8fe;';
    // 값: Storyboard flow.json stages.rq 와 같은 모양
    const D = NEW ? { project: '', customer: '', target: '', note: '', read: '', keymen: [['', '100', [['', 0]]]] }
      : DRAFT ? { project: '성수 플래그십 리테일 리뉴얼', customer: 'K 리츠', target: '', note: '', read: '회의록_K리츠.pdf에서 읽음',
        keymen: [['자산관리팀장', '60', [['1층 파사드 미디어로 집객', 0], ['테넌트별 콘텐츠 운영', 0], ['시설 원격 관리', 0]]], ['마케팅 리드', '40', [['시즌 캠페인 빠른 교체', 0], ['방문객 데이터 활용', 'warn']]]] }
      : { project: '용산 업무시설 재개발 AI Ready 오피스', customer: 'E 자산운용', target: '대표이사', note: '', read: '',
        keymen: [['대표이사', '50', [['사용자를 인식하고 반응하는 AI Ready 오피스', 0], [EDIT ? '국내 최초 AI Ready 오피스로 알리기' : '최초 AI Ready 공간으로 알리기', EDIT ? 'chg' : 0], ['에너지 사용량 20% 절감 · 실측 증빙', 0]]],
          ['공간컨텐츠실장', '30', [['오피스를 업무환경 플랫폼으로', 'warn'], ['예측 · 반응형 공간', 0], ['건물 가치 · 임대 선호도 제고', 0]]],
          ['개발사업팀장', '20', [['AI 인프라를 설계 단계에 반영', 0], ['시공 · 운영 유지보수 부담 최소화', 0]].concat(EDIT ? [['입주 전 시범 운영 공간', 'add']] : [])]] };
    const fields = [['rq-proj', '프로젝트명', D.project, '예) 용산 업무시설 재개발'], ['rq-cust', '고객사', D.customer, '예) E 자산운용'], ['rq-to', '최종 제안대상', D.target, '예) 대표이사']]
      .map(([id, k, v, ph], i) => ({ id, k, v, ph, style: IN + (i === 0 && v ? ' font-weight: 700;' : '') }));
    const RQ_IN = 'flex-grow: 1; min-width: 0; height: 32px; box-sizing: border-box; padding: 0 9px; border-radius: 8px; border: 1px solid #eef0f4; background: #ffffff; font-size: 13.5px; color: #121417; outline: none;';
    let nReq = 0;
    const kms = D.keymen.map(([name, weight, reqs], i) => ({
      name, weight, idN: 'rq-k' + i, idW: 'rq-w' + i,
      nameStyle: 'width: 100%; height: 34px; box-sizing: border-box; padding: 0 9px; border-radius: 8px; border: 1px solid #e6e9ef; background: #ffffff; font-size: 14.5px; font-weight: 700; color: #121417; outline: none;',
      reqs: reqs.map(([t, flag], j) => { nReq++; return { n: j + 1, t, id: 'rq-r' + i + '-' + j, warn: flag === 'warn', chg: flag === 'chg' || flag === 'add', chgText: flag === 'add' ? '새로 씀' : '고침',
        xLabel: '빼기 · ' + (t || '빈 요구사항'), style: RQ_IN + (flag === 'chg' || flag === 'add' ? CHG : '') }; })
    }));
    const sum = D.keymen.reduce((a, k) => a + Number(k[1] || 0), 0);
    return {
      h: this.props.h ?? 682,
      dropText: NEW ? '파일을 끌어다 놓으면 빈 칸이 채워져요' : '파일을 더 놓으면 빈 칸만 채워요',
      dropStyle: 'flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; border-radius: 12px;' + (NEW ? ' height: 60px; border: 1.5px dashed #b8c2e6; background: #fbfcff;' : ' height: 46px; border: 1px dashed #d5d9e0; background: #fbfbfc;'),
      readFrom: D.read || (NEW ? '아직 읽은 자료 없음' : '직접 입력'),
      readStyle: 'height: 26px; padding: 0 9px; border-radius: 7px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;' + (D.read ? ' background: #eaeefb; color: #1428a0;' : ' background: #f0f2f5; color: #596170;'),
      fields, note: D.note, kms,
      sumLine: '키맨 ' + D.keymen.length + ' · 요구 ' + (NEW ? 0 : nReq) + ' · 가중치 합 ' + sum + '%',
      sumStyle: 'font-size: 12px; white-space: nowrap;' + (sum === 100 ? ' color: #596170;' : ' color: #7a4f00; font-weight: 700;')
    };
  }
}
</script>
</body>
</html>
