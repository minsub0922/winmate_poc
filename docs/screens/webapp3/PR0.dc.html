<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B2B 제안서 · 제안서 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="proposal" current="" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="B2B 제안서 생성" title="제안서 목록" popover="none" hint-size="1180px,64px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 26px 40px 24px 40px; box-sizing: border-box; overflow: hidden">
      <!-- 제목 · 새로 만들기 -->
      <div style="height: 48px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">제안서</h1>
          <span style="font-size: 13px; color: #596170">전체 {{total}}건 · 2주 안에 마감 3건 · 내 검토 차례 1건</span>
        </div>
        <a href="PR1.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>새 제안서</span>
        </a>
      </div>

      <!-- 시작하는 방법 4가지 -->
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; color: #596170">시작하는 방법</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{starts}}" as="s" hint-placeholder-count="4">
            <a href="{{s.href}}" style="{{s.cardStyle}}">
              <div style="{{s.iconBox}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{s.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"/></svg></div>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
                <span style="font-size: 13.5px; font-weight: 700; color: #121417; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span>
                <span style="font-size: 12px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.desc}}</span>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </sc-for>
        </div>
      </div>

      <!-- 상태 탭 · 검색 · 필터 -->
      <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div role="tablist" aria-label="상태" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #e9ebef">
          <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{tb.on}}" style="{{tb.style}}">{{tb.label}}<span style="{{tb.countStyle}}">{{tb.count}}</span></button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">제안서 검색</label>
          <div style="width: 240px; height: 36px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #ffffff; display: flex; align-items: center; gap: 8px; padding: 0 12px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="q" placeholder="제안서 · 고객사 검색" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 13px; color: #121417; outline: none">
          </div>
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button aria-haspopup="listbox" style="height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="color: #596170">{{f.k}}</span><span style="font-weight: 600">{{f.v}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          </sc-for>
        </div>
      </div>

      <!-- 목록 -->
      <div style="flex-shrink: 0; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden">
        <div style="{{headStyle}}">
          <span>제안서</span><span>유형</span><span>진행</span><span>상태</span><span>마감</span><span>담당</span><span></span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <div style="{{r.rowStyle}}">
            <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
              <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
                <span style="font-size: 12px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
                <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}">
                  <span style="height: 18px; padding: 0 6px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0">{{r.note}}</span>
                </sc-if>
              </div>
            </div>
            <span style="font-size: 12.5px; color: #3d4452; white-space: nowrap">{{r.type}}</span>
            <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <div style="display: flex; gap: 3px">
                <sc-for list="{{r.segs}}" as="sg" hint-placeholder-count="6">
                  <span style="{{sg.style}}"></span>
                </sc-for>
              </div>
              <span style="font-size: 11.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.step}}</span>
            </div>
            <span style="{{r.stStyle}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.stIcon}}"/></svg>{{r.stLabel}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700; color: #121417">{{r.due}}</span>
              <span style="{{r.ddayStyle}}">{{r.dday}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
              <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #eaeefb; color: #1428a0; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.initial}}</span>
              <span style="font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.owner}}</span>
            </div>
            <a href="{{r.href}}" style="{{r.actStyle}}">{{r.act}}</a>
          </div>
        </sc-for>
      </div>

      <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #596170">
        <span style="display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h12v12H8z M4 16V4h12"/></svg>완료한 제안서는 '복제해서 시작'으로 필요한 섹션만 골라 다시 쓸 수 있어요.</span>
        <span style="font-family: Manrope, sans-serif; font-weight: 700">1–{{total}} / {{total}}</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ICON = {
      blank: 'M6 3h8l5 5v13H6V3z M14 3v5h5 M12 11v6 M9 14h6',
      rfp: 'M6 3h8l5 5v13H6V3z M14 3v5h5 M12 18v-6 M9.5 14.5L12 12l2.5 2.5',
      link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
      copy: 'M8 8h12v12H8z M4 16V4h12',
      draft: 'M4 20h4L19 9l-4-4L4 16v4z',
      review: 'M4 5h16v11H9l-5 4V5z',
      done: 'M5 12l5 5L20 7'
    };
    const S = [
      ['빈 제안서', '고객 정보부터 직접 입력', 'blank', 'PR1.dc.html', true],
      ['RFP로 시작', '파일을 올리면 고객 · 요구 · 일정 자동 채움', 'rfp', 'PR1F.dc.html', false],
      ['기존 작업에서 시작', 'Storyboard · MI · 조감도 · 시나리오 연결', 'link', 'PR1L.dc.html', false],
      ['이전 제안서 복제', '가져올 섹션만 골라 다시 쓰기', 'copy', 'PR1C.dc.html', false]
    ];
    const starts = S.map(([title, desc, ic, href, main]) => ({
      title, desc, href, icon: ICON[ic], iconColor: main ? '#ffffff' : '#1428a0',
      iconBox: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center;' + (main ? ' background: #1428a0;' : ' background: #eaeefb;'),
      cardStyle: 'height: 64px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 12px; min-width: 0;' + (main ? ' border: 1.5px solid #1428a0;' : ' border: 1px solid #e2e5ea;')
    }));

    // [제목, 부제, 알림, 유형, 진행 라벨, 완료 단계 수, 현재 단계, 상태, 마감, D-day, 담당, 버튼, 링크]
    const R = [
      ['B 병원 안내 시스템 제안', '의료 · 요양 · PPTX v2', '코멘트 3', '퀵윈(제품)', 'PPTX v2 · 검토 요청 1/2 승인', 6, 0, 'review', '10.08', 'D-7', '박서연', '검토 보기', 'PR7C.dc.html'],
      ['B 병원 외래 대기실 디스플레이 제안', '의료 · 요양 · PPTX v3', '', '표준', 'PPTX v3 · 승인 대기', 6, 0, 'review', '10.10', 'D-9', '최민섭', '버전 보기', 'PR7V.dc.html'],
      ['A 커피 프랜차이즈 메뉴보드 제안', '외식 · 카페 · 연결 작업 5', 'MI 작업 업데이트됨', '표준', '섹션 작성 · 4 / 8 섹션', 3, 4, 'draft', '10.15', 'D-14', '최민섭', '이어서 작성', 'PRS4.dc.html'],
      ['C 물류센터 스마트 오피스 제안', '제조 · 물류 · 딸깍으로 완성', '확인 필요 3', 'Solution형', 'PPTX 생성 · 사실 확인 중', 5, 6, 'draft', '10.22', 'D-21', '이준호', '확인할 곳', 'PR7Q.dc.html'],
      ['D 대학 강의동 협업 공간 제안', '교육 · 캠퍼스 · RFP로 시작', '', '표준', '고객 · 프로젝트 확인 중', 0, 1, 'draft', '10.30', 'D-29', '최민섭', '이어서 작성', 'PR1F.dc.html'],
      ['A 커피 프랜차이즈 2025 매장 사이니지 제안', '외식 · 카페 · 2025.11.20 제출', '', '표준', 'PPTX v4 · 제출 완료', 6, 0, 'done', '제출함', '2025.11.20', '최민섭', '복제해서 시작', 'PR1C.dc.html']
    ];
    const ST = {
      draft: ['작성 중', ' color: #3d4452; background: #f0f2f5;'],
      review: ['검토 중', ' color: #1428a0; background: #eaeefb;'],
      done: ['완료', ' color: #ffffff; background: #121417;']
    };
    const cols = 'grid-template-columns: minmax(0, 1fr) 92px 176px 96px 96px 124px 112px; gap: 0 14px;';
    const rows = R.map(([title, sub, note, type, step, done, cur, st, due, dday, owner, act, href], i) => {
      const urgent = st !== 'done' && Number(dday.replace('D-', '')) <= 7;
      return {
        title, sub, note, hasNote: !!note, type, step, due, dday, owner, act, href, initial: owner.slice(0, 1),
        segs: [1, 2, 3, 4, 5, 6].map((n) => ({
          style: 'width: 22px; height: 5px; border-radius: 3px; box-sizing: border-box;' + (n <= done ? ' background: #1428a0;' : n === cur ? ' background: #eaeefb; box-shadow: inset 0 0 0 1px #1428a0;' : ' background: #e2e5ea;')
        })),
        stLabel: ST[st][0], stIcon: ICON[st],
        stStyle: 'justify-self: start; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap;' + ST[st][1],
        ddayStyle: 'font-size: 11.5px; white-space: nowrap;' + (urgent ? ' color: #1428a0; font-weight: 700;' : ' color: #8a91a0;'),
        actStyle: 'justify-self: end; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;' + (i === 2 ? ' background: #1428a0; color: #ffffff;' : ' border: 1px solid #e2e5ea; background: #ffffff; color: #121417;'),
        rowStyle: 'display: grid; ' + cols + ' align-items: center; height: 64px; padding: 0 16px; box-sizing: border-box;' + (i < R.length - 1 ? ' border-bottom: 1px solid #f0f2f5;' : '') + (i === 2 ? ' background: #f5f7fd;' : '')
      };
    });
    const count = (k) => R.filter((r) => r[7] === k).length;
    const T = [['전체', R.length, true], ['작성 중', count('draft'), false], ['검토 중', count('review'), false], ['완료', count('done'), false]];
    const tabs = T.map(([label, n, on]) => ({
      label, count: n, on,
      style: 'height: 30px; padding: 0 12px; border: none; border-radius: 8px; font-size: 12.5px; display: flex; align-items: center; gap: 6px;' + (on ? ' background: #ffffff; color: #121417; font-weight: 700; box-shadow: 0 1px 2px rgba(18,20,23,0.12);' : ' background: transparent; color: #596170; font-weight: 500;'),
      countStyle: 'font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800;' + (on ? ' color: #1428a0;' : ' color: #8a91a0;')
    }));
    return {
      starts, tabs, rows, total: R.length,
      filters: [{ k: '담당', v: '전체' }, { k: '유형', v: '전체' }, { k: '정렬', v: '마감 임박순' }],
      headStyle: 'display: grid; ' + cols + ' align-items: center; height: 38px; padding: 0 16px; box-sizing: border-box; background: #fbfbfc; border-bottom: 1px solid #e2e5ea; font-size: 11.5px; color: #596170;'
    };
  }
}
</script>
</body>
</html>
