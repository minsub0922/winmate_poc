<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>딸깍 — 제안서 생성 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="proposal" current="A 커피 프랜차이즈 메뉴보드 제안" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="B2B 제안서 생성" title="A 커피 프랜차이즈 메뉴보드 제안" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="6" auto-from="4" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 24px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; justify-content: flex-end">
          <div style="display: flex; align-items: center; gap: 8px; background: #121417; color: #ffffff; border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 13.5px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
            <span style="font-weight: 700">딸깍</span><span style="color: #c5cbd6">· 조감도부터 나머지 자동 완성</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px">
          <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
          <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 3px; flex-grow: 1; min-width: 0">
            <div style="font-size: 14.5px; line-height: 1.65">남은 6개 섹션과 템플릿을 추론해 제안서를 만들고 있어요. 확정해 두신 MI · Value Props는 그대로 쓰고, 추론으로 채운 시트에는 표시와 근거 노트를 남깁니다.</div>

            <a href="OneClickDone.dc.html" style="display: block; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden; color: #121417">
              <div style="padding: 14px 16px 12px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e2e5ea">
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <div style="display: flex; align-items: center; gap: 8px">
                    <div style="width: 26px; height: 26px; border-radius: 7px; background: #121417; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
                    <span style="font-size: 14px; font-weight: 700">제안서 생성 중</span>
                    <span style="font-size: 12px; color: #596170">표준 제안서 · 21장</span>
                  </div>
                  <span style="font-size: 13px; font-weight: 700; color: #1428a0">45% · 약 1분 남음</span>
                </div>
                <div style="height: 6px; border-radius: 999px; background: #eef0f3; overflow: hidden"><div style="width: 45%; height: 6px; border-radius: 999px; background: #1428a0"></div></div>
              </div>
              <div style="padding: 8px 10px 10px 10px; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
                  <div style="{{r.rowStyle}}">
                    <sc-if value="{{r.isDone}}" hint-placeholder-val="{{false}}">
                      <span style="width: 20px; height: 20px; border-radius: 50%; background: #1428a0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
                    </sc-if>
                    <sc-if value="{{r.isAuto}}" hint-placeholder-val="{{false}}">
                      <span style="width: 20px; height: 20px; border-radius: 50%; background: #121417; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
                    </sc-if>
                    <sc-if value="{{r.isRun}}" hint-placeholder-val="{{false}}">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0"><circle cx="12" cy="12" r="9" stroke="#d5d9e0" stroke-width="3"/><path d="M12 3a9 9 0 0 1 9 9" stroke="#1428a0" stroke-width="3" stroke-linecap="round"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isWait}}" hint-placeholder-val="{{true}}">
                      <span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d5d9e0; box-sizing: border-box; flex-shrink: 0"></span>
                    </sc-if>
                    <span style="width: 120px; flex-shrink: 0; font-weight: 600">{{r.name}}</span>
                    <span style="flex-grow: 1; min-width: 0; color: #596170; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span>
                    <span style="{{r.stStyle}}">{{r.st}}</span>
                  </div>
                </sc-for>
              </div>
            </a>
          </div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 14px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; display: flex; align-items: center; justify-content: space-between">
          <div style="font-size: 13px; font-weight: 600">딸깍 진행 중 <span style="color: #596170; font-weight: 500">· 다른 작업을 해도 돼요, 끝나면 알려드릴게요</span></div>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; gap: 10px">
          <label for="dir" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">진행 방향 메모</label>
          <div style="flex-grow: 1; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; display: flex; align-items: center; gap: 8px; padding: 0 12px">
            <input id="dir" placeholder="진행 중에도 방향을 알려주세요 (예: Why Samsung은 비용 중심으로)" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none">
            <button aria-label="보내기" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: none; background: #e2e5ea; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
          <a href="OneClickConfirm.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="#121417"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>중지</a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // [섹션, 근거, 상태: done(확정) · auto(추론 완료) · run(생성 중) · wait(대기)]
    const R = [
      ['Market Intelligence', '직접 작성 · 3시트', 'done'],
      ['Value Props', '직접 작성 · 2시트', 'done'],
      ['조감도', '작성 중이던 내용 + 조감도 작업으로 완성', 'auto'],
      ['공간별 제품', '조감도 배치안 · 요구사항에서 제품 추론', 'run'],
      ['솔루션 제안', '연결된 솔루션 2개 · 시나리오로 작성', 'wait'],
      ['유관 사례', '유사도 상위 사례 자동 선택', 'wait'],
      ['Why Samsung', 'MI 경쟁사 분석으로 비교표 작성', 'wait'],
      ['제품 스펙', '공간별 제품 모델로 비교표 생성', 'wait'],
      ['디자인 템플릿', '삼성 B2B 표준 (기본값)', 'wait'],
      ['PPTX 조립', '표지 · 목차 · 섹션 구분 포함', 'wait']
    ];
    const ST = { done: '확정', auto: '추론 완료', run: '생성 중', wait: '대기' };
    const rows = R.map(([name, note, s]) => ({
      name, note, st: ST[s],
      isDone: s === 'done', isAuto: s === 'auto', isRun: s === 'run', isWait: s === 'wait',
      rowStyle: 'display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 13px;' + (s === 'run' ? ' background: #f5f7fd;' : ''),
      stStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 600;' + (s === 'run' ? ' color: #1428a0;' : s === 'auto' ? ' color: #121417;' : s === 'done' ? ' color: #596170;' : ' color: #8a91a0;')
    }));
    return { steps: ['고객 · 프로젝트', '제안서 유형', '시트 구성', '섹션 작성', '디자인 템플릿', 'PPTX 생성'], rows };
  }
}
</script>
</body>
</html>
