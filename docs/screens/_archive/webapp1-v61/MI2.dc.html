<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MI · 검색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#a3a9b5}
.m-ghost:hover{background:#f3f5fd}
@keyframes mspin{to{transform:rotate(360deg)}}
.m-spin{animation:mspin 1s linear infinite}
.m-ghost:focus-visible,.m-btn:focus-visible,.m-chip:focus-visible{outline:2px solid #1428a0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="market" current="" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="Market Intelligence" title="MI-01 수정" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{two}}" hint-size="1180px,56px"></dc-import>
    <dc-import name="SBBar" ids="SB-01" cur="SB-01" note="MI-01 v1을 고쳐요 · 저장하면 v2" on-open="{{openPop}}" hint-size="1180px,52px"></dc-import>
    <section style="width: 1180px; height: 728px; box-sizing: border-box; padding: 22px 40px 22px 40px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
        <h1 style="margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -0.02em">{{h1}}</h1>
        <span style="font-size: 13px; color: #596170">{{h1sub}}</span>
      </div>

      <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
        <div role="status" aria-live="polite" style="box-sizing: border-box; flex-shrink: 0; margin-top: 8px; border: 1px solid #e2e5ea; border-radius: 16px; background: #ffffff; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin-bottom: 8px"><svg class="m-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>AI가 Storyboard를 분석하고 있어요</span>
          <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; height: 44px; border-top: 1px solid #f5f6f8">
              <span style="{{j.dot}}"></span>
              <span style="{{j.style}}">{{j.t}}</span>
              <span style="font-size: 12.5px; color: #596170; white-space: nowrap">{{j.note}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
        <span style="height: 22px; padding: 0 7px; border-radius: 5px; background: #eaeefb; color: #1428a0; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/></svg>AI 분석</span>
        <span style="font-size: 12px; font-weight: 600; color: #596170; margin-right: 4px">Storyboard에서 읽은 것</span>
        <sc-for list="{{basis}}" as="b" hint-placeholder-count="4"><span style="height: 26px; padding: 0 9px; border-radius: 7px; background: #ffffff; border: 1px solid #e2e5ea; font-size: 12px; display: flex; align-items: center; gap: 5px; white-space: nowrap"><b style="font-weight: 700; color: #596170">{{b.k}}</b>{{b.v}}</span></sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; flex-shrink: 0">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
          <div style="box-sizing: border-box; height: 300px; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14.5px; font-weight: 700; flex-grow: 1">{{c.t}}</span><span style="font-size: 12px; color: #8a91a0">검색어 {{c.n}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{c.qs}}" as="q" hint-placeholder-count="4">
                <span style="{{q.style}}"><span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><button onClick="{{q.toggle}}" aria-label="{{q.label}}" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="{{q.icon}}"/></svg></button></span>
              </sc-for>
            </div>
            <div style="margin-top: auto; display: flex; align-items: center; gap: 6px; height: 34px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; border: 1px dashed #b8bec8">
              <label for="{{c.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{c.t}} 검색어 추가</label>
              <input id="{{c.id}}" placeholder="+ 검색어" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 12.5px; color: #121417; outline: none">
            </div>
          </div>
        </sc-for>
      </div>

      <div style="box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; padding: 4px 16px; display: flex; flex-direction: column">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px; min-height: 46px; border-top: {{o.line}}">
            <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600; color: #3d4452">{{o.k}}</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{o.vs}}" as="v" hint-placeholder-count="3"><button class="m-chip" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.t}}</button></sc-for>
            </div>
          </div>
        </sc-for>
      </div>

      </sc-if>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
        <a href="MI1.dc.html" style="display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #596170; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Storyboard</a>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 13px; color: #596170; white-space: nowrap">검색어 {{nq}}개 · 1–2분</span>
        <a class="m-btn" href="MI3.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>웹 검색 후 정제로</a>
      </div>
    </section>
  </main>

  <sc-if value="{{popOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(18,20,23,0.42); display: flex; align-items: center; justify-content: center; z-index: 30">
      <dc-import name="SBPopup" sb="SB-01" on-close="{{closePop}}" hint-size="760px,660px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["auto","loading","ready"],"default":"auto"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    if ((this.props.phase ?? 'auto') === 'auto') {
      this.t1 = setTimeout(() => this.setState({ step: 1 }), 900);
      this.t2 = setTimeout(() => this.setState({ step: 2 }), 1700);
      this.t3 = setTimeout(() => this.setState({ step: 3 }), 2500);
    }
  }
  componentWillUnmount() { [this.t1, this.t2, this.t3].forEach((t) => { if (t) clearTimeout(t); }); }
  renderVals() {
    const ph = this.props.phase ?? 'auto';
    const step = ph === 'ready' ? 3 : ph === 'loading' ? 1 : ((this.state && this.state.step) || 0);
    const ready = step >= 3;
    const J = [['Storyboard SB-01 읽기', '요구사항 · DSS · 요약본'], ['고객사 · 업종 · 공간 · 요구 뽑기', 'E 자산운용 · 오피스 · 공간 7'], ['시장 · 고객사 · 사용자 검색어 만들기', '검색어 10']];
    const jobs = J.map(([t, note], i) => {
      const done = i < step, run = i === step;
      return { t, note: done ? note : '',
        dot: 'width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; box-sizing: border-box;' + (done ? ' background: #1428a0;' : run ? ' border: 3px solid #1428a0; border-right-color: transparent;' : ' border: 2px solid #d5d9e0;'),
        style: 'font-size: 14px; flex-grow: 1;' + (done ? '' : run ? ' font-weight: 700;' : ' color: #8a91a0;') };
    });
    const s = Object.assign({ off: { 'm3': true }, o: { 0: 0, 1: [0, 1, 2], 2: 0 }, pop: false }, this.state || {});
    const put = (p) => this.setState(Object.assign({}, s, p));
    const COLS = [
      ['m', '시장', ['프라임 오피스 스마트 빌딩 도입', '서울 도심 신축 오피스 임대 동향', 'AI 도입 기업 업무 공간 변화', '건물 에너지 효율 규제']],
      ['c', '고객사', ['E 자산운용 용산 재개발', 'E 자산운용 ESG 에너지 목표', 'E 자산운용 오피스 포트폴리오']],
      ['u', '사용자', ['하이브리드 근무 회의실 수요', '오피스 방문객 출입 경험', '임차인 선호 오피스 설비']]
    ];
    const cols = COLS.map(([p, t, qs]) => {
      const list = qs.map((q, i) => { const key = p + i; const off = !!s.off[key]; return { t: q, label: (off ? '다시 넣기 · ' : '빼기 · ') + q, icon: off ? 'M12 5v14M5 12h14' : 'M6 6l12 12M18 6L6 18',
        style: 'height: 34px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 6px;' + (off ? ' border: 1px dashed #c9d0e6; color: #8a91a0; text-decoration: line-through;' : ' background: #eaeefb; color: #1428a0; font-weight: 600;'),
        toggle: () => put({ off: Object.assign({}, s.off, { [key]: !off }) }) }; });
      return { t, qs: list, n: list.filter((x, i) => !s.off[p + i]).length, id: 'mi-add-' + p };
    });
    const nq = cols.reduce((a, c) => a + c.n, 0);
    const chip = (on) => 'height: 30px; box-sizing: border-box; padding: 0 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap;' + (on ? ' border: 1px solid #1428a0; background: #eaeefb; color: #1428a0; font-weight: 700;' : ' border: 1px solid #e2e5ea; background: #ffffff; color: #3d4452; font-weight: 500;');
    const O = [['기간', ['최근 1년', '최근 3년', '전체'], false], ['출처', ['뉴스', '공시 · IR', '리포트', '정부 통계'], true], ['기존 MI-01', ['담은 정보 11개 유지 · 새로 찾은 것만 더하기', '처음부터 다시'], false]];
    const opts = O.map(([k, vs, multi], oi) => ({
      k, line: oi ? '1px solid #f0f2f5' : 'none',
      vs: vs.map((t, i) => { const cur = s.o[oi]; const on = multi ? cur.indexOf(i) >= 0 : cur === i; return { t, on, style: chip(on), pick: () => put({ o: Object.assign({}, s.o, { [oi]: multi ? (on ? cur.filter((x) => x !== i) : cur.concat([i])) : i }) }) }; })
    }));
    return {
      loading: !ready, ready, jobs, h1: ready ? '무엇을 검색할까요?' : 'Storyboard를 읽는 중이에요', h1sub: ready ? 'AI가 Storyboard의 고객사 · 업종 · 공간 · 요구에서 검색어를 만들었어요. 빼거나 더하면 돼요.' : '다 읽으면 검색어와 검색 조건이 나타나요.',
      steps: ['Storyboard', '검색', '정제'], two: 2,
      basis: [['고객사', 'E 자산운용'], ['업종', '오피스 · 업무시설'], ['공간', '로비 외 6'], ['요구', '에너지 절감 · AI Ready']].map(([k, v]) => ({ k, v })),
      cols, nq, opts, popOpen: s.pop,
      openPop: () => put({ pop: true }), closePop: () => put({ pop: false })
    };
  }
}
</script>
</body>
</html>
