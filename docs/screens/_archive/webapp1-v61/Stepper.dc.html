<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스텝바 컴포넌트 (딸깍 버튼 포함)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{rootStyle}}">
  <div style="display: flex; align-items: center">
    <sc-for list="{{items}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 7px">
        <div style="{{s.circle}}">
          <sc-if value="{{s.auto}}" hint-placeholder-val="{{false}}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="#ffffff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
          </sc-if>
          <sc-if value="{{s.check}}" hint-placeholder-val="{{false}}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
          </sc-if>
          <sc-if value="{{s.num}}" hint-placeholder-val="{{true}}">
            <span>{{s.n}}</span>
          </sc-if>
        </div>
        <span style="{{s.label}}">{{s.text}}</span>
      </div>
      <sc-if value="{{s.notLast}}" hint-placeholder-val="{{true}}">
        <div style="{{s.line}}"></div>
      </sc-if>
    </sc-for>
  </div>

  <!-- 딸깍: 어느 단계에서든 남은 부분을 추론해 최종 제안서까지 -->
  <sc-if value="{{showBtn}}" hint-placeholder-val="{{false}}">
    <button onClick="{{toggle}}" aria-expanded="{{open}}" title="남은 단계를 AI가 추론해 최종 제안서를 바로 만듭니다" style="{{btnStyle}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
      <span style="font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em">딸깍</span>
      <span style="width: 1px; height: 14px; background: #3a3f48"></span>
      <span style="font-size: 12px; color: #c5cbd6; font-weight: 500">나머지 자동 완성</span>
    </button>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="딸깍 — 나머지 자동 완성" style="position: absolute; top: 50px; right: 20px; width: 440px; box-sizing: border-box; background: #ffffff; border: 1px solid #121417; border-radius: 14px; box-shadow: 0 20px 48px rgba(18,20,23,0.24); display: flex; flex-direction: column; overflow: hidden; text-align: left; z-index: 5">
      <div style="padding: 16px 18px 12px 18px; display: flex; gap: 12px; border-bottom: 1px solid #e2e5ea">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #121417; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 15px; font-weight: 700; color: #121417">딸깍으로 나머지를 완성할까요?</div>
          <div style="font-size: 12.5px; color: #596170; line-height: 1.5">지금까지 확정한 내용은 그대로 두고, 남은 단계는 AI가 추론해 채운 뒤 최종 PPTX까지 만듭니다.</div>
        </div>
      </div>
      <sc-if value="{{hasConfirmed}}" hint-placeholder-val="{{true}}">
        <div style="padding: 12px 18px 0 18px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 11.5px; font-weight: 600; color: #596170">확정된 내용 · 그대로 사용</div>
          <div style="display: flex; gap: 5px; flex-wrap: wrap">
            <sc-for list="{{confirmed}}" as="c" hint-placeholder-count="3">
              <span style="display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 11.5px; font-weight: 600; white-space: nowrap"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>{{c}}</span>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <div style="padding: 12px 18px 0 18px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: #596170"><span>딸깍이 추론해 채울 부분</span><span>{{summary}}</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; background: #f5f6f8; font-size: 12.5px; color: #121417">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="#1428a0" style="flex-shrink: 0"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
            <span style="font-weight: 600; flex-shrink: 0; white-space: nowrap">{{r.label}}</span>
            <span style="flex-grow: 1; min-width: 0; text-align: right; color: #596170; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span>
          </div>
        </sc-for>
      </div>
      <div style="padding: 12px 18px 0 18px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #121417">
        <label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked="{{yes}}" style="accent-color: #1428a0; margin: 0">추론한 시트에 '추론' 표시와 근거 노트 남기기</label>
        <label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked="{{yes}}" style="accent-color: #1428a0; margin: 0">완료 후 검토가 필요한 곳 모아 보기</label>
      </div>
      <div style="padding: 14px 18px 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="font-size: 12px; color: #596170">약 1–2분 · 진행 중에도 다른 작업 가능</span>
        <div style="display: flex; gap: 8px">
          <button onClick="{{close}}" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13px; font-weight: 600">취소</button>
          <a href="https://claude.ai/artifact/Jd1mPcNMqvZoeBjfKFxeJe" style="height: 38px; padding: 0 14px; border-radius: 10px; background: #121417; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="#9db4ff"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>딸깍, 완성하기</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"steps":{"editor":null,"default":["1단계","2단계","3단계"]},"current":{"editor":"int","default":2,"min":1,"max":9},"oneClick":{"editor":"boolean","default":false},"oneClickOpen":{"editor":"boolean","default":false},"autoFrom":{"editor":"int","default":0,"min":0,"max":9},"complete":{"editor":"boolean","default":false},"planConfirmed":{"editor":null},"planRows":{"editor":null},"planSummary":{"editor":null},"$preview":{"width":1180,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = Array.isArray(this.props.steps) ? this.props.steps : ['1단계', '2단계', '3단계'];
    const cur = Number(this.props.current ?? 2);
    const complete = !!this.props.complete;
    const autoFrom = Number(this.props.autoFrom ?? 0);
    const n = steps.length;

    // 딸깍 버튼: 켜져 있고 아직 남은 단계가 있을 때만
    const oneClick = !!this.props.oneClick;
    const showBtn = oneClick && !complete && cur <= n && !(autoFrom > 0);
    const open = showBtn && (!!this.props.oneClickOpen || !!(this.state && this.state.open));

    const gap = n > 5 ? 8 : 12;
    const lineW = n > 5 ? 28 : (n > 3 ? 40 : 56);
    const circleBase = 'width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;';
    const items = steps.map((text, i) => {
      const k = i + 1;
      const done = complete || k < cur;
      const active = !complete && k === cur;
      const auto = done && autoFrom > 0 && k >= autoFrom;
      return {
        text, n: k, auto, check: done && !auto, num: !done, notLast: i < n - 1,
        circle: circleBase + (auto ? ' background: #121417; color: #ffffff;' : done ? ' background: #1428a0; color: #ffffff;' : active ? ' border: 2px solid #1428a0; background: #ffffff; color: #1428a0;' : ' border: 2px solid #d5d9e0; background: #ffffff; color: #8a91a0;'),
        label: 'font-size: ' + (n > 5 ? '12.5px' : '13px') + '; white-space: nowrap;' + (active ? ' color: #121417; font-weight: 600;' : done ? ' color: #596170;' : ' color: #8a91a0;'),
        line: 'width: ' + lineW + 'px; height: 1px; margin: 0 ' + gap + 'px; background: ' + (complete || k < cur ? '#1428a0' : '#d5d9e0') + ';'
      };
    });

    // 팝오버 내용: 화면이 plan을 넘기면 그것을, 아니면 단계 목록으로 대체
    const given = Array.isArray(this.props.planRows) && this.props.planRows.length > 0;
    const rows = given ? this.props.planRows : steps.slice(cur - 1).map((label, i) => ({ label, note: i === 0 ? '입력한 내용까지 반영하고 나머지 추론' : '추론해 자동 완성' }));
    const confirmed = Array.isArray(this.props.planConfirmed) ? this.props.planConfirmed : steps.slice(0, cur - 1);

    return {
      items, showBtn, open, rows, confirmed, hasConfirmed: confirmed.length > 0, yes: true,
      summary: this.props.planSummary || ('남은 ' + rows.length + '단계'),
      rootStyle: 'width: 1180px; height: 56px; box-sizing: border-box; position: relative; z-index: 20; flex-shrink: 0; display: flex; align-items: center; border-bottom: 1px solid #e2e5ea; background: #fbfbfc; font-family: \'Noto Sans KR\', system-ui, sans-serif; color: #121417;' + (showBtn ? ' justify-content: space-between; padding: 0 20px 0 28px;' : ' justify-content: center;'),
      btnStyle: 'display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px; border: none; color: #ffffff; flex-shrink: 0;' + (open ? ' background: #1428a0; box-shadow: 0 0 0 3px rgba(20,40,160,0.2);' : ' background: #121417;'),
      toggle: () => this.setState({ open: !open }),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
