<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경쟁사 분석 · 되묻기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="competitor" current="" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="경쟁사 분석" title="새 분석" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <span style="font-size: 12.5px; font-weight: 700; color: #1428a0">질문 1 / 1</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em">어느 고객사, 어느 지역인가요?</h1>
        </div>
        <span style="font-size: 14px; line-height: 1.5; color: #596170">입력에서 업종(외식 · 카페)과 제품(메뉴보드 사이니지)은 읽었지만 고객사와 장소가 없어요. 알려 주면 지역 경쟁사까지 찾아요.</span>
      </div>

      <div style="height: 60px; box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
        <span style="font-size: 12px; font-weight: 700; color: #596170; white-space: nowrap; flex-shrink: 0">입력에서 읽은 것</span>
        <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <span style="{{c.style}}">
              <sc-if value="{{c.found}}" hint-placeholder-val="{{true}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5L20 7"/></svg></sc-if>
              <span style="font-weight: 700">{{c.k}}</span><span style="opacity: 0.55">·</span><span style="font-weight: 500">{{c.v}}</span>
              <sc-if value="{{c.partial}}" hint-placeholder-val="{{false}}"><span style="height: 16px; padding: 0 5px; border-radius: 4px; background: #ffffff; color: #0b6e4f; font-size: 10px; font-weight: 700; display: flex; align-items: center">일부</span></sc-if>
            </span>
          </sc-for>
        </div>
        <span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 700; color: #8a91a0; white-space: nowrap; flex-shrink: 0">{{foundCount}}</span>
      </div>

      <div style="box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 1.5px solid #1428a0; border-radius: 18px; box-shadow: 0 10px 32px rgba(20,40,160,0.10); padding: 18px 18px 18px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="cust" style="font-size: 12.5px; font-weight: 600; color: #596170">고객사</label>
          <div style="height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; padding: 0 12px"><input id="cust" placeholder="예) A 커피 프랜차이즈" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="place" style="font-size: 12.5px; font-weight: 600; color: #596170">지역 · 장소</label>
          <div style="height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; padding: 0 12px"><input id="place" placeholder="예) 수도권 직영점 · 전국 320개 매장" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 7px; flex-shrink: 0; padding: 0 2px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 11v5 M12 8h.01"/></svg>
        <span style="font-size: 12.5px; color: #596170; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">고객사 · 업종 · 장소 · 제품까지 알려 주면 경쟁사를 훨씬 잘 찾아요. 업종만 있어도 찾긴 하지만 후보가 넓어져요.</span>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <a href="CA1.dc.html" style="display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #596170"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>뒤로</a>
        <span style="flex-grow: 1"></span>
        <div style="display: flex; align-items: center; gap: 10px">
          <a href="CA1G.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l7 6-7 6 M13 6l7 6-7 6"/></svg>건너뛰기 — 업종 기준으로 찾기</a>
          <span style="font-size: 12px; color: #8a91a0; white-space: nowrap">후보가 넓어져요</span>
        </div>
        <span style="flex-grow: 1"></span>
        <a href="CA1G.dc.html" style="height: 48px; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap">답하고 찾기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = ['넣기', '경쟁사 확인', '분석', '결과'];
    // 입력 "카페 메뉴보드 사이니지" 에서 읽은 것: 업종 찾음 · 제품 일부 · 고객사 · 장소 비어 있음(점선)
    const chip = (found) => 'height: 26px; box-sizing: border-box; padding: 0 9px 0 7px; border-radius: 999px; font-size: 11px; display: flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0;' + (found ? ' background: #e6f4ee; color: #0b6e4f;' : ' border: 1px dashed #8a91a0; background: transparent; color: #596170;');
    const C = [['업종', '외식 · 카페', true, false], ['제품', '메뉴보드 사이니지', true, true], ['고객사', '', false, false], ['장소', '', false, false]];
    const chips = C.map(([k, v, found, partial]) => ({ k, v: found ? v : '비어 있음', found, partial, style: chip(found) }));
    const n = chips.filter((c) => c.found).length;
    return { steps, cur: 1, chips, foundCount: n + ' / ' + chips.length };
  }
}
</script>
</body>
</html>
