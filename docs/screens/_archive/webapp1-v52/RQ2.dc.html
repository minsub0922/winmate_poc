<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요구사항 · 채워진 폼</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#a3a9b5}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="requirements" current="E 자산운용 용산 AI Ready 오피스" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="고객 요구사항" title="E 자산운용 용산 AI Ready 오피스" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>
    <section style="position: relative; width: 1180px; height: 780px; box-sizing: border-box; padding: 24px 40px 24px 40px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="flex-shrink: 0; height: 52px; box-sizing: border-box; padding: 0 8px 0 14px; border: 1.5px dashed #c9d0e6; border-radius: 12px; background: #fbfbfc; display: flex; align-items: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4 M7 9l5-5 5 5 M4 15v5h16v-5"/></svg>
        <span style="height: 34px; box-sizing: border-box; padding: 0 6px 0 8px; border-radius: 9px; border: 1px solid #e2e5ea; background: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; min-width: 0"><span style="height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;">PPTX</span><span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis">제안지원요청서_용산 업무시설 재개발.pptx</span><button aria-label="빼기" style="width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span style="height: 34px; box-sizing: border-box; padding: 0 6px 0 8px; border-radius: 9px; border: 1px solid #e2e5ea; background: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; min-width: 0"><span style="height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;">TXT</span><span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis">고객 미팅 메모_11월 4일.txt</span><button aria-label="빼기" style="width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: #596170; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span style="flex-grow: 1"></span>
        <button style="height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1428a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4 M7 9l5-5 5 5 M4 15v5h16v-5"/></svg>파일 첨부</button>
      </div>
      <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px">
    <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <label for="f-proj" style="font-size: 13px; font-weight: 600; color: #3d4452">프로젝트명</label>
        <div style="position: relative"><input id="f-proj" value="용산 업무시설 재개발 AI Ready 오피스" placeholder="" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; padding: 0 54px 0 12px; font-size: 14px; color: #121417; background: #ffffff; outline: none"><span style="position: absolute; right: 10px; top: 13px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;">PPTX</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <label for="f-cust" style="font-size: 13px; font-weight: 600; color: #3d4452">고객사</label>
        <div style="position: relative"><input id="f-cust" value="E 자산운용" placeholder="" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; padding: 0 54px 0 12px; font-size: 14px; color: #121417; background: #ffffff; outline: none"><span style="position: absolute; right: 10px; top: 13px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;">PPTX</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <label for="f-to" style="font-size: 13px; font-weight: 600; color: #3d4452">최종 제안대상</label>
        <div style="position: relative"><input id="f-to" value="" placeholder="예) 대표이사" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; padding: 0 12px 0 12px; font-size: 14px; color: #121417; background: #ffffff; outline: none"></div>
      </div>
      <div style="height: 1px; background: #f0f2f5; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 0">
        <label for="f-note" style="font-size: 13px; font-weight: 600; color: #3d4452; display: flex; align-items: center; gap: 6px">제작자 의견<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8a91a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><title>고객 문서 제외</title><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"/></svg></label>
        <div style="position: relative; flex-grow: 1; min-height: 0; display: flex"><textarea id="f-note" placeholder="제안 방향 · 강조할 점" style="width: 100%; box-sizing: border-box; resize: none; border: 1px solid #e2e5ea; border-radius: 10px; padding: 11px 12px; font-size: 14px; line-height: 1.6; color: #121417; background: #ffffff; outline: none">설계 단계 스펙인이 목표. 성수 오피스 대비 &#x27;최초 AI Ready&#x27;를 강조.</textarea><span style="position: absolute; right: 10px; bottom: 10px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;">TXT</span></div>
      </div>
    </div>
    <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
        <span style="font-size: 15px; font-weight: 700">키맨별 요구사항</span>
        <span style="font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; color: #1428a0">{{kmCount}}</span>
        <span style="flex-grow: 1"></span>
        <button style="height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #e2e5ea; background: #ffffff; color: #1428a0; font-size: 12.5px; font-weight: 600; white-space: nowrap">+ 키맨</button>
      </div>
      <sc-if value="{{multi}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
          <span style="font-size: 12.5px; color: #596170; white-space: nowrap">가중치</span>
          <div role="group" aria-label="키맨 가중치 · 경계를 끌어서 조정" style="flex-grow: 1; min-width: 0; display: flex; gap: 2px; border-radius: 7px; overflow: hidden">
            <sc-for list="{{keymen}}" as="k" hint-placeholder-count="3"><span style="{{k.seg}}">{{k.w}}%</span></sc-for>
          </div>
          <sc-if value="{{wDefault}}" hint-placeholder-val="{{true}}"><span style="height: 22px; padding: 0 8px; border-radius: 5px; border: 1px dashed #8a91a0; color: #596170; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">균등</span></sc-if>
        </div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden">
        <sc-for list="{{keymen}}" as="k" hint-placeholder-count="3">
          <div style="flex-shrink: 0; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; padding: 5px 12px 3px 12px; display: flex; flex-direction: column">
            <div style="display: flex; align-items: center; gap: 10px; height: 38px">
              <span style="{{k.av}}">{{k.init}}</span>
              <span style="font-size: 14.5px; font-weight: 700; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.name}}</span>
              <sc-if value="{{k.multi}}" hint-placeholder-val="{{true}}">
                <span style="display: flex; align-items: center; height: 28px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 8px; overflow: hidden; flex-shrink: 0">
                  <button aria-label="{{k.minus}}" style="width: 26px; height: 26px; border: none; background: #fbfbfc; color: #596170; font-size: 15px; line-height: 1">−</button>
                  <span style="min-width: 40px; text-align: center; font-family: Manrope, sans-serif; font-size: 12.5px; font-weight: 800">{{k.w}}%</span>
                  <button aria-label="{{k.plus}}" style="width: 26px; height: 26px; border: none; background: #fbfbfc; color: #596170; font-size: 15px; line-height: 1">+</button>
                </span>
              </sc-if>
              <button style="height: 28px; padding: 0 8px; border: none; background: transparent; color: #1428a0; font-size: 12.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0">+ 요구사항</button>
            </div>
            <sc-for list="{{k.reqs}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px; height: 34px; border-top: 1px solid #f0f2f5">
                <span style="width: 16px; flex-shrink: 0; padding-left: 6px; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; color: #8a91a0">{{r.n}}</span>
                <sc-if value="{{r.shim}}" hint-placeholder-val="{{false}}"><span aria-busy="true" style="{{r.shimStyle}}"></span></sc-if>
                <sc-if value="{{r.txt}}" hint-placeholder-val="{{true}}"><span style="flex-grow: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span></sc-if>
                <sc-if value="{{r.src}}" hint-placeholder-val="{{true}}"><span style="{{r.badge}}">{{r.src}}</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
        <span></span>
        <span style="flex-grow: 1"></span>
        <a href="RQ4.dc.html" style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 14px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">바로 저장</a>
        <a href="RQ3.dc.html" style="height: 48px; padding: 0 22px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z M19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>심층 작성</a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = ["입력", "심층 작성", "저장"];
    const COL = [["#1428a0", "#ffffff"], ["#5468d8", "#ffffff"], ["#c9d1f4", "#1428a0"]];
    const badge = 'height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; display: flex; align-items: center; flex-shrink: 0;';
    const K = [["대표이사", 34, [["사용자를 인식하고 반응하는 'AI Ready' 오피스", "PPTX"], ["'최초 AI Ready' 공간으로 알리기", "PPTX"], ["에너지 절감 · 정량 데이터 확보", "TXT"]]], ["공간컨텐츠실장", 33, [["오피스를 업무환경 플랫폼으로", "PPTX"], ["예측 · 반응형 공간 (Connecting-AI)", "TXT"], ["건물 가치 · 임대 선호도 제고", "TXT"]]], ["개발사업팀장", 33, [["AI 인프라를 설계 단계에 미리 반영", "TXT"]]]];
    const multi = K.length > 1;
    const keymen = K.map(([name, w, reqs], i) => ({
      name, w, multi, init: name.slice(0, 1), minus: name + ' 가중치 낮추기', plus: name + ' 가중치 높이기',
      av: 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: ' + COL[i][0] + '; color: ' + COL[i][1] + ';',
      seg: 'flex: ' + w + ' 1 0; min-width: 0; height: 24px; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; cursor: col-resize; background: ' + COL[i][0] + '; color: ' + COL[i][1] + ';',
      reqs: reqs.map(([t, src], j) => ({ n: j + 1, t: t || '', src: src || '', shim: t === null, txt: t !== null, badge,
        shimStyle: 'background: linear-gradient(90deg, #eef0f4, #e3e7ee, #eef0f4); border-radius: 6px; height: 12px; width: ' + (j % 2 ? '44%' : '62%') + ';' }))
    }));
    return { yes: true, steps, cur: 1, keymen, multi, kmCount: K.length + '명', wDefault: true };
  }
}
</script>
</body>
</html>
