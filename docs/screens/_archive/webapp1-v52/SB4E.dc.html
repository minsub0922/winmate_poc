<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Storyboard · 내보내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="storyboard" current="E 자산운용 용산 오피스 제안 기획" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="전략 수립 Storyboard" title="E 자산운용 용산 오피스 제안 기획" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" complete="{{done}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
        <span style="display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12.5px; font-weight: 700; color: #1428a0">공유 · 내보내기</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35">어떻게 내보낼까요?</h1>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #596170">고객에게 가는 파일에서는 내부 메모가 자동으로 빠져요.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 14px; height: 84px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; background: #ffffff; text-align: left; color: #121417; cursor: pointer; border: 2px solid #1428a0; box-shadow: 0 4px 14px rgba(20,40,160,0.10);">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; box-sizing: border-box; border: 6px solid #1428a0;"></span>
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">PPT</span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 15px; font-weight: 700">PPTX · 스토리보드 양식</span><span style="font-size: 12.5px; color: #596170">섹션 표 그대로 · 편집할 수 있어요</span></span>
        </button>
        <button aria-pressed="false" style="display: flex; align-items: center; gap: 14px; height: 84px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; background: #ffffff; text-align: left; color: #121417; cursor: pointer; border: 1px solid #e2e5ea;">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; box-sizing: border-box; border: 2px solid #c9d0e6;"></span>
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #eaeefb; color: #1428a0; font-family: Manrope, sans-serif; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">PDF</span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 15px; font-weight: 700">PDF</span><span style="font-size: 12.5px; color: #596170">공유 · 인쇄용</span></span>
        </button>
      </div>
      <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 16px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden">
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 14px; height: 58px; width: 100%; box-sizing: border-box; padding: 0 20px; border: none; background: #ffffff; text-align: left; color: #121417; cursor: pointer;">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #1428a0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          <span style="font-size: 14.5px; font-weight: 600; flex-grow: 1">요구 추적표를 부록으로</span>
          <span style="font-size: 12.5px; color: #8a91a0; white-space: nowrap">12행 · 연결 유형</span>
        </button>
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 14px; height: 58px; width: 100%; box-sizing: border-box; padding: 0 20px; border: none; background: #ffffff; text-align: left; color: #121417; cursor: pointer; border-top: 1px solid #f0f2f5;">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #1428a0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          <span style="font-size: 14.5px; font-weight: 600; flex-grow: 1">추가 논의 4 포함</span>
          <span style="font-size: 12.5px; color: #8a91a0; white-space: nowrap">Intro 문구 · XR · 레퍼런스 · DT 위치</span>
        </button>
        <button aria-pressed="true" aria-disabled="true" style="display: flex; align-items: center; gap: 14px; height: 58px; width: 100%; box-sizing: border-box; padding: 0 20px; border: none; background: #ffffff; text-align: left; color: #121417; cursor: pointer; border-top: 1px solid #f0f2f5;">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #8a91a0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          <span style="font-size: 14.5px; font-weight: 600; flex-grow: 1">확인 필요 · TBD 표시 유지</span>
          <span style="font-size: 12.5px; color: #8a91a0; white-space: nowrap">항상 켜져 있어요</span>
        </button>
        <button aria-pressed="false" style="display: flex; align-items: center; gap: 14px; height: 58px; width: 100%; box-sizing: border-box; padding: 0 20px; border: none; background: #ffffff; text-align: left; color: #121417; cursor: pointer; border-top: 1px solid #f0f2f5;">
          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid #c9d0e6; background: #ffffff;"></span>
          <span style="font-size: 14.5px; font-weight: 600; flex-grow: 1">내부 목표 메모 포함</span>
          <span style="font-size: 12.5px; color: #8a91a0; white-space: nowrap">내부 검토용 파일에만</span>
        </button>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <a href="SB4.dc.html" style="display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #596170; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>저장 완료</a>
        <span style="flex-grow: 1"></span>
        
        <button style="height: 48px; border: none; padding: 0 24px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap">내보내기</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { steps: ["요구사항 불러오기", "기획 방향", "목차 · 서사", "요구 추적", "일정 · 공유"], cur: 5, done: true };
  }
}
</script>
</body>
</html>
