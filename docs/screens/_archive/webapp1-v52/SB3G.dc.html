<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Storyboard · 목차 만드는 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="storyboard" current="E 자산운용 용산 오피스 제안 기획" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="전략 수립 Storyboard" title="E 자산운용 용산 오피스 제안 기획" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>
    <section style="width: 1180px; height: 780px; box-sizing: border-box; padding: 36px 180px 28px 180px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center">W</div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">목차와 서사를 쓰는 중이에요</h1>
          <span style="font-size: 14px; color: #596170">약 1분 · 끝나면 자동으로 넘어가요</span>
        </div>
        <div style="width: 520px; height: 8px; border-radius: 4px; background: #e2e5ea; overflow: hidden"><div style="width: 64%; height: 8px; background: #1428a0; border-radius: 4px"></div></div>
        <div style="width: 520px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #ffffff; border: 1px solid #e2e5ea">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1428a0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
              <span style="font-size: 13.5px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">요구 12개 분류 · 내부 목표 1개 분리</span>
              <span style="font-size: 12px; white-space: nowrap; color: #8a91a0;">끝</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #ffffff; border: 1px solid #e2e5ea">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1428a0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
              <span style="font-size: 13.5px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">기획 축을 파트에 반영</span>
              <span style="font-size: 12px; white-space: nowrap; color: #8a91a0;">끝</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #ffffff; border: 1px solid #e2e5ea">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #1428a0; box-sizing: border-box; background: #ffffff;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1428a0"></span></span>
              <span style="font-size: 13.5px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">섹션 11개 작성 방향 쓰기</span>
              <span style="font-size: 12px; white-space: nowrap; color: #1428a0; font-weight: 600;">7 / 11</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #ffffff; border: 1px solid #e2e5ea">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #c9d0e6; box-sizing: border-box;"></span>
              <span style="font-size: 13.5px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8a91a0;">요구 → 섹션 연결</span>
              <span style="font-size: 12px; white-space: nowrap; color: #8a91a0;">대기</span>
            </div>
        </div>
        <span style="font-size: 13px; color: #596170">확인 필요 4개는 추정하지 않고 TBD로 둬요</span>
        <a href="SB3.dc.html" style="font-size: 13px; font-weight: 600; color: #596170">기다리지 않고 지금까지 쓴 것 보기</a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { steps: ["요구사항 불러오기", "기획 방향", "목차 · 서사", "요구 추적", "일정 · 공유"], cur: 3 };
  }
}
</script>
</body>
</html>
