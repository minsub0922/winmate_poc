<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Value Proposition 3/3 — 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="value" current="A 커피 메뉴보드 가치 제안" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="Value Proposition" title="A 커피 메뉴보드 가치 제안" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" complete="{{done}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 18px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; gap: 12px">
        <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 3px; flex-grow: 1; min-width: 0">
          <div style="font-size: 14.5px; line-height: 1.6">가치 제안 3장을 만들었어요. 시트마다 고른 레이아웃과 이유를 붙여 두었고, 확인할 것은 3개예요.</div>

          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
              <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
                  <span style="font-size: 12px; font-weight: 700; color: #3d4452; white-space: nowrap">{{c.step}}</span>
                  <span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800">{{c.code}}</span><span style="{{c.mStyle}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="{{c.mIcon}}"/></svg>{{c.mText}}</span></span>
                </div>
                <div style="width: 212px; height: 120px; max-width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #e2e5ea; background: #ffffff; overflow: hidden; align-self: center">
                  <div style="width: 120px; height: 68px; transform: scale(1.75); transform-origin: 0 0"><dc-import name="Thumb" kind="{{c.kind}}" n="{{c.n}}" hint-size="120px,68px"></dc-import></div>
                </div>
                <span style="font-size: 13.5px; font-weight: 700; line-height: 1.4; height: 38px; overflow: hidden">{{c.title}}</span>
                <span style="font-size: 12px; color: #3d4452; line-height: 1.5; height: 36px; overflow: hidden">{{c.points}}</span>
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 8px; border-top: 1px solid #f0f2f5">
                  <span style="font-size: 11.5px; color: #596170; white-space: nowrap">{{c.meta}}</span>
                  <a href="VP3L.dc.html" style="font-size: 12px; font-weight: 600; white-space: nowrap">왜 이 레이아웃?</a>
                </div>
              </div>
            </sc-for>
          </div>

          <!-- 확인할 것 -->
          <div style="box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden">
            <div style="height: 38px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid #e2e5ea; background: #fbfbfc">
              <span style="font-size: 13px; font-weight: 700; white-space: nowrap">확인할 것 <span style="color: #596170; font-weight: 500">· 3 · 모두 그대로 둬도 제안서에 보낼 수 있어요</span></span>
            </div>
            <sc-for list="{{checks}}" as="k" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-top: 1px solid #f0f2f5">
                <span style="{{k.tagStyle}}">{{k.tag}}</span>
                <span style="font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0">{{k.t}}</span>
                <a href="{{k.href}}" style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #e2e5ea; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0">{{k.act}}</a>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 14px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; display: flex; align-items: center; justify-content: space-between">
          <div style="font-size: 13px; font-weight: 600">결과 <span style="color: #596170; font-weight: 500">· 3 / 3 · 완료</span></div>
          <div style="display: flex; gap: 6px">
            <a href="VP3L.dc.html" style="display: inline-flex; align-items: center; box-sizing: border-box; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">레이아웃 바꾸기</a>
            <a href="VP3N.dc.html" style="display: inline-flex; align-items: center; box-sizing: border-box; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">수치 보강</a>
            <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">한 문장 버전도 만들기</button>
          </div>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; gap: 10px">
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">후속 요청</label>
          <div style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; display: flex; align-items: center; gap: 8px; padding: 0 12px">
            <input id="q" placeholder="후속 요청 (예: 두 번째 기둥을 '손님이 먼저 읽는 메뉴'로)" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none">
            <button aria-label="보내기" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: none; background: #e2e5ea; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
          <a href="VP4.dc.html" style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; flex-shrink: 0">저장 · 내보내기</a>
          <a href="VP4.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap">
            <span>제안서 Value Props로</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const MODE = {
      auto: ['자동', 'background: #eaeefb; color: #1428a0;', 'M13 2L4 14h7l-1 8 9-12h-7l1-8z'],
      check: ['확인 권장', 'background: #ffffff; color: #1428a0; border: 1px solid #1428a0;', 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v7h-2zm0 9h2v2h-2z']
    };
    const CHIP = 'height: 20px; padding: 0 7px; border-radius: 999px; box-sizing: border-box; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; ';
    // 시트: [단계, 코드, 썸네일, n, 제목, 핵심, 근거 · 추정, 모드]
    const C = [
      ['고객 과제', 'CH-A', 'pillars', 3, 'A 커피가 지금 겪는 세 가지 문제', '인쇄 · 배송 연 [00]억 · 교체 매장당 월 [00]시간 · 오표기 월 [00]건', '근거 6 · 추정 0', 'auto'],
      ['가치 제안', 'VP-F·3', 'cards3img', 3, 'A 커피가 얻는 세 가지 가치와 그 가치를 만드는 제품', '본사에서 한 번에 운영 · 승인은 본사, 반영은 몇 분 · 저전력 자동 운영', '근거 5 · 공식 실사 3', 'auto'],
      ['기대 효과', 'EF-A', 'hbars', 3, '도입 1년 후, 네 가지 지표가 이렇게 달라집니다', '교체 [0]일 → [00]분 · 오표기 · 주문 대기 · 매장 전력', '근거 3 · 추정 1', 'check']
    ];
    const cards = C.map(([step, code, kind, n, title, points, meta, m]) => ({ step, code, kind, n, title, points, meta, mText: MODE[m][0], mIcon: MODE[m][2], mStyle: CHIP + MODE[m][1] }));
    const K = [
      ['추정', "기대 효과 '교체 리드타임' — 유관 사례 2건의 범위 [00~00]분으로 넣고 [추정] 표시했어요", '수치 보강', 'VP3N.dc.html', true],
      ['이미지', '이미지 칸 5개 — 공식 실사 4 (MagicINFO · QM55C · SmartThings Pro 화면) · 고객 매장 사진 없어 일러스트 1', '이미지 확인', 'VPI.dc.html', false],
      ['알림', 'Value Props 외식 · 카페 업종판이 나오면 3장을 업종 레이아웃으로 바꿀지 물어볼게요', '알림 보기', 'VP0.dc.html', false]
    ];
    const checks = K.map(([tag, t, act, href, strong]) => ({
      tag, t, act, href,
      tagStyle: 'height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0; ' + (strong ? 'background: #121417; color: #ffffff;' : 'background: #eaeefb; color: #1428a0;')
    }));
    return { steps: ['재료', '가치 구조', '결과'], cur: 3, done: true, cards, checks };
  }
}
</script>
</body>
</html>
