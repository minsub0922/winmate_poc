                <circle cx="166" cy="20" r="9" fill="#1428a0"/>

            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
              <span style="font-size: 11.5px; font-weight: 700; color: #1428a0; letter-spacing: 0.04em">WITH 솔루션</span>
              <span style="width: 18px; height: 18px; border-radius: 50%; background: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>

            <div style="font-size: 15px; font-weight: 700; color: #121417">솔루션 + 연관 제품 활용</div>
            <div style="font-size: 12.5px; color: #596170; line-height: 1.55">시나리오 속에 MagicINFO·SmartThings Pro 같은 솔루션이 동작하는 장면과, 그 솔루션에 연결된 제품 활용을 함께 넣습니다. 운영·관리 효과를 보여줄 때 적합.</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="font-size: 11px; color: #1428a0; background: #ffffff; border-radius: 4px; padding: 2px 7px">본사 원격 배포 장면</span><span style="font-size: 11px; color: #1428a0; background: #ffffff; border-radius: 4px; padding: 2px 7px">에너지 자동 제어</span></div>

          <button style="display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; padding: 16px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; text-align: left">
            <div style="width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; overflow: hidden">
              <svg width="100%" height="132" viewBox="0 0 340 132" fill="none" aria-hidden="true" style="display: block">
                <rect x="8" y="12" width="324" height="112" rx="8" fill="#f5f6f8"/>
                <rect x="22" y="30" width="74" height="44" rx="4" fill="#1f2533"/>

                <rect x="188" y="69" width="16" height="22" rx="2" fill="#1f2533"/>
                <path d="M190 99H202" stroke="#b4bccb" stroke-width="2" stroke-linecap="round"/>

                <path d="M228 95L203 81" stroke="#aeb7c6" stroke-width="4.5" stroke-linecap="round"/>
                <circle cx="201" cy="80" r="5.5" stroke="#9fb0e6" stroke-width="1.2"/>
                <circle cx="201" cy="80" r="2.2" fill="#9fb0e6"/>
                <path d="M225 116V96a11 11 0 0 1 22 0v20z" fill="#aeb7c6"/>
                <circle cx="236" cy="77" r="7" fill="#d3d9e2"/>
                <rect x="280" y="74" width="26" height="17" rx="2" fill="#1f2533"/>
                <path d="M293 91V94" stroke="#b4bccb" stroke-width="2.5"/>
                <rect x="310" y="86" width="8" height="8" rx="1.5" fill="#d3d9e2"/>
                <rect x="266" y="94" width="58" height="22" rx="3" fill="#ffffff" stroke="#b4bccb" stroke-width="1.2"/>
                <text x="18" y="117" fill="#596170" font-size="9.5" font-weight="600">매장</text>
              </svg>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
              <span style="font-size: 11.5px; font-weight: 700; color: #596170; letter-spacing: 0.04em">WITHOUT 솔루션</span>
              <span style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #d5d9e0; box-sizing: border-box"></span>
            </div>
            <div style="font-size: 15px; font-weight: 700; color: #121417">제품 활용만</div>
            <div style="font-size: 12.5px; color: #596170; line-height: 1.55">고객의 공간 시나리오에 제품이 쓰이는 장면만 넣습니다. 하드웨어 중심 제안이나 솔루션 도입 전 단계에 적합.</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="font-size: 11px; color: #596170; background: #f0f2f5; border-radius: 4px; padding: 2px 7px">메뉴보드 시청 장면</span><span style="font-size: 11px; color: #596170; background: #f0f2f5; border-radius: 4px; padding: 2px 7px">키오스크 주문</span></div>
          </button>
        </div>
        <div style="padding: 12px 18px 0 18px">
          <div style="box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="{{iconBoxStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{iconStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z M12 12l8-4.5 M12 12v9 M12 12L4 7.5"/></svg></span>
              <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="font-size: 13.5px; font-weight: 700; color: #121417">조감도 추가</span>
                  <span style="{{aerialTagStyle}}">{{aerialTag}}</span>
                </div>
                <div style="font-size: 12.5px; color: #596170; line-height: 1.5">장면이 일어나는 위치를 공간 조감도 위에 번호로 표시해 시나리오와 함께 넣습니다.</div>
              </div>
              <button aria-label="조감도 추가" aria-pressed="{{aerialPressed}}" onClick="{{toggleAerial}}" style="{{toggleStyle}}"><span style="{{knobStyle}}"></span></button>
            </div>
            <sc-if value="{{aerialOn}}" hint-placeholder-val="{{ false }}">
              <div style="padding-left: 44px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <button aria-pressed="{{newPressed}}" onClick="{{pickNew}}" style="{{newStyle}}">
                  <span style="font-size: 12.5px; font-weight: 700">새로 만들기</span>
                  <span style="font-size: 11.5px; color: #596170">시나리오 공간으로 조감도 생성</span>
                </button>
                <button aria-pressed="{{existPressed}}" onClick="{{pickExist}}" style="{{existStyle}}">
                  <span style="font-size: 12.5px; font-weight: 700">기존 조감도 연결</span>
                  <span style="font-size: 11.5px; color: #596170">조감도 작업 3개에서 고르기</span>
                </button>
              </div>
            </sc-if>
          </div>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; justify-content: flex-end">
          <a href="SC2.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
            <span>공간 시나리오 입력</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

      </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // 조감도 추가: 기본 꺼짐. 켜면 조감도를 새로 만들지, 기존 조감도 작업에 연결할지 고른다.
    const st = this.state || {};
    const on = st.aerial === true;
    const src = st.src === 'exist' ? 'exist' : 'new';
    const opt = (sel) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; box-sizing: border-box; min-height: 44px; padding: 8px 12px; border-radius: 10px; text-align: left; color: #121417; cursor: pointer; ' + (sel ? 'border: 1.5px solid #1428a0; background: #eaeefb;' : 'border: 1px solid #e2e5ea; background: #ffffff;');
    return {
      steps: ['시나리오 유형', '공간 시나리오 입력', '솔루션 · 제품 입력', '시나리오 생성'], cur: 1,
      aerialOn: on,
      aerialPressed: on ? 'true' : 'false',
      toggleAerial: () => this.setState({ aerial: !on }),
      aerialTag: on ? '켜짐' : '선택 · 기본 꺼짐',
      aerialTagStyle: 'font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; ' + (on ? 'color: #1428a0; background: #eaeefb;' : 'color: #596170; background: #f0f2f5;'),
      iconBoxStyle: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: ' + (on ? '#eaeefb' : '#f0f2f5') + ';',
      iconStroke: on ? '#1428a0' : '#596170',
      toggleStyle: 'width: 36px; height: 20px; flex-shrink: 0; position: relative; border: none; border-radius: 999px; padding: 0; cursor: pointer; background: ' + (on ? '#1428a0' : '#d5d9e0') + ';',
      knobStyle: 'position: absolute; top: 2px; left: ' + (on ? '18px' : '2px') + '; width: 16px; height: 16px; border-radius: 50%; background: #ffffff;',
      pickNew: () => this.setState({ src: 'new' }),
      pickExist: () => this.setState({ src: 'exist' }),
      newPressed: src === 'new' ? 'true' : 'false',
      existPressed: src === 'exist' ? 'true' : 'false',
      newStyle: opt(src === 'new'),
      existStyle: opt(src === 'exist')
    };
  }
}
</script>
</body>
</html>
