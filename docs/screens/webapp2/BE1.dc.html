<!doctype html>
<html lang="ko">
<head>

<title>조감도 1/5 — 공간 입력</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}

</style>

<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="birdseye" current="강남 플래그십 1층 로비" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="공간 조감도 생성" title="새 작업" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; gap: 12px">
          <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
          <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 3px">
            <div style="font-size: 14.5px; line-height: 1.65">조감도를 만들 공간을 알려주세요. 용도, 대략의 면적과 층고, 창·기둥 같은 특징이 있으면 함께 적어주세요. 도면이나 현장 사진을 첨부하면 구조를 더 정확히 반영합니다.</div>
            <div style="display: flex; gap: 8px; font-size: 12.5px; color: #596170; align-items: center">
              <span>여러 공간을 한 조감도에 담으려면 공간을 줄 단위로 나눠 적어주세요.</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 16px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; font-size: 13px; font-weight: 600">공간 입력 <span style="color: #596170; font-weight: 500">· 1 / 5</span></div>
        <div style="padding: 10px 18px 0 18px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
          <span style="font-size: 12px; color: #596170; margin-right: 2px">공간 유형</span>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #1428a0; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600">매장 · 로비</button>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">회의실 · 오피스</button>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">강의실</button>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">병원 대기실</button>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">호텔 객실</button>
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">관제실</button>
        </div>
        <div style="padding: 10px 18px 0 18px">
          <label for="space" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">공간 설명</label>
          <textarea id="space" placeholder="예) 강남 플래그십 스토어 1층 로비. 약 120평, 층고 4.5m, 정면이 전면 유리창이라 낮에는 밝고 저녁엔 외부에서 내부가 잘 보임. 중앙에 기둥 2개." style="width: 100%; height: 108px; box-sizing: border-box; resize: none; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #121417; outline: none"></textarea>
        </div>
        <div style="padding: 10px 18px 0 18px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 5px">
            <label for="area" style="font-size: 12px; color: #596170">면적</label>
            <div style="height: 38px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; padding: 0 12px; gap: 6px"><input id="area" placeholder="120" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none"><span style="font-size: 12.5px; color: #596170">평</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px">
            <label for="height" style="font-size: 12px; color: #596170">층고</label>
            <div style="height: 38px; box-sizing: border-box; border: 1px solid #e2e5ea; border-radius: 10px; background: #f5f6f8; display: flex; align-items: center; padding: 0 12px; gap: 6px"><input id="height" placeholder="4.5" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #121417; outline: none"><span style="font-size: 12.5px; color: #596170">m</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px">
            <span style="font-size: 12px; color: #596170">도면 · 사진</span>
            <a href="BE1D.dc.html" style="height: 38px; box-sizing: border-box; border: 1px dashed #b8bec8; border-radius: 10px; background: #ffffff; color: #1428a0; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L16 7"/></svg><span>파일 첨부</span></a>
          </div>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; justify-content: flex-end">
          <a href="BE2.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
            <span>배치될 제품 입력</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() { return { steps: ['공간 입력', '배치될 제품', '가구 추천', '배치 · 인테리어 컨펌', '3D 조감도 생성'], cur: 1 }; }
