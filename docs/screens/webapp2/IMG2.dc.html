<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이미지 생성 2/3 — 상세 조건</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f6f8}
a{color:#1428a0;text-decoration:none}a:hover{color:#0f1f80}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">
  <dc-import name="Sidebar" group="image" current="카페 매장 메뉴보드 시안" hint-size="260px,900px"></dc-import>
  <main style="width: 1180px; height: 900px; display: flex; flex-direction: column">
    <dc-import name="TopBar" section="이미지 생성" title="카페 매장 메뉴보드 시안" popover="none" hint-size="1180px,64px"></dc-import>
    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; justify-content: flex-end">
          <div style="max-width: 560px; background: #eef0f4; border-radius: 16px 16px 4px 16px; padding: 12px 16px; font-size: 14.5px; line-height: 1.65"><span style="font-weight: 600">공간</span> · 카페 카운터 위에 3연 메뉴보드가 걸린 장면, 낮 시간, 손님 2~3명</div>
        </div>
        <div style="display: flex; gap: 12px">
          <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>
          <div style="font-size: 14.5px; line-height: 1.65; padding-top: 3px">좋습니다. 장면에 등장할 삼성 제품과 표현 스타일을 정해 주세요. 제품을 지정하면 실제 제품 외형과 비율을 반영해 생성합니다.</div>
        </div>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 16px 40px 24px 40px">
      <div style="width: 800px; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e5ea; border-radius: 18px; box-shadow: 0 8px 28px rgba(18,20,23,0.08); display: flex; flex-direction: column">
        <div style="padding: 14px 18px 0 18px; font-size: 13px; font-weight: 600">상세 조건 <span style="color: #596170; font-weight: 500">· 2 / 3</span></div>

        <div style="padding: 10px 18px 0 18px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: #596170">등장 제품</div>
          <div style="box-sizing: border-box; min-height: 48px; border: 1px solid #e2e5ea; border-radius: 12px; background: #ffffff; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600"><span>Smart Signage QM55C ×3</span><button aria-label="제거" style="width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent; color: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
            <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600"><span>Kiosk KM24C</span><button aria-label="제거" style="width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent; color: #1428a0; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
            <label for="pq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">제품명 입력</label>
            <input id="pq" placeholder="제품명을 입력해 추가…" style="flex-grow: 1; min-width: 160px; height: 30px; border: none; background: transparent; font-size: 14px; color: #121417; outline: none">
          </div>
        </div>

        <div style="padding: 10px 18px 0 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; color: #596170">스타일</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #1428a0; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600">실사 렌더</button>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">미니멀 3D</button>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">일러스트</button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; color: #596170">비율 · 장수</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #1428a0; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600">16:9</button>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">4:3</button>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">1:1</button>
              <span style="width: 1px; height: 20px; background: #e2e5ea; margin: 0 4px"></span>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 12.5px; font-weight: 500">2장</button>
              <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #1428a0; background: #eaeefb; color: #1428a0; font-size: 12.5px; font-weight: 600">4장</button>
            </div>
          </div>
        </div>

        <div style="padding: 10px 18px 0 18px; display: flex; align-items: center; gap: 10px">
          <div style="font-size: 12px; color: #596170; flex-shrink: 0">참조 이미지</div>
          <div style="display: flex; gap: 6px">
            <div style="width: 52px; height: 36px; border-radius: 6px; background: #dfe3ea; position: relative"><button aria-label="참조 이미지 제거" style="position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: none; background: #121417; color: #ffffff; font-size: 10px; display: flex; align-items: center; justify-content: center">×</button></div>
            <div style="width: 52px; height: 36px; border-radius: 6px; background: #e6e9ef; position: relative"><button aria-label="참조 이미지 제거" style="position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: none; background: #121417; color: #ffffff; font-size: 10px; display: flex; align-items: center; justify-content: center">×</button></div>
            <button style="width: 52px; height: 36px; border-radius: 6px; border: 1px dashed #b8bec8; background: #ffffff; color: #596170; font-size: 16px">+</button>
          </div>
          <span style="font-size: 12px; color: #596170">이미지 검색에서 선택한 2장이 참조로 들어갔습니다</span>
        </div>

        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
          <a href="IMG1.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; color: #121417; font-size: 13.5px; font-weight: 600; display: flex; align-items: center">이전</a>
          <a href="IMG3G.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #1428a0; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
            <span>이미지 4장 생성</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>

}
</script>
</body>
</html>
