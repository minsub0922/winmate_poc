<!doctype html>

<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #f5f6f8; color: #121417; font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden">

    <dc-import name="Stepper" steps="{{steps}}" current="{{cur}}" hint-size="1180px,56px"></dc-import>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 40px 0 40px; box-sizing: border-box; overflow: hidden">
      <div style="width: 800px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; gap: 12px">
          <div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #1428a0; color: #ffffff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">W</div>

        </div>

        <div style="padding: 14px 18px 0 18px; font-size: 13px; font-weight: 600">이미지 유형 <span style="color: #596170; font-weight: 500">· 하나 선택 · 1 / 3</span></div>
        <div style="padding: 12px 18px 0 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">

          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; text-align: left">

            </div>

            <div style="font-size: 12.5px; color: #596170; line-height: 1.5">표지·섹션 슬라이드용 분위기 배경, 텍스트 영역 확보</div>

          <button style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #e2e5ea; background: #ffffff; text-align: left">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
              <div style="width: 34px; height: 34px; border-radius: 9px; background: #f0f2f5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#596170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2"/><path d="M17 11h4M19 9v4"/></svg></div>
              <span style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #d5d9e0; box-sizing: border-box"></span>
            </div>
            <div style="font-size: 14px; font-weight: 700; color: #121417">시나리오</div>
            <div style="font-size: 12.5px; color: #596170; line-height: 1.5">사람이 제품을 사용하는 순간을 담은 컷</div>

        </div>
        <div style="padding: 10px 18px 0 18px">

          <textarea id="desc" placeholder="예) 카페 카운터 위에 3연 메뉴보드가 걸린 장면, 낮 시간, 손님 2~3명" style="width: 100%; height: 72px; box-sizing: border-box; resize: none; border: 1px solid #e2e5ea; border-radius: 12px; background: #f5f6f8; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #121417; outline: none"></textarea>
        </div>
        <div style="padding: 12px 18px 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="display: flex; align-items: center; gap: 6px">
            <a href="IMG2R.dc.html" aria-label="참조 이미지 첨부" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #e2e5ea; background: #ffffff; color: #596170; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></a>
            <span style="font-size: 12.5px; color: #596170">참조 이미지는 상단 '이미지 검색'에서도 가져올 수 있어요</span>
          </div>
