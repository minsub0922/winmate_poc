# 생성 이미지 · 문구 콘텐츠 정책 사전 — 플랫폼 소유(config/). 07-image §10.6. 초안(status: draft) — 법무 확인 전.
# image 서비스가 먼저 읽는다(없으면 서비스 안 초안). 고치면 서비스 재시작 없이 다음 호출부터 반영되는지는 서비스 구현을 따른다.
status: draft
competitor_brands:
  - name: LG전자
    aliases: [LG, 엘지, LG전자, LG Electronics]
  - name: 소니
    aliases: [Sony, 소니]
  - name: 파나소닉
    aliases: [Panasonic, 파나소닉]
  - name: 샤프
    aliases: [Sharp, 샤프]
  - name: 애플
    aliases: [Apple, 애플, 아이패드, iPad, 아이폰, iPhone]
  - name: 하이센스
    aliases: [Hisense, 하이센스]
  - name: TCL
    aliases: [TCL]
  - name: 필립스
    aliases: [Philips, 필립스]
  - name: NEC
    aliases: [NEC]
  - name: BOE
    aliases: [BOE]
  - name: 샤오미
    aliases: [Xiaomi, 샤오미]
  - name: 레노버
    aliases: [Lenovo, 레노버]
# 사전 밖 일반 표현(“경쟁사 A”, “타사 제품”)
generic_competitor_patterns:
  - '경쟁사(?:\s*[A-Z](?![A-Za-z]))?'
  - '타사'
# 실존 인물 표현(역할어 + 이름) — LLM 이 없을 때의 최소 규칙
person_patterns:
  - '(?:배우|가수|모델|아나운서|선수|연예인|탤런트|아이돌|방송인|대통령|장관|회장)\s*[가-힣○OＯ]{2,4}'
