[project]
name = "winmate-export"
version = "0.1.0"
description = "내보내기 — PPTX · XLSX · DOCX · PDF · ZIP 생성, 시트 템플릿 카탈로그"
requires-python = ">=3.11"
dependencies = ["winmate-common", "python-pptx>=1.0.2", "python-docx>=1.2", "openpyxl>=3.1.5", "reportlab>=5.0", "pillow>=12.3", "pypdfium2>=5.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_export"]
