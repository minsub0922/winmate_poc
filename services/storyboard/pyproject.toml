[project]
name = "winmate-storyboard"
version = "0.1.0"
description = "전략 수립 Storyboard — 기획 질문 · 5단 목차 · 요구사항 추적 · 버전 비교 · 일정"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_storyboard"]
