[project]
name = "winmate-mi"
version = "0.1.0"
description = "Market Intelligence — 업종 판별 · 4개 분석 영역 · 출처 검증 · 부분 재분석 · 보고서"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14", "python-dateutil>=2.9"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_mi"]
