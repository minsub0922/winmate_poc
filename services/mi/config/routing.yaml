# mi 라우팅 규칙 — MIR 시트(GET /v1/routing-rules)와 서버 판단 코드가 같은 값을 읽는다(03-mi.md §3.3 · §10).
# 문구의 {auto} {check_min} {check_max} {ask_gap} 은 아래 thresholds 값으로 채운다(AC-MI-01: 값을 바꾸면 설명과 판정이 함께 바뀐다).

header:
  eyebrow: "ROUTING · MARKET INTELLIGENCE"
  title: "에이전트가 스스로 정하는 것, 사람에게 묻는 것"
  desc: "여섯 단계마다 신호를 읽고 갈 길을 정해요. 오른쪽 아래 네 경우만 사람에게 묻습니다."

modes:
  - {key: auto, label: "자동", desc: "진행"}
  - {key: check, label: "확인 권장", desc: "진행 + 결과에 표시"}
  - {key: ask, label: "선택 필요", desc: "답 받고 진행"}
  - {key: pin, label: "고정", desc: "사람이 정함"}

thresholds:
  segment_auto: 0.80          # 1위 확신도 ≥ → 자동 확정
  segment_check_min: 0.50     # 1위 < → 범용(GEN)
  segment_ask_gap: 0.10       # 1 · 2위 차이 < → 한 번 묻기(100배 정수 비교)
  llm_weight: 0.5
  kb_weight: 0.3
  clue_weight: 0.2
  fallback_kb_weight: 0.6
  fallback_clue_weight: 0.4
  one_line_chars: 60          # 입력 합계 < → 한 줄 메모뿐
  inferred_max: 3
  customer_public_min: 3      # 고객 공개 자료 < → 고객사 영역 축소(CB-A)
  competitor_auto_top: 3
  competitor_min_conf: 0.50
  conflict_ratio: 0.20
  stale_months: 24
  number_tolerance_ratio: 0.005
  quote_partial_ratio: 0.90
  dup_jaccard: 0.9
  fit_ok: 85
  layout_tie: 5
  depth_standard: 30
  depth_large: 60
  recheck_days: 30

keywords:
  competitor: ["경쟁", "대체", "교체"]
  user: ["손님", "직원", "동선", "대기"]
  exec_onepager: ["경영진 한 장", "한 장으로", "1장 요약", "경영진 1장"]

budgets:
  "30": {websearch: 16, fetch: 30, llm: 40}
  "60": {websearch: 32, fetch: 60, llm: 80}

time:
  base_s: 60
  per_area_s: 30
  changed_base_s: 20
  changed_per_area_s: 20
  layout_s: 40

stages:
  - "no": "1"
    title: "입력 판별"
    sub: "무엇으로 시작했나 — 직접 입력 · 문서 · 다른 작업 · 업종 칩"
    rules:
      - ["RFP · 회의록 첨부", "요구 · 평가 기준 · 일정 추출", auto]
      - ["Storyboard 작업 연결", "요구사항 · Key Message 상속", auto]
      - ["업종 칩에서 시작 (MI1I)", "업종 확정 · 요구 프리셋", pin]
      - ["이전 MI 작업 · 30일 경과", "바뀐 자료만 찾아 다시 분석", auto]
      - ["한 줄 메모뿐", "사례 DB로 빈칸 추론 · 표시", check]
  - "no": "2"
    title: "업종 판별"
    sub: "16개 업종 + 범용 · 단서 키워드 · 사례 DB 유사도"
    rules:
      - ["확신 {auto} 이상", "자동 확정", auto]
      - ["{check_min} ~ {check_max}", "진행하고 결과에 업종 확인 칩", check]
      - ["1 · 2위 차이 {ask_gap} 미만", "한 번 묻기 (섞어서 보기 포함)", ask]
      - ["16개 업종 밖 (예: 스크린골프장)", "범용 레이아웃으로", auto]
      - ["연결된 Storyboard · 제안서에 업종", "그대로 상속", auto]
  - "no": "3"
    title: "쓰임 판별"
    sub: "결과가 어디로 가나 — 연결된 제안서 유형 · 요청 문구"
    rules:
      - ["표준 제안서 연결", "MI 섹션 3시트 (시장 · 고객 · 경쟁)", auto]
      - ["Solution형 연결", "대규모 MI 5~6시트 + 시사점", auto]
      - ["퀵윈 연결", "MI 섹션 없음 → 리포트 + VP 재료로", auto]
      - ["'경영진 한 장' 요청", "IM-B 1장 + 부록 2장", auto]
      - ["연결 없음", "리포트 · 보낼 때 다시 매핑", auto]
  - "no": "4"
    title: "범위 · 경쟁사"
    sub: "무엇을 얼마나 — 요구 문구 · 공개 자료 양 · 제출 대상"
    rules:
      - ["요구에 '경쟁 · 대체 · 교체'", "경쟁 영역 포함", auto]
      - ["'손님 · 직원 · 동선 · 대기'", "사용자 영역 포함", auto]
      - ["고객 공개 자료 3건 미만", "고객사 영역 축소 → CB-A", auto]
      - ["경쟁사 지정 없음", "업종 사례 빈도 상위 3곳", check]
      - ["고객에게 내는 제안서", "경쟁사 익명 표기 (A · B · C)", auto]

layout:
  "no": "5"
  title: "레이아웃 선택 — 시트마다"
  sub: "고정한 시트는 건너뜀 → 업종 레이아웃 (16개 업종 × 3장) → 데이터 모양 → 메시지 · 고른 이유는 한 줄로 시트에 남김"
  columns: ["시트", "업종이 정해지면", "업종 레이아웃이 없거나 업종이 범용이면 — 데이터 모양 → 템플릿"]
  band:
    - code: MS
      name: "시장 규모 · 성장"
      ind: "MI-XX-A (트렌드와 한 장)"
      has_industry: true
      rules: [["연도별 규모", "MS-B"], ["지표 여럿 · 추이 없음", "MS-A"], ["확장 목표 · 노릴 몫", "MS-C"], ["세그먼트별 규모 · 성장", "MS-D"], ["수치 부족 · 동인 설득", "MS-E"]]
    - code: TR
      name: "산업 트렌드"
      ind: "MI-XX-A (시장과 한 장)"
      has_industry: true
      rules: [["과거 → 다음 흐름", "TR-A"], ["3개 이하 · 고객과 연결", "TR-B"], ["5개 이상 · 우선순위", "TR-C"]]
    - code: CB
      name: "고객사 비즈니스"
      ind: "MI-XX-B"
      has_industry: true
      rules: [["공개 자료만", "CB-A"], ["전략 문서 있음", "CB-B"], ["운영 단계마다 문제", "CB-C"], ["내부 · 외부 균형", "CB-D"]]
    - code: US
      name: "사용자 분석"
      ind: "MI-XX-C"
      has_industry: true
      rules: [["유형이 뚜렷이 나뉨", "US-A"], ["동선 · 인터뷰", "US-B"], ["구성 비율 데이터", "US-C"]]
    - code: CP
      name: "경쟁 환경"
      ind: "업종 틀 없음 → 범용"
      has_industry: false
      rules: [["2~5곳 × 비교 기준", "CP-A"], ["5곳 이상 · 두 축 수치", "CP-B"], ["점유율 데이터", "CP-C"]]
    - code: IM
      name: "MI 시사점"
      ind: "범용"
      has_industry: false
      rules: [["방향 하나로 좁히기", "IM-A"], ["경영진 한 장", "IM-B"]]

gaps:
  "no": "6"
  title: "결측 · 충돌 처리"
  sub: "값이 없거나 부딪칠 때 — 먼저 스스로 메우고, 못 메우면 표시해서 남김"
  rules:
    - ["레이아웃에 필요한 값이 없음", "추가 검색 → 대체 레이아웃 (MS-B → MS-E) + [확정 필요]", auto]
    - ["사람이 고정한 시트", "대체하지 않음 · 자리표시 [00] · 확정 필요 목록으로", pin]
    - ["출처끼리 수치 차이 20% 이상", "최신 · 공신력 순으로 쓰고 두 값을 함께 표시", check]
    - ["24개월 지난 출처", "제외하고 최신 자료로 대체 · 대체 못 하면 표시", auto]

asks:
  title: "사람에게 묻는 경우는 이 넷뿐"
  items:
    - "업종이 두 갈래 — 1 · 2위 차이 {ask_gap} 미만"
    - "경쟁사 실명을 고객에게 내는 제안서에 넣을 때"
    - "사내 대외비 수치를 고객 제출물에 넣을 때"
    - "사람이 고정한 시트를 덮어써야 할 때"
  footer: "답이 없으면 추천값으로 진행 · 하나를 바꾸면 그 뒤 단계만 다시 돕니다"
