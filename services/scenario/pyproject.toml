[project]
name = "winmate-scenario"
version = "0.1.0"
description = "공간 시나리오 — 업종 템플릿 · 장면 작성 · 장면별 솔루션 · 장면 이미지 · 내보내기"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_scenario"]
