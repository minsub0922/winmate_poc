# SC2 「예시 골격」(09-scenario §10.6, (신규) 제안 문장). 누르면 입력칸 끝에 덧붙인다(지우지 않음).
# 업종을 모르면 아래 3개(보드: 매장 하루 · 신메뉴 출시일 · 장애 발생 상황).
# 업종을 알면 그 업종 프리셋 제목 앞 2개 + 「장애 발생 상황」 — 프리셋 골격은 흐름 단계를 「{단계}. …」 줄로 펼친다
# (시각은 비운다 — 근거 없이 시각을 지어내지 않음, 매장 하루처럼 아래에 문장이 있는 제목은 그 문장을 쓴다).
# {책임자} = 업종 프리셋 첫 역할(없으면 「점장」).
generic:
  - title: 매장 하루
    text: "07:00 {책임자}가 매장을 오픈한다.\n11:30 점심 피크. 손님이 몰린다.\n14:00 본사가 오후 프로모션을 내린다.\n21:00 마감."
  - title: 신메뉴 출시일
    text: "전날 본사가 신메뉴 콘텐츠를 예약한다.\n07:00 오픈과 함께 메뉴가 바뀐다.\n12:00 신메뉴 주문이 몰린다.\n20:00 반응을 집계한다."
  - title: 장애 발생 상황
    text: "10:00 매장 화면 하나가 꺼진다.\n10:05 본사가 알림을 받는다.\n10:20 원격으로 조치한다.\n10:30 정상화된다."
