[project]
name = "winmate-vp"
version = "0.1.0"
description = "Value Proposition — 재료 수집 · 메시지 · 레이아웃 · 이미지 슬롯 · 수치"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_vp"]
