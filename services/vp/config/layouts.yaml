# Value Props 레이아웃 카탈로그 — 범용 35종(05-vp.md §4.15.1) + 업종판(16 × 3, 코드로 만든다 — catalog.py)
# - code = 정본 코드(저장 · 계약 · export 템플릿 코드), display = 화면 코드(가운뎃점).
# - board: image(제품 이미지판) · scene(장면판) · text(이미지 없는 판) · field(현장 질문형) · photo(실사 중심판)
# - thumb: Thumb kind · n(보드에 정의 없는 `—` 는 export 썸네일이 먼저 나오고, 없으면 여기 kind)
# - slots: 이미지 칸 정의 — subject(product · solution · space · case · customer) · per(pillar · pair · stakeholder · product · one) · label(칸 이름 틀)
# - needs: 적합도(§4.15.5) — fit = round(100 × Σ w·s / Σ w), s ∈ [0,1](개수는 비율, strict 는 0/1). (제안) 가중치 — §11 Q9
# - why: 이유 문장 틀(met · unmet)
layouts:
  - code: VP-E
    display: VP-E
    family: 제품 이미지판
    board: image
    role: VP
    name: 과제 → 제품 → 가치
    short: 과제 ↔ 제품
    when: 과제 = 제품
    shape: 과제 n = 제품 n(1:1 짝)
    thumb: {kind: chain, n: 3}
    twin: VP-A
    slots: {subject: product, per: pair, grade: C, label: '짝 {i}'}
    needs:
      - {key: pairs, strict: true, w: 3}
      - {key: challenges, min: 2, w: 1}
      - {key: products, min: 2, w: 1}
    why: {met: '과제 {challenges} · 제품 {products} — 1:1로 맞아요', unmet: '과제 {challenges} · 제품 {products} — 짝이 안 맞음'}
