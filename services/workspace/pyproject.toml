[project]
name = "winmate-workspace"
version = "0.1.0"
description = "워크스페이스 — 사용자 · 프로젝트 · 작업물 색인(최근 작업·사이드바 이력) · 코멘트 · 검토/승인 · 공유 링크"
requires-python = ">=3.11"
dependencies = ["winmate-common"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_workspace"]
