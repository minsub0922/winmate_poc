[project]
name = "winmate-files"
version = "0.1.0"
description = "파일 — 업로드 · 저장 · 문서 파싱(PPTX·PDF·DOCX·XLSX·TXT·메일·HEIC) · 미리보기"
requires-python = ">=3.11"
dependencies = ["winmate-common", "pypdfium2>=5.14", "pdfplumber>=0.11", "python-pptx>=1.0.2", "python-docx>=1.2", "openpyxl>=3.1.5", "pillow>=12.3", "pillow-heif>=1.8", "beautifulsoup4>=4.15", "lxml>=6.1"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_files"]
