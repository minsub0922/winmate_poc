# 화면 표시 규칙(보드 · 00-shell [제안] 그대로). 사실이 아니라 "어떻게 보일지"만 정한다.

# L1 분류 순서 (00-shell §7.2.3 [제안])
l1_order: [top_display, top_tv_audio, top_it, top_mobile, top_hvac, top_living, top_kitchen, top_solution, top_service]

# 모델 표시명 규칙 (갭 G-PRD-1). 규칙에 맞지 않으면 모델코드를 그대로 쓴다(display_name_basis = model_code).
# 사이니지 모델코드 LH{크기}{계열 2자}{세대 1자}… → {계열}{크기}{세대}: LH55QMCEBGCXKR → QM55C (보드 QM55C · QB55C · QH55C)
display_name_rules:
  - id: signage_lh
    l1: [top_display]
    pattern: '^LH(?P<size>\d{2,3})(?P<line>[A-Z]{2})(?P<gen>[A-Z])'
    template: '{line}{size}{gen}'

# 영문 계열명(제품 입력창 버블 `Smart Signage QM55C`, 보드 원문) — 분류(L2)별. 없는 분류는 표시명만 쓴다.
series_en:
  cat_smart-signage: Smart Signage

# 해상도 라벨 (00-shell §9.3)
resolution_labels:
  "3840x2160": 4K UHD
  "1920x1080": FHD
  "2560x1440": QHD
  "7680x4320": 8K

# 솔루션 종류(KB solution.kind) → 정보 상자 머리 (보드 `CMS — MagicINFO · VXT 지원`)
