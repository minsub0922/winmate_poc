[project]
name = "winmate-kb"
version = "0.1.0"
description = "지식 DB — 제품 · 솔루션 · 업종 · 공간 · 사례 · 메시지 · 이미지 질의 (winmate-kb)"
requires-python = ">=3.11"
dependencies = ["winmate-common", "numpy>=2.2", "scikit-learn>=1.9", "joblib>=1.5", "pillow>=12.3", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_kb"]
