[project]
name = "winmate-birdseye"
version = "0.1.0"
description = "공간 조감도 — 공간 입력 · 도면 인식 · 제품 배치 · 가구 추천 · 배치 검증 · 3D 조감도"
requires-python = ">=3.11"
dependencies = ["winmate-common", "pillow>=12.3", "numpy>=2.2", "shapely>=2.1", "pdfplumber>=0.11", "pypdfium2>=5.14", "reportlab>=5.0"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_birdseye"]
