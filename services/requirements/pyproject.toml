[project]
name = "winmate-requirements"
version = "0.1.0"
description = "고객 요구사항 — 입력 폼 · 파일로 채우기 · 심층 작성 · 고객 질문 · 정의서 버전"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_requirements"]
