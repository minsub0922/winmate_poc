[project]
name = "winmate-competitor"
version = "0.1.0"
description = "경쟁사 분석 — 경쟁사 찾기 · 6개 비교 기준 · 신뢰도 · 익명화 · 30일 재확인"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14", "python-dateutil>=2.9"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_competitor"]
