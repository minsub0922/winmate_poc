# 생성 이미지 콘텐츠 정책 사전(초안 · draft) — 07-image §10.6. 법무 확인 필요.
# config/content_policy.yaml 이 있으면 그 파일이 먼저다(플랫폼 소유). 이 파일은 그전까지의 서비스 내 기본값.
status: draft
competitor_brands:
  - name: LG전자
    aliases: [LG, 엘지, LG전자, LG Electronics]
  - name: 소니
    aliases: [Sony, 소니]
  - name: 파나소닉
    aliases: [Panasonic, 파나소닉]
  - name: 샤프
    aliases: [Sharp, 샤프]
  - name: 애플
    aliases: [Apple, 애플, 아이패드, iPad, 아이폰, iPhone]
  - name: 하이센스
    aliases: [Hisense, 하이센스]
  - name: TCL
    aliases: [TCL]
  - name: 필립스
    aliases: [Philips, 필립스]
  - name: NEC
    aliases: [NEC]
  - name: BOE
    aliases: [BOE]
  - name: 샤오미
    aliases: [Xiaomi, 샤오미]
  - name: 레노버
    aliases: [Lenovo, 레노버]
# 사전 밖 일반 표현(“경쟁사 A”, “타사 제품”)
generic_competitor_patterns:
  - '경쟁사(?:\s*[A-Z](?![A-Za-z]))?'
  - '타사'
# 실존 인물 표현(역할어 + 이름) — LLM 이 없을 때의 최소 규칙
person_patterns:
  - '(?:배우|가수|모델|아나운서|선수|연예인|탤런트|아이돌|방송인|대통령|장관|회장)\s*[가-힣○OＯ]{2,4}'
