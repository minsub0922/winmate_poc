[project]
name = "winmate-image"
version = "0.1.0"
description = "이미지 생성 — 유형 · 상세 조건 · 참조 이미지 · 현장 합성 · 부분 수정 · 변형 · 업스케일"
requires-python = ">=3.11"
dependencies = ["winmate-common", "pillow>=12.3", "numpy>=2.2"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_image"]
