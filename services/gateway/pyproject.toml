[project]
name = "winmate-gateway"
version = "0.1.0"
description = "Winmate API 게이트웨이 — 라우팅 · 인증 · 계약 문서 · 웹 정적 파일"
requires-python = ">=3.11"
dependencies = ["winmate-common", "itsdangerous>=2.2"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_gateway"]
