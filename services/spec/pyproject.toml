[project]
name = "winmate-spec"
version = "0.1.0"
description = "Spec 시트 — 조건으로 모델 찾기 · 고객 스펙 대응표 · 단종·불일치 경고 · 단위 변환"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_spec"]
