[project]
name = "winmate-proposal"
version = "0.1.0"
description = "B2B 제안서 — 시작 방식 · 섹션 작성 · 템플릿 · 딸깍 · 검토/승인 · 버전 · 기존 제안서 활용"
requires-python = ">=3.11"
dependencies = ["winmate-common", "rapidfuzz>=3.14", "pillow>=12.3"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_proposal"]
