[project]
name = "winmate-ai-tools"
version = "0.1.0"
description = "AI Tools — LLM · I2T · T2I · 웹 검색 · 웹 수집 · 임베딩 (외부 모델 호출의 유일한 통로)"
requires-python = ">=3.11"
dependencies = ["winmate-common", "google-genai>=2.28", "openai>=3.24", "pillow>=12.3", "pillow-heif>=1.8", "trafilatura>=2.3", "beautifulsoup4>=4.15", "lxml>=6.1", "numpy>=2.2", "pypdfium2>=5.14"]

[tool.uv.sources]
winmate-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winmate_ai_tools"]
