# 공간 유형 시드 (VLM 닫힌 어휘의 원천) — status: draft
# 출처: US 호텔 업종 페이지의 고객 여정 구분, KR 업종 하위 구분, Winmate 공간 시나리오 템플릿에서 쓰던 공간들.
# 수집 후 업종 페이지·카탈로그에서 관측된 공간으로 보강하고 사람이 승인한다.

vocab_version: 1

