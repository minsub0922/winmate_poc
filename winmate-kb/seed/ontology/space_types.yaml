space_attr_defs:
  - {key: exposure, name_ko: 실내외, dtype: enum, enum_values: [indoor, outdoor, semi_outdoor]}
  - {key: sunlight, name_ko: 직사광 노출, dtype: enum, enum_values: [none, partial, direct]}
  - {key: viewing_distance_m, name_ko: 시청거리, dtype: num, unit: m}
  - {key: area_m2, name_ko: 면적, dtype: num, unit: m2}
  - {key: ceiling_height_m, name_ko: 층고, dtype: num, unit: m}
  - {key: foot_traffic, name_ko: 유동량, dtype: enum, enum_values: [low, mid, high]}
  - {key: temp_range_c, name_ko: 온도 범위, dtype: range, unit: degC}
  - {key: humidity, name_ko: 습도, dtype: enum, enum_values: [normal, high]}
  - {key: access, name_ko: 공용/전용, dtype: enum, enum_values: [public, staff, private]}
  - {key: operating_hours, name_ko: 운영 시간, dtype: enum, enum_values: [business_hours, extended, h24]}
  - {key: power_points, name_ko: 전원 위치, dtype: text}

