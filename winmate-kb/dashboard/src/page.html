<title>Winmate KB 검증</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --surface-3: #e7eaef; --border: #dde1e7; --border-strong: #c5cbd4;
  --text: #16191d; --muted: #5d6673; --faint: #8a93a0; --accent: #2457d6; --accent-weak: #e6edfc; --accent-text: #1c46ad;
  --ok: #18794e; --ok-weak: #e3f4ea; --bad: #c4332f; --bad-weak: #fbe8e7; --warn: #a15c00; --warn-weak: #fdf1dc;
  --info: #5b4bc4; --info-weak: #ece9fb; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --overlay: rgba(15, 18, 24, .38); --mark: #fff0a8; --mark-text: #1a1a1a; --on-accent: #ffffff;
  --c-space: #0e7c86; --c-cap: #a15c00; --c-cat: #2457d6; --c-fam: #5b4bc4; --c-model: #6b4f2a; --c-sol: #18794e; --c-vert: #b0306b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #191c21; --surface-2: #20242a; --surface-3: #2a2f37; --border: #2e333b; --border-strong: #3d434d;
    --text: #e8eaed; --muted: #a2a9b4; --faint: #7b8390; --accent: #7aa2ff; --accent-weak: #1d2a4a; --accent-text: #a8c1ff;
    --ok: #5cc98f; --ok-weak: #15301f; --bad: #ff7b74; --bad-weak: #3a1918; --warn: #f1b45a; --warn-weak: #3a2a10;
    --info: #a79bff; --info-weak: #262040; --shadow: 0 1px 2px rgba(0, 0, 0, .4); --overlay: rgba(0, 0, 0, .55); --mark: #5c4d00; --mark-text: #fff6c8; --on-accent: #0b1220;
    --c-space: #4fc3cc; --c-cap: #f1b45a; --c-cat: #7aa2ff; --c-fam: #a79bff; --c-model: #d2a877; --c-sol: #5cc98f; --c-vert: #ff8fc0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191c21; --surface-2: #20242a; --surface-3: #2a2f37; --border: #2e333b; --border-strong: #3d434d;
  --text: #e8eaed; --muted: #a2a9b4; --faint: #7b8390; --accent: #7aa2ff; --accent-weak: #1d2a4a; --accent-text: #a8c1ff;
  --ok: #5cc98f; --ok-weak: #15301f; --bad: #ff7b74; --bad-weak: #3a1918; --warn: #f1b45a; --warn-weak: #3a2a10;
  --info: #a79bff; --info-weak: #262040; --shadow: 0 1px 2px rgba(0, 0, 0, .4); --overlay: rgba(0, 0, 0, .55); --mark: #5c4d00; --mark-text: #fff6c8; --on-accent: #0b1220;
  --c-space: #4fc3cc; --c-cap: #f1b45a; --c-cat: #7aa2ff; --c-fam: #a79bff; --c-model: #d2a877; --c-sol: #5cc98f; --c-vert: #ff8fc0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 720px) { .wrap { padding: 0 16px; } }

/* 상단 */
.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; gap: 16px; padding: 12px 0 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 { white-space: nowrap; }
@media (max-width: 560px) { .brand .sub { display: none; } .top-row { padding-top: 10px; } }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); }
.who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.who.on .dot { background: var(--ok); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 10px; color: var(--muted); font-weight: 600; font-size: 13.5px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent-text); border-bottom-color: var(--accent); }
.tab .n { font-weight: 500; color: var(--faint); margin-left: 4px; font-size: 12px; }
#loadbar { height: 2px; background: transparent; position: relative; overflow: hidden; }
#loadbar.on::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
#loadmsg { font-size: 12px; color: var(--muted); }

main { padding: 20px 0 64px; }
.section { margin-bottom: 28px; }
.section > h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.section > h2 .hint { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.pad { padding: 14px 16px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.lead { color: var(--muted); max-width: 860px; margin: 0 0 18px; }

/* 칩·배지 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
button.chip:hover { border-color: var(--border-strong); }
.chip.k-space_type { color: var(--c-space); border-color: color-mix(in srgb, var(--c-space) 35%, var(--border)); }
.chip.k-capability { color: var(--c-cap); border-color: color-mix(in srgb, var(--c-cap) 35%, var(--border)); }
.chip.k-category { color: var(--c-cat); border-color: color-mix(in srgb, var(--c-cat) 35%, var(--border)); }
.chip.k-family { color: var(--c-fam); border-color: color-mix(in srgb, var(--c-fam) 35%, var(--border)); }
.chip.k-model { color: var(--c-model); border-color: color-mix(in srgb, var(--c-model) 35%, var(--border)); }
.chip.k-solution, .chip.k-service { color: var(--c-sol); border-color: color-mix(in srgb, var(--c-sol) 35%, var(--border)); }
.chip.k-vertical { color: var(--c-vert); border-color: color-mix(in srgb, var(--c-vert) 35%, var(--border)); }
.chip.k-deployment { color: var(--warn); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--ok-weak); color: var(--ok); }
.p-bad { background: var(--bad-weak); color: var(--bad); }
.p-warn { background: var(--warn-weak); color: var(--warn); }
.p-info { background: var(--info-weak); color: var(--info); }
.p-acc { background: var(--accent-weak); color: var(--accent-text); }
.p-mute { background: var(--surface-3); color: var(--muted); }
.grade { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 20px; padding: 0 5px; border-radius: 5px; font-weight: 700; font-size: 11.5px; background: var(--surface-3); color: var(--text); }
.grade.g-A { background: var(--ok-weak); color: var(--ok); }
.grade.g-AC { background: var(--accent-weak); color: var(--accent-text); }
.grade.g-C { background: var(--info-weak); color: var(--info); }
.grade.g-D { background: var(--warn-weak); color: var(--warn); }
.grade.g-E { background: var(--bad-weak); color: var(--bad); }

/* 지표 */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.status-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.status-strip .card { padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.big { font-size: 20px; font-weight: 700; }

/* 표 */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--faint); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.lines { margin: 6px 0 2px 14px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }

/* 입력 */
.field { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.field:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; border-color: var(--accent); }
select.field { padding-right: 26px; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-weak); color: var(--accent-text); }
.qbox { display: flex; gap: 8px; }
.qbox textarea { flex: 1; resize: vertical; min-height: 46px; }
@media (max-width: 720px) { .qbox { flex-direction: column; } }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters .field { max-width: 100%; }
.pager { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

/* 결과 */
.score { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.bar { position: relative; width: 84px; height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; display: inline-flex; }
.bar > i { display: block; height: 100%; }
.b-cap { background: var(--c-cap); } .b-site { background: var(--c-sol); } .b-cat { background: var(--c-cat); } .b-prec { background: var(--c-vert); } .b-text { background: var(--c-fam); } .b-one { background: var(--accent); }
.legend { display: inline-flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.reasons { margin: 4px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.reasons li { margin: 1px 0; }
.spacecard { padding: 0; overflow: hidden; }
.spacecard > header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.spacecard > header h3 { font-size: 15px; }
.quote { color: var(--muted); font-size: 12.5px; }
.quote::before { content: "“"; } .quote::after { content: "”"; }
.hit { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.hit:last-child { border-bottom: 0; }
.hit .t { font-weight: 600; }
.hit .x { margin-top: 4px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 2px; padding: 0 1px; }
.cols { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.side { position: sticky; top: 104px; max-height: calc(100vh - 120px); overflow: auto; padding: 6px; }
@media (max-width: 900px) { .side { position: static; max-height: 260px; } }
.side button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; gap: 6px; align-items: baseline; }
.side button:hover { background: var(--surface-2); }
.side button.on { background: var(--accent-weak); color: var(--accent-text); font-weight: 600; }
.side button.child { padding-left: 20px; }
.side .grp { font-size: 11.5px; color: var(--faint); font-weight: 600; padding: 10px 8px 4px; text-transform: uppercase; letter-spacing: .04em; }
.scene { padding: 14px 16px; }
.scene + .scene { border-top: 1px solid var(--border); }
.scene h3 { font-size: 15px; }
.seqno { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; background: var(--accent-weak); color: var(--accent-text); font-size: 12px; font-weight: 700; margin-right: 6px; flex: none; }
.items { margin-top: 10px; }
.msgs { margin-top: 8px; font-size: 12.5px; }
.msgs .km { margin: 4px 0; }
.msgs .pp { color: var(--muted); padding-left: 14px; }

/* 컨텍스트 → 메시지 */
.cmform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 760px) { .cmform { grid-template-columns: minmax(0, 1fr); } }
.cmform .full { grid-column: 1 / -1; }
.cmf { min-width: 0; }
.cmf > label { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.cmf > label .opt { font-weight: 500; color: var(--faint); font-size: 11.5px; }
.cmf .field { width: 100%; }
.cmf textarea.field { resize: vertical; min-height: 48px; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.picked:empty { display: none; }
.picked .chip { padding-right: 4px; }
.picked .chip button { border: 0; background: none; padding: 0 3px; color: var(--faint); font-size: 14px; line-height: 1; }
.picked .chip button:hover { color: var(--bad); }
.combo { position: relative; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); max-height: 320px; overflow: auto; display: none; }
.sugg.on { display: block; }
.sugg button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 7px 10px; font-size: 13px; }
.sugg button:hover, .sugg button.act { background: var(--surface-2); }
.sugg .k { font-size: 11px; color: var(--faint); flex: none; width: 54px; }
.ctxtab td:first-child { width: 84px; color: var(--muted); white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.mrow:last-child { border-bottom: 0; }
.mth:empty { display: none; }
.mrow:has(> .mth:empty) { grid-template-columns: minmax(0, 1fr); }
.mth .tiny-thumbs { margin: 0; }
.mth .tiny-thumbs .thumb { width: 72px; }
.mtext { font-weight: 600; font-size: 14px; margin-top: 4px; word-break: keep-all; overflow-wrap: anywhere; }
.headline .mtext { font-size: 17px; letter-spacing: -.01em; }
.why { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.why span { font-size: 11.5px; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.pps { margin: 8px 0 0; padding-left: 12px; border-left: 2px solid var(--border); }
.pps .pp { margin: 6px 0; font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .pgrid { grid-template-columns: minmax(0, 1fr); } }
.pcard { overflow: hidden; }
.pcard > header { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); align-items: flex-start; flex-wrap: nowrap; }
.pcard > header .tiny-thumbs { margin: 0 !important; }
.pcard .mrow { padding: 9px 14px; }
.pcard .mtext { font-size: 13px; font-weight: 500; }
.b-fprod { background: var(--c-fam); } .b-fvert { background: var(--c-vert); } .b-fspace { background: var(--c-space); } .b-fcust { background: var(--warn); } .b-ftext { background: var(--c-cat); }

/* 그리드 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fcard { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; border: 1px solid var(--border); }
.fcard:hover { border-color: var(--border-strong); }
.fcard .nm { font-weight: 600; }
.fcard .thumb { aspect-ratio: 16 / 10; border-radius: 6px; margin-bottom: 4px; }
.fcard .thumb img { object-fit: contain; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.icard { overflow: hidden; display: flex; flex-direction: column; }
.thumb { aspect-ratio: 4 / 3; background: var(--surface-3); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .ph { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.thumb .grade { position: absolute; top: 8px; left: 8px; }
.thumb.nothumb { aspect-ratio: auto; min-height: 76px; padding-top: 26px; }
.tiny-thumbs .chip { gap: 5px; padding-left: 3px; }
.icard .meta { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tiny-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tiny-thumbs .thumb { width: 96px; border-radius: 6px; border: 1px solid var(--border); }
.tiny-thumbs.sm .thumb, td.tiny-thumbs .thumb { width: 64px; }
.tiny-thumbs .grade { top: 3px; left: 3px; height: 15px; min-width: 20px; font-size: 10px; padding: 0 3px; }
.mini { border: 0; padding: 0; background: none; cursor: zoom-in; border-radius: 6px; }
.mini:hover .thumb { border-color: var(--accent); }
.thumb img:not([src]) { visibility: hidden; }

/* 검수 버튼 */
.rv { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; vertical-align: middle; }
.rv button { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0 7px; height: 24px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.rv button:hover { border-color: var(--border-strong); color: var(--text); }
.rv button.on.v-ok { background: var(--ok-weak); color: var(--ok); border-color: var(--ok); }
.rv button.on.v-wrong { background: var(--bad-weak); color: var(--bad); border-color: var(--bad); }
.rv button.on.v-unsure { background: var(--warn-weak); color: var(--warn); border-color: var(--warn); }
.rv button.on.v-note { color: var(--accent-text); border-color: var(--accent); }
.rv .tally { font-size: 11.5px; color: var(--faint); margin-left: 3px; }
.rv .tally b { font-weight: 600; }
.rv select { height: 24px; padding: 0 4px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.rv.ro button { cursor: default; opacity: .6; }
.rvnote { display: flex; gap: 6px; margin-top: 6px; }
.rvnote input { flex: 1; min-width: 0; }

/* 드로어 */
#ov { position: fixed; inset: 0; background: var(--overlay); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .15s; }
#ov.on { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); z-index: 41; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0, 0, 0, .18); }
#drawer.on { transform: none; }
#drawer > header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }
#drawer > header h2 { font-size: 17px; }
#drawer .body { overflow: auto; padding: 16px 18px 40px; flex: 1; }
#drawer .body .section { margin-bottom: 20px; }
.x { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 8px; font-size: 16px; color: var(--muted); flex: none; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv > div:nth-child(odd) { color: var(--muted); }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv > div:nth-child(odd) { margin-top: 6px; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.note { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; }
@keyframes rot { to { transform: rotate(360deg); } }
</style>
